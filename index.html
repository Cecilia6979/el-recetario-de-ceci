charaditas de sal, las cucharaditas de\nlevadura en polvo y el yogur en un envase, amasa hasta que esté\nhomogénea, haz pequeñas bolas, pasa el rodillo para estirar.\nCOCINAR BAGEL SIMPLE\nPrecalienta la freidora de aire y prográmala en horneado, a una temperatura\n190°C. Realiza el proceso de cocción durante 20 minutos. Luego retira y\nsirve."},{"id":75,"title":"GOFRES CON AZÚCAR MORENA Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":80,"text":"GOFRES CON AZÚCAR MORENA\nDificultad: Fácil\nTiempo de preparación: 18 minutos\nTiempo de cocción: 15 minutos\nPorciones: 7 personas\nINGREDIENTAS\n8 rebanadas de tocino\n380 g de harina\n1 ½ cda de polvo de hornear\n1 ½ cdta de bicarbonato y sal\n110 g de azúcar morena\n5 huevos\n2 ½ cdta de extracto de vainilla\n170 ml de aceite de oliva\n550 ml de suero de leche\nPREPARACIÓN\nPreparación de la masa: incorpora todos los ingredientes secos y luego los\nhúmedos.\nCOCINAR GOFRES CON AZÚCAR MORENA\nPrograma la freidora de aire en la función horneado, a 180°C, unta el molde\ncon aceite, incorpora y hornea durante 15 minutos. Culminado el proceso,\nretira y sirve."},{"id":76,"title":"SALCHICHAS E HIGOS CON ARCE Dificultad: Fácil","category":"Postres","source":"365 recetas sin aceite","page":81,"text":"SALCHICHAS E HIGOS CON ARCE\nDificultad: Fácil\nTiempo de preparación: 18 minutos\nTiempo de cocción: 22 minutos\nPorciones: 2 personas\nINGREDIENTES\n3 cda de jarabe de arce\n3 cda de vinagre balsámico\n700 g de salchichas de pollo\n6 higos frescos maduros cortados en tiras\n1 cebolla dulce picada en juliana\n500 g de acelgas picadas\n3 cdta de aceite de oliva\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nIntegra el almíbar con 1 cucharada de vinagre en un envase pequeño, luego\ncolocas las salchichas con los higos en una bandeja de horno forrada con\npapel de aluminio de una sola capa.\nCOCINAR SALCHICHAS E HIGOS CON ARCE\nPrograma la freidora de aire a 230°C. Coloca las salchichas e higos en\nmodo asado, durante 10 minutos, bañando de almíbar durante toda la\ncocción. Luego pon las cebollas en la freidora de aire, en un envase con\npapel film durante 9 minutos, incorpora el aceite y el condimento con 1\ncucharadita de vinagre. Presenta en una fuente para servir y comer."},{"id":77,"title":"ALCACHOFAS CON JAMÓN SERRANO Y QUESO PARMESANO Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":84,"text":"ALCACHOFAS CON JAMÓN SERRANO Y\nQUESO PARMESANO\nDificultad: Fácil\nTiempo de preparación: 15 minutos\nTiempo de cocción: 20 minutos\nPara 4 personas\nINGREDIENTES\n4 alcachofas recién lavadas\n150 gramos de jamón serrano en lonjas\nQueso parmesano para rallar\nUna pizca de sal\nMedio limón\nAceite de oliva\nPREPARACIÓN\nEstando limpias vas a abrir pequeños huecos en las alcachofas. Rellénalos\ncon el jamón serrano y cúbrelas con el aceite de oliva. Esparce la sal y ralla\nel queso sobre cada alcachofa para después llevarlas a la canasta, poniendo\nel limón al lado de ellas para que se cocinen.\nCOCINAR ALCACHOFAS CON JAMÓN SERRANO Y QUESO\nPARMESANO\nCon la freidora precalentada a 200°, pon las alcachofas a cocinar durante 20\nminutos aproximadamente y deja reposar para servir."},{"id":78,"title":"HUEVOS ESTRELLADOS Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":85,"text":"HUEVOS ESTRELLADOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 2 personas\nINGREDIENTES\n5 patatas\n1 ½ cda de aceite de oliva\n½ cda de pimentón dulce molido\n½ cda de pimentón picante molido\n½ cdta de ajo en polvo\n½ cdta de cebolla en polvo\n4 huevos\n5 lonchas de jamón ibérico\nSal\nPimienta molida negra al gusto\nPREPARACIÓN\nLava y pela las patatas para cortarlas en cuadritos, déjalas remojando en un\nbol con agua por media hora. Sécalas, déjalas en una taza y échales todas\nlas especias en medida de cucharadita y mezcla. Ponlas en bandeja, agrega\nel aceite por encima de ellas y llévalas a la freidora de aire.\nCOCINAR HUEVOS ESTRELLADOS\nCon la freidora precalentada a 140º cocínalas unos 20 minutos. Luego\nsácalas y sube la temperatura a 200º para volver a cocinarlas otros 5\nminutos. Pon a freír los huevos en una plancha con aceite de oliva. Coloca"},{"id":79,"title":"TORREZNOS Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":87,"text":"TORREZNOS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 28 minutos\nPara 1 personas\nINGREDIENTES\n250 gramos de panceta adobada o tocino de 3 centímetros de grosor\nSal\nPREPARACIÓN\nCorta cada una panceta o tocino en tiras medianas. Rocíales la sal por\nencima. Con un cuchillo has pequeños pinchazos en la piel de la panceta.\nLleva las tiras a la bandeja de la freidora.\nCOCINAR TORREZNOS\nCon la freidora precalentada a 180º cocina las tiras por 28 minutos. En los\nprimero 14 minutos sácalas de la freidora y dales la vuelta para que se\ncocinen el resto de los 14 minutos y sirve."},{"id":80,"title":"PIMIENTOS DE PIQUILLO RELLENOS DE ATÚN Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":88,"text":"PIMIENTOS DE PIQUILLO RELLENOS DE\nATÚN\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n4 pimientos de piquillo\n2 latas de atún (240 g aproximadamente c/u)\n1 huevo\ntomate frito\n1 ½ cda de aceite de oliva\n80 g de queso mozzarela\n1 pizca de sal\n1 pizca de pimienta negra\n1 pizca de tomillo\nPREPARACIÓN\nCocina el huevo en agua hervida y pícalo en pedazos pequeños, en un\nrecipiente mezcla el atún con los pedazos de huevo y una cucharada de\ntomate frito y picado. Agrega la sal, la pimienta y el tomillo. Limpia los\npimientos y córtalos por la parte de arriba para sacarles la membrana y las\nsemillas. Rellena los pimientos con la mezcla de atún, ponle el queso por\nencima y llévalos a la bandeja.\nCOCINAR PIMIENTOS DE PIQUILLO RELLENOS DE ATÚN"},{"id":81,"title":"SÁNDWICH DE QUESO A LA PARRILLA Dificultad Fácil","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":90,"text":"SÁNDWICH DE QUESO A LA PARRILLA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 minutos\nPara 1 personas\nINGREDIENTES\n2 rebanadas de pan\nMantequilla\nLáminas de queso cheddar\nPREPARACIÓN\nA una de las caras de cada pan le vas a untar una cucharada de mantequilla.\nColoca dos láminas de queso arriba de las caras que tengan mantequilla y\núnelas.\nCOCINAR SÁNDWICH DE QUESO A LA PARRILLA\nCon la freidora precalentada a 180ºC, cocina durante 8 minutos. En los\nprimero 5 minutos saca el sándwich y voltéalo para volver a cocinarlo otros\n3 minutos y sírvelo."},{"id":82,"title":"CHAMPIÑONES RELLENOS Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":91,"text":"CHAMPIÑONES RELLENOS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 15 minutos\nPara 3 personas\nINGREDIENTES\n6 Champiñones\n200 g de carne picada\n3 cda de pasta de tomate\nSal\nPimienta negra molida al gusto\n½ cdta de ajo en polvo\n160 g de queso rallado\n1 ½ cda de aceite de oliva\nPREPARACIÓN\nCorta la base de los champiñones y quita el relleno de la cabeza dejándolo\nhueco. Límpialos con un trapo húmedo, sin ponerlos directamente en agua.\nCocina la carne en una sartén con el aceite, después agrega lo que quedo de\nlos champiñones, picados en trozos pequeños junto a la sal y al ajo en\npolvo. Ya estando cocinada, agrega la pasta de tomate y mezcla. Rellena los\nchampiñones con la preparación y añade por encima el queso rallado para\nllevarlos a la bandeja.\nCOCINAR CHAMPIÑONES RELLENOS\nCon la freidora precalentada a 200ºC cocina durante unos 15 minutos y\nsirve."},{"id":83,"title":"Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":93,"text":"PANCETA CON PATATAS REVOLCONAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 2 personas\nINGREDIENTES\n4 patatas\n150 g de panceta\n2 dientes de ajo picados\nSal\nPimienta negra al gusto\n30 g de pimentón dulce\nAceite de oliva\nPREPARACIÓN\nLava y pela las patatas para llevarlas a coserse en agua con sal hasta que\nestén blandas. En la freidora calienta los ajos a 130ºC por 5 minutos con un\npoco de aceite. En un plato hondo coloca las patatas con los ajos, un\nchorrito de aceite y las especies. Machaca todo y mezcla hasta que se\nvuelva una masa homogénea. Pica las pancetas en trocos pequeños y\nllévalos a la bandeja.\nCOCINAR PANCETA CON PATATAS REVOLCONAS\nCon la freidora precalentada a 200ºC cocina la panceta durante 15 minutos.\nDéjalos reposar, mezcla con las patatas revolconas y sirve."},{"id":84,"title":"CALAMARES A LA ROMANA Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":94,"text":"CALAMARES A LA ROMANA\nDificultad Media\nTiempo de preparación 10 minutos\nTiempo de cocción 75 minutos\nPara 5 personas\nINGREDIENTES\n300 g de calamar fresco\n100 g de harina\n1 huevo\nAceite en eaerosol\nSal\nPimienta negra molida al gusto\n6 hojas de espinacas\nPREPARACIÓN\nLimpia el calamar, sécalo y córtalo en anillos gruesos. Bate el huevo en un\nrecipiente y tamizada la harina dejándola en una bandeja. Sumerge los\ntrozos de calamar en el huevo batido y luego pásalos por la harina. Rocía el\naceite y colócalos en la cesta de la freidora sin estar muy juntos ni\namontonados.\nCOCINAR CALAMARES A LA ROMANA\nCon la freidora precalentada a 200ºC pon a cocinar los calamares, espera 10\nminutos y revisa como están, utiliza una pinza para moverlos con cuidado y\nvuelve a cocinarlos otros 5 minutos, has una cama de espinacas en un plato\ny sirve ahí los calamares."},{"id":85,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":95,"text":"PATATAS BRAVAS\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n2 patatas grandes\nAceite de oliva\nSal\n1 cebolla\n1 diente de ajo\n1 tomate natural triturado\n1 pizca de azafrán\n1 pizca de azúcar\n½ cdta de pimienta de cayena\n1 punta de jamón\n1 cucharadita de pimentón picante\n1 cucharadita de colorante alimentario\n1 cucharada de harina de trigo\nVinagre de Jerez\nPREPARACIÓN\nLo primero es la salsa brava. Cocina la cebolla picada con ajo en una sartén\ncon aceite. Agrega la punta de jamón, pimienta de cayena, pimentón\npicante, azafrán y espera que las cebollas estén transparentes. Agrega el\ntomate triturado y el azúcar sin dejar de mezclar. Al final echa un chorrito\nde vinagre, quita la punta de jamón y licua la mezcla, cuélala y reserva. Pela"},{"id":86,"title":"las patatas y lávalas, córtalas en cuadros. Agrégales aceite de oliva, sal y","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":96,"text":"las patatas y lávalas, córtalas en cuadros. Agrégales aceite de oliva, sal y\nllévalas a bandeja.\nCOCINAR PATATAS BRAVAS\nCon la freidora precalentada a 180°C, cocina las papas durante 20 minutos,\nsacude la cesta cada 5 minutos. Colócalas en un plato, esparce la salsa sobre\nellas y sirve."},{"id":87,"title":"EMPANADA DE TERNERA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":97,"text":"EMPANADA DE TERNERA\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n220 g de carne picada\n1 paquete de masa quebrada refrigerada\nMedia cebolla picada\n1 diente de ajo picado\n1 pimiento verde picado\n60 g de salsa de tomate\nComino\n1 huevo\nSal\nPimienta negra molida al gusto\nAceite de oliva\n1 cda de leche\nPREPARACIÓN\nEn un sartén vierte el aceite y agrega la carne picada para que se cocine.\nAñade después la cebolla y el ajo, espera 3 minutos y añade la salsa y el\npimentón sin dejar de revolver. Por ultimo agrega la sal y las especias y\nespera 10 minutos para que el relleno esté listo. Bate la yema del huevo y la\ncucharada de leche en un recipiente aparte. Coloca el relleno sobre las\nmasas de empanada y séllalas. Pasa una pincelada de huevo sobre las\nempanadas y llévalas a la bandeja."},{"id":88,"title":"COCINAR EMPANADA DE TERNERA","category":"Carnes y aves","source":"365 recetas sin aceite","page":98,"text":"COCINAR EMPANADA DE TERNERA\nCon la freidora precalentada a 200°C cocina las empanadas durante 10\nminutos y sírvelas."},{"id":89,"title":"AROS DE CEBOLLA CON BACON Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":99,"text":"AROS DE CEBOLLA CON BACON\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\n2 cebollas blancas\nSalsa picante\n10 lonjas de tocino\nPREPARACIÓN\nCorta las cebollas en rodajas y separa los aros en su interior. Llévalas a un\nbol y vierte una cucharada de salsa picante para que con la mano pueda\nesparcirla en todas ellas. Una por una las vas a ir envolviendo con el Bacon\ny las llevaras a la bandeja sin estar muy juntas.\nCOCINAR AROS DE CEBOLLA CON BACON\nCon la freidora precalentada a 190°C cocina los aros de cebolla durante 10\nminutos. En los primeros 5 minutos voltéalos y vuelva a cocinarlos otros 5\nminutos y sirve."},{"id":90,"title":"GAMBAS AL AJILLO Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":100,"text":"GAMBAS AL AJILLO\nDificultad Fácil\nTiempo de preparación 1 hora\nTiempo de cocción 10 minutos\nPara 3 persona\nINGREDIENTES\n9 gambas\n1 diente de ajo picado\n1 cda de aceite de oliva\n5 g de perejil picado\nPREPARACIÓN\nLimpia y pela las gambas para llevarlas a un tazón. Agrégales el ajo junto al\naceite y mézclalo hasta que todas estén cubiertas. Tápalas y déjalas reposar\npor una hora. Inserta como gamba en tres palitos de altura, colocando tres\nen cada uno. Por último las pondremos en la bandeja.\nCOCINAR GAMBAS AL AJILLO\nCon la freidora precalentada a 180°C cocina las gambas durante unos 10\nminutos. Agrégales por encima el perejil picado y sirve."},{"id":91,"title":"PULPO A LA GALLEGA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":101,"text":"PULPO A LA GALLEGA\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 35 minutos\nPara 3 personas\nINGREDIENTES\n600 g de patas de pulpo cocidas\n3 Patatas\n1 porción de pimentón picante\n1 pizca de sal\nAceite de oliva\nPREPARACIÓN\nPrimero vas a pelar las patatas y cortarlas en rodajas finas para llevarlas a\nun tazón y mezclarlas con la sal además se un chorrito de aceite. Cúbrelos\nen papel aluminio completamente y llévalos a la freidora de aire a 200ºC\npor 25 minutos. Listas las patatas lo que sigue es limpiar la gelatina del\npulpo y llévalo a la bandeja con un poco de aceite.\nCOCINAR PULPO A LA GALLEGA\nCon la freidora precalentada a 200° cocina el pulpo durante\naproximadamente 10 minutos. Después córtalo en rodajas, colócalo sobre\nlas patatas y agrega por encima el pimentón piante y sirve."},{"id":92,"title":"CAMARONES TROPICALES Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":102,"text":"CAMARONES TROPICALES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 3 personas\nINGREDIENTES\n9 camarones\n1 tza harina de trigo\n1 huevo\nPan rallado\nCopos de coco\nPREPARACIÓN\nLimpia los camarones, quítales las venas y cúbrelos con harina. Bate el\nhuevo en un bol aparte y sumerge los mariscos en él. En un plato llano\nagrega el pan rallado con los copos de coco, mézclalos y pasa las gambas\npor ellos. Llévalas a la bandeja de la freidora estando separadas.\nCOCINAR CAMARONES TROPICALES\nCon la freidora precalentada a 160°C fríe las gambas durante 12 minutos.\nEn los primeros 6 minutos voltéalas y vuelve a cocinarlas otros 6 minutos y\nsirve."},{"id":93,"title":"NUDOS DE AJO Dificultad Fácil","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":103,"text":"NUDOS DE AJO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n500 g masa de pizza\nAceite de oliva\n5 dientes de ajo picados\n23 gramos de queso parmesano rallado\nSal\nPerejil picado\nPREPARACIÓN\nCorta la masa en dos partes iguales. Estíralas y enróllalas de manera que\nqueden como una cuerda. Cruza los extremos y has un nudo. En un\nrecipiente mezcla el aceite, el ajo, la sal el queso y el perejil picado. Con\neso vas a cubrir la parte superior del nudo de masa con ayuda de un pincel y\nllévalos a la bandeja.\nCOCINAR NUDOS DE AJO\nCon la freidora precalentada a 180°C, hornea los nudos durante 15 minutos.\nEn los primero 7 minutos voltéalos y deja que se cocinen el resto del tiempo\ny sírvelos."},{"id":94,"title":"BAGEL Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":104,"text":"BAGEL\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n125 g de harina todo uso\n296 g de yogur griego descremado\n2 cdta de levadura en polvo\n1 pizca de sal\n2 huevos batido\nPREPARACIÓN\nAgrega 1 de los huevos con el resto de los ingredientes en un recipiente y\nmézclalos. Cuando todo esté unido comienza a amasar con las manos hasta\nque quede homogénea y no se te pegue en los dedos. Pícala en 4 partes\niguales, luego enróllalas en forma de cuerda y dales la forma del bagel.\nDale pinceladas por arriba con el huevo batido que sobró y colócalas en la\nbandeja.\nCOCINAR BAGEL\nCon la freidora precalentada a 140°C, hornea durante 15 minutos y sirve."},{"id":95,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":105,"text":"PATATAS FRITAS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 8 minutos\nPara 5 personas\nINGREDIENTES\n10 patatas pequeñas\n10 tiras de tocino\n1 pizca de sal\n1 pizca de pimienta\n1 pizca de ajo en polvo\nPREPARACIÓN\nPela las patatas y llévalas a un bol. Agrega la sal, la pimienta y el ajo en\npolvo y mezcla. Envuélvelas con las tiras de tocino que queden bien sujetas.\nPonlas en la cesta y llévalas a la freidora.\nCOCINAR PATATAS FRITAS\nCon la freidora precalentada a 200°C cocínalas durante 8 minutos. Cuando\npasen los primeros 4 minutos voltea las patatas y vuelve a cocinarlas por el\ntiempo restante y sirve."},{"id":96,"title":"PINCHOS DE COLES DE BRUSELAS Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":106,"text":"PINCHOS DE COLES DE BRUSELAS\nDificultad Fácil\nTiempo de preparación 17 minutos\nTiempo de cocción 7 minutos\nPara 8 personas\nINGREDIENTES\n25 coles de Bruselas\n2 cda de glaseado balsámico\n4 cda de aceite de oliva\n½ cdta de ajo en polvo\nSal\nPimienta\nPREPARACIÓN\nRecorta las coles y pícalas por la mitad. Los pedazos los vas a ensartar en\npalillos de manera. Agrégales aceite por encima junto a la sal, la pimienta,\najo en polvo y el glaseado. Ya puedes llevarlas a la bandeja.\nCOCINAR PINCHOS DE COLES DE BRUSELAS\nCon la freidora precalentada a 190°C cocina las coles 7 minutos. Cuando\npasen los primero 4 minutos dales la vuelta y cocínalos por el resto del\ntiempo y sirve."},{"id":97,"title":"ESPÁRRAGOS AL ESTRAGÓN Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":107,"text":"ESPÁRRAGOS AL ESTRAGÓN\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 5 minutos\nPara 4 personas\nINGREDIENTES\n900 g de espárragos recortados\n2 cda de aceite de oliva\n1 cdta de sal\n½ cdta de pimienta negra\n90 g de miel\n3 ½ cda de estragón picado\nPREPARACIÓN\nEn un bol vas a dejar los espárragos y vas a verter en ellos el aceite, junto\ncon la miel, el estragón, la sal y la pimienta. Mezcla todo hasta que los\nespárragos estén completamente condimentados.\nCOCINAR ESPÁRRAGOS AL ESTRAGÓN\nCon la freidora precalentada a 148°C, modo freír, coloca en una bandeja los\nespárragos durante 5 minutos y después sirve."},{"id":98,"title":"CAZUELA DE HUEVOS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":108,"text":"CAZUELA DE HUEVOS\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 13 minutos\nPara 4 personas\nINGREDIENTES\n8 huevos batidos\n18 g de cebolla blanca picada\n1 pimiento verde picado\n450 g de salchicha molida ya cocida\n120 g de queso cheddar\nSal de ajo\nAceite en aerosol\nPREPARACIÓN\nEn un bol mezcla todos los ingredientes. En un molde para hornear los vas a\nrociar con el aceite y luego vas a verter la preparación. Lleve a la freidora.\nCOCINAR CAZUELA DE HUEVOS\nCon la freidora precalentada a 200°C, modo hornear, cocina durante 13\nminutos aproximadamente y sirve."},{"id":99,"title":"JUDÍAS VERDES CON GLASEADO DE MANTEQUILLA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":109,"text":"JUDÍAS VERDES CON GLASEADO DE\nMANTEQUILLA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 7 minutos.\nPara 3 personas\nINGREDIENTES\n450 g de judías verdes\n½ cdta de condimento cajún\n1 cda de mantequilla derretida\nPREPARACIÓN\nLava y corta las judías verdes. En un recipiente las vas a mezclar con la\nmantequilla y el condimento cajún. Llévalas a la cesta de la freidora.\nCOCINAR\nJUDÍAS\nVERDES\nCON\nGLASEADO\nDE\nMANTEQUILLA\nCon la freidora precalentada a 170°C, modo hornear, cocina durante 6\nminutos aproximadamente y sirva."},{"id":100,"title":"PASTEL DE PESCADO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":110,"text":"PASTEL DE PESCADO\nDificultad Fácil\nTiempo de preparación 1 hora con 20 minutos\nTiempo de cocción 45 minutos\nPara 5 personas\nINGREDIENTES\n820 g cabracho\n4 palitos de surimis\n230 ml de agua\n4 huevos\n34 g de tomate frito\n1 ½ pimiento del piquillo\n100 g de nata para montar\n15 g de mantequilla\n1 cebolla picada a la mitad\n1 puerro\n1 zanahoria picada en trozos\n1 hoja de laurel\n3 cda de aceite de oliva\nSal\nPimienta negra al gusto\nPREPARACIÓN\nEn una olla vas a verter el agua y la sal y la vas a llevar a fuego medio.\nCuando comience a hervir vas a agregar los pedazos de cebolla, la\nzanahoria, el puerro, la hoja de laurel y el aceite de oliva. Deja cocinando\ndurante 10 minuto, luego vas a agregar el cabracho y dejarlos en la olla por"},{"id":101,"title":"15 minutos. Retira del fuego, cuela y limpia el pescado. Quítale la piel y las","category":"Desayunos","source":"365 recetas sin aceite","page":111,"text":"15 minutos. Retira del fuego, cuela y limpia el pescado. Quítale la piel y las\nespinas, luego hazlo todo migas. Ahora en un molde para hornear vamos a\nuntar la mantequilla por todos lados. En un bol aparte vas a agregar el\npescado desmenuzado, el surimi, el pimiento del piquillo, los huevos, el\ntomate frito y la nata para montar. Mezcla todo junto hasta que se vuelva\nuna masa y viértelo en el molde.\nCOCINAR PASTEL DE PESCADO\nCon la freidora precalentada a 180°C, cocina la preparación durante 45\nminutos aproximadamente. Cuando esté lista, déjala reposar y llévala al\nrefrigerador por dos horas para que cuaje y luego puedas servir."},{"id":102,"title":"Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":112,"text":"TORTILLA DE PATATAS\nDificultad Fácil\nTiempo de preparación 45 minutos\nTiempo de cocción 8 minutos\nPara 4 personas\nINGREDIENTES\n6 patatas\n7 huevos\n1 pizca de sal\n1 cda de aceite de oliva\nPREPARACIÓN\nPica las patatas en trozos finos y lávalos con agua fría por unos minutos,\npara que se deshagan del almidón. Colócalos en un bol con el aceite de\noliva y mézclalos bien. Después de eso llevaremos los trozos cubiertos de\naceite a la freidora de aire por aproximadamente 30 minutos a 180ºC,\nrevolviendo cada 5 minutos e ir agregando la sal. Ya cocinadas las\nsacaremos para que escurran el aceite y vamos a ir mezclando los 7 huevos\nen un bol aparte para luego añadirlos donde están las patatas y luego seguir\nmezclando.\nCOCINAR TORTILLAS DE PATATAS\nCon la freidora precalentada a 130°C añade la mezcla de patatas y huevos\ncon el procedimiento manual y cocina durante 6 a 8 minutos hasta que cuaje\ny sirva."},{"id":103,"title":"Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":113,"text":"PATATAS ROJAS ASADAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 1 hora\nPara 6 personas\nINGREDIENTES\n10 patatas\n½ pimiento rojo dulce\n4 tomillos frescos\n1 pizca de sal\n1 pizca de pimienta de cayena\n55 ml de aceite de oliva\nPREPARACIÓN\nEn un molde para hornear vas a agregar las patatas sin necesidad de pelarlas\n(el hacerlo queda por tu cuenta) y vierte el aceite sobre ellas. Mezcla todo\npara que queden completamente cubiertas de aceite. Por encima vas a\nespolvorear las especias.\nCOCINAR PATATAS ROJAS ASADAS\nCon la freidora precalentada a 200°C cocina las patatas durante 30 minutos.\nPasado este tiempo dales la vuelta y vuelve a cocinarlas por 20 minutos\nmás. Después dales la vuelta nuevamente y vuelve a cocinarlas por\naproximadamente 15 minutos hasta que queden doradas, retira y sírvelas."},{"id":104,"title":"MUFFINS DE PAN DE MAÍZ CON JALAPEÑO Y QUESO CHEDDAR Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":114,"text":"MUFFINS DE PAN DE MAÍZ CON JALAPEÑO Y\nQUESO CHEDDAR\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 35 minutos\nPara 7 personas\nINGREDIENTES\n100 g de harina de maíz amarilla\n50 g de harina todo uso\n1 huevo batido\n55 g de taza de azúcar\n65 g de mantequilla sin sal derretida\n1 tza de queso cheddar fuerte\n1 chili jalapeño fresco\n1 cdta de polvo de hornear\n½ cdta de bicarbonato de sodio\n½ cdta de sal\n½ taza de suero de leche\n½ lata de crema de maíz\nAceite en aerosol\nPREPARACIÓN\nEn un bol vas a agregar todos los ingredientes secos y mezclarlos, esto\nimplica: la harina de maíz, la harina todo uso, el azúcar, el polvo de hornear\ntodo con el bicarbonato de sodio y la sal. Luego vierte el suero de leche con\nla crema de maíz, el huevo, la mantequilla y el queso cheddar. Pica y quítale"},{"id":105,"title":"las semillas al jalapeño y agrégalo a la preparación. Prepara 8 moldes para","category":"Postres","source":"365 recetas sin aceite","page":115,"text":"las semillas al jalapeño y agrégalo a la preparación. Prepara 8 moldes para\nmuffins, rociándolos con el aceite en aerosol. Vierte la mezcla en los\nmoldes y lleva a la freidora.\nCOCINAR MUFFINS DE PAN DE MAÍZ CON JALAPEÑO Y\nQUESO CHEDDAR\nCon la freidora precalentada a 200°C hornea los muffins durante 30\nminutos, déjalos reposar unos minutos y después sírvelos."},{"id":106,"title":"PATATA CREMOSA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":116,"text":"PATATA CREMOSA\nDificultad Fácil\nTiempo de preparación 75 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n2 patatas medianas\n2 tiras de tocino fritas y picadas\n1 cdta de aceite de oliva\n90 g de queso cheddar rallado\n1 cda de cebollas verdes picada\nSal\nPimienta\n1 cda de mantequilla\n2 cda de crema pesada\nPREPARACIÓN\nSin quitarles la cáscara, mezcla las patatas con el aceite hasta que queden\ncubiertas completamente. Espolvorea por encima la sal y la pimienta al\ngusto. Llévelas a la cesta y cocínelas en la freidora de aire precalentada a\n200°C, durante 30 minutos. Pasado el tiempo voltéalas y cocina durante\notros 30 minutos. Llévalas a una tabla de picar y a lo largo le vas a hacer un\ncorte en medio de la cáscara. Sácale con cuidado todo el relleno y colócalo\nen un bol. Agrégale la sal, el tocino, la pimienta, cebolla, crema espesa y\nmantequilla. Mézclalo todo y rellena nuevamente las cáscaras. Agrégales el\nqueso por encima y llévalas a la cesta otra vez."},{"id":107,"title":"COCINAR PATATA CREMOSA y sirve.","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":117,"text":"COCINAR PATATA CREMOSA\nCon la freidora precalentada a 200°C hornea las patatas durante 20 minutos\ny sirve."},{"id":108,"title":"NAPOLITANAS DE JAMÓN Y QUESO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":118,"text":"NAPOLITANAS DE JAMÓN Y QUESO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 6 personas\nINGREDIENTES\n230 g de masa de hojaldre rectangular\n1 huevo batido\n110 g de lonchas de jamón cocinadas\n75 g de queso Havarti en lonchas\nPREPARACIÓN\nDesdobla la masa de hojaldre sobre un papel antiadherente. Por encima vas\na ir esparciendo el jamón y el queso cubriendo todas las partes de la masa.\nCorta la masa en 6 rectángulos. Vas a doblar los cuadrados llevando los\nextremos al centro, luego dobla otra vez hacia el centro y voltea para que\nlos dobles queden abajo. Ponlos en la bandeja y pásales una pincelada de\nhuevo batido.\nCOCINAR NAPOLITANAS DE JAMÓN Y QUESO\nCon la freidora precalentada a 200°C, cocínalas durante 20 minutos,\naproximadamente, y sirve."},{"id":109,"title":"SAQUITOS DE QUESO Y ARÁNDANOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":119,"text":"SAQUITOS DE QUESO Y ARÁNDANOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 13 minutos\nPara 8 personas\nINGREDIENTES\n8 masas de empanadillas\n8 cdta de mermelada de arándanos\n60 g de queso Grana Padano rallado\n4 cdta de Cebolla crujiente\nAceite de oliva en aerosol\nPREPARACIÓN\nVas a poner por separado cada masa de empanadilla. Las vas a rellenar con\nuna cucharadita de la mermelada. Luego agrega el queso granada y media\ncucharadita de cebolla. Lo siguiente es darles la forma de saco, con las\nmanos vas a ir cerrando los bordes hacia arriba haciendo presión con los\ndedos. Colócalos en la cesta, rocíalos con aceite de oliva y llévalos a la\nfreidora.\nCOCINAR SAQUITOS DE QUESO Y ARÁNDANOS\nCon la freidora precalentada a 200°C, cocínalas durante 13 minutos,\naproximadamente, y sirve."},{"id":110,"title":"CROQUETAS DE JAMÓN Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":120,"text":"CROQUETAS DE JAMÓN\nDificultad Media\nTiempo de preparación 6 horas\nTiempo de cocción 12 minutos\nPara 4 personas\nINGREDIENTES\n125 g de jamón serrano picado en trocos\n100 g de fécula de maíz\n1 cebolla picada en trozos pequeños\n60 ml de leche entera\n2 huevos\n1 cda de aceite de oliva\n1 pizca de sal\n1 pizca de pimienta\nPan rallado\nPREPARACIÓN\nEn un sartén a fuego medio vamos a agregar el aceite, esperáramos que\ncaliente un poco y luego agregamos las cebollas junto a la sal. Esperamos\nque la cebolla cocine y añadimos la pimienta junto a la fécula de maíz y\nvamos revolviendo todo por 2 minutos para después verter la leche entera\nsin dejar de batir. Agregamos el jamón y bajamos en fuego mientras\ncontinúas mezclando para que no se hagan grumos y espese. Cuando enfrié\nlo llevarás a un tazón y lo taparás con papel film, dejándolo reposar por 6\nhoras mínimo. Pasado el tiempo haces pequeñas bolas con la masa y las\ndejas a un lado. Mezcla los huevos en un recipiente aparte y en un plato\nplano vierte el pan rallado. Sumergimos las bolitas en el huevo batido y"},{"id":111,"title":"después la pasamos por el pan rallado cubriendo cada parte de este. Las","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":121,"text":"después la pasamos por el pan rallado cubriendo cada parte de este. Las\ncolocamos en la cesta de la freidora no sin antes ponerle una fina capa de\naceite por encima.\nCOCINAR CROQUETAS DE JAMÓN\nCon la freidora precalentada a 200°C cocina las croquetas de un lado por 8\nminutos, pasado el tiempo voltéalas y déjalas cocinarse otra vez por 4\nminutos más y sirve."},{"id":112,"title":"FRITURA ANDALUZA Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":122,"text":"FRITURA ANDALUZA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 3 personas\nINGREDIENTES\n500 g de pescados variados (Boquerones, salmonetes, lenguaditos,\netc.)\nSal\n1 tza de harina de trigo\nAceite en aerosol\nLimón\nPREPARACIÓN\nLimpia los pescados y quítales la espina central. Agrégales sal y luego\ncúbrelos con harina. Da una rociada del aceite en aerosol en la bandeja de la\nfreidora y coloca los pescados de manera separada. Coloca una última\npasada de aceite sobre los pescados antes de cocinarlos.\nCOCINAR FRITURA ANDALUZA\nCon la freidora precalentada a 180°C, cocina por 15 minutos hasta que toda\nla tanda esté frita y sirve."},{"id":113,"title":"CROQUETAS DE ESPINACAS Y QUESO AZUL Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":123,"text":"CROQUETAS DE ESPINACAS Y QUESO AZUL\nDificultad Fácil\nTiempo de preparación 3 horas 20 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n50 g de espinacas\n2 cda de harina\n130 g de cebolla\n100 de queso picado en cuadros\n200 g de pan rallado\n1 lata de leche de coco\n2 huevos batidos\nPREPARACIÓN\nEn una sartén a fuego medio vas a cocinar la cebolla picada con la harina.\nLuego irás vertiendo la leche poco a poco. Cuando tenga una consistencia\ngrumosa, agrega las espinacas y los cuadritos de queso. Retira del fuego y\nespera a que enfríe, luego vierte en un bol y llévalo al refrigerador por 3\nhoras. Cuando la preparación esté fría y firme, con ayuda una cuchara, toma\npequeñas porciones y dale la forma de croquetas. Sumérgelas en un tazón\ncon el huevo batido y luego cúbrelas con el pan rallado. Colócalas en la\nbandeja y llévalas a la freidora.\nCOCINAR CROQUETAS DE ESPINACAS Y QUESO AZUL\nCon la freidora precalentada a 200°C, cocina las croquetas por 15 minutos\nhasta que toda la tanda esté frita y sirve."},{"id":114,"title":"Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":125,"text":"SALMÓN AL PAPILLOTE CON VERDURAS\nDificultad Fácil\nTiempo de preparación 7 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\nDos lomos de salmón que pesen entre 150 a 180 g\n½ calabacín\n1 zanahoria pequeña\n6 tomates cherry\nSal\nPimienta negra al gusto\nAceite de oliva\nPREPARACIÓN\nPica el calabacín en trozos pequeños, los tomates córtalos a la mitad y pela\nla zanahoria quitándole los extremos. Ralla la zanahoria en láminas finas\ncon ayuda de un rallador de alimentos. Pon el calabacín y la zanahoria en\nuna bandeja cubierta con papel antiadherente. Espolvorea la sal y la\npimienta sobre ellos. Coloca el salmón por encima, sobre el agregamos sal,\naceite y al lado de este los tomates. Ahora dobla el papel sobre sí mismo\nhaciendo una especie de paquete bien sellado. Colócalo en la bandeja y\nllévalo a la freidora.\nCOCINAR SALMÓN AL PAPILLOTE CON VERDURAS\nCon la freidora precalentada a 200°C, cocina durante 8 a 10 minutos,\naproximadamente y sírvelo."},{"id":115,"title":"TORRIJAS DE LECHE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":127,"text":"TORRIJAS DE LECHE\nDificultad Fácil\nTiempo de preparación 1 hora 10 minutos\nTiempo de cocción 10 minutos\nPara 5 personas\nINGREDIENTES\n10 panes para torrijas\n500 ml de leche\n50 g de leche\nAceite de oliva\n1 huevo\nUna ramita de canela\nRalladura de limón\nPREPARACION\nPrimero calienta la leche en una olla para después ir añadiendo el azúcar, la\ncanela y la ralladura de limón sin dejar de mezclar. Cuando hierva retíralo\ndel fuego y déjalo enfriar. Ya frío, pon la leche en una fuente y sumerge ahí\nlos panes dejándolos alrededor de una hora. Bate el huevo en un recipiente\naparte. Agarra cada pan y pasa las dos caras de este en el huevo. Cubre la\ncesta de la freidora con papel de horno y riega un poco de aceite sobre este.\nCOCINAR TORRIJAS DE LECHE\nCon la freidora precalentada a 200°C, cocina las torrijas durante 10\nminutos, dándoles la vuelta cuando hayan pasado los primero 5 minutos, y\nsirve."},{"id":116,"title":"CUÑAS DE PATATA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":128,"text":"CUÑAS DE PATATA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n2 patatas grandes\n3 cda de crema agria\n2 cda de salsa de chile dulce\nSal\nPimienta\n1 cda de aceite de oliva\nPREPARACIÓN\nPica las patatas en rodajas y ponlas en un bol. Agrega el aceite, la sal y la\npimienta y mezcla todo junto. Colócalas en la cesta y llévalas a la freidora.\nCOCINAR CUÑAS DE PATATA\nCon la freidora precalentada a 180°C, cocina las patatas durante 25\nminutos. Pasados los primeros 15 minutos, voltéalas y déjalas cocinarse el\nresto del tiempo. Ya listas agrégales por encima la salsa de chile y sirve."},{"id":117,"title":"ALBARICOQUES CON BRIOCHE Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":129,"text":"ALBARICOQUES CON BRIOCHE\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 5 minutos\nPara 5 personas\nINGREDIENTES\n5 albaricoques maduros\n5 rebanadas de brioche\n2 cda de mantequilla\n2 cda de azúcar\n2 cda de miel\n320 g de helado de vainilla\nPREPARACIÓN\nPrimero hay que cocinar el brioche. Llévalos a la freidora precalentada a\n180°C y cocínalos durante 3 minutos para reservarlos luego. Corta los\nalbaricoques a la mitad y en un bol mézclalos con la mantequilla y el\nazúcar. Colócalas en la bandeja y llévalas a la freidora.\nCOCINAR ALBARICOQUES CON BRIOCHE\nCon la freidora precalentada a 180°C cocina los albaricoques durante 2\nminutos. Cuando estén asados colócalos sobre el brioche, agrega la miel, un\npoco de azúcar, una cucharada de helado y sirve."},{"id":118,"title":"CHULETAS DE PAVO EN VINO BLANCO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":132,"text":"CHULETAS DE PAVO EN VINO BLANCO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 32 minutos\nPara 2 personas\nINGREDIENTES\n5 chuletas de pavo\n2 patatas medianas\n2 dientes de Ajo\n60 ml de vino blanco\n1 cebolla\n1 cdta de tomillo\n1 pizca de sal\n1 pizca de pimienta\n1 chorrito aceite de oliva\nPREPARACIÓN\nPica las patatas en láminas, corta la cebolla en pedazos pequeños, al igual\nque el ajo, y colócalos todos en un molde para hornear. Ahora agrega la sal,\nla pimienta, el tomillo y vierte el vino blanco. Coloca también un chorrito\nde aceite. Hay que cocinar primero los vegetales, así que debes llevar el\nmolde a la freidora, para que cocine a 200°C, por 15 minutos. Saca el molde\ny voltea las patatas. Agrega las chuletas de pavo arriba de ellas,\nespolvoréales sal y vuelve a llevarlo a la freidora.\nCOCINAR CHULETAS DE PAVO EN VINO BLANCO"},{"id":119,"title":"PECHUGAS DE PAVO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":134,"text":"PECHUGAS DE PAVO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 1 hora\nPara 3 personas\nINGREDIENTES\n1 pechuga de pavo sin huesos de 1 k\n60 g de mayonesa\n2 cda de condimento para aves\n½ cdta de ajo en polvo\nSal\nPimienta negra al gusto\nPREPARACIÓN\nUnta la pechuga de pavo con la mayonesa. Espolvorea sobre este, la sal, la\npimienta, el condimento para aves y el ajo en polvo. Colócalo en la cesta y\nllévalo a la freidora.\nCOCINAR PECHUGAS DE PAVO\nCon la freidora precalentada a 180°C, cocina el pavo durante 1 hora\naproximadamente. Cada 20 minutos voltea la pechuga para que se cocine\nbien y sirve."},{"id":120,"title":"PAVO ENVUELTO CON BACON Y ESPÁRRAGOS Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":135,"text":"PAVO ENVUELTO CON BACON Y\nESPÁRRAGOS\nDificultad Media\nTiempo de preparación 25 minutos\nTiempo de cocción 12 minutos\nPara 4 personas\nINGREDIENTES\n8 chuletas de pechuga de pavo\n350 g de espárragos\n½ tza de mezcla de mayonesa Dijon\n4 cdta de leche\nCondimento para aves\n8 lonchas de jamón serrano\n8 rebanadas de queso provolone\n½ cdta de pimienta\n8 tiras de bacon\nAceite en aerosol\nPREPARACIÓN\nRocía con aceite la bandeja de la freidora de aire y coloca los espárragos en\nella. Cocínalos a 180°C durante 15 minutos y resérvalos. A las chuletas de\npavo las vas a cubrir con una cucharada de mayonesa Dijon y luego arriba\nvas a colocar el queso, jamón y los espárragos. Agrégales por encima la\npimienta el condimento de aves. Termina envolviendo con el bacon. Lleva a\nla bandeja rociada con aceite y lleva a la freidora."},{"id":121,"title":"COCINAR PAVO ENVUELTO CON BACON Y ESPÁRRAGOS","category":"Carnes y aves","source":"365 recetas sin aceite","page":136,"text":"COCINAR PAVO ENVUELTO CON BACON Y ESPÁRRAGOS\nCon la freidora precalentada a 190°C, cocina durante 12 minutos\naproximadamente. Pasados los primero 5 minutos voltea las chuletas y\nsiegue cocinando. En un recipiente mezcla 2 cucharadas de mayonesa\nDijon, 4 de leche y media cucharadita de condimento para aves. Vierte la\nmezcla cuando sobre las chuletas cuando estén tibias y sirve."},{"id":122,"title":"HAMBURGUESAS DE PAVO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":137,"text":"HAMBURGUESAS DE PAVO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n225 g de carne de pavo molida\n2 panes de hamburguesa\n3 cebollas picadas\n2 cdas de pan rallado\n1 pizca de sal\n1 pizca de pimienta\n½ cdta de aderezo ranchero\nPREPARACIÓN\nEn un tazón vas a mezclar el pavo molido con pan rallado, el aderezo\nranchero, las cebollas picadas finamente, sal y pimienta hasta que se haga\nuna masa homogénea. Divídela en dos y con las manos ve dándoles la\nforma de una hamburguesa. Rebana los panes por la mitad y tuéstalos sobre\nuna sartén. Lleva la carne de hamburguesa a la freidora.\nCOCINAR HAMBURGUESAS DE PAVO\nCon la freidora precalentada a 200°C pon a cocinar las hamburguesas por\n12 minutos aproximadamente. Colóquelas entre los bollos y agrega los\nacompañantes de tu preferencia."},{"id":123,"title":"NUGGETS DE PAVO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":138,"text":"NUGGETS DE PAVO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 1 personas\nINGREDIENTES\n1 Pechuga de pavo picada en trozos\n150 g de pan rallado\n120 g de harina\n2 Huevos\n½ cdta de Ajo en polvo\nSal\n2 cda de aceite de oliva\nSalsa búfalo (opcional)\nPREPARACIÓN\nColoca los cuadrados de pavo en un bol y mézclalos con el aceite, la sal y el\najo en polvo. En un tazón vas a batir los huevos. En un plato plano vas a\nagregar la harina y el otro aparte vas a agregar el pan rallado. Pasa los\ntrozos de pavo primero por la harina, luego sumérgelos en el huevo y\ndespués pásalos por el pan rallado. Ponlos en la cesta y llévalos a la\nfreidora.\nCOCINAR NUGGETS DE PAVO\nCon la freidora precalentada a 180°C, cocina los nuggets durante 15\nminutos. Cuando pasen los primero 5 minutos voltéalos y déjalos cocinarse\nel resto del tiempo para servir."},{"id":124,"title":"Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":140,"text":"CORONA DE PAVO ASADO CON VERDURAS\nDificultad Media\nTiempo de preparación 40 minutos\nTiempo de cocción 45 minutos\nPara 4 personas\nINGREDIENTES\n1 corona de pavo de 1 k\n20 g de mantequilla\n4 ramitas de tomillo\n3 ramitas de romero\n150 g de zanahorias pequeñas\n2 apios de campo pequeños\n5 rodajas de panceta\n4 bolas de relleno\n4 cerdos en mantas\n500 g de patatas asadas\n150 g de coles de Bruselas\n2 cda de aceite de oliva\nSal\nPimienta negra al gusto\nPREPARACIÓN\nPela y corta por la mitad las zanahorias y el apio. Ponlos en un bol con las\ncoles, el romero y las patatas asadas. Vierte aceite y llévalos a la freidora\npor 30 minutos a 190°C y reserva. Unta el pavo con mantequilla por debajo\nde la piel y por arriba. Añade el tomillo abajo de la piel y agrégale sal y\npimienta por encima. Coloca las rodajas de panceta arriba fijándolas con"},{"id":125,"title":"palillos de cocina. Coloca el pavo en la bandeja con el lado de la panceta","category":"Carnes y aves","source":"365 recetas sin aceite","page":141,"text":"palillos de cocina. Coloca el pavo en la bandeja con el lado de la panceta\nhacia abajo y llévalo a la freidora.\nCOCINAR CORONA DE PAVO ASADO CON VERDURAS\nCon la freidora precalentada a 190°C vas a asar el pavo durante 45 minutos.\nCuando pasen los primeros 25 minutos baja la temperatura a 160°C, voltea\nel pavo y coloca al lado del pavo las bolas de relleno con los cerdos en\nmantas y deja cocinar por el resto del tiempo. En un plato coloca las\nverduras, arriba de ellas coloca el pavo y sirve."},{"id":126,"title":"PIERNA DE PAVO CON CERVEZA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":142,"text":"PIERNA DE PAVO CON CERVEZA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 40 minutos\nPara 1-2 personas\nINGREDIENTES\n1 muslo de pavo\n300 ml de cerveza\n1 limón\n2 dientes de ajo picados\n1 pizca de pimienta negra\nSal\nAceite de oliva\nPREPARACIÓN\nEn un tazón coloca el muslo de pavo. Agrégale la sal, la pimienta y el aceite\nde oliva. Colócalo en la cesta y ahí exprime el limón sobre él. Riega el ajo\npor encima y llévalo a la freidora.\nCOCINAR PIERNA DE PAVO CON CERVEZA\nCon la freidora precalentada a 200°C, vas a cocinar durante 40 minutos.\nCuando pasen los primeros 10 minutos, baja la temperatura a 150ºC, vierte\ndentro de la cesta la cerveza y vuelve a hornear por 30 minutos. Después\ndéjalo reposar y sirve"},{"id":127,"title":"SOLOMILLO DE PAVO CON LIMÓN ENCURTIDO Y ROMERO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":143,"text":"SOLOMILLO DE PAVO CON LIMÓN\nENCURTIDO Y ROMERO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n2 solomillos de pavo\n1 cdta de sal\n1 cdta de pimienta negra\n1 cdta de pimentón ahumado\n½ limón encurtido\n4 dientes de ajo\n4 ramitas de romero fresco\n1 cda de aceite de oliva virgen extra\nPREPARACIÓN\nEn un plato coloca los solomillos. Agrega el aceite y úntalo por los dos\nsolomillos. Espolvorea encima la sal, la pimienta y el pimentón. Corta el\nlimón encurtido en gajos delgados y machaca los dientes de ajo. Coloca los\nsolomillos en la cesta, sobre ellos pon los gajos de limón, el romero y los\najos. Llévalos a la freidora.\nCOCINAR SOLOMILLO DE PAVO CON LIMÓN ENCURTIDO Y\nROMERO\nCon la freidora precalentada a 200°C, cocina durante 12 minutos y sirve."},{"id":128,"title":"BROCHETAS DE PAVO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":145,"text":"BROCHETAS DE PAVO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 14 minutos\nPara 2 personas\nINGREDIENTES\n500 g de pavo cortado en cuadrados\n1 calabacín mediano\n1 pimiento verde\n1 cda de aceite de oliva\n3 cda de orégano\n1 cda de ajo en polvo\nPimienta negra al gusto\nSal\nPREPARACIÓN\nEn un tazón coloca el pavo y mézclalo con el aceite, la sal, la pimienta, el\norégano y el ajo en polvo. Pica el calabacín y el pimiento en forma de\ncuadrados. Con un palillo de altura vas a pinchar primero el pavo, después\nel pimiento y seguido el calabacín. Interna hasta llenar un poco más de la\nmitad del palillo. Colócalos en la cesta y llévalos a la freidora.\nCOCINAR BROCHETAS DE PAVO\nCon la freidora precalentada a 180°C, cocina durante 14 minutos y sirve."},{"id":129,"title":"PECHUGA DE PAVO RELLENA DE BACON Y TOMATE Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":146,"text":"PECHUGA DE PAVO RELLENA DE BACON Y\nTOMATE\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n4 filetes de pavo\n1 Tomate picado en rodajas\n4 lonchas de Bacon\n1 Huevo\n60 g de pan rallado\n1 cdta de pimienta\nSal\nAceite en aerosol\nPREPARACIÓN\nToma dos de los filetes y colócalos en un plato. Encima de ellos coloca, en\ncada uno, dos lonchas de bacon y dos rodajas de tomate. Colocamos los\notros dos filetes encima de ellos y en los bordes clavamos palillos de\ndientes para sellarlos. En un bol bate el huevo y en un plato plano coloca el\npan rallado. Sumerge los filetes primero en el huevo y luego pásalos por el\npan rallado. Colócalos en la cesta estando separados, rocía sobre ellos aceite\ny llévalos a la freidora."},{"id":130,"title":"COCINAR PECHUGA DE PAVO RELLENA DE BACON Y","category":"Carnes y aves","source":"365 recetas sin aceite","page":147,"text":"COCINAR PECHUGA DE PAVO RELLENA DE BACON Y\nTOMATE\nCon la freidora precalentada a 200°C, cocina durante 12 minutos. Cuando\npasen los primeros 6 minutos voltéalos y déjalos cocinar por el tiempo\nrestante y sirve."},{"id":131,"title":"PAVO AL HORNO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":148,"text":"PAVO AL HORNO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 35 minutos\nPara 4 personas\nINGREDIENTES\n1 pechuga de pavo entero con huesos\n1 cdta de tomillo\n1 cdta de romero\n1 cdta salvia\n¼ tza de miel\n2 cda de mostaza de Dijon\n1 cda de mantequilla derretida\nPimienta negra\nSal\nPREPARACIÓN\nEn un bol mezcla una salsa con la miel, la mostaza dijon, la mantequilla y\nreserva. Aliña el pavo con la sal y la pimienta. Agrega el tomillo junto al\nromero y frótalos sobre la piel de este. Colócalo en la cesta y llévalo a la\nfreidora.\nCOCINAR PAVO AL HORNO\nCon la freidora precalentada a 200°C, modo horno, cocina el pavo durante\n30 minutos aproximadamente. Cuando esté dorado, sácalo y unta sobre este\nla preparación de miel para volver a llevarlo a la freidora otros 2 minutos a\n165°C. Déjalo reposar y sírvelo."},{"id":132,"title":"PAVO RELLENO AL HORNO Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":150,"text":"PAVO RELLENO AL HORNO\nDificultad Media\nTiempo de preparación 25 minutos\nTiempo de cocción 45 minutos\nPara 5-6 personas\nINGREDIENTES\n1 pechuga de pavo entero con huesos\n2 tallos de apio picados\n1 limón picado en rodajas\n35 g de hojas de orégano picadas\n60 g de perejil picado\n1 cdta de hojas de salvia secas\n2 tza de caldo de pavo\n3 dientes de ajo picados\n½ cebolla grande picada\n2 huevos\n600 g de salchichas\n4 cda de mantequilla\nPimienta negra al gusto\nSal\nPREPARACIÓN\nQuítales la piel a las salchichas y muélelas. En una sartén a fuego medio\nagrega 2 cucharadas de mantequilla, con la carne de salchicha, y cocina por\n6 minutos. Después añade el apio, la cebolla, el ajo y la salvia a la\npreparación, cocina 12 minutos más y retira del fuego. En un bol bate los\nhuevos con el perejil. Vierte el caldo de pavo en la preparación de"},{"id":133,"title":"salchichas y luego los huevos para tener listo el relleno. Mete la preparación","category":"Desayunos","source":"365 recetas sin aceite","page":151,"text":"salchichas y luego los huevos para tener listo el relleno. Mete la preparación\ndentro del pavo, ciérrala la piel con unos palillos. Unta el resto de la\nmantequilla con perejil, orégano, sal y pimienta sobre el pavo. Colócalo en\nla bandeja y pásalo a la freidora.\nCOCINAR PAVO RELLENO AL HORNO\nCon la freidora precalentada a 200°C, cocina el pavo durante 45 minutos.\nCuando esté listo coloca rodajas de limón sobre este como adorno y sirve."},{"id":134,"title":"DRUMETTES DE PAVO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":152,"text":"DRUMETTES DE PAVO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 40 minutos\nPara 4 personas\nINGREDIENTES\n650 g de pavo\n1 cda de aceite de sésamo\n1 cdta de condimentos para aves\nPREPARACIÓN\nCorta el pavo para que tenga una forma circular. Colócalo en un bol y\nmezcla con el aceite de sésamo y el condimento para aves. Colócalos en la\nbandeja y llévalos a la freidora.\nCOCINAR DRUMETTES DE PAVO\nCon la freidora precalentada a 200°C, modo horno, cocina durante 40\nminutos. Cuando pasen los primero 20 minutos voltea los drumettes, y\nponlos nuevamente a cocinar por el tiempo restante y sirve."},{"id":135,"title":"PECHUGA DE PAVO CUBIERTO CON GLASEADO DE CEREZA Dificultad media","category":"Carnes y aves","source":"365 recetas sin aceite","page":153,"text":"PECHUGA DE PAVO CUBIERTO CON\nGLASEADO DE CEREZA\nDificultad media\nTiempo de preparación 15 minutos\nTiempo de cocción 35 minutos\nPara 8 personas\nINGREDIENTES\n5 libras de pechuga de pavo con hueso\n1 cdta de tomillo seco\n½ cdta de salvia seca\n2 cdta de aceite de oliva\n50 g de cerezas\n1 cda de hojas de tomillo, picadas\n1 cdta de salsa de soja\nPimienta negra al gusto\nSal\nPREPARACIÓN\nEn una olla vas a mezclar las cerezas con media cucharadita de pimienta\nnegra, la salsa de soja y el tomillo. Llévalo a fuego medio, cuando esté esta\nsalsa espesa, retírala y reserva. Aliña el pavo con aceite, tomillo, pimienta,\nsalvia y la sal. Colócalo en la bandeja y llévalo a la freidora.\nCOCINAR PECHUGA DE PAVO CUBIERTO CON GLASEADO DE\nCEREZA"},{"id":136,"title":"Con la freidora precalentada a 180°C, cocina durante 35 minutos. Cuando","category":"Carnes y aves","source":"365 recetas sin aceite","page":154,"text":"Con la freidora precalentada a 180°C, cocina durante 35 minutos. Cuando\npasen los primeros 25 minutos voltea el pavo y cocínalo el tiempo que\nqueda. Cuando esté dorado, cúbrelo con la primera preparación y sirve."},{"id":137,"title":"TORTAS DE PAVO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":155,"text":"TORTAS DE PAVO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n500 g de carne molida de pavo\n6 champiñones picados\n1 cdta de ajo en polvo\n1 cdta de cebolla en polvo\nPasta de tomate para servir\nSal\nPimienta negra\nAceite en aerosol\nPREPARACIÓN\nLicúa los champiñones con sal y pimienta por 4 minutos. Ponlos en un bol y\nagrega el pavo, la cebolla en polvo, el ajo en polvo, un poco más de sal y la\npimienta y mezcla todo hasta que quede una masa. Agarra pequeñas\nporciones y dales forma de pastelitos. Colócalas en la bandeja, rocíalas con\naceite y llévalas a la freidora.\nCOCINAR TORTAS DE PAVO\nCon la freidora precalentada a 160°C, cocínalas durante 10 minutos y\nsírvelas."},{"id":138,"title":"PECHUGA DE POLLO Dificultad fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":156,"text":"PECHUGA DE POLLO\nDificultad fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n3 Pechugas de pollo sin hueso\n½ cdta de ajo en polvo\n1 pizca de pimienta\n½ cdta orégano\n1 cdta Aceite\nPREPARACIÓN\nUnta las pechugas con aceite. Espolvorea sobre ellas la sal, la pimienta, el\norégano y el ajo en polvo. Colócalas en la cesta y llévalas a la freidora.\nCOCINAR PECHUGA DE POLLO\nCon la freidora precalentada a 180°C, cocine durante 20 minutos. Después\nde los primeros 10 minutos voltea las pechugas, cocina el resto del tiempo y\nsirva."},{"id":139,"title":"NUGGETS DE POLLO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":157,"text":"NUGGETS DE POLLO\nDificultad Fácil\nTiempo de preparación 40 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n2 pechugas de pollo molidas\n1 vaso de leche\n3 huevos\n185 g de pan rallado\nSal\nPimienta negra\nNuez moscada\nPREPARACIÓN\nColoca en un bol la carne de pollo con 120 g de pan rallado, sal, pimienta y\nnuez moscada. Vierte la leche y 1 huevo. Mezcla hasta formar una masa y\ndéjala unos 30 minutos en el refrigerador. En un tazón aparte bate los\nhuevos y en un plato plano agrega el resto del pan rallado. Agarra pequeñas\ncantidades de la masa y dales forma. Sumérgelas en el huevo y luego\npásalas por el pan rallado. Colócalas en la bandeja y llévalas a la freidora.\nCOCINAR NUGGETS DE POLLO\nCon la freidora precalentada a 200°C, cocina durante 15 minutos y sirve."},{"id":140,"title":"POLLO ASADO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":158,"text":"POLLO ASADO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 1 hora\nPara 4 personas\nINGREDIENTES\n1 pollo entero con huesos\n2 cda de aceite de oliva\n1 cda de sal sazonada\nPREPARACIÓN\nQuítale las menudencias al pollo. Aliña el pollo con la sal y úntale el aceite.\nColócalo en la cesta y llévalo a la freidora.\nCOCINAR POLLO ASADO\nCon la freidora precalentada a 175°C, cocina durante 1 hora. Después de los\nprimeros 30 minutos voltea el pollo, cocina el resto del tiempo y sirve."},{"id":141,"title":"HAMBURGUESAS DE POLLO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":159,"text":"HAMBURGUESAS DE POLLO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 2 personas\nINGREDIENTES\n250 g de pechuga de pollo molido\n2 panes de hamburguesa\n2 cda de pan rallado\n1 pizca de sal\n1 diente de ajo picado\nPimienta negra al gusto\nAceite de oliva\nPREPARACIÓN\nEn un tazón mezcla el pollo con pan rallado, huevo, ajo y la pimienta hasta\nque se haga una masa. Divídela en dos y con las manos ve dándoles la\nforma de hamburguesa. Cúbrelas con aceite. Colócalas en la bandeja y\nllévalas a la freidora.\nCOCINAR HAMBURGUESAS DE POLLO\nCon la freidora precalentada a 200°C, pon a cocinar las hamburguesas por\n15 minutos aproximadamente. Rebana los panes por la mitad y tuéstalos\nsobre una sartén. Coloca las carnes entre los panes y agrega los\nacompañantes de tu preferencia."},{"id":142,"title":"TROCITOS DE POLLO AGRIDULCE A LA NARANJA Dificultad Media","category":"Postres","source":"365 recetas sin aceite","page":160,"text":"TROCITOS DE POLLO AGRIDULCE A LA\nNARANJA\nDificultad Media\nTiempo de preparación 25 minutos\nTiempo de cocción 15 minutos\nPara 3 personas\nINGREDIENTES\n500 g de pollo picado en cuadros\n2 huevos\n2 cda de fécula de maíz\n50 g de harina\n1 cdta de sal\n1 cdta de pimienta negra\n2 cdta de aceite de oliva\n2 dientes de ajo picados\n1 cdta de jengibre fresco picado\n1 tza de jugo de naranja\n1 cda y media de miel\n1 cda y media de salsa de soja\n2 cda de agua\n1 cda de vinagre de arroz\nPREPARACIÓN\nEn un tazón pequeño vierte agua y agrega 1 cucharada de la fécula de maíz,\nmezcla hasta que diluya y reserva. En una olla a fuego medio agrega el\naceite con el jengibre y el ajo. Cuando esté caliente añade el jugo de"},{"id":143,"title":"naranja, la miel, el vinagre y la soja. Agrega la fécula de maíz diluida.","category":"Desayunos","source":"365 recetas sin aceite","page":161,"text":"naranja, la miel, el vinagre y la soja. Agrega la fécula de maíz diluida.\nEspera que espese, retira del fuego y reserva. En un bol bate los huevos y en\nun tazón mezcla la harina con 1 cucharada de fécula de maíz, sal y\npimienta. Sumerge el pollo en el huevo y después pásalo por la preparación\nde harina. Colócalo en la bandeja y llévalos a la freidora.\nCOCINAR TROCITOS DE POLLO AGRIDULCE A LA NARANJA\nCon la freidora precalentada a 180°C, cocina durante 15 minutos. Espera\nque enfríen un poco, báñalos en la salsa de naranja y sirve."},{"id":144,"title":"POLLO EMPANIZADO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":162,"text":"POLLO EMPANIZADO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 2-3 personas\nINGREDIENTES\n400 g milanesas de pollo\n120 g de pan molido\n½ tza de leche evaporada\nSal\nPimienta negra molida\nAceite en aerosol\nPREPARACIÓN\nMezcla el pollo con sal y pimienta. En un bol vierte la leche evaporada, en\nun plato plano coloca el pan rallado. Sumerge el pollo en la leche y luego\npásalo por el pan rallado. Colócalo en la bandeja, rocíalo con el aceite y\nllévalo a la freidora.\nCOCINAR POLLO EMPANIZADO\nCon la freidora precalentada a 200°C cocina durante 15 minutos. Cuando\npasen los primeros 10 minutos voltea el pollo, deja cocinar el resto del\ntiempo y sirve."},{"id":145,"title":"CROQUETAS DE POLLO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":163,"text":"CROQUETAS DE POLLO\nDificultad Fácil\nTiempo de preparación 45 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n450 g de pechuga de pollo cortada en trozos\n1 cebolla\n2 dientes de ajo picados\n700 g de harina de trigo\n500 ml de leche\n50 g de mantequilla\nPan rallado\n2 huevos\nAceite de oliva\nSal\nPimienta negra molida\nPREPARACIÓN\nCorta la cebolla en trozos finos y llévala a un satén con dos cucharadas de\naceite. Agrega el ajo, luego el pollo y mezcla por 10 minutos. Agrega sal,\npimienta y retira del fuego. Coloca harina y mantequilla a una olla y\nmezcla. Vierte la leche en la harina. Añade la mezcla del pollo, revuelve y\ndéjalo en la nevera 30 minutos. Bate el huevo en un tazón y pon el pan\nrallado en un plato. Has pequeñas bolitas con la mezcla y pásalas por el\nhuevo y luego por el pan rallado."},{"id":146,"title":"COCINAR CROQUETAS DE POLLO","category":"Carnes y aves","source":"365 recetas sin aceite","page":164,"text":"COCINAR CROQUETAS DE POLLO\nCon la freidora precalentada a 200°C cocínalas por unos 10 minutos.\nDespués sácalas para voltearlas y vuelve a cocinarlas 5 minutos para servir."},{"id":147,"title":"ALITAS DE POLLO EN SALSA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":165,"text":"ALITAS DE POLLO EN SALSA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 1 hora y 50 minutos\nPara 4 personas\nINGREDIENTES\n10 alitas de pollo\n½ tza de salsa de soja\n90 g de azúcar morena\n113 g de mantequilla\n½ cdta de mostaza picante\n60 ml de agua\nPREPARACIÓN\nEn un tazón mediano mezcla todos los ingredientes, excepto las alitas, hasta\ntener una salsa. Agrega esta sobre las alitas. Colócalas en la bandeja y\nllévalas a la freidora.\nCOCINAR ALITAS DE POLLO EN SALSA\nCon la freidora precalentada a 140°C, cocina durante 1 hora y 50 minutos y\nsirva."},{"id":148,"title":"POLLO CON SUERO DE MANTEQUILLA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":166,"text":"POLLO CON SUERO DE MANTEQUILLA\nDificultad Fácil\nTiempo de preparación 5 horas\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n650 g de muslo de pollo\n2 tza de suero de mantequilla\n150 g de harina\n1 cda de polvo de hornear\n1 cda de pimentón dulce\n1 cda de ajo en polvo\nSal\nPimienta negra molida\n1 pizca de cayena\nPREPARACIÓN\nEn un bol coloca el pollo, el suero de mantequilla, la pimienta, la cayena y\nmézclalos. Tápalo con un plato y déjalo en el refrigerador por 5 horas. En\nun tazón aparte mezcla la harina con el ajo en polvo, el polvo de hornear y\nel pimentón. Escurre los muslos de pollo y pásalos por la harina. Colócalos\nen la bandeja y llévalos a la freidora.\nCOCINAR POLLO CON SUERO DE MANTEQUILLA\nCon la freidora precalentada a 180°C, cocina durante 20 minutos. Pasados\nlos primero 10 minutos volverlos y deje que se cocinen el resto del tiempo\npara servirlos."},{"id":149,"title":"POLLO CREMOSO CON COCO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":168,"text":"POLLO CREMOSO CON COCO\nDificultad Fácil\nTiempo de preparación 2 horas\nTiempo de cocción 30 minutos\nPara 2 personas\nINGREDIENTES\n2 Muslos grandes de pollo\n2 cda de crema de coco\n2 ½ cdta de cúrcuma en polvo\n1 cda de jengibre rallado\nSal\nPimienta negra molida\nPREPARACIÓN\nEn un bol mezcla con un batidor la crema de coco, la sal, la pimienta, el\njengibre y la cúrcuma. Agrega el pollo, tapa con un plato y déjalo en el\nrefrigerador por 2 horas. Pasado el tiempo colócalos en la bandeja y llévalos\na la freidora.\nCOCINAR POLLO CREMOSO CON COCO\nCon la freidora precalentada a 180°C, cocina durante 30 minutos\naproximadamente y sirva."},{"id":150,"title":"POLLO A LAS HIERBAS Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":169,"text":"POLLO A LAS HIERBAS\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n1 pollo entero\n1 cdta de ajo en polvo\n1 cdta de cebolla en polvo\n½ cdta de tomillo seco\n1 cdta de romero, seco\n1 cda de Jugo de limón\nSal\nPimienta\n2 cda de aceite de oliva\nPREPARACIÓN\nAliña el pollo con la sal, cebolla en polvo, ajo en polvo, romero, tomillo y\nla pimienta. Úntale encima el aceite y el jugo de limón. Déjalo reposar en el\nrefrigerador por 30 minutos. Pasado el tiempo colócalos en la bandeja y\nllévalos a la freidora.\nCOCINAR POLLO A LAS HIERBAS\nCon la freidora precalentada a 180°C, cocina durante 40 minutos. Cuando\npasen los primero 20 minutos voltea el pollo y déjalo cocinarse el resto del\ntiempo y sirve."},{"id":151,"title":"BROCHETA DE POLLO AGRIDULCE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":170,"text":"BROCHETA DE POLLO AGRIDULCE\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n450 g de pechugas de pollo picadas en cuadros\n4 dientes de ajo picados\n1 ½ cda de salsa de soja\n2 cda de jugo de piña\n1 cda de aceite de sésamo\n½ cdta de jengibre picado\n1 pizca de pimienta\nPREPARACIÓN\nEn un tazón grande mezcla todos los ingredientes menos el pollo. Pincha el\npollo con palillos de altura, colócalos en el tazón y déjalos marinar por 2\nhoras. Pasado el tiempo colócalos en la bandeja y llévalos a la freidora.\nCOCINAR BROCHETA DE POLLO AGRIDULCE\nCon la freidora precalentada a 180°C, cocina durante 20 minutos y sirve."},{"id":152,"title":"ALBÓNDIGAS DE POLLO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":171,"text":"ALBÓNDIGAS DE POLLO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 3 personas\nINGREDIENTES\n550 g de pollo molido\n1 huevo batido\n½ tza de queso mozzarella rallado\n1 cda de condimento para tacos\n2 dientes de ajo picados\n2 cda de perejil picado\n1 cebolla picada\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nTodos los ingredientes los vas a colocar en un bol grande y a mezclarlos\nhasta formar una masa homogénea. Agarra pequeñas porciones y dale\nformas de bolas. Colócalas en la bandeja y llévalas a la freidora.\nCOCINAR ALBÓNDIGAS DE POLLO\nCon la freidora precalentada a 200°C, cocina durante 10 minutos y sirve."},{"id":153,"title":"POLLO CON CHAMPIÑONES Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":172,"text":"POLLO CON CHAMPIÑONES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n600 g de pechugas de pollo\n85 g de tomates secos\n225 g de champiñones picados en rodajas\n½ tza de mayonesa\n1 cdta de sal\nPREPARACIÓN\nPica las pechugas de pollo a la mitad. Únta sobre ellas la mayonesa y\nespolvorea la sal. Colócalas en la bandeja de la freidora. Arriba de este vas\na colocar los tomates secos y los champiñones. Lleva a la freidora.\nCOCINAR POLLO CON CHAMPIÑONES\nCon la freidora precalentada a 180°C, cocina durante 25 minutos y sirve."},{"id":154,"title":"POLLO AL CILANTRO Y LIMÓN Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":173,"text":"POLLO AL CILANTRO Y LIMÓN\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 20 minutos\nPara 5 personas\nINGREDIENTES\n550 g de muslo de pollo sin huesos\n1 cda de cilantro picado\n1 cdta de condimento para aves\n1 cdta de salsa de soja\njugo de limón\n1 cdta de aceite de oliva\nPimienta negra molida\nSal\nAceite en aerosol\nPREPARACIÓN\nEn un tazón grande mezcla todos los ingredientes menos el pollo. Cuando\nse haga una salsa uniforme, agrega el pollo. Tápalo con plástico y déjalo en\nel refrigerador toda la noche. Coloca los muslos en la bandeja rociada\npreviamente con aceite y llévalos a la freidora.\nCOCINAR POLLO AL CILANTRO Y LIMÓN\nCon la freidora precalentada a 200°C, cocínalas durante 20 minutos.\nCuando pasen los primeros 10 minutos voltea los muslos, cocina el resto del\ntiempo y sirve."},{"id":155,"title":"CACEROLA DE POLLO Y BRÓCOLI Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":174,"text":"CACEROLA DE POLLO Y BRÓCOLI\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 1 hora\nPara 4 personas\nINGREDIENTES\n3 pechugas grandes de pollo picadas en cubos\n2 tza de brócoli cortado en ramilletes\n2 cda de aceite de oliva\n2 latas de crema de champiñones\n1 lata de caldo de pollo\n1 lata de castañas de agua escurridas\n1 lata de champiñones escurridos\n1 lata de aros de cebolla\n2 cda de mantequilla\nPREPARACIÓN\nEn una sartén a fuego bajo con aceite cocina los brócolis y el pollo.\nLlévalos a un bol grande y mezcla con el resto de los ingredientes. Vierte el\ncompuesto en una cacerola para hornear, untada con mantequilla y llévala a\nla freidora.\nCOCINAR CACEROLA DE POLLO Y BRÓCOLI\nCon la freidora precalentada a 135°C, cocina durante 1 hora y sirve."},{"id":156,"title":"PECHUGAS DE POLLO A LA BARBACOA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":175,"text":"PECHUGAS DE POLLO A LA BARBACOA\nDificultad Fácil\nTiempo de preparación 1 hora\nTiempo de cocción 15 minutos\nPara 5 personas\nINGREDIENTES\n5 Pechugas de pollo deshuesadas sin piel\n2 ½ cda de condimento para barbacoa\nAceite en aerosol\nPREPARACIÓN\nEn un bol mezcla las pechugas de pollo con el condimento de barbacoa.\nTápalo con plástico y déjalo en el refrigerador por 1 hora. Colócalas en la\nbandeja rociada previamente con aceite y llévalos a la freidora.\nCOCINAR PECHUGAS DE POLLO A LA BARBACOA\nCon la freidora precalentada a 200°C, cocina durante 15 minutos. Cuando\nllegue a los primeros 7 minutos, voltea el pollo y déjalo cocinarse el resto\ndel tiempo para servir."},{"id":157,"title":"MILANESAS DE POLLO CON MIEL Y MOSTAZA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":176,"text":"MILANESAS DE POLLO CON MIEL Y\nMOSTAZA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 6 personas\nINGREDIENTES\n6 milanesas de pollo\n2 cda de romero picado\n2 cda de miel\n1 cda de mostaza de Dijon\nSal\nPimienta\nPREPARACIÓN\nEn un tazón has una salsa con la mostaza, la miel, la pimienta, el romero y\nla sal. Únta las milanesas completamente con la preparación. Colócalas en\nla bandeja, rociada previamente con aceite, y llévalas a la freidora.\nCOCINAR MILANESAS DE POLLO CON MIEL Y MOSTAZA\nCon la freidora precalentada a 170°C, cocina durante 25 minutos\naproximadamente y sirve."},{"id":158,"title":"PALILLOS DE POLLO CON SALSA PICANTE Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":177,"text":"PALILLOS DE POLLO CON SALSA PICANTE\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 2 personas\nINGREDIENTES\n500 g de muslos de pollo\n70 g de harina\n1 cda de salsa picante\n1 cdta de ajo en polvo\n1 cdta de cebolla en polvo\n½ cdta de tomillo seco\n1 cdta de romero, seco\nSal\nPimienta negra molida al gusto\n2 cda de aceite de oliva\nPREPARACIÓN\nEn un bol mezcla la harina, todos los condimentos y la salsa picante. Pica\nlos muslos de pollo en tiras largas y pásalas por la mezcla de harina.\nColócalos en la bandeja y llévalos a la freidora.\nCOCINAR PALILLOS DE POLLO CON SALSA PICANTE\nCon la freidora precalentada a 180°C cocina durante 25 minutos. Cuando\nllegue a los primeros 15 minutos voltéalos y déjalos cocinarse el resto del\ntiempo para servir."},{"id":159,"title":"POLLO RELLENO DE BACON Y QUESO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":178,"text":"POLLO RELLENO DE BACON Y QUESO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n2 pechugas de pollo de 450 g c/u\n4 cda de queso de cabra\n½ cdta de ajo en polvo\n1 cdta de orégano seco\n1 cdta de perejil picado\n4 lonchas de tocino\n1 cda de aceite de oliva\nPREPARACIÓN\nColoca papel film sobre las pechugas y dales pequeños golpes hasta que\nqueden aplanadas. Coloca sobre ellas el queso y el bacon. Enróllalas y\nasegura con palillos. Úntalos con el aceite, el ajo en polvo, orégano y\nperejil. Colócalos en la bandeja y llévalos a la freidora.\nCOCINAR POLLO RELLENO DE BACON Y QUESO\nCon la freidora precalentada a 200°C, modo hornear, cocina durante 20\nminutos. Cuando llegue a los primeros 10 minutos, voltéalos y déjalos\ncocinarse el resto del tiempo para servir."},{"id":160,"title":"BISTEC FRITO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":181,"text":"BISTEC FRITO\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 15 minutos\nPara 2 personas\nINGREDIENTES\n2 chuletas de res deshuesadas que tengan 1 pulgada de grosor\n2 cdta de aceite de oliva\nSal\nPimienta negra molida\nPREPARACIÓN\nEn un tazón coloca los filetes y úntalos con aceite. Espolvoréales por\nencima la sal y la pimienta. Tápalo con plástico y déjalo reposar en el\nrefrigerador por 30 minutos. Pasado el tiempo colócalos en la bandeja y\nllévalos a la freidora.\nCOCINAR BISTEC FRITO\nCon la freidora precalentada a 200°C, modo freír, cocina durante 15\nminutos. Pasados los primeros 10 minutos voltea los bistecs y cocínalos el\nresto del tiempo para servir."},{"id":161,"title":"BISTEC CON SALSA DE MANTEQUILLA DE AJO Y PEREJIL Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":182,"text":"BISTEC CON SALSA DE MANTEQUILLA DE\nAJO Y PEREJIL\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 1 persona\nINGREDIENTES\n1 chuleta de res deshuesada\n2 cda de mantequilla\n1 cdta de perejil picado\n1 cdta de ajo picado\n½ cdta de salsa de soja baja en sodio\n1 pizca de sal\n1 pizca de pimienta negra\nPREPARACIÓN\nEn un tazón pequeño mezcla la mantequilla con el perejil, el ajo y la soya,\nreserva la preparación. Frota la chuleta con la sal y la pimienta. Colócalo en\nla cesta y llévalo a la freidora.\nCOCINAR BISTEC CON SALSA DE MANTEQUILLA DE AJO Y\nPEREJIL\nCon la freidora precalentada a 200°C, modo freír, cocina durante 12\nminutos. Pasados los primeros 6 voltéalo y deja que se cocine el resto del\ntiempo. Cuando esté listo agrega sobre él una generosa cantidad de salsa\narriba de este y sírvelo."},{"id":162,"title":"CHULETAS DE CERDO APAISADAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":184,"text":"CHULETAS DE CERDO APAISADAS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 8 minutos\nPara 2-4 personas\nINGREDIENTES\n4 chuletas de solomillo de cerdo\n120 g de harina\n2 huevos\n1 chorrito de leche\n160 g de pan rallado\n2 cdta de pimentón en polvo\n1 pizca de sal\n1 pizca de pimienta negra\nAceite en aerosol\nPREPARACIÓN\nCubre los filetes con papel film y dales pequeños golpes para aplanarlos.\nColoca el pan rallado en un plato y mézclalo con el pimentón en polvo. En\notro plato agrega la harina combinada con la sal y la pimienta. En un tazón\nvierte la leche con el huevo y bate. Cubre los filetes con la mezcla de\nharina. Luego sumérgelos en la preparación con huevo y después pásalos\npor el pan rallado. Colócalos en la canasta, rocíales aceite por encima y\nllévalos a la freidora.\nCOCINAR CHULETAS DE CERDO APAISADAS"},{"id":163,"title":"SOLOMILLO AL QUESO DE TRESVISO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":186,"text":"SOLOMILLO AL QUESO DE TRESVISO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n4 chuletas de solomillo de ternera\n315 g de queso de tresviso picado en trocitos\n3 cda de nata líquida\n2 cda de harina\n300 g de mantequilla\n2 cdta de perejil picado\nSal\nPimienta\nPREPARACIÓN\nEn una sartén a fuego medio coloca la mantequilla y mézclala la harina.\nAgrega el queso y la nata. Espera hasta que se forme una salsa espesa y\nretírala del fuego. Espolvorea sobre ella sal y pimienta para reservarla.\nEspolvorea sobre los filetes sal y pimienta. Colócalos en la cesta y llévalos\na la freidora.\nCOCINAR SOLOMILLO AL QUESO DE TRESVISO\nCon la freidora precalentada a 180°C, cocina los filetes durante 25 minutos\naproximadamente hasta que estén dorados. Cuando estén listos colócalos en\nun plato. Agrégales encima una buena capa de salsa, espolvorea arriba\nperejil y sírvelos."},{"id":164,"title":"MORCILLA DE BURGOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":188,"text":"MORCILLA DE BURGOS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n8 Morcillas\n2 Patatas medianas\nSal\nPimienta negra molida\nAceite en aerosol\nPREPARACIÓN\nPela y corta las patatas en rodajas. Colócalas en la cesta y rocía sobre ellas\naceite en aerosol. Coloca la morcilla sobre ella y espolvorea la sal con la\npimienta. Lleva a la freidora.\nCOCINAR MORCILLA DE BURGOS\nCon la freidora precalentada a 180°C, cocina durante 20 minutos y sirve."},{"id":165,"title":"LOMO IBÉRICO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":189,"text":"LOMO IBÉRICO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n1 pieza de lomo de cerdo ibérico sin grasa\n3 cda de aceite de oliva\n1 cdta de Ajo en polvo\n1 cdta de Cebolla en polvo\n1 cdta de Hierbas provenzales\nSal\nPimienta\nAceite en aerosol\nPREPARACIÓN\nLima el lomo de cerdo y hazle pequeños agujeros con un tenedor. En un\ntazón vas a mezclar todas las especias con el aceite, la sal y la pimienta.\nVierte la mezcla de manera uniforme sobre todo el lomo de cerdo. Colócalo\nen la cesta y llévalo a la freidora.\nCOCINAR LOMO IBÉRICO\nCon la freidora precalentada a 200°C, cocina durante 20 minutos. Cuando\nesté listo cúbrelo con papel aluminio y déjalo reposar por 5 minutos para\nservirlo."},{"id":166,"title":"CARNITAS DE CERDO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":190,"text":"CARNITAS DE CERDO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 20 minutos\nPara 5 personas\nINGREDIENTES\n650 g de solomillo de cerdo picado en cuadrados\n4 cda de condimento para barbacoa\n4 cda de aceite de oliva\n1 ramita de tomillo picada\n1 pizca de pimienta\n1 paquete de tortillas\nPREPARACIÓN\nEn un tazón coloca el solomillo. Úntalo con el aceite y espolvoréale por\nencima el sazonador, la pimienta y el tomillo. Colócalo en la cesta y llévalo\na la freidora.\nCOCINAR CARNITAS DE CERDO\nCon la freidora precalentada a 180°C, cocina durante 20 minutos. Cuando\nestén listas colócalas arriba de una tortilla y sírvelas."},{"id":167,"title":"ARROZ AL HORNO Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":191,"text":"ARROZ AL HORNO\nDificultad Media\nTiempo de preparación 30 minutos\nTiempo de cocción 45 minutos\nPara 3 personas\nINGREDIENTES\n610 g de arroz\n55 g de garbanzos cocidos\n7 trozos de costillas de cerdo\n115 g de nabo procesado\n405 ml de agua\n1 cabeza de ajo\n1 butifarra\n1 tomate\nAzafrán\nAceite de oliva\n1 pizca de sal\nPREPARACIÓN\nEn una olla coloca agrega un poco de aceite de oliva y después coloca los\ntrozos de costillas de cerdo hasta que se sofrían y después añade el nabo.\nCuando lleguen a estar dorados vierte el agua y deja calentado. Cuando\nempiece a hervir agregaras los garbanzos, el azafrán y la sal, déjalos así\ndurante 30 minutos. En una cazuela se pondrá el arroz, la butifarra, el\ntomate previamente picado, la cabeza de ajo y el ingredie
