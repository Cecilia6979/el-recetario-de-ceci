cda de extracto de vainilla\n2 tzas de harina de trigo\n1 barra de mantequilla a temperatura ambiente\n1 cdta de polvo de hornear\n1 tza de agua\nPREPARACIÓN\nUne usando una batidora la mantequilla, azúcar y huevos, al final de\nmezclados estos ingredientes, coloca los cubos de manzana. Aparte en otro\ntazón se debe unir el resto y luego se incorporarán a la mezcla anterior.\nCOCINAR EL PAN DE MANZANA:\nAñade la mezcla a un molde engrasado, la temperatura será de 160°C por\n45 minutos. Finalizado retira y sirve."},{"id":351,"title":"PLÁTANOS FRITOS CON CHOCOLATE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":413,"text":"PLÁTANOS FRITOS CON CHOCOLATE\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\nPlátanos cortados a lo largo\nAceite\n35 g de maicena\n1 huevo\nGalletas dulces trituradas\nAceite para freír\nSalsa de chocolate\nPREPARACIÓN\nPasa los plátanos por maicena, huevo batido y al final por las galletas\ntrituradas.\nCOCINAR LOS PLATANOS FRITOS CON CHOCOLATE\nFríe los plátanos en la freidora a una temperatura de 170°C, primero 5\nminutos por un lado y luego 5 minutos por el otro, al servir colócale la salsa\nde chocolate."},{"id":352,"title":"PASTEL DE MANZANA SÚPER RÁPIDO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":414,"text":"PASTEL DE MANZANA SÚPER RÁPIDO\nDificultad Fácil\nTiempo de preparación 6 minutos\nTiempo de cocción 9 minutos\nPara 6 personas\nINGREDIENTES\n450 g de relleno de tarta de manzana\nCorteza congelada de pastel\nPREPARACIÓN\nExtiende la corteza, córtala en rectángulos y colma cada rectángulo con el\nrelleno de manzanas, luego sella muy bien con un tenedor.\nCOCINAR PASTEL DE MANZANA SÚPER RÁPIDO\nColoca los rectángulos en la freidora de aire por 9 minutos, a una\ntemperatura de 200°C. Terminado el proceso, retira y sirve."},{"id":353,"title":"PERAS AL HOJALDRE Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":415,"text":"PERAS AL HOJALDRE\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 16 minutos\nPara 4 personas\nINGREDIENTES\n4 hojas de hojaldre\n1 tza de crema de vainilla\n2 peras grandes cortadas a la mitad sin semillas\n1 huevo batido\n½ cdta de nueces molidas\n½ cdta de canela en polvo\n1 cda de azúcar\nPREPARACIÓN\nEn cada lámina de hojaldre coloca una porción de crema de vainilla, luego\nenvuelve las peras, úntalas con huevo batido y ligeramente báñalas con\ncanela, nueces y azúcar.\nCOCINAR PERAS AL HOJALDRE\nColócalas sin que se peguen unas con otras en la cesta de la freidora de aire,\ncocina por 16 minutos a una temperatura de 160°C. Luego de culminado,\ndeja enfriar para servir."},{"id":354,"title":"PANES CON MANTEQUILLA Y PASAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":416,"text":"PANES CON MANTEQUILLA Y PASAS\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 15 minutos\nPara 5 personas\nINGREDIENTES\n1 tza de harina de trigo\n½ barra de mantequilla\n2 huevos batidos\nRalladura de naranja\n1 cdta de esencia de vainilla\n1 pizca de nuez moscada rallada\n2 cda de pasas\n½ tza de azúcar moreno\nPREPARACIÓN\nMezcla todos los ingredientes hasta que estén bien unidos, en moldes\npequeños vierte la masa ayudándote de una cuchara.\nCOCINAR PANES CON MANTEQUILLA Y PASAS\nUna vez colocado el molde en la posición correcta hornea a 180°C por 15\nminutos. Luego de culminada la cocción, retira y pon a enfriar para servir."},{"id":355,"title":"PAN DE ARÁNDANO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":417,"text":"PAN DE ARÁNDANO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 18 minutos\nPara 4 personas\nINGREDIENTES\n60 g de arándanos secos\n1 tza de harina de trigo\n1 cdta de levadura en polvo\n1 pizca de sal\n1 huevo batido\n½ taza de leche\n½ barra de mantequilla a temperatura ambiente\n¼ de cdta de nuez moscada\n30 g de azúcar morena\nPREPARACIÓN\nMezcla todos los ingredientes hasta que obtengas una masa compacta,\nvierte la masa en un molde para pan ya engrasado. Coloca en la posición\ncorrecta sobre la bandeja para hornear.\nCOCINAR PAN DE ARÁNDANO\nUna vez esté precalentada la freidora de aire, a la temperatura de 182°C,\ncocina el pan por 18 minutos o hasta que al introducir un palillo salga\nlimpio. Luego retira y sirve."},{"id":356,"title":"TARTA DE CHOCOLATE TRADICIONAL Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":418,"text":"TARTA DE CHOCOLATE TRADICIONAL\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 22 minutos\nPara 5 personas\nINGREDIENTES\n1 tza de harina de trigo\n½ barra de mantequilla derretida\n1 tza de azúcar\n3 huevos\n1 cdta de extracto de vainilla\n1 pizca de sal\n140 g de chocolate amargo rallado\nPREPARACIÓN\nBate la mantequilla con el azúcar y luego ve colocando los huevos uno por\nuno, luego añade el resto de los ingredientes y sigue batiendo hasta obtener\nuna mezcla esponjosa. Coloca luego la mezcla en un molde engrasado.\nCOCINAR TARTA DE CHOCOLATE\nSelecciona hornear a temperatura de 170°C, procede a la cocción por unos\n22 minutos. Culminado el proceso, retira, deja reposar y sirve."},{"id":357,"title":"PANQUEQUE DE VAINILLA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":419,"text":"PANQUEQUE DE VAINILLA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 minutos\nPara 4 personas\nINGREDIENTES\n2 huevos\n1 tza de harina de trigo\n½ barra de mantequilla\n½ tza de azúcar\n1 cdta de vainilla\n¼ cda de polvo de hornear\nPREPARACIÓN\nUne todos los ingredientes para lograr una mezcla homogénea y esponjosa.\nCOCINAR PANQUEQUES DE VAINILLA:\nPrecalienta la freidora de aire a 170°C, con cucharadas de la masa, forma\nlas panqueques en la bandeja previamente engrasada, voltéalas por 4\nminutos de cada lado o hasta que estén doraditas en los bordes. Acompaña\ncon jarabe de chocolate o mermelada al servir."},{"id":358,"title":"TARTA DE QUESO CON CEREZAS Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":420,"text":"TARTA DE QUESO CON CEREZAS\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 23 minutos\nPara 4 personas\nINGREDIENTES\n1 ½ tza de galletas dulces trituradas\n¾ tza de azúcar\n½ tza de mermelada de cereza\n2 tza de queso crema\n1/3 de barra de mantequilla temperatura ambiente\n1 pizca de sal\n3 huevos batidos\n5 cdas de harina de trigo\n¼ tza de crema espesa\nPREPARACIÓN\nMezcla las migas con 2 cucharadas de azúcar y mantequilla, presiona en un\nmolde para tarta, para formar la base, aparte mezcla los demás ingredientes\nque serán el relleno de la tarta.\nCOCINAR TARTA DE QUESO CON CEREZAS\nPrimero hornea la base de la tarta por 3 minutos a 170°C en la freidora de\naire, una vez que se enfríe, rellena con la mezcla y lleva a la freidora, en\nopción hornear, por 20 minutos más a 150°C. Retira deja reposar y sirve."},{"id":359,"title":"FLAN DE HUEVO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":421,"text":"FLAN DE HUEVO\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 15 minutos\nPara 3 personas\nINGREDIENTES\n1 corteza de pastel congelado\n3 huevos\n1 pizca de sal\n3 tza de leche\n¾ cda de azúcar\n1 cdta de vainilla\nPREPARACIÓN\nUne todos los ingredientes y colócalos en la corteza de pastel, que\npreviamente se ha colocado en un molde.\nCOCINAR EL FLAN DE HUEVO:\nLleva la a la freidora en modo hornear a 170°C por 15 minutos. Luego de\nculminada la cocción, retira, deja enfriar y sirve."},{"id":360,"title":"PALITOS DE CANELA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":422,"text":"PALITOS DE CANELA\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 14 minutos\nPara 4 personas\nINGREDIENTES\n1 tza de mantequilla\n5 cda de azúcar\n1 cdta de vainilla\n2 tza de harina de trigo\n2 cda de canela molida\nPREPARACIÓN\nMezcla los ingredientes haciendo una masa suave y moldeable, forma los\npalitos y espolvoréalos con canela y azúcar.\nCOCINAR LOS PALITOS DE CANELA\nColócalos sin que se peguen en un molde engrasado, hornea en la freidora\nde aire por 14 minutos a 150°C. Finalizado el proceso, retira, deja reposar y\nsirve."},{"id":361,"title":"MELOCOTONES FRITOS CON BRANDY Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":423,"text":"MELOCOTONES FRITOS CON BRANDY\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n3 cda de brandy\n4 melocotones\n60 g de harina\n2 huevos\nCanela\nAzúcar al gusto\nPREPARACIÓN\nPon a hervir los melocotones un minuto y luego déjalos reposar en hielo\npara que se desprenda la piel, corta en mitades, haz una mezcla con los\ndemás ingredientes, pasa por esa mezcla las mitades de los melocotones.\nCOCINAR MELOCOTONES FRITOS CON BRANDY\nUna vez cubiertos los melocotones, completamente, con la mezcla, llévalos\na la freidora de aire a una temperatura de 180°C y cocínalos por 10 minutos,\nretira, luego que estén fríos pásalos por la canela con el azúcar y sirve."},{"id":362,"title":"PAN DULCE CON QUESO CREMA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":424,"text":"PAN DULCE CON QUESO CREMA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 5 minutos\nPara 2 personas\nINGREDIENTES\n1 huevo\n4 rebanadas de pan de caja\nHarina de trigo\nCanela molida y azúcar moreno\n100 g de queso crema\nAzúcar morena\nPREPARACIÓN\nBate el huevo con una cucharada de harina, con el pan y el queso crema\nhacer unos sándwiches, pásalos por la mezcla de huevo y harina.\nCOCINAR PAN DULCE CON QUESO CREMA\nUna vez rebozados los panes, lo llevas a la freidora de aire a 170°C de\ntemperatura, y se freirán por ambos lados por 5 minutos o hasta que estén\ndorados, ya listos se pasan por la canela y azúcar morena, luego sirve."},{"id":363,"title":"PASTEL DE ALMENDRAS Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":425,"text":"PASTEL DE ALMENDRAS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 1 hora\nPara 4 personas\nINGREDIENTES\n6 huevos\n2 barras de mantequilla a temperatura ambiente\n3 tza de azúcar\n3 tza de harina\n1 tza de leche de almendras\n1 cdta de extracto de almendras\n1 pizca de nuez moscada\nPREPARACIÓN\nMezcla todos los ingredientes hasta obtener una masa homogénea, luego\nvierte en un molde engrasado.\nCOCINAR PASTEL DE ALMENDRAS\nHornea en la freidora de aire por 60 minutos a una temperatura de 180°C.\nFinalizado el proceso, retira, deja reposar y sirve."},{"id":364,"title":"PASTEL DE ZARZAMORA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":426,"text":"PASTEL DE ZARZAMORA\nDificultad Fácil\nPreparación 15 minutos\nCocción 15 minutos\nPara 4 personas\nINGREDIENTES\n1 caja de mezcla para bizcocho\n2 huevos\n1 barra de mantequilla\n200 g de queso crema\n1 tza de mermelada de zarzamora\nPREPARACIÓN\nIntegra los tres primeros ingredientes, una vez lista la mezcla colócala en un\nmolde para hornear, aparte une el queso crema con la mermelada.\nCOCINAR PASTEL DE ZARZAMORA\nHornea el pastel en la freidora de aire por 15 minutos a 170°C, una vez que\nse enfrié corta por la mitad y rellena con la mezcla de queso crema y\nmermelada. Sirve."},{"id":365,"title":"FRUTAS ACARAMELADAS Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":427,"text":"FRUTAS ACARAMELADAS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n450 g de frutas picadas de la estación (Puede ser manzana, piña y\nmelón)\n2 cda de pasitas\n4 cda de azúcar moreno\n½ cdta de canela en polvo\n2 clavos enteros\n4 cda de azúcar morena\n1 cda de aceite de coco\nPREPARACIÓN\nUne todos los ingredientes en una sartén ligeramente engrasada.\nCOCINAR LAS FRUTAS ACARAMELADAS\nLleva la sartén a la freidora de aire y a una temperatura de 170°C, fríe las\nfrutas por 10 minutos o hasta que el azúcar se derrita y vaya tomando un\ncolor oscuro, puedes servir frío o caliente."},{"id":366,"title":"PASTELITOS PARA LA MERIENDA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":428,"text":"PASTELITOS PARA LA MERIENDA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n1 huevo\n50 g de azúcar moreno\n1 cdta de vainilla\n26 g de cacao en polvo\n2 cda de azúcar\n83 g de harina de trigo\n42 g de chips de chocolate blanco\n1 cda de aceite\nPREPARACIÓN\nBate el azúcar con el huevo y poco a poco incorpora los demás\ningredientes, hasta obtener una masa suave y esponjosa. En un molde\nengrasado o moldes pequeños de silicona, vierte la masa.\nCOCINAR LOS PASTELITOS PARA LA MERIENDA\nHornea en la freidora de aire por 20 minutos a una temperatura de 170°C, o\ncuando al introducir un palillo este salga limpio. Al finalizar retira, deja\nreposar y sirve."},{"id":367,"title":"PLÁTANOS FRITOS DORADOS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":429,"text":"PLÁTANOS FRITOS DORADOS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n8 plátanos maduros\n1 cda de canela molida\n50 g de harina\n3 claras de huevo\n3 cda de aceite\n120 g de pan rallado\nPREPARACIÓN\nCalienta el aceite y añade el pan rallado, dóralo ligeramente y luego\ncolócalo en un plato aparte, pasa los plátanos por la harina, por los huevos\nbatidos y finalmente por el pan rallado que se ha dorado.\nCOCINAR PLÁTANOS A LA SARTÉN\nFríe los plátanos por 10 minutos en la freidora de aire a una temperatura de\n140°C. Culminado el proceso, retira y sirve."},{"id":368,"title":"DONAS DE FRESA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":430,"text":"DONAS DE FRESA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n220 g de harina de trigo\n3 cda de azúcar\n1 huevo\n½ cda de mantequilla derretida\n¼ tza de leche\n½ cdta de levadura\nAzúcar glas\n4 cda de nata\nColorante rosa\nPREPARACIÓN\nUne todos los ingredientes, menos los tres últimos, una vez que tengas la\nmasa dale forma a las donas, con los restantes ingredientes se hará el\nglaseado de fresa.\nCOCINANDO LAS DONAS DE FRESA\nColoca las donas en la cesta de la freidora de aire, fríelas por 10 minutos, a\n180°C, una vez que se enfríen báñalas con el glaseado de fresa y sirve."},{"id":369,"title":"PAN DE MANTEQUILLA Y CACAO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":431,"text":"PAN DE MANTEQUILLA Y CACAO\nDificultad Fácil\nTiempo de Preparación 9 minutos\nTiempo de cocción 22 minutos\nPara 6 personas\nINGREDIENTES\n1 barra de mantequilla\n200 g de azúcar\n2 huevos\n½ tza de harina de trigo\n½ cdta de levadura en polvo\n26 g de cacao\n2 cda de aceite\n1 cdta de vainilla\n1 pizca de sal\nPREPARACIÓN\nBate los ingredientes en un tazón, primero la mantequilla y el azúcar, luego\nlos huevos y finalmente el resto de los ingredientes. Coloca la mezcla en un\nmolde para hornear engrasado y enharinado.\nCOCINAR EL PAN DE MANTEQUILLA Y CACAO:\nSe precalentará la freidora de aire a una temperatura de 171°C, allí\ncolocarás el molde con el pan y lo hornearás por 22 minutos. Luego retira y\nsirve."},{"id":370,"title":"MANZANAS CON BRANDY Y NUECES Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":432,"text":"MANZANAS CON BRANDY Y NUECES\nDificultad Fácil\nTiempo de preparación 9 minutos\nTiempo de cocción 18 minutos\nPara 4 personas\nINGREDIENTES\n2 manzanas picadas a la mitad sin semillas\n4 cda de nueces picadas\n2 cda de brandy\n4 cda de pasas\n2 cda de mantequilla\n½ cdta de canela\n½ cdta de nuez moscada rallada\nPREPARACIÓN\nA las mitades de las manzanas retírales parte de la pulpa haciendo un\nagujero en medio, aparte mezcla todos los ingredientes y rellena las mitades\nde manzanas, pásalas a la bandeja del horno de la freidora coloca 60 ml de\nagua dentro del molde.\nCOCINAR MANZANAS CON BRANDY Y NUECES\nColoca la opción hornear en su freidora de aire a una temperatura de 171°C\npor 18 minutos. Luego retira y sirve."},{"id":371,"title":"TOSTADAS DE CANELA Y COCO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":433,"text":"TOSTADAS DE CANELA Y COCO\nDificultad Fácil\nTiempo de preparación 6 minutos\nTiempo de cocción 6 minutos\nPara 4 personas\nINGREDIENTES\n4 rebanadas de pan\n1 cda de canela molida\n1 cda de azúcar moreno\n2 cda de coco rallado\n2 cda de mantequilla derretida\n1 huevo batido\nPREPARACIÓN\nUna en un plato la canela, azúcar y coco rallado. Unta ligeramente las\nrebanadas con mantequilla, luego páselas por el huevo batido y finalmente\npor la mezcla de coco rallado, azúcar y canela molida.\nCOCINAR TOSTADAS DE CANELA Y COCO\nColoca la temperatura de su freidora de aire a 171°C, coloca una sartén\nengrasada y procede a freír cada rebanada por ambos lados, por 6 minutos o\nhasta que estén doradas. Luego retira y sirve."},{"id":372,"title":"TARTA DE COCO Y CACAO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":434,"text":"TARTA DE COCO Y CACAO\nDificultad Fácil\nTiempo de preparación 9 minutos\nTiempo de cocción 22 minutos\nPara 6 personas\nINGREDIENTES\n4 cda de aceite de coco\n200 g de azúcar\n2 huevos\n50 g de harina de trigo\n25 g de harina de coco\n50 g de cacao en polvo\n1 pizca de nuez moscada\n2 cda de leche de coco\n1 cda de coco rallado\nPREPARACIÓN\nComienza a batir los ingredientes, inicia con el aceite el azúcar y los\nhuevos, luego incorpora los demás ingredientes, hasta obtener una masa\nsuave y esponjosa, vierte la mezcla en un molde engrasado y enharinado.\nCOCINAR TARTA DE COCO Y CACAO\nColoca la temperatura de la freidora de aire en 171°C en opción hornear,\nintroduce el molde en la posición correcta y cocina la tarta por 22 minutos.\nLuego retira, deja enfriar y sirve."},{"id":373,"title":"PASTEL DE ZARZAMORAS TRADICIONAL Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":435,"text":"PASTEL DE ZARZAMORAS TRADICIONAL\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 8 minutos\nPara6 personas\nINGREDIENTES\n425 g de relleno de zarzamoras para pastel\n2 cortezas de pastel congeladas\nPREPARACIÓN\nExtiende una de las cortezas de la masa en un molde para tarta, coloca allí\nel relleno de zarzamora, luego coloca encima la masa corteza restante y\nsella correctamente con un tenedor.\nCOCINAR PASTEL DE ZARZAMORAS\nPrecalienta la freidora de aire a una temperatura de 198°C, hornea el pastel\npor 8 minutos, hasta que tenga un color dorado, puedes servir a temperatura\nambiente."},{"id":374,"title":"Albóndigas","category":"Desayunos","source":"40 recetas saludables","page":5,"text":"Albóndigas\ncaseras\n230 g de carne molida.\n30 g de pan rallado.\n1 huevo.\n3 g de ajo en polvo.\n2 g de cebolla en polvo.\n2 g de orégano seco.\n2 g de perejil.\nSal y pimienta al gusto\n15 g de queso parmesano.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n2\nCrear bolas pequeñas con la mezcla\nresultante. Colocar en el frigorífico durante\n15 minutos.\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 200 °C.\n4\nColocar las albóndigas en la freidora\nprecalentada y ajustar a una temperatura\nde 200 °C y un tiempo de cocción de 8\nminutos. Se recomienda rociar con aceite en\naerosol antes de la cocción.\n5\nPueden servirse con queso rallado al gusto.\n20 min\n8 min\n1-2 raciones\nMezclar carne molida, pan rallado, huevo\nbatido, especias, sal, pimienta y queso\nparmesano.\n1\n— 4 —"},{"id":375,"title":"Alitas de","category":"Carnes y aves","source":"40 recetas saludables","page":6,"text":"Alitas de\npollo barbacoa\n600 g de alitas de pollo.\n3 g de pimentón ahumado.\n5 g de ajo en polvo.\n3 g de cebolla en polvo.\n4 g de chile en polvo.\n7 g de azúcar moreno.\n2 g de comino.\n1 g de pimienta cayena.\n1 g de pimienta negra.\nSalsa barbacoa.\nPasos a seguir\nIngredientes\n1\nCombinar los ingredientes en un cuenco\nhasta que la mezcla sea homogénea.\n2\nEspolvorear la mezcla sobre el pollo y\ndejar reposar durante 30 minutos.\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n5\nCepillar el pollo con salsa barbacoa cada 5\nminutos durante la cocción.\n6\nAl finalizar la cocción, el pollo puede servirse\ncon más salsa barbacoa.\n30 min\n20 min\n4 raciones\n4\nColocar las alitas en la freidora\nprecalentada y seleccionar el modo Pollo.\n— 5 —"},{"id":376,"title":"Alitas","category":"Carnes y aves","source":"40 recetas saludables","page":7,"text":"Alitas\nde pollo\n450 g de alitas de pollo.\n9 g de ajo en polvo.\n1 caldo de pollo.\n5 g de sal.\n3 g de pimienta negra.\n1 g de pimienta cayena.\n3 g de cebolla en polvo.\n1 g de orégano.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n3\nSazonar las alitas con la mitad de la mezcla\ny rociar de forma abundante con aceite\nen aerosol.\n4\nColocar las alitas en la freidora precalentada\ny seleccionar el modo Pollo con un ajuste\nde tiempo de 30 minutos.\n5\nUna vez cocinadas, las alitas se rocían con\nla mezcla de ingredientes restante antes\nde servir.\n5 min\n30 min\n4 raciones\nPrecalentar la freidora durante 5 minutos\na 195 °C.\n1\n2\nMezclar ingredientes hasta obtener mezcla\nhomogénea.\n— 6 —"},{"id":377,"title":"Chuletón","category":"Verduras y guarniciones","source":"40 recetas saludables","page":8,"text":"Chuletón\nasado\nChuletón deshuesado.\nSal al gusto.\n2 g de ajo en polvo.\n2 g de cebolla en polvo.\nRomero seco.\nPimienta negra al gusto.\n15 ml de aceite de oliva.\nPasos a seguir\nIngredientes\n2\nMezclar bien los condimentos de ajo en\npolvo, cebolla en polvo, pimienta y sal, y\nespolvorear sobre el chuletón.\n3\nRociar con aceite de oliva.\n4\nColocar el chuletón en la freidora\nprecalentada y ajustar a una temperatura\nde 200 °C y un tiempo de cocción entre 6 y\n10 minutos (dependiendo del punto de\ncocción de la carne).\n5\nColocar romero seco en la freidora junto\ncon el chuletón para aromatizar.\n8 min\n6-10 min\n2 raciones\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 200 °C.\n1\n— 7 —"},{"id":378,"title":"Muslos de","category":"Carnes y aves","source":"40 recetas saludables","page":9,"text":"Muslos de\npollo asados\n4 muslos de pollo\ndeshuesados con piel\n(válido con otras partes del\npollo).\n35 ml de aceite de oliva.\n30 g de ajo en polvo.\n6 g de sal.\n2 g de pimienta negra.\n2 g de tomillo seco.\n2 g de orégano seco.\n2 g de romero seco.\n2 g de estragón seco.\nPasos a seguir\nIngredientes\n3\nColocar el pollo en la freidora precalentada y\nseleccionar el modo Pollo.\n4\nSe recomienda revisar el punto de la carne\ncada 5 minutos.\n20 min\n18 min\n4 raciones\nCubrir los muslos de pollo con el resto de\ningredientes y aceite de oliva. Dejar reposar\ndurante 15 minutos.\n1\n2\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n— 8 —"},{"id":379,"title":"Pinchos","category":"Carnes y aves","source":"40 recetas saludables","page":10,"text":"Pinchos\nmorunos\n350 g de cordero\ntroceado.\n2 g de comino.\n2 g de pimentón.\n3 g de ajo en polvo.\n2 g de cebolla en polvo.\n1 g de canela.\n1 g de cúrcuma.\n1 g de semillas de hinojo.\n1 g de semilla de\ncilantro molido.\n3 g de sal.\nPalillos / brochetas si\nse requiere.\nPasos a seguir\nIngredientes\n4\nSeleccionar el modo Carne y ajustar el\ntiempo de cocción a 12 minutos.\n8 min\n12 min\n2 raciones\n2\nPrecalentar la freidora durante 5 minutos\na 180 °C.\n3\nColocar varias piezas de cordero por\nbrocheta o colocar directamente en la cesta\nde la freidora.\nMezclar todos los ingredientes en un\nrecipiente y mezclar hasta que el cordero\nquede bien cubierto.\n1\n— 9 —"},{"id":380,"title":"Pollo","category":"Carnes y aves","source":"40 recetas saludables","page":11,"text":"Pollo\na la miel\n4 muslos de pollo\ndeshuesados.\n45 ml de miel.\nJugo de un limón.\n2 dientes de ajo\npicados.\nSal al gusto.\nSalsa de soja.\nPasos a seguir\nIngredientes\n2\nSumergir el pollo en la mezcla y dejar\nmarinar 1 hora.\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n5\nSe recomienda rociar con marinado en la\nmitad de tiempo de cocción si fuera necesario.\n1 h\n20 min\n4 raciones\n1\nCombinar miel, salsa de soja, jugo de limón\ny ajo en un recipiente y mezclar hasta\nobtener un resultado homogéneo.\n4\nColocar el pollo en la freidora precalentada\ny seleccionar el modo Pollo con un ajuste\nde tiempo de 20 minutos.\n— 10 —"},{"id":381,"title":"Pollo a la","category":"Desayunos","source":"40 recetas saludables","page":12,"text":"Pollo a la\nparmesana\n2 pechugas de pollo.\n60 g de pan rallado.\n20 g de queso parmesano.\n60 g de harina de todo uso.\n2 huevos batidos.\nPerejil picado.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n2\nMezclar pan rallado con el queso parmesano\ny el perejil picado en un recipiente.\n3\nPasar cada pechuga por harina, sumergirlas\nen los huevos batidos y, por último,\nsumergir en la mezcla de pan rallado\nhecha previamente.\n4\nRociar con aceite en aerosol el pollo y el\ninterior de la cesta de la freidora. A\ncontinuación, colocar el pollo y seleccionar\nel modo Pollo y un tiempo de cocción\nde 15 minutos.\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n10 min\n12 min\n2 raciones\n1\n— 11 —"},{"id":382,"title":"Pollo","category":"Carnes y aves","source":"40 recetas saludables","page":13,"text":"Pollo\nfrito\n2 patas de pollo.\n2 muslos de pollo.\n230 ml de suero de leche.\n180 g de harina de\ntodo uso.\n3 g de ajo en polvo.\n3 g de cebolla en polvo.\n3 g de pimentón.\n2 g de pimienta negra.\n5 g de sal.\n40 ml de aceite vegetal.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n2\nMezclar harina, sal y especias en un\nrecipiente.\n3\nSumergir el pollo en la harina hasta que\nesté totalmente cubierto.\n5\nRociar el pollo con aceite en aerosol.\n6\nColocar el pollo en la freidora precalentada y\nseleccionar el modo Pollo.\n7\nSe recomienda agitar el pollo durante la\ncocción cada 3-4 minutos.\n2 h\n25 min\n2 raciones\n4\nPrecalentar la freidora durante 5 minutos\na 180 °C.\nMezclar el suero de leche con todas las\npiezas de pollo en una bolsa hermética y\ndejar marinar durante 1-1,5 horas.\n1\n— 12—"},{"id":383,"title":"Tocino","category":"Otros","source":"40 recetas saludables","page":14,"text":"Tocino\ncrunchy\n3 min\n5-8 min\nTocino cortado en tiras.\n5 g de chile en polvo.\n1 g de comino molido.\n1 g de pimienta.\n13 g de azúcar moreno.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n1\nMezclar bien los condimentos de azúcar\nmoreno, chile en polvo, comino molido\ny pimienta.\n2\nSumergir el tocino en la mezcla hasta que\nesté totalmente cubierto.\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 160 °C.\n4\nColocar el tocino en la freidora\nprecalentada y ajustar a una temperatura\nde 160°C y un tiempo de cocción entre 5\ny 8 minutos (dependiendo del punto que\nse desee).\n5\nSe recomienda rociar generosamente con\naceite en aerosol al principio y a mitad de la\ncocción.\n— 13 —"},{"id":384,"title":"Calamares a","category":"Desayunos","source":"40 recetas saludables","page":16,"text":"Calamares a\nla romana\n400 g de calamar fresco.\n150 g de harina de trigo.\n200 g de agua.\n1 huevo.\n1/2 cucharada de\nbicarbonato sódico.\nAceite de oliva\nen aerosol.\nSal al gusto.\nPasos a seguir\nIngredientes\n3\nPrecalentar la freidora durante 5 minutos a\n180 °C.\n4\nEnharinar el calamar abundantemente y\nretirar el exceso de harina. Rociar los\ncalamares con aceite de oliva en aerosol.\n5\nIntroducir los calamares en la freidora y\ncocinar durante 15 minutos a 180 °C.\n6\nSe recomienda agitar la cubeta de la freidora\ndurante la cocción para que el contenido se\nhaga lo más homogéneo posible y rociar con\naceite de oliva en aerosol si es necesario.\nUna vez limpio el calamar, cortar en aros no\nmuy gruesos y secar con papel absorbente.\n1\n2\nMezclar en un recipiente harina, agua fría,\nsal, huevo y bicarbonato. Remover hasta\nconseguir una pasta semilíquida.\n10 min\n15min\n— 15 —"},{"id":385,"title":"Gambas al","category":"Pescados y mariscos","source":"40 recetas saludables","page":17,"text":"Gambas al\nestilo cajún\n450 g de gambas peladas.\n30 ml de aceite de oliva.\n2 g de pimentón ahumado.\n2 g de ajo en polvo.\n2 g de chile en polvo.\n1 g de cebolla en polvo.\n1 g de pimienta negra.\n2 g de condimento italiano.\nPasos a seguir\nIngredientes\n2\nMezclar todos los ingredientes en un\nrecipiente.\n3\nMezclar las gambas con aceite de oliva\nhasta que estén totalmente cubiertas.\n6\nSe recomienda agitar la cesta un par de\nveces durante la cocción.\n5\nColocar las gambas en la freidora\nprecalentada y seleccionar el modo Marisco.\n1\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n4\nEspolvorear la mezcla de ingredientes\nsobre las gambas hasta que estén\nbien cubiertas.\n3 min\n5 min\n3 raciones\n— 16 —"},{"id":386,"title":"Gambas","category":"Pescados y mariscos","source":"40 recetas saludables","page":18,"text":"Gambas\ncon jamón\n16 gambas grandes\npeladas.\n3 g de ajo en polvo.\n2 g de pimentón.\n2 g de cebolla en polvo.\n1 g de pimienta\nnegra molida.\n8 lonchas de jamón.\nPasos a seguir\nIngredientes\n3\nPrecalentar la freidora durante 5 minutos\na 160 °C.\n5 min\n10 min\n3 raciones\nColocar las gambas en un recipiente y\nsazonar con las especias.\n1\n2\nEnvolver una loncha de jamón por\ncada gamba.\n5\nSeleccionar un tiempo de cocción entre\n8-10 minutos, y ajustar a una temperatura\nde 160 °C.\n— 17 —\n4\nIntroducir las gambas en la freidora en\ndos tandas para asegurar que se\nhacen correctamente."},{"id":387,"title":"Langostino","category":"Desayunos","source":"40 recetas saludables","page":19,"text":"Langostino\nfrito\n230 g de langostinos\npelados.\n5 g de sal.\n1 g de pimienta negra.\n1 g de ajo en polvo.\n2 g de pimentón.\n2 huevos batidos.\n15 ml de leche.\n30 g de pan rallado o\nmiga de pan.\n40 g de coco rallado en\nescamas.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n4\nPrecalentar la freidora durante 5 minutos\na 180 °C.\n8 min\n8 min\n3 raciones\n2\nMezclar las migas de pan, el coco y el resto\nde aderezos y especias en otro recipiente.\n3\nCubrir cada langostino con harina, después\nsumergir en huevo y pasar finalmente por\nlas migas de pan con coco.\n5\nColocar los langostinos en la freidora\nprecalentada y seleccionar el modo Marisco.\nMezclar la harina y la mitad de los aderezos\nen un recipiente. Batir los huevos y la leche\nen otro recipiente.\n1\n6\nSe recomienda agitar la cubeta de la freidora\ndurante la cocción para que el contenido se\nhaga lo más homogéneo posible.\n— 18 —"},{"id":388,"title":"Berenjenas","category":"Verduras y guarniciones","source":"40 recetas saludables","page":21,"text":"Berenjenas\nasadas\n1 berenjena cortada\nen rodajas.\n30 ml de aceite de oliva.\n3 g de sal.\n2 g de ajo en polvo.\n1 g de pimienta negra.\n1 g de cebolla en polvo.\n1 g de comino molido.\nPasos a seguir\nIngredientes\n4\nColocar las rodajas de berenjena en la\nfreidora precalentada y cocinar durante 10\nminutos a 200 °C.\nPrecalentar freidora durante 5 minutos\na 200 °C.\n1\n2\nLimpiar la berenjena y cortarla en rodajas.\n5 min\n10 min\n2 raciones\n3\nMezclar en un recipiente el aceite y los\ncondimentos hasta que estén bien\ncombinados y mezclar la berenjena hasta\nque todas las rodajas estén bien cubiertas.\n— 20 —"},{"id":389,"title":"2 calabacines cortados","category":"Desayunos","source":"40 recetas saludables","page":22,"text":"2 calabacines cortados\nen tiras.\n60 g de harina de\ntodo uso.\n12 g de sal.\n2 g de pimienta negra.\n2 huevos batidos.\n15 ml de leche.\n85 g de pan rallado.\n25 g de queso\nparmesano.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n3\nMezclar los huevos y la leche por separado\ny combinar el pan rallado y el queso\nparmesano en un tercer recipiente.\n4\nCubrir cada pieza de calabacín con harina,\nseguidamente sumergir en huevo y pasar\npor el t.\nCortar el calabacín en tiras.\n1\n2\nMezclar la harina, la sal y la pimienta.\n7\nSe recomienda agitar la cubeta de la\nfreidora durante la cocción para que el\ncontenido se haga lo más homogéneo\nposible.\n6\nColocar el calabacín en la freidora y rociar\ncon aceite en aerosol, después cocinar\ndurante 10 minutos a una temperatura\nde 175 °C.\n5\nPrecalentar la freidora durante 5 minutos\na 175 °C.\nCalabacín\nfrito\n— 21 —\n10 min\n8 min\n4 raciones"},{"id":390,"title":"Calabaza","category":"Otros","source":"40 recetas saludables","page":23,"text":"Calabaza\nasada\n1 calabaza sin semillas,\ncortada en dados o tiras\ngruesas.\n15 ml de aceite de oliva.\n1 g de hoja de tomillo.\n6 g de sal.\n1 g de pimienta negra.\nPasos a seguir\nIngredientes\n3\nIntroducir la calabaza en la freidora y\ncocinar durante 12 minutos a 200 °C.\n4\nSe recomienda agitar la cubeta de la freidora\ndurante la cocción para que el contenido se\nhaga lo más homogéneo posible.\nPrecalentar la freidora durante 5 minutos\na 200 °C.\n1\n2\nCubrir la calabaza cortada con aceite de\noliva y sazonar con tomillo, sal y pimienta.\n10 min\n12 min\n2-4 raciones\n— 22 —"},{"id":391,"title":"Champiñones","category":"Postres","source":"40 recetas saludables","page":24,"text":"Champiñones\nrellenos\n6 champiñones grandes.\n45 ml de aceite de oliva.\n1/4 de cebolla cortada en\ndados pequeños.\n1 diente de ajo picado.\n115 g de salchicha dulce.\n15 g de pan rallado.\n60 g de queso\nmozzarella rallado.\n20 g de queso\nparmesano rallado.\n3 g de perejil.\nSal y pimienta al gusto.\nPasos a seguir\nIngredientes\n3\nCocinar en una sartén a fuego medio los\ntallos de los champiñones y la cebolla\npicada con aceite de oliva durante 5\nminutos. Añadir el ajo y la salchicha hasta\nque se dore.\n4\nMezclar la salchicha con el pan rallado, la\nmozzarella, el parmesano y el perejil.\nSazonar al gusto con sal y pimienta.\n5\nRellenar los champiñones y cubrirlos con\nqueso mozzarella.\n6\nPrecalentar la freidora durante 5 minutos\na 160 °C.\n7\nColocar los champiñones en la freidora,\nrociar con aceite y cocinar durante 10\nminutos con una temperatura de 160 °C.\n15 min\n18 min\n3 raciones\nCortar los tallos de los champiñones y\npicarlos.\n1\n2\nVaciar el interior de las tapas de los\nchampiñones para crear un espacio donde\ncolocar el relleno.\n— 23 —"},{"id":392,"title":"Espárragos con","category":"Carnes y aves","source":"40 recetas saludables","page":25,"text":"Espárragos con\njamón o bacon\n12 espárragos.\n10 ml de aceite de oliva.\n12 lonchas de jamón o\ntiras de bacon.\nSal y pimienta al gusto.\nPasos a seguir\nIngredientes\n3\nRociar los espárragos con aceite y\ncondimentar al gusto con sal y pimienta.\n4\nEnvolver una loncha de jamón o tira de\nbacon por espárrago de arriba a abajo y\ncolocar en la freidora.\n5\nColocar los espárragos en la freidora\nprecalentada y seleccionar el modo Marisco.\n6\nCocinar durante 10 minutos a 150 °C.\n5 min\n10 min\n3 raciones\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 150 °C.\n1\n2\nSi se desea, cortar los extremos de los\nespárragos y desechar.\n— 24 —"},{"id":393,"title":"Tofu","category":"Otros","source":"40 recetas saludables","page":26,"text":"Tofu\ncrispy\n225 g de tofu cortados\nen dados.\n30 ml de salsa de soja.\n10 ml de vinagre de arroz.\n10 ml de aceite\nde sésamo.\n40 g de almidón\nde maíz.\nPasos a seguir\nIngredientes\n2\nPrecalentar la freidora durante 5 minutos\na 190 °C.\n3\nEscurrir el tofu y colocar en almidón de maíz\nhasta que esté totalmente cubierto.\n5\nSe recomienda agitar la cesta para que el\ncontenido se haga de forma uniforme.\n1\nMezclar el tofu, salsa de soja, vinagre de\narroz y aceite de sésamo y dejar macerar\ndurante 10 minutos.\n4\nColocar el tofu en la freidora de aire\nprecalentada y seleccionar un tiempo de\ncocción de 18 minutos y una temperatura\nde 190 °C.\n15 min\n18 min\n2 raciones\n— 25 —"},{"id":394,"title":"Verduras","category":"Desayunos","source":"40 recetas saludables","page":27,"text":"Verduras\nfritas\nReceta válida para\npepinillos, zanahorias,\ncalabacines, etc.\n60 g de harina de\ntodo uso.\n2 huevos batidos.\n2 g de pimentón.\n1 g de pimienta de\ncayena.\nSal y pimienta al gusto.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n4\nColocar las piezas en la freidora y rociar con\naceite en aerosol.\n5\nCocinar durante 10 minutos a 180 °C. Agitar\nel contenido y rociar con aceite en aerosol\nen varias ocasiones durante la cocción.\n10 min\n8min\n4 raciones\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 180 °C.\n1\n2\nColocar 3 recipientes: uno con harina, otro\ncon huevo batido y otro con una mezcla de\npan rallado, especias, sal y pimienta.\n3\nPrimeramente, cortar la verdura elegida en\npequeños trozos. A continuación, se cubre\ncada pieza con harina, después se sumerge en\nhuevo batido y finalmente en el pan rallado.\n— 26 —"},{"id":395,"title":"Zanahorias","category":"Verduras y guarniciones","source":"40 recetas saludables","page":28,"text":"Zanahorias\nasadas\n450 g de zanahoria\narcoiris.\n15 ml de aceite de oliva.\n30 ml de miel.\nTomillo fresco.\nSal y pimienta al gusto.\nPasos a seguir\nIngredientes\n3\nIntroducir la zanahoria en la freidora y\ncocinar durante 12 minutos con una\ntemperatura de 200 °C.\n4\nSe recomienda agitar la cubeta de la freidora\ndurante la cocción para que el contenido se\nhaga lo más homogéneo posible.\nPrecalentar la freidora durante 5 minutos\na 200 °C.\n1\n2\nColocar la zanahoria troceada en un\nrecipiente con aceite de oliva, miel, tomillo,\nsal y pimienta.\n5 min\n12 min\n2-4 raciones\n— 27 —"},{"id":396,"title":"1 cebolla blanca cortada","category":"Desayunos","source":"40 recetas saludables","page":29,"text":"1 cebolla blanca cortada\nen rodajas.\n90 g de pan crujiente\nmolido o migas de pan.\n2 g de pimentón.\n5 g de sal.\n2 huevos batidos.\n230 ml de suero de leche.\n60 g de harina de\ntodo uso.\nAceite en aerosol.\nPasos a seguir\nIngredientes\n4\nPrecalentar la freidora durante 5 minutos\na 190°C.\nCortar la cebolla en rodajas y separar las\ncapas en anillos/aros.\n1\n2\nMezclar el pan, el pimentón y la sal en un\nrecipiente. En otro recipiente, batir los\nhuevos y el suero de leche hasta que la\nmezcla sea homogénea.\n5\nColocar los aros en la freidora y rociar\nabudantemente con aceite en aerosol. A\ncontinuación, cocinar a 190°C durante\n10 minutos o hasta que se doren.\n6\nSe recomienda agitar y rociar con aceite en\naerosol a mitad de la cocción para que se\nhagan de forma uniforme.\nAritos\nde cebolla\n— 28 —\n10 min\n20 min\n2 raciones\n3\nSumergir cada aro de cebolla en la harina,\ndespués en los huevos batidos y finalmente\nen la mezcla de pan."},{"id":397,"title":"Croquetas de","category":"Desayunos","source":"40 recetas saludables","page":31,"text":"Croquetas de\njamón ibérico\n600 ml de leche entera.\n1 cucharada sopera de\nmantequilla.\n1 cucharada sopera de\nharina de trigo.\n100 g de jamón ibérico.\n2 huevos cocidos.\n2 huevos batidos.\nPan rallado.\nPasos a seguir\nIngredientes\n3\nCocer dos huevos, pelarlos y picar muy\nfinamente.\n4\nAñadir el resto del jamón y el huevo duro\ncuando la bechamel esté casi lista.\n5\nRetirar la bechamel y dejar reposar\nuna hora.\n6\nFormar las croquetas, sumergir en huevo\nbatido y cubrir con pan rallado por completo.\n7\nPrecalentar la freidora durante 5 minutos a\nuna temperatura de 180 °C.\n8\nIntroducir las croquetas en la freidora\nprecalentada y cocinar a una temperatura\nde 180 °C durante 15 minutos hasta\nque se doren.\nPicar el jamón en tacos muy pequeños.\n1\n2\nPoner en una sartén la mantequilla y la\nharina y, cuando se funda la mantequilla,\nañadir la mitad del jamón. Añadir la leche\nmuy poco a poco.\n15 min\n30 min\n— 30 —"},{"id":398,"title":"Fingers","category":"Desayunos","source":"40 recetas saludables","page":32,"text":"Fingers\nde queso\n6 piezas de queso\nmozzarella.\n16 g de harina de todo uso.\n3 g de almidón de maíz.\n3 g de sal.\n1 g de pimienta negra.\n2 huevos batidos.\n15 ml de leche.\n50 g de pan rallado o\nmigas de pan.\n2 g de perejil picado.\nAceite en aerosol.\nPasos a seguir\nIngredientes\nCortar las piezas de queso en láminas.\n1\n10 min\n8 min\n3 raciones\n3\nCubrir cada lámina de queso con harina,\ndespués, sumergirla en huevo y finalmente\nen pan rallado.\n4\nPrecalentar la freidora durante 5 minutos\na 175 °C.\n5\nColocar los fingers en la freidora y rociar con\naceite en aerosol. A continuación,\nestablecer un tiempo de cocción de 8\nminutos con una temperatura de 175 °C.\n6\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para asegurar\nque el contenido se hace de forma homogénea.\n2\nMezclar la harina, el almidón de maíz, la sal\ny la pimienta en un recipiente. Batir los\nhuevos y la leche en otro recipiente.\nMezclar el pan rallado y el perejil picado en\nun tercer recipiente.\n— 31 —"},{"id":399,"title":"Nuggets","category":"Postres","source":"40 recetas saludables","page":33,"text":"Nuggets\nde pescado\n450 g de pescado blanco.\n30 g de harina de todo uso.\n2 huevos.\n180 g de pan rallado.\nAceite en aerosol.\nSalsa tártara.\nPasos a seguir\nIngredientes\n6 min\n6min\n4 raciones\n— 32 —\n2\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 175 °C.\n1\n4\nColocar el pescado en la freidora precalentada\ny seleccionar el modo Marisco con un ajuste\nde tiempo de 6 minutos.\nIntroducir la harina en un recipiente. Batir\nlos huevos en otro recipiente. Echar el pan\nrallado en un tercer recipiente.\nCubrir cada tira de pescado con harina, y\ndespués sumergir en los huevos batidos.\nPor último, pasar por el pan rallado.\nCortar el pescado en tiras.\n8\nServir con salsa tártara.\n5\n6\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para asegurar\nque el contenido se hace de forma homogénea.\n7\nRociar el pescado con aceite en aerosol\npor ambos lados y colócalo en la freidora\nprecalentada."},{"id":400,"title":"Pan","category":"Panes, pasta y aperitivos","source":"40 recetas saludables","page":34,"text":"Pan\nde ajo\n1 barra de pan,\npreferiblemente baguette.\n4 dientes de ajo picados.\n45 g de mantequilla.\n15 ml de aceite de oliva.\n10 g de queso\nparmesano.\n8 g de perejil.\nPasos a seguir\nIngredientes\n4\nExtender la pasta de forma uniforme en el\npan y espolvorear queso parmesano\npor encima.\n5\nColocar el pan en la freidora y, a continuación,\ncocinar durante 8-10 minutos a 160 °C.\n6\nUna vez cocinado, decorar con perejil picado\npor encima.\nCortar la barra de pan en piezas de no más\nde dos dedos de ancho.\n1\n2\nPrecalentar la freidora durante 5 minutos\na 160 °C.\n5 min\n8 min\n4 raciones\n3\nMezclar el ajo, la mantequilla y el aceite de\noliva para crear una pasta.\n— 33 —"},{"id":401,"title":"Queso asado 4 rebanadas de pan de molde. 45 g de mantequilla. 60 g de queso cheddar.","category":"Panes, pasta y aperitivos","source":"40 recetas saludables","page":35,"text":"Queso\nasado\n4 rebanadas de pan\nde molde.\n45 g de mantequilla.\n60 g de queso cheddar.\nPasos a seguir\nIngredientes\n2\nCepillar las rebanadas de pan por cada\nlado con mantequilla.\n3\nRepartir el queso en dos rebanadas de pan\ny cubrir las rebanadas con las dos restantes.\n1\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 160 °C.\n4\nColocar los sándwiches en la freidora\nprecalentada y seleccionar una\ntemperatura de 160 °C y un tiempo de\ncocción de 8 minutos.\n5 min\n8 min\n2 raciones\n— 34 —"},{"id":402,"title":"Sándwich de","category":"Pescados y mariscos","source":"40 recetas saludables","page":36,"text":"Sándwich de\natún y chipotle\n1 lata de atún.\n45 g de salsa chipotle.\n4 rebanadas de pan\nde molde.\n2 lonchas de queso\nal gusto.\nPasos a seguir\nIngredientes\n2\nMezclar el atún y la salsa chipotle hasta\nque la mezcla sea homogénea.\n3\nExtender la mezcla de atún y chipotle por 2\nrebanadas de pan.\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 160 °C.\n4\nAñadir una loncha de queso a cada una de\nlas rebanadas y cerrar con otra rebanada.\n5\nColocar los sándwiches en la freidora\nprecalentada y seleccionar una temperatura\nde 160 °C durante 8 minutos.\n5 min\n8 min\n4 raciones\n1\n— 35 —"},{"id":403,"title":"caseras 1 L de agua. 15 ml de aceite. 3 g de ajo en polvo. 2 g de pimentón. Sal y pimienta al gusto.","category":"Verduras y guarniciones","source":"40 recetas saludables","page":38,"text":"Patatas fritas\ncaseras\nPatatas cortadas en tiras.\n1 L de agua.\n15 ml de aceite.\n3 g de ajo en polvo.\n2 g de pimentón.\nSal y pimienta al gusto.\nPasos a seguir\nIngredientes\n3\nAgregar aceite y especias a las patatas\nhasta que estén totalmente cubiertas.\n4\nPrecalentar la freidora durante 3 minutos a\n200 °C.\nCortar las patatas en tiras y ponerlas a\nremojo en agua durante 15 minutos.\n1\n2\nEnjuagar las patatas con agua fría y dejar\nsecar unos pocos minutos.\n6\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para\nasegurar que el contenido se hace de\nforma homogénea.\n20 min\n25 min\n5\nColocar las patatas en la freidora y rociar\ncon aceite en aerosol. A continuación,\nseleccionar el modo Patatas fritas y\ncambiar el tiempo de cocción a 25 minutos.\n— 37 —"},{"id":404,"title":"Patatas fritas","category":"Verduras y guarniciones","source":"40 recetas saludables","page":39,"text":"Patatas fritas\nestilo mediterráneo\nPatatas cortadas en tiras.\n1 L de agua.\n40 ml de aceite vegetal.\n3 g de ajo en polvo.\n2 g de pimentón.\n60 g de queso feta.\n4 g de perejil picado.\n3 g de orégano fresco.\nSal y pimienta al gusto.\nJugo de limón.\nPasos a seguir\nIngredientes\n3\nAgregar aceite, polvo de ajo y pimentón\nhasta que las patatas estén bien cubiertas.\n4\nPrecalentar la freidora durante 3 minutos\na 200 °C.\nCortar las patatas en tiras y ponerlas a\nremojo en agua durante 15 minutos.\n1\n2\nEnjuagar las patatas con agua fría y dejar\nsecar unos pocos minutos.\n6\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para\nasegurar que el contenido se hace de\nforma homogénea.\n7\nUna vez terminada la cocción, se agrega a\nlas patatas queso feta, perejil, orégano, sal\ny pimienta. Se puede servir con jugo\nde limón.\n20 min\n25 min\n5\nColocar las patatas en la freidora y rociar\ncon aceite en aerosol. A continuación,\nseleccionar el modo Patatas fritas y\ncambiar el tiempo de cocción a 25 minutos.\n— 38 —"},{"id":405,"title":"Batatas cortadas","category":"Verduras y guarniciones","source":"40 recetas saludables","page":40,"text":"Batatas cortadas\nen tiras.\n15 ml de aceite.\nSal y pimienta al gusto.\n2 g de pimentón.\n2 g de ajo en polvo.\n2 g de cebolla en polvo.\nPasos a seguir\nIngredientes\nEspolvorear sal y pimienta al gusto,\npimentón, ajo en polvo y cebolla en polvo.\nColocar las batatas en la freidora y rociar\ncon aceite en aerosol. A continuación,\nseleccionar el modo Patatas fritas y\ncambiar el tiempo de cocción a 25 minutos.\nCortar las batatas en tiras y agregarlas en\nun recipiente con aceite hasta que estén\ntotalmente cubiertas.\nPrecalentar la freidora durante 3 minutos a\n200 °C.\n20 min\n25 min\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para\nasegurar que el contenido se hace de forma\nhomogénea.\nPatatas\nfritas dulces\n3\n4\n1\n2\n5\n— 39 —"},{"id":406,"title":"Patatas cortadas","category":"Verduras y guarniciones","source":"40 recetas saludables","page":41,"text":"Patatas cortadas\nen cuñas.\n25 ml de aceite de oliva.\n3 g de ajo en polvo.\n1 g de cebolla en polvo.\n3 g de sal.\n1 g de pimienta negra.\n5 g de queso\nparmesano rallado.\nPasos a seguir\nIngredientes\n4\nColocar las patatas en la freidora, seleccionar\nel modo Patatas fritas y cambiar el tiempo\nde cocción a 25 minutos.\nCortar las patatas en forma de cuña.\n1\n2\nPrecalentar la freidora durante 3 minutos\na 200 °C.\n5\nSe recomienda agitar la cesta de la freidora\nvarias veces durante la cocción para asegurar\nque el contenido se hace de forma\nhomogénea.\n3 min\n20 min\nPatatas\ngajo\n3\nCubrir las patatas con aceite de oliva y\nmezclar con el resto de ingredientes y el\nqueso parmesano hasta que las patatas\nestén bien cubiertas.\n— 40 —"},{"id":407,"title":"Patatas","category":"Verduras y guarniciones","source":"40 recetas saludables","page":42,"text":"Patatas\nHasselback\n4 patatas medianas\nsin pelar.\n30 ml de aceite de oliva.\n12 g de sal.\n1 g de pimienta negra.\n1 g de ajo en polvo.\n30 g de mantequilla.\n8 g de perejil picado.\nPasos a seguir\nIngredientes\n3\nCubrir las patatas con aceite de oliva y\nsazonar de forma uniforme con sal,\npimienta negra y ajo en polvo.\n4\nAgregar las patatas a la freidora de aire y\ncocinar durante 30 minutos con una\ntemperatura de 200 °C.\n5\nCepillar las patatas con mantequilla\nderretida y cocinar durante 10 minutos más\na 200 °C.\n6\nServir con perejil picado por encima de\nlas patatas.\nCortar la patata a lo largo en hendiduras\ndeteniendo el corte para que la patata\nsiga entera.\n1\n2\nPrecalentar la freidora durante 5 minutos\na 200°C.\n— 41 —\n5 min\n40 min\n4 raciones"},{"id":408,"title":"Mini","category":"Panes, pasta y aperitivos","source":"40 recetas saludables","page":44,"text":"Mini\npizzas\nMasa de pizza\nprefabricada.\nAceite de oliva.\n60 g de tomate frito.\nTomates cherry.\nOlivas negras.\n85 g de mozzarella\nrallada.\n25 g de queso\nparmesano.\nOrégano.\nPasos a seguir\nIngredientes\n3\nColocar la masa de pizza en la freidora\nprecalentada y cocinar durante 3 minutos\na 160 °C.\n4\nAgregar el tomate frito, mozzarella,\nparmesano, 3-4 rodajas de tomate cherry,\noliva negra y orégano al gusto.\n5\nMeter de nuevo las pizzas en la freidora y\ncocinar durante 5 minutos a 160 °C.\n5 min\n10 min\n4 raciones\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 160 °C.\n1\n2\nCepillar la masa con aceite por la parte\nde arriba.\n— 43 —"},{"id":409,"title":"Pasta","category":"Panes, pasta y aperitivos","source":"40 recetas saludables","page":45,"text":"Pasta\nchip\n500 g de pasta seca.\nQueso parmesano o\ngrana padano.\nPimienta negra molida.\nPimentón picante.\nOrégano seco.\nAceite de oliva.\nSal al gusto.\nPasos a seguir\nIngredientes\n3\nPrecalentar la freidora 5 minutos a 200 °C.\n4\nColocar la pasta en la freidora de aire y\ncocinar durante 10 minutos a 200 °C.\n5\nSe recomienda remover la pasta varias\nveces durante la cocción para asegurar que\nel contenido se hace de forma uniforme.\n6\nDejar reposar la pasta 5 minutos antes\nde servir.\nCocer la pasta dejándola blanda.\n1\n2\nUna vez cocida la pasta, escurrir y mezclar\ncon el resto de ingredientes en un bol.\nSazonar al gusto y rociar con aceite\nde oliva en aerosol. Remover bien.\n15 min\n10min\n— 44 —"},{"id":410,"title":"Bizcocho","category":"Postres","source":"40 recetas saludables","page":47,"text":"Bizcocho\nde naranja\n120 g de harina de\ntodo uso.\n4 g de levadura.\n85 g de mantequilla.\n120 g de azúcar\n1 huevo.\n15 g de jugo de naranja.\n1 naranja para ralladura.\n60 g de suero de leche.\nPasos a seguir\nIngredientes\n4\nVertir lentamente el suero de leche mientras\nse bate a velocidad media.\n5\nPrecalentar la freidora durante 5 minutos a\n160°C.\n6\nColocar la mezcla en un pequeño molde e\nintroducirlo en la freidora.\n7\nCocinar durante 30 minutos con una\ntemperatura de 160°C .\nMezclar harina, levadura y sal en un\nrecipiente.\n1\n2\nBatir la mantequilla hasta que esté suave y\nesponjosa. Batir el azúcar con la mantequilla\ndurante un minuto.\n3\nBatir la mezcla de harina junto con la\nmantequilla hasta crear una mezcla\nhomogénea. Agregar el huevo, juego y\nralladura de naranja. Mezclar de nuevo los\ningredientes hasta que estén unidos.\n— 46 —\n10 min\n30min"},{"id":411,"title":"Muffins","category":"Postres","source":"40 recetas saludables","page":48,"text":"Muffins\nde chocolate\n120 g de harina de\ntodo uso.\n125 ml de leche de coco\no soja.\n40 g de azúcar.\n60 ml de aceite de coco.\n5 ml de extracto de\nvainilla.\n20 g de cacao en polvo.\n4 g de levadura.\n2 g de bicarbonato\nsódico.\n85 g de pepitas\nde chocolate.\n25 g de pistacho o\navellana molida (opcional).\nAceite en aerosol.\nPasos a seguir\nIngredientes\n3\nCombinar ambas mezclas poco a poco\nhasta que dé como resultado una mezcla\nsuave. Después se añaden las pepitas de\nchocolate y avellana si se desea.\n4\nPrecalentar la freidora durante 5 minutos\na 150 °C.\n5\nColocar la masa en moldes de papel con\ncuidado. A su vez, colocar papel de horno o\nrecipiente de aluminio en la cesta de\nla freidora.\n6\nCocinar durante 15 minutos con una\ntemperatura de 150 °C.\nMezclar azúcar, leche de coco o soja, aceite\nde coco y extracto de vainilla en\nun recipiente.\n1\n2\nMezclar la harina, el cacao en polvo,\nlevadura bicarbonato y una pizca de sal en\notro recipiente.\n20 min\n25 min\n6-8 raciones\n— 47 —"},{"id":412,"title":"Roscas","category":"Postres","source":"40 recetas saludables","page":49,"text":"Roscas\nde azúcar\n500 g de harina.\n1 huevo.\n10 g de levadura.\n150 ml de leche.\n100 ml de agua.\n4 g de sal.\n80 g de azúcar.\n40 g de mantequilla.\n1 cuchara de extracto\nde vainilla.\nAzúcar glas.\nPasos a seguir\nIngredientes\n4\nPrecalentar la freidora durante 5 minutos\na 180 °C.\n5\nEstirar la masa y dar forma de donuts\nayudandose de un molde o dos vasos de\ndiferente tamaño. Dejar reposar 30\nminutos más.\n6\nIntroducir las roscas con papel de horno en\nla freidora precalentada y cocinar durante\n15 minutos a 180 °C.\n7\nSe recomienda dar la vuelta a los donuts a\nmitad de la cocción para asegurar que se\nhacen de forma uniforme.\n8\nUna vez listos se pueden espolvorear con\nazúcar glas o cubrir con glaseado al gusto.\nEn un recipiente, mezclar la levadura, la\nharina, el azúcar y la sal.\n1\n3\nAmasar con las manos hasta quedar una\nmasa suave y maleable. Dejar reposar la\nmasa durante una hora.\n2\nAñadir el huevo, la mantequilla, el extracto de\nvainilla, la leche y el agua. Mezcar de nuevo\nhasta conseguir una masa homogénea.\n10 min\n10min\n— 48 —"},{"id":413,"title":"Torrijas de","category":"Postres","source":"40 recetas saludables","page":50,"text":"Torrijas de\nla abuela\n5 min\n10 min\nPan blanco.\n2 huevos.\n60 ml de leche.\n15 ml de sirope de arce.\n2 ml de extracto\nde vainilla.\nAceite en aerosol.\n38 g de azúcar.\n3 g de canela molida.\nAzúcar glas.\nPasos a seguir\nIngredientes\n1\nUtilizar rebanadas de pan blanco y cortar\nen trozos de dos dedos de ancho.\n2\nBatir los huevos, la leche, el sirope de arce\ny la vainilla.\n3\nPrecalentar la freidora durante un tiempo\nde 5 minutos a 170 °C.\n4\nSumergir el pan en la mezcla de huevo y\ncolocarlo en la freidora de aire\nprecalentada. Rociar las torrijas\ngenerosamente con aceite en aerosol.\n5\nCocinar las torrijas durante 10 minutos a\n175 °C. Se recomienda girar las torrijas a\nmitad de cocción.\n6\n7\nCubrir las torrijas con la mezcla de azúcar y\ncanela cuando haya ﬁnalizado la cocción.\n8\nEspolvorear con azúcar glas.\nMezclar azúcar y canela en un recipiente.\n— 49 —"},{"id":414,"title":"Queso Asado RINDE 2 PORCIONES","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":10,"text":"Queso Asado\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cepilla la mantequilla a cada lado de las rebanadas\nde pan.\n3 Divide el queso de manera pareja sobre 2 rebanadas\nde pan y cubre con las rebanadas restantes para hacer\n2 sándwiches.\n4 Coloca los sándwiches en la freidora de aire\nprecalentada.\n5 Ajusta el tiempo 6-8 minutos a 180°C\n6 Corta diagonalmente y sirve.\n43 g de mantequilla derretida\n4 rebanadas de pan blanco\n57 g de queso cheddar, rallado,\ndividido"},{"id":415,"title":"HUEVOS FRITOS GEMELOS RINDE 1 PORCIÓN","category":"Desayunos","source":"120 recetas para comer mejor","page":11,"text":"HUEVOS FRITOS GEMELOS\nRINDE 1 PORCIÓN\nTIEMPO DE PREPARACIÓN: 2\nminutos\nTIEMPO DE COCCIÓN: 6-8\nminutos\n2 Huevos\nSal y pimienta al gusto\nPUEDES ACOMPAÑAR LOS HUEVOS CON TOSTADAS O\nTORTILLAS DE MAÍZ\n1 Colocar un fondo platillo porcelana que cabe en la\ncesta de la Airfryer\n2 Pincelar el platillo con mantequilla o aceite de oliva\ny abrir el huevo con cuidado.\n3 Programar el tiempo para 6-8 minutos a 180 grados\ncon la Airfryer ya calentada (4 minutos)."},{"id":416,"title":"240 g de harina todo uso","category":"Desayunos","source":"120 recetas para comer mejor","page":12,"text":"240 g de harina todo uso\n50 g de azúcar granulada\n8 g de polvo de hornear\n2 g de sal\n85 g de mantequilla fría\ntroceada\n85 g de arándanos frescos\n3 g de jengibre fresco\nrallado\n113 ml de crema para batir\n2 huevos grandes\n4 ml de extracto de vainilla\n5 ml de agua\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 Une el azúcar, la harina, el polvo de hornear y la sal\nen un recipiente grande.\n2 Une la mantequilla con la harina usando una\nbatidora o tus manos hasta que la mezcla se asemeje\na migas gruesas.\n3 Mezcla los arándanos y el jengibre en la mezcla de\nharina. Deja de lado.\n4 Une la crema para batir, 1 huevo y el extracto de\nvainilla en un recipiente diferente.\n5 Une la mezcla de crema con la mezcla de harina\nhasta que se combinen.\n6 Forma la masa hasta que llegue a un grosor de\naproximadamente 38 mm y córtala en octavos.\n7 Unta los bollos con una combinación de huevo y\nagua. Deja de lado.\n8 Preheat\n9 Coloca papel para hornear en la canasta interna\nprecalentada y coloca los bollos arriba del papel.\n10 Cocina durante 12 minutos a 175°C, hasta que\nestén dorados\nBollos de Arándano\nRINDE 6 BOLLOS"},{"id":417,"title":"TIEMPO DE PREPARACIÓN: 5","category":"Desayunos","source":"120 recetas para comer mejor","page":13,"text":"TIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n2 masas para hojaldre\ncuadrada, comprado listo\n1 huevo (clara y yema\nseparados)\n½ taza de té de atún\n½ taza de té de perejil picado\n½ taza de aceitunas de té\npicado\nSal y pimienta al gusto\n1 Precalentar la Airfryer. Ajuste el tiempo de 5 minutos\ny la temperatura a 200 grados.\n2 Mezclar el atún con aceitunas y el perejil. Sazonar al\ngusto y dejar de lado.\n3 Coloque la mitad del relleno en cada masa y doblar\npor la mitad.\n4 Pincele con clara de huevo y cierre suavemente sin\namasar demasiado para no obstaculizar el crecimiento\nde la masa de hojaldre.\n5 Después de cerrado hacer dos pequeños cortes en la\nparte superior de salida de aire. Pincele con la yema\nde huevo.\n6 Colocar en la cesta de la AirFryer. Ajustar el tiempo\npara 10 minutos a 200°C\nEMPANADAS DE HOJALDRE CON ATÚN\nRINDE 2 PORCIONES"},{"id":418,"title":"TIEMPO DE PREPARACIÓN: 3","category":"Desayunos","source":"120 recetas para comer mejor","page":14,"text":"TIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 10-15\nminutos\n2 huevos\n2 rebanadas de jamón\npicadas\n2 rebanadas de mozzarella\npicada\n1 cucharada de sopa de\ncebolla bien picada\n½ taza de té de perejil y\ncebollino picado\nSal, pimienta negra y orégano\nal gusto\nAceite de oliva para untar\n1 Pre caliente la Airfryer por el tiempo de 5 minutos y la\ntemperatura a 200 grados.\n2 Untar un refractario que se ajusta en la cesta de la\nAyrfryer que tiene una repisa alta.\n3 En un cuenco bata ligeramente los huevos con un\ntenedor.\n4 Añadir los rellenos y especias. Coloque el recipiente\nrefractario en la cesta de la Airfryer y verter los huevos\nbatidos con cuidado de no caerse.\n5 Ajuste el tiempo de 10 a 15 minutos a 200°C.\nLa su tortilla está lista cuando esté dorada.\nTORTILLA RICA MAÑANA\nRINDE 1 PORCIón"},{"id":419,"title":"Aceite en aerosol","category":"Postres","source":"120 recetas para comer mejor","page":15,"text":"Aceite en aerosol\nantiadherente\n1 rebanada de queso\ncheddar blanco\n1 rebanada de tocino\ncanadiense\n1 muffin inglés, dividido\n15 ml de agua caliente\n1 huevo grande Sal y\npimienta, al gusto\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n1 Rocía el interior de un molde de 85 g con aceite en\naerosol y colócalo en la freidora de aire\n2 Preheat\n3 Agrega el queso y el tocino canadiense en la\nfreidora de aire precalentada.\n4 Vierte el agua caliente y el huevo en el molde\ncaliente y sazona con sal y pimienta.\n5 Ajusta a 10 minutos a 180°C.\n6 Saca los muffins ingleses después de 7 minutos,\ndejando el huevo durante el tiempo completo.\n7 Arma tu sándwich colocando el huevo cocido\nencima del muffing inglés y sirve.\nSándwich de Muffins\nRINDE 1 PORCIóN"},{"id":420,"title":"Aceite en aerosol","category":"Desayunos","source":"120 recetas para comer mejor","page":16,"text":"Aceite en aerosol\nantiadherente\n3 huevos\n6 rodajas de tocino\nahumado, en cubitos\n60 g de espinaca bebe\nlavada\n120 ml de crema para batir\n15 g de queso parmesano\nTIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n1 Preheat\n2 Rocía tres moldes de 76 mm con aceite en aerosol\nantiadherente.\n3 Agrega 1 huevo a cada molde engrasado.\n4 Cocina el tocino en una sartén hasta que esté\ndorado, aproximadamente 5 minutos.\n5 Agrega las espinacas y cocina hasta que se\nmarchiten, 2 minutos.\n6 Mezcla la crema para batir y el Queso parmesano.\nCocina durante 2-3 minutos.\n7 Vierte la mezcla de crema sobre los huevos.\n8\nColoca\nlos\nmoldes\nen\nla\nfreidora\nde\naire\nprecalentada y cocina por 8-10 minutos a 175°C hasta\nque la clara de huevo esté completamente preparada.\n9 Sazona al gusto con sal y pimienta\nHuevo Cocido en Cacerola\nRINDE 3 PORCIONES"},{"id":421,"title":"TIEMPO DE PREPARACIÓN: 5","category":"Desayunos","source":"120 recetas para comer mejor","page":17,"text":"TIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n4 rebanadas de pan blanco,\n38 mm de espesor,\npreferiblemente duras\n2 huevos\n60 ml de leche\n15 ml de salsa de maple\n2 ml de extracto de vainilla\nAceite en aerosol\nantiadherente\n38 g de azúcar\n3 g de canela molida Jarabe\nde maple, para servir\nAzúcar Glas para\nespolvorear\n1 Corta cada rebanada de pan en tercios haciendo 12\npiezas. Coloca de lado.\n2 Bate los huevos, la leche, el sirope de maple y la\nvainilla.\n3 Preheat\n4 Sumerge el pan rebanado en la mezcla de huevo y\ncolócalo en la freidora de aire precalentada. Rocía las\ntostadas francesas generosamente con aceite en\naerosol.\n5 Cocina las tostadas francesas por 10 minutos a\n175°C. Gira las tostadas a la mitad de la cocción.\n6 Mezcla el azúcar y la canela en un tazón.\n7 Cubre las tostadas Francesas con la mezcla de\nazúcar y canela cuando hayas finalizado la cocción.\n8 Sirve con sirope de Maple y espolvorea con azúcar en\npolvo.\nTostadas Francesas en Palitos\nRINDE 4 PORCIONES"},{"id":422,"title":"TIEMPO DE PREPARACIÓN: 10","category":"Postres","source":"120 recetas para comer mejor","page":18,"text":"TIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\nCUBIERTA CROCANTE\n13 g de azúcar blanca\n16 g de azúcar morena clara\n1 g de canela\n2 g de sal\n14 g de mantequilla sin sal,\nderretida\n24 g de harina todo uso\nMUFFINS\n90 g de harina todo uso\n53 g de azúcar morena clara\n4 g de polvo de hornear\n1 g de bicarbonato de sodio\n2 g de canela\n1 g de sal\n112 g de crema agria\n42 g de mantequilla sin sal,\nderretida\n1 huevo\n4 ml de extracto de vainilla\nAceite en aerosol\nantiadherente\n1 Mezcla todos los ingredientes de la cubierta crocante\nhasta que formen migas gruesas. Deja de un lado.\n2 Combina la harina, la azúcar morena, el polvo de\nhornear, el bicarbonato de sodio, la canela y la sal en\nun tazón grande.\n3 Mezcla la crema agria, la mantequilla, el huevo y la\nvainilla en un tazón separado hasta que se combinen.\n4 Mezcla los ingredientes húmedos con los secos hasta\nque estén bien combinados.\n5 Preheat\n6 Engrasa los moldes para muffins con aceite en aerosol\ny vierte la mezcla hasta que las tazas estén a 3/4.\n7 Espolvorea la parte superior de los muffins con la\ncobertura crocante.\n8 Coloca los moldes de muffins en la freidora de aire\nprecalentada. Es posible que tengas que trabajar en\nlotes.\n9 Cocina los muffins a 175°C durante 12 minutos\nMuffins de Cacé Streusel\nRINDE 6 MUFFINS"},{"id":423,"title":"TIEMPO DE PREPARACIÓN: 4","category":"Desayunos","source":"120 recetas para comer mejor","page":19,"text":"TIEMPO DE PREPARACIÓN: 4\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 rebanada de pan de\nbrioche, 64 mm de espesor,\npreferiblemente rancio\n113 g de queso crema\n2 huevos 15 ml de leche\n30 ml de crema para batir\n38 g de azúcar\n3 g de canela\n2 ml de extracto de vainilla\nAceite en aerosol\nantiadherente\nPistachos picados para\ncubrir\nJarabe de maple, para servir\n1 Preheat\n2 Corta una hendidura en el medio del panecillo.\n3 Rellena el interior de la hendidura con queso crema.\nDeja de un lado.\n4 Mezcla los huevos, la leche, la crema para batir, el\nazúcar, la canela y el extracto de vainilla.\n5 Humedece la tostada francesa rellena en la mezcla\nde huevo por 10 segundos de cada lado.\n6 Rocía cada lado de la tostada francesa con aceite\nen aerosol.\n7 Coloca la tostada francesa en la freidora de aire\nprecalentada y cocina durante 10 minutos a 175°C\n8 Remueve la tostada francesa cuidadosamente con\nuna espátula cuando termines de cocinar.\n9 Sirve cubierta con pistachos picados y jarabe de\nacre.\nTostadas Francesa Rellena\nRINDE 1 PORCIÓN"},{"id":424,"title":"TIEMPO DE PREPARACIÓN: 2","category":"Otros","source":"120 recetas para comer mejor","page":20,"text":"TIEMPO DE PREPARACIÓN: 2\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n13 g de azúcar morena oscuro\n5 g de chile en polvo\n1 g de comino molido\n1 g de pimienta de cayena\n4 rebanadas de tocino,\ncortado a la mitad\n1 Mezcla los condimentos hasta que estén bien\ncombinados.\n2 Sumerge el tocino en el aderezo hasta que esté\ncompletamente cubierto. Deja de un lado.\n3 Preheat\n4 Coloca el tocino en la freidora de aire precalentada\npor 8 minutos a 170°C\nTocino BBQ\nRINDE 2 PORCIONES"},{"id":425,"title":"TIEMPO DE PREPARACIÓN: 5","category":"Desayunos","source":"120 recetas para comer mejor","page":21,"text":"TIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n10 ml de aceite de oliva\n1 masa de pizza prefabricada\n(178 mm)\n28 g de queso mozzarella\nbajo en humedad\n2 rebanadas de jamón\nahumado\n1 huevo\n2 g de cilantro picado\n1 Pasa aceite de oliva encima de la masa de pizza\nprefabricada.\n2 Agrega queso mozzarella y jamón ahumado en la\nmasa.\n3 Preheat\n4 Coloca la pizza en la freidora de aire precalentada y\ncocina durante 10 minutos a 175°C.\n5 Remueve las cestas luego de 5 minutos y abre el huevo\nsobre la pizza. (Si quieres el huevo duro deja unos 4-6\nminutos más)\n6 Remplaza las cestas en la freidora de aire y termina\nde cocinar. Adorna con cilandro picado y sirve.\nPizza de Desayuno\nRINDE 1-2 PORCIONES"},{"id":426,"title":"240 g de harina todo uso","category":"Desayunos","source":"120 recetas para comer mejor","page":22,"text":"240 g de harina todo uso\n50 g de azúcar granulada\n8 g de polvo de hornear\n1 g de sal\n85 g de mantequilla fría\ntroceada\n84 g de fresas frescas\ntroceadas\n120 ml de crema para batir\n2 huevos grandes\n10 ml de extracto de vainilla\n5 ml de agu\nETIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 Tamiza la harina, el azúcar, el polvo de hornear y la\nsal en un tazón grande.\n2 Une la mantequilla con la harina usando una\nbatidora o tus manos hasta que la mezcla se asemeje\na migas gruesas.\n3 Mezcla las fresas en la mezcla de harina. Deja de\nlado para que repose la mezcla.\n4 Bate la crema para batir, 1 huevo y el extracto de\nvainilla en un recipiente aparte.\n5 Une la mezcla de crema en la mezcla de harina\nhasta que estén homogéneas, luego extiende la\nmezcla hasta un grosor de 38 mm.\n6 Usa un cortador de galletas redondo para cortar los\nbollos.\n7 Unta los bollos con una combinación de huevo y\nagua. Deja de lado.\n8 Preheat\n9 Coloca papel para hornear en la canasta interna\nprecalentada. 10 Coloca los bollos en la parte\nsuperior del papel de hornear y cocina durante 12\nminutos a 175°C, hasta que estén dorados.\nBollos de Crema con Fresas\nRINDE 6 BOLLOS"},{"id":427,"title":"TIEMPO DE PREPARACIÓN: 5","category":"Desayunos","source":"120 recetas para comer mejor","page":23,"text":"TIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n1 huevo\n2 tajadas de pan tajado\n1 cucharada de salsa\npomodoro\n3 hojitas de albahaca\n3 tomates cherry en mitades 1\ncucharadita de queso\nparmesano rallado\n1 cucharadita de aceite de\noliva Sal y pimienta al gusto\n1. Colocar un pedazo de papel de aluminio o un plato\npequeño dentro del compartimiento del Air Fryer.\n2 Verter el aceite de oliva y luego las rodajas de pan.\n3 A esta última quitarle un círculo del tamaño de un\npocillo para que quede espacio para el huevo\n4\nalbahaca y el queso.\n5 Cocinar por 8 a 10 minutos a 170° C o hasta obtener\nel termino deseado.\nSalpimentar y agregar la salsa pomodoro la\nHuevos Pomodoro\nRINDE 1 PORCIón"},{"id":428,"title":"TIEMPO DE PREPARACIÓN: 5","category":"Desayunos","source":"120 recetas para comer mejor","page":24,"text":"TIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n1 cucharada de sopa de\naceite de oliva\n2 cucharadas de ricotta\ndesmenuzable\n1 cucharada de sopa de queso\nparmesano\n1 rebanada de queso\ngorgonzola\n1 rebanada de queso Brie\n1 cucharada de sopa de nata\n1 huevo\nNuez moscada y sal al gusto\n1 Unte con aceite de oliva en fondo de un pequeño\nrefractario de vidrio.\n2 Colocar el queso en fondo y sazonar con nuez\nmoscada y sal.\n3 Romper el huevo en una taza y agregarlo suavemente\na la mezcla del refractario.\n4 Pre caliente la Airfryer por el tiempo de 5 minutos y la\ntemperatura a 200 grados.\n5 Al final del tiempo la Airfryer se apaga.\n6\nPuso el refractario en la cesta de la Airfyer\nestablecer el tiempo de 10 minutos a 180°C\nHUEVOS COCOTTE\nRINDE 1 PORCIón"},{"id":429,"title":"TIEMPO DE PREPARACIÓN: 3","category":"Carnes y aves","source":"120 recetas para comer mejor","page":25,"text":"TIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 5-6\nminutos\n4 rebanadas de pan sin\ncáscara\n4 rebanadas de pechuga de\npavo\n4 rebanadas de queso tipo\nplato\n2 cucharadas de cream\ncheese\n2 cucharadas de mantequilla\n1 Precalentar la Airfryer, ajuste el tiempo de 5 minutos y\nla temperatura a 200 grados.\n2 Pasar la mantequilla en un lado de la rebanada de\npan y en el otro lado de la rebanada el cream cheese.\n3 Montar los sándwiches la colocación de dos\nrebanadas de pechuga de pavo y dos rebanadas queso\nentre los panes, con el cream cheese para dentro y el\nlado con mantequilla.\n4 Coloque los sándwiches en la cesta de la Airfryer.\n5 Ajuste el tiempo de la Airfryer para 5 minutos a 180-\n200°C\nSANDWICH MISTO QUENTE\nRINDE 2 PORCIONES"},{"id":430,"title":"COSTILLAR DE CERDO CON MOSTAZA Y MIEL RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":27,"text":"COSTILLAR DE CERDO CON MOSTAZA Y MIEL\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nhoras\nTIEMPO DE COCCIÓN: 35\nminutos\n½ kg de costillar de cerdo\n½ taza de té de mostaza\namarilla\n½ taza de miel\nEl jugo de ½ limón\n1 cucharada de sopa de ajo\nexprimido o aplastado\n1 cucharada de romero fresco\no seco\n1 cucharada de aceite de oliva\nSal y pimienta al gusto al\ngusto\n1 Preparar la marinada con jugo de limón, ajo, romero,\naceite de oliva, pimienta y sal. Mezclar todo y poner\nen una bolsa de plástico y dejar de lado 2 horas.\nMezclar la mostaza con miel y dejar de lado.\n2 Cortar las costillar de cerdo en trozos entre los\nhuesos. Colocar los trozos de costillar en el interior de\nla bolsa de plástico, y cerrar la bolsa e eliminar la\nmayor cantidad de aire. Marinar durante al menos\nmedia hora en el refrigerador.\n3 Precalentar\n4 Retire las costillar de la bolsa y colocar en la cesta.\nPincele con la mezcla de mostaza y miel. Ajuste el\ntiempo 35 minutos a 200°C. Agitar la cesta de la\nmitad del tiempo. Pincelar con más mezcla de mostaza\ny miel."},{"id":431,"title":"Langostino frito RINDE 3 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":28,"text":"Langostino frito\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 8\nminutos\n230 g de langostinos pelados.\n5 g de sal.\n1 g de pimienta negra.\n1 g de ajo en polvo.\n2 g de pimentón.\n2 huevos batidos.\n15 ml de leche.\n30 g de pan rallado o miga de\npan.\n40 g de coco rallado en\nescamas.\nAceite en aerosol\n1 Mezclar la harina y la mitad de los aderezos en un\nrecipiente.\nrecipiente.\n2 Mezclar las migas de pan, el coco y el resto de\naderezos y especias en otro recipiente.\n3 Cubrir cada langostino con harina, después sumergir\nen huevo y pasar finalmente por las migas de pan con\ncoco.\n4 Precalentar la freidora durante 5 minutos a 180 °C.\n5 Colocar los langostinos en la freidora precalentada a\n180 °C 8 minutos\n6 Se recomienda agitar la cubeta de la freidora\ndurante la cocción para que el contenido se haga lo\nmás homogéneo posible\nBatir los huevos y la leche en otro"},{"id":432,"title":"Chuletón Santa María RINDE 2 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":29,"text":"Chuletón Santa María\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 8-12\nminutos\n2 g de sal\n2 g de pimienta negra\n2 g de ajo en polvo\n2 g de cebolla en polvo\n2 g de orégano seco\nUna pizca de romero seco\nUna pizca de cayena Una\npizca de salvia seca\n1 chuletón (16 oz), sin hueso\n15 ml de aceite de oliva\n1 Preheat\n2 Mezcla los condimentos y espolvoréalos sobre el\nfilete.\n3 Rocía aceite de oliva sobre el filete.\n4 Coloca el filete en la freidora de aire precalentada.\n5 12 Minutos para la cocción a 190°C o dependiendo de\ntu preferencia puede ser un poco menos o más\n6 Retira el filete de la freidora de aire cuando termines.\nDeja que repose por 10 minutos antes de cortar y servir"},{"id":433,"title":"Calamares a la romana RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":30,"text":"Calamares a la romana\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n400 g de calamar fresco.\n150 g de harina de trigo.\n200 g de agua.\n1 huevo.\n1/2 cucharada de bicarbonato\nsódico.\nAceite de oliva en aerosol.\nSal al gusto.\nNOTA: dependiendo de tu preferencia puede ser un\npoco menos o más\n1 muy gruesos y secar con papel absorbente.\n2 Mezclar en un recipiente harina, agua fría, sal, huevo\ny bicarbonato. Remover hasta conseguir una pasta\nsemilíquida\n3 Precalentar la freidora durante 5 minutos a 180 °C.\n4 Enharinar el calamar abundantemente y retirar el\nexceso de harina. Rociar los calamares con aceite de\noliva en aerosol.\n5 Introducir los calamares en la freidora y cocinar\ndurante 15 minutos a 180 °C.\n6 Se recomienda agitar la cubeta de la freidora durante\nla cocción para que el contenido se haga lo más\nhomogéneo posible y rociar con aceite de oliva en\naerosol si es necesario"},{"id":434,"title":"Filete Nueva York con Chimichurri RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":31,"text":"Filete Nueva York con Chimichurri\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 8-12\nminutos\nCHIMICHURRI\n60 ml de aceite de oliva extra\nvirgen\n20 g de albahaca fresca\n20 g de cilantro\n20 g de perejil\n4 filetes de anchoa\n1 chalota pequeña\n2 dientes de ajo, pelados\n1 limón, jugo\nUna pizca de pimiento rojo\ntriturado\nFILETE\n12 ml de aceite vegetal\n1 Filete Estilo Nueva York (16\noz)\nSal y Pimienta al Gusto\nNOTA: dependiendo de tu preferencia puede ser un\npoco menos o más\n1\nCombina\ntodos\nlos\ningredientes\nde\nla\nsalsa\nchimichurri en una licuadora y mezcla hasta alcanzar la\nconsistencia deseada.\n2 Preheat\n3 Frota aceite vegetal en la freidora en el filete y\nsazona con sal y pimienta.\n4 Coloca el filete en la freidora de aire precalentada,\najusta el tiempo a 8 minutos (para que quede medio\ncocido) 180°C 5 minutos al terminar.\nFinalmente, cúbrelo con salsa chimichurri y sírvelo"},{"id":435,"title":"Muslos de pollo asados RINDE 4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":32,"text":"Muslos de pollo asados\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 18\nminutos\nTIEMPO DE COCCIÓN: 20-22\nminutos\n4 muslos de pollo\ndeshuesados con piel (válido\ncon otras partes del pollo).\n35 ml de aceite de oliva.\n30 g de ajo en polvo.\n6 g de sal.\n2 g de pimienta negra.\n2 g de tomillo seco.\n2 g de orégano seco.\n2 g de romero seco.\n2 g de estragón seco.\nNOTA: dependiendo de tu preferencia puede ser un\npoco menos o más\n1 Cubrir los muslos de pollo con el resto de ingredientes\ny aceite de oliva. Dejar reposar durante 15 minutos.\n2 Precalentar la freidora durante un tiempo de 5\nminutos a 190 °C\n3 Colocar el pollo en la freidora precalentada, ajusta\nel tiempo 20 minutos a 190°C\n4 Se recomienda revisar el punto de la carne cada 5\nminutos."},{"id":436,"title":"Sándwich de Carne RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":33,"text":"Sándwich de Carne\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 6-8\nminutos\n1 chuletón (16 oz), sin hueso\n20 ml de aceite de oliva\n5 g de sal 1 g de pimienta\nnegra\n110 g de crema agria\n40 g de rábano picante\nblanco preparado, escurrido\n2 g de cebollín recién picado\n1 chalote pequeño, picado\n½ limón, jugo Sal y pimienta,\nal gusto Bollos de semillas de\nsésamo tostados, para servir\nRúcula bebé, para servir\nChalotes, en rodajas, para\nservir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cubre tu filete con aceite de oliva y sazona con sal y\npimienta.\n3 Coloca el filete en la freidora de aire precalentada.\n4 Coloca 8 minutos a 180°C.\n5 Mezcla la crema agria, el rábano picante, el cebollín,\nlos chalotes y el jugo de limón en un tazón pequeño.\n6 Sazona la crema de rábano picante con sal y pimienta\nal gusto.\n7 Retira el filete de la freidora de aire cuando termines\nde cocinarla y déjala reposar durante 5-10 minutos\nantes de cortarla.\n8 Crea un sándwich agregando parte de la crema de\nrábano picante al bollo inferior junto con la rúcula bebé,\nlos chalotes en rodaja y el filete en rodajas"},{"id":437,"title":"PApAS RELLENAS RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":34,"text":"PApAS RELLENAS\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 35\nminutos\n2 patatas grandes de 25 x 25\ncm\n½ litro de agua\n2 cucharadas de sopa de té\nde mantequilla\n1 taza de queso crema\n½ taza de té de pechuga de\npavo ahumada\n½ taza de queso mozzarella\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Lavar las patatas, a continuación, hacer varios\nagujeros profundos en ella con un tenedor, envolver en\npapel de patatas.\n2 Cocine las papas en una olla a presión con ½ litro de\nagua durante 10 minutos.\n3 Precalentar\n4 Retire las papas olla a presión, abrir el papel de\naluminio sólo en la parte superior, donde se hace el\ncorte.\n5 Con un cuchillo, hacer un corte en la parte superior a\nla mitad de la patata y apretarlo a lo largo para dejar\nmás abierta. Espolvorear un poco de sal. Coloque una\ncucharada de mantequilla.\n6 Distribuir la mitad de la crema de queso y pavo\nahumado. Cubra con el queso mozzarella ral
