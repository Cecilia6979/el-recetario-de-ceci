elhead{background:var(--green);color:white;padding:18px}.panelhead h2{margin:5px 0;font-family:Georgia,serif;font-size:26px}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;font-size:22px;background:#ffffff25;color:white}.content{padding:18px;white-space:pre-wrap;line-height:1.55;font-size:15px}.actions{display:flex;gap:8px;padding:0 18px 18px;flex-wrap:wrap}.action{background:var(--green);color:white;border:0;border-radius:12px;padding:11px 14px;font:inherit}.foot{color:var(--muted);font-size:12px;padding:24px 4px;text-align:center}.hide{display:none!important}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:9px}.recipe{padding:12px;min-height:145px}.recipe h3{font-size:15px}.wrap{padding:12px}.panel{margin:4px auto}.modal{padding:8px}}
</style></head><body><header><div class="eyebrow">Tu cocina, a tu manera</div><h1>El recetario de Ceci</h1><p>Tus recetas de Air Fryer, reunidas en un solo lugar 🍋</p></header><main class="wrap"><div class="search"><input id="q" type="search" placeholder="🔎 Busca receta o ingrediente…" aria-label="Buscar recetas"><select id="sort" aria-label="Ordenar"><option value="az">A–Z</option><option value="source">Por recetario</option></select></div><div class="filters" id="filters"></div><div class="stats" id="stats"></div><div class="grid" id="grid"></div><div class="empty hide" id="empty">No encuentro recetas con esa búsqueda. Prueba otra palabra ❤️</div><div class="foot">El recetario personal de Ceci · Los tiempos y temperaturas de los libros son orientativos; comprueba siempre la cocción.</div></main><div class="modal" id="modal"><article class="panel"><div class="panelhead"><button class="close" id="close">×</button><div class="tag" id="mcat"></div><h2 id="mtitle"></h2><div id="msource" class="source" style="color:#e3ebe6"></div></div><div class="content" id="mtext"></div><div class="actions"><button class="action" id="favdetail">☆ Guardar favorita</button><button class="action" id="copy">Copiar receta</button></div></article></div><script>
const RECIPES=[{"id":1,"title":"D E S A Y U N O S","category":"Desayunos","source":"Air Fryer Master","page":12,"text":"D E S A Y U N O S\nTostadas Francesa Rellena\nI N G R E D I E N T E S\n1 rebanada de pan de brioche, 64 mm\nde espesor, preferiblemente rancio\n113 g de queso crema\n2 huevos\n15 ml de leche\n30 ml de crema para batir\n38 g de azúcar\n3 g de canela\n2 ml de extracto de vainilla\nAceite en aerosol antiadherente\nPistachos picados para cubrir\nJarabe de maple, para servir\nP R E P A R A C I Ó N\n1.\nSelecciona Preheat en la freidora de aire, ajústala a 175°C\ny presiona Inicio/Pausa.\n2.\nCorta una hendidura en el medio del panecillo.\n3.\nRellena el interior de la hendidura con queso crema. Deja\nde un lado.\n4.\nMezcla los huevos, la leche, la crema para batir, el azúcar,\nla canela y el extracto de vainilla.\n5.\nHumedece la tostada francesa rellena en la mezcla de\nhuevo por 10 segundos de cada lado.\n6.\nRocía cada lado de la tostada francesa con aceite en\naerosol.\n7.\nColoca la tostada francesa en la freidora de aire\nprecalentada y cocina durante 10 minutos a 175°C\n8.\nRemueve la tostada francesa cuidadosamente con una\nespátula cuando termines de cocinar.\n9.\nSirve cubierta con pistachos picados y jarabe de acre.\nDESAYUNOS\n12"},{"id":2,"title":"D E S A Y U N O S","category":"Postres","source":"Air Fryer Master","page":14,"text":"D E S A Y U N O S\nMuffins de Cacé Streusel\nI N G R E D I E N T E S\nCUBIERTA CROCANTE:\n13 g de azúcar blanca 16 g de azúcar\nmorena clara 1 g de canela 2 g de sal\n14 g de mantequilla sin sal, derretida 24\ng de harina todo uso.\nMUFFINS:\n90 g de harina todo uso\n53 g de azúcar morena clara\n4 g de polvo de hornear\n1 g de bicarbonato de sodio\n2 g de canela\n1 g de sal\n112 g de crema agria\n42 g de mantequilla sin sal, derretida\n1 huevo\n4 ml de extracto de vainilla Aceite en\naerosol antiadherente\nP R E P A R A C I Ó N\n1.\nMezcla todos los ingredientes de la cubierta crocante\nhasta que formen migas gruesas. Deja de un lado.\n2.\nCombina la harina, la azúcar morena, el polvo de hornear,\nel bicarbonato de sodio, la canela y la sal en un tazón\ngrande.\n3.\nMezcla la crema agria, la mantequilla, el huevo y la vainilla\nen un tazón separado hasta que se combinen.\n4.\nMezcla los ingredientes húmedos con los secos hasta que\nestén bien combinados.\n5.\nSelecciona Preheat en la freidora de aire, ajústala a 175°C\ny presiona Inicio/Pausa.\n6.\nEngrasa los moldes para muffins con aceite en aerosol y\nvierte la mezcla hasta que las tazas estén a 3/4.\n7.\nEspolvorea la parte superior de los muffins con la\ncobertura crocante.\n8.\nColoca los moldes de muffins en la freidora de aire\nprecalentada. Es posible que tengas que trabajar en lotes.\n9.\nCocina los muffins a 175°C durante 12 minutos.\nDESAYUNOS\n14"},{"id":3,"title":"A L M U E R Z O S","category":"Carnes y aves","source":"Air Fryer Master","page":22,"text":"A L M U E R Z O S\nAlbóndigas de Pollo con Salsa Búfalo\nI N G R E D I E N T E S\nAlbóndigas:\n454 gramos de pollo picado\n43 gramos de zanahoria rallada\n2 cebollas verdes bien cortadas de\nforma transversal\n1 rama de apio cortada en trozos\npequeños\n32 mililitros de salsa búfalo para alitas\n32 gramos de harina de almendra\n1 huevo batido\n30 gramos de mayonesa\n7 mililitros de vinagre de manzana\n10 gramos de ajo en polvo\n10 gramos de cebolla en polvo\n5 gramos de sal kosher\n5 gramos de pimienta negra\nEspray de aceite de oliva\nSalsa:\n118 mililitros de leche de coco\n30 gramos de mayonesa\n15 mililitros de vinagre de manzana\n15 gramos de cebollino fresco troceado\n15 gramos de eneldo fresco troceado\n15 gramos de hojas frescas de perejil\nitaliano troceado\n5 gramos de ajo en polvo\n2 gramos de cebolla en polvo\n2 gramos de sal kosher\n2 gramos de pimienta negra\nP R E P A R A C I Ó N\n1.\nColocar todos los ingredientes de las albóndigas, salvo el\nespray de aceite, en un bol grande y mezclar, prestando\natención en no remover el pollo en exceso.\n2.\nFormar 12 albóndigas con la mezcla.\n3.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligente y colocar las albóndigas en el plato\nescurridor.\n4.\nRociar las albóndigas con espray de aceite de oliva.\n5.\nSeleccionar la función de Air Fry (Freír por aire), ajustar el\ntiempo a 14 minutos y pulsar Start/Pause (Iniciar/Pausar).\n6.\nBatir y mezclar los ingredientes de la salsa en un bol\nmediano.\n7.\nSacar las albóndigas cuando estén listas y servir con la\nsalsa.\nALMUERZOS\n22"},{"id":4,"title":"A L M U E R Z O S","category":"Postres","source":"Air Fryer Master","page":32,"text":"A L M U E R Z O S\nPasteles de Cangrejo\nI N G R E D I E N T E S\nREMOLADA\n55 g de mayonesa\n15 g de alcaparras, lavadas y\nescurridas\n5 g de encurtidos dulces, picados\n5 g de cebolla roja, finamente picada\n8 ml de jugo de limón\n8 g de mostaza Dijon Sal y pimienta, al\ngusto\nPASTELES DE CANGREJO\n1 huevo grande, golpeado\n17 g de mayonesa\n11 g de mostaza Dijon\n5 ml de salsa Worcestershire\n2 g de condimento Old Bay\n2 g de sal Una pizca de pimienta\nblanca\nUna pizca de cayena\n26 g de apio, finamente cortado en\ncubitos\n45 g de pimiento rojo, finamente\ncortado en cubitos\n8 g de perejil fresco, finamente picado\n227 g de carne de cangrejo\n28 g de migas de pan Aceite en\naerosol antiadherente\nP R E P A R A C I Ó N\n1.\nMezcla los ingredientes de rémoulade hasta que todo esté\nbien incorporado. Deja de lado.\n2.\nBate el huevo, la mayonesa, la mostaza, la salsa\nWorcestershire, el condimento Old Bay, la sal, la pimienta\nblanca, la pimienta de cayena, el apio, el pimiento y el\nperejil.\n3.\nAgita suavemente la carne de cangrejo en la mezcla de\nhuevo y muévela hasta que esté bien mezclada.\n4.\nEspolvorea las migas de pan sobre la mezcla de cangrejo\ny dóblalas suavemente hasta que las migas de pan\ncubran todos los rincones.\n5.\nForma la mezcla de cangrejo en 4 pasteles y enfría en la\nnevera durante 30 minutos.\n6.\nSeleccione Preheat en la freidora de aire Cosori y presione\nInicio/Pausa.\n7.\nColoca una hoja de papel para hornear en la canasta de\nla freidora de aire precalentada. Rocía los pasteles de\ncangrejo con aerosol para cocinar y colócalos\nsuavemente sobre el papel.\n8.\nCocina los pasteles de cangrejo a 205°C durante 8\nminutos hasta que estén dorados.\n9.\nDale la vuelta a los pasteles de cangrejo durante la\ncocción.\n10. Sirve con rémoulade.\nALMUERZOS\n32"},{"id":5,"title":"A L M U E R Z O S","category":"Carnes y aves","source":"Air Fryer Master","page":39,"text":"A L M U E R Z O S\nHamburguesas de Pavo con Ensalada Asiática\nI N G R E D I E N T E S\nENSALADA DE COL ASIÁTICA\n175 g de repollo rallado\n¼ cebolla roja pequeña, en rodajas\nfinas\n½ zanahoria, rallada\n2 cebollas verdes, en rodajas finas\n2 g de cilantro, picado\n30 ml de vinagre de vino de arroz\n30 ml de salsa de soja\n28 g de azúcar morena\n15 ml de aceite de sésamo\n14 g de mayonesa Sal y pimienta, al\ngusto\nEMPANADA\n454 g di tacchino macinato (85/15)\n2 spicchi d'aglio tritati\n25 mm di zenzero grattugiato\n2 cipolle verdi tritate\n32 g di hoisin\n15 ml di salsa di soia\n10 g di sambal oelek\n3 g di sale\n1 g di pepe nero\n90 g di pangrattato\nP R E P A R A C I Ó N\n1.\nENSALADA DE COL ASIÁTICA:\n2.\nMezcla la col, la cebolla, las zanahorias, las cebollas\nverdes y el cilantro en un tazón grande.\n3.\nMezcla el vinagre, la salsa de soja, el azúcar moreno, el\naceite de sésamo, la mayonesa, la sal y la pimienta en un\ntazón pequeño.\n4.\nMezcla las verduras con el aderezo de vinagre y deja que\nla ensalada marine por 30 minutos. EMPANADA:\n5.\nMezcla todos los ingredientes de las hamburguesas en un\ntazón grande.\n6.\nCrea 4 hamburguesas con la mezcla de pavo y colócalas\nen la nevera para que se enfríen.\n7.\nSelecciona Preheat en la freidora de aire Cosori y presione\nInicio/Pausa.\n8.\nColoca las hamburguesas de pavo en la freidora de aire\nprecalentada.\n9.\nCocina durante 10 minutos a 205°C.\n10. Sirve en panes con ensalada asiática.\nALMUERZOS\n39"},{"id":6,"title":"C E N A S","category":"Carnes y aves","source":"Air Fryer Master","page":41,"text":"C E N A S\nPollo al Limón con Pesto de Espinacas\nI N G R E D I E N T E S\nPollo:\n6 muslos de pollo con hueso y piel\n2 limones, rallados y exprimidos\n60 mililitros de aceite de oliva\n2 dientes de ajo machacados\n2 ramas de tomillo fresco\n5 gramos de sal kosher\n3 gramos de pimienta negra\nPesto:\n60 gramos de hojas pequeñas de\nespinaca\n15 gramos de hojas frescas de\nalbahaca\n15 gramos de hojas frescas de menta\n32 gramos de piñones tostados\n1 diente de ajo\n78 mililitros de aceite de oliva, y más\nsegún sea necesario\n1 limón exprimido\n15 gramos de levadura nutricional\n5 gramos de sal kosher, más sal al\ngusto\n3 gramos de pimienta negra\nUtensilios necesarios:\nBatidora o procesador de alimentos\nP R E P A R A C I Ó N\n1.\nColocar todos los ingredientes del pollo en una bolsa de\nplástico que se pueda sella o en un bol y mezclarlos bien.\n2.\nMarinar en el frigorífico durante 2 horas.\n3.\nVerter el líquido y desechar el marinado.\n4.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligente y colocar el pollo en el plato escurridor.\n5.\nSeleccionar la función de Chicken (Pollo), ajustar el tiempo\na 18 minutos y pulsar Start/Pause (Iniciar/Pausar).\n6.\nMezclar las espinacas, la albahaca, la menta, los piñones,\nel ajo, el aceite de oliva y el zumo de limón en un\nprocesador de alimentos o una batidora para mezclarlos.\n7.\nAñadir la levadura nutricional, la sal y la pimienta, y\nmezclar hasta que el pesto esté suave, pero siga teniendo\nun poco de textura. Añadir más aceite de oliva si fuera\nnecesario para que la textura del pesto sea más suave.\n8.\nSacar cuando esté listo, rociar con pesto y servir\nCENAS\n41"},{"id":7,"title":"C E N A S","category":"Verduras y guarniciones","source":"Air Fryer Master","page":45,"text":"C E N A S\nSanta María Ribeye\nI N G R E D I E N T E S\n1 chuletón sin hueso (450 g)\n5 gramos de sal kosher\n2 gramos de pimienta negra molida\n2 gramos de ajo en polvo\n2 gramos de cebolla en polvo\n2 gramos de orégano seco\nUna pizca de romero seco\nUna pizca de pimienta de cayena\nUna pizca de salvia seca\n15 mililitros de aceite de oliva\nP R E P A R A C I Ó N\n1.\nSacar el filete del frigorífico 30 minutos antes de cocinar.\n2.\nSecar el filete con papel de cocina y sazonar ambos lados\ncon sal y pimienta.\n3.\nMezclar los condimentos espolvorear sobre el filete de\nforma uniforme.\n4.\nRociar el filete con aceite de oliva.\n5.\nColocar el filete directamente en la cesta de la freidora\npor aire inteligente, sin el plato escurridor.\n6.\nSeleccionar la función de Steak (Filete), ajustar el tiempo a\n10 minutos y pulsar Start/Pause (Iniciar/Pausar). De esta\nforma, estará medio hecho.\n7.\nSacar cuando estén listas.\n8.\nDejar reposar el filete durante 5 minutos antes de cortar y\nservir.\nCENAS\n45"},{"id":8,"title":"C E N A S","category":"Carnes y aves","source":"Air Fryer Master","page":48,"text":"C E N A S\nFilete Nueva York con Chimichurri\nI N G R E D I E N T E S\n1-2 Porciones\nCHIMICHURRI SAUCE\n60 ml de aceite de oliva extra virgen\n20 g de albahaca fresca\n20 g de cilantro\n20 g de perejil\n4 filetes de anchoa\n1 chalota pequeña\n2 dientes de ajo, pelados\n1 limón, jugo\nUna pizca de pimiento rojo triturado\nFILETE:\n12 ml de aceite vegetal\n1 Filete Estilo Nueva York (16 oz)\nSal y Pimienta al Gusto\nP R E P A R A C I Ó N\n1.\nCombina todos los ingredientes de la salsa chimichurri en\nuna licuadora y mezcla hasta alcanzar la consistencia\ndeseada.\n2.\nSelecciona Preheat en la freidora de aire y presiona\nInicio/Pausa.\n3.\nFrota aceite vegetal en la freidora en el filete y sazona con\nsal y pimienta.\n4.\nColoca el filete en la freidora de aire precalentada.\n5.\nSelecciona Filete, ajusta el tiempo a 6 minutos (para que\nquede medio cocido) y presiona Inicio/Pausa.\n6.\nPermite que el filete repose durante 5 minutos al terminar.\n7.\nFinalmente, cúbrelo con salsa chimichurri y sírvelo.\nCENAS\n48"},{"id":9,"title":"C E N A S","category":"Carnes y aves","source":"Air Fryer Master","page":55,"text":"C E N A S\nChuletas de Cerdo al Estilo Carolina del Norte\nI N G R E D I E N T E S\n2 Porciones\n2 chuletas de cerdo deshuesadas\n15 ml de aceite vegetal\n25 g de azúcar moreno oscuro,\nenvasados\n6 g de pimentón húngaro\n2 g de mostaza molida\n2 g de pimienta negra recién molida\n3 g de cebolla en polvo\n3 g de ajo en polvo Sal y pimienta, al\ngusto\nP R E P A R A C I Ó N\n1.\nSelecciona Preheat, en la freidora de aire Cosori y presiona\nInicio/Pausa.\n2.\nCubre las chuletas de cerdo con aceite.\n3.\nCombina todas las especias y sazona abundantemente\nlas chuletas de cerdo, casi como si estuvieras\nempanizándolas.\n4.\nColoca las chuletas de cerdo en la freidora de aire\nprecalentada.\n5.\nSelecciona Filete, ajusta el tiempo a 10 minutos y presiona\nInicio/Pausa.\n6.\nRemueve las chuletas de cerdo cuando hayas terminado\nde cocinar, déjalas reposar durante 5 minutos y sírvelas.\nCENAS\n55"},{"id":10,"title":"C E N A S","category":"Pescados y mariscos","source":"Air Fryer Master","page":57,"text":"C E N A S\nSalmón Glaseado Teriyaki\nI N G R E D I E N T E S\n2 Porciones\nSALSA TERIYAKI\n118 ml de salsa de soja\n50 g de azúcar\n1 g de jengibre rallado\n1 diente de ajo, aplastado\n60 ml de jugo de naranja\nSALMÓN\n2 filetes de salmón (5 oz)\n20 ml de aceite vegetal\nSal y pimienta blanca, al gusto\nP R E P A R A C I Ó N\n1.\nCombina todos los ingredientes de la salsa teriyaki en una\nolla pequeña.\n2.\nPon la salsa a ebullición, redúcela a la mitad, luego déjala\nenfriar.\n3.\nSelecciona Preheat, en la freidora de aire ajusta la\ntemperatura a 175°C y presiona Inicio/Pausa.\n4.\nCubre el salmón con aceite y sazona con sal y pimienta\nblanca.\n5.\nColoca el salmón en la freidora de aire precalentada,\nhacia abajo. Selecciona Comida Marina, ajusta a 8\nminutos y presiona Inicio/Pausa.\n6.\nRetira el salmón de la freidora cuando haya terminado.\nDeja reposar por 5 minutos, luego glasea con salsa\nteriyaki.\n7.\nSirve sobre una cama de arroz blanco o con verduras a la\nparrilla.\nCENAS\n57"},{"id":11,"title":"S N A C K S","category":"Carnes y aves","source":"Air Fryer Master","page":69,"text":"S N A C K S\nShawarma de Cordero\nI N G R E D I E N T E S\n340 g de cordero molido\n2 g de comino\n2 g de pimentón\n3 g de ajo en polvo\n2 g de cebolla en polvo\n1 g de canela\n1 g de cúrcuma\n1 g de semillas de hinojo\n1 g de semilla de cilantro molido\n3 g de sal\n4 brochetas de bambú (229 mm)\nP R E P A R A C I Ó N\n1.\nCombina todos los ingredientes en un tazón y mézclalos\nbien.\n2.\nEnsarta 85 g de carne en cada brocheta, luego, colócalas\nen la nevera durante 10 minutos.\n3.\nSelecciona Preheat en la freidora de aire y presiona\nInicio/Pausa.\n4.\nColoca las brochetas en la freidora de aire precalentada,\nselecciona Filete, ajusta a 8 minutos y presiona\nInicio/Pausa.\n5.\nSirve con aderezo de yogur de limón o solo.\nSNACKS\n69"},{"id":12,"title":"E N T R A D A S","category":"Desayunos","source":"Air Fryer Master","page":73,"text":"E N T R A D A S\nRollitos de Primavera de Aguacate y Mango\nI N G R E D I E N T E S\n60 mililitros de aceite de coco líquido\n30 mililitros de aceite de sésamo\n12 obleas de huevo\n1 mango maduro, pelado y cortado en\ntiras de 6 ml\n2 aguacates maduros medianos,\ncortados en tiras de 6 ml\n11 gramos de sal kosher\n14 gramos de condimento de tajín\n28 gramos de cilantro fresco troceado\n2 cebolletas troceadas\nEscamas de sal, para espolvorear\nSalsa:\n128 gramos de mango cortado en\ndados\n43 mililitros de crema de coco\nZumo de 1 lima\n7 mililitros de sirope de ágave\n7 mililitros de salsa picante\n5 mililitros de aminoácidos de coco\n3 gramos de condimento de tajín\n3 gramos de sal kosher\nUtensilios necesarios :\nBatidora o procesador de alimentos\nP R E P A R A C I Ó N\n1.\nMezclar el aceite de coco y el aceite de sésamo en un bol\nmediano.\n2.\nUntar cada oblea de huevo con la mezcla de aceite,\ncolocar una segunda masa sobre esta y volver a untar\ncon aceite.\n3.\nColocar varios trozos de mango y aguacate en el centro\nde cada oblea de huevo.\n4.\nRociar el mango y el aguacate con sal, tajín y cilantro.\n5.\nEnvolver la fruta con la parte inferior de la oblea de huevo\ny después envolver los laterales.\n6.\nMojarse los dedos con agua y humedecer el lateral\nabierto restante y después enrollar las obleas de huevo f\nirmemente.\n7.\nUntar el exterior de las obleas con la mezcla de coco y\naceite de sésamo.\n8.\nMezclar todos los ingredientes de la salsa en el bol de un\nprocesador pequeño de alimentos o una batidora y\nprocesar hasta que la mezcla tenga una textura suave.\nReservar.\n9.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligentes y colocar las obleas de huevo en el plato\nescurridor.\n10. Seleccionar la función de Air Fry (Freír por aire), ajustar la\ntemperatura a 185 °C y pulsar Start/Pause (Iniciar/Pausar).\n11.\nSacar cuando estén listos y espolvorear con escamas de\nsal.\n12.\nDejar enfriar durante 10 minutos y servir con las salsas.\nENTRADAS\n73"},{"id":13,"title":"P O S T R E S","category":"Postres","source":"Air Fryer Master","page":82,"text":"P O S T R E S\nTartas Pequeñas de Manzana\nI N G R E D I E N T E S\n1 manzana mediana pelada y cortada\nen dados pequeños\n18 gramos de azúcar\n18 gramos de mantequilla sin sal\n1 gramo de canela molida\nUna pizca de nuez moscada molida\nUna pizca de pimienta de Jamaica\nmolida\n1 lámina de masa preparada para\ntarta\n1 huevo batido\n5 mililitros de leche\nP R E P A R A C I Ó N\n1.\nAñadir la manzana cortada en dados, el azúcar, la\nmantequilla, la canela, la nuez moscada y la pimienta de\nJamaica molida en una olla mediana o sartén y cocinar a\ntemperatura baja-media. Calentar hasta que se empiece\na cocinar a fuego lento.\n2.\nCocinar a fuego lento durante 2 minutos y apartar del\nfuego.\n3.\nDejar que las manzanas se enfríen al descubierto y a\ntemperatura ambiente durante 30 minutos.\n4.\nCortar la masa de tarta en círculos de 127 mm.\n5.\nAñadir el relleno al centro de cada tarta y utilizar los dedos\npara untar los extremos con agua. Sobrará parte del\nrelleno.\n6.\nCerrar la tarta pellizcando la masa y hacer un pequeño\ncorte en la parte superior. Mantener refrigerada hasta que\nesté lista para cocinar.\n7.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligente\n8.\nSeleccionar la función de Air Fry (Freír por aire), ajustar la\ntemperatura a 175 °C y el tiempo a 5 minutos y pulsar\nStart/Pause (Iniciar/Pausar) para precalentar.\n9.\nMezclar el huevo y la leche para untar la parte superior de\ncada tarta con la mezcla.\n10. Colocar las tartas de manzana en el plato escurridor.\n11.\nSeleccionar la función de Bake (Hornear), ajustar la\ntemperatura a 175 °C y el tiempo a 10 minutos, y luego\npulsar Start/Pause (Iniciar/Pausar).\n12.\nSacar las tartas cuando estén listas y doradas, dejar\nreposar durante 5 minutos y servir.\nPOSTRES\n82"},{"id":14,"title":"P O S T R E S","category":"Otros","source":"Air Fryer Master","page":83,"text":"P O S T R E S\nMagdalenas de Streusel y Café\nI N G R E D I E N T E S\nLas migas:\n13 gramos de azúcar blanco\n16 gramos de azúcar moreno\n1 gramo de canela\nUna pizca de sal\n30 gramos de mantequilla sin sal,\nfundida\n30 gramos de harina común\nBollos:\n100 gramos de harina común\n49 gramos de azúcar moreno\n4 gramos de levadura en polvo\n1 gramo de bicarbonato de sodio\n2 gramos de canela\n1 gramo de sal fina\n98 gramos de crema agria\n44 gramos de mantequilla sin sal,\nfundida\n1 huevo\n5 mililitros de extracto de vainilla\nEspray de aceite\nUtensilios necesarios:\nMoldes de magdalena de silicona o 6\nmoldes individuales metálicos de\nmagdalenas\nP R E P A R A C I Ó N\n1.\nMezclar todos los ingredientes de las migas hasta que se\nformen migas gruesas. Reservar.\n2.\nMezclar la harina, el azúcar moreno, la levadura en polvo,\nla canela y la sal en un bol grande.\n3.\nBatir la crema agria, la mantequilla, el huevo y el extracto\nde vainilla en un bol por separado hasta que se mezclen\nbien.\n4.\nIncorporar los ingredientes líquidos a los secos hasta que\nquede una mezcla homogénea.\n5.\nEngrasar los moldes de las magdalenas con espray de\naceite y verter la mezcla hasta llenar tres cuartas partes\ndel molde.\n6.\nEspolvorear las magdalenas con la mezcla de las migas.\n7.\nColocar las magdalenas directamente en la cesta de la\nfreidora por aire, sin el plato escurridor.\n8.\nSeleccionar la función de Bake (Hornear), ajustar la\ntemperatura a 150 °C y el tiempo a 12 minutos, y luego\npulsar Start/Pause (Iniciar/Pausar).\n9.\nSacar las magdalenas cuando estén hechas y servir\ncalientes.\nPOSTRES\n83"},{"id":15,"title":"A C O M P A Ñ A M I E N T O S","category":"Verduras y guarniciones","source":"Air Fryer Master","page":87,"text":"A C O M P A Ñ A M I E N T O S\nPatatas Fritas Crujientes Sazonadas\nI N G R E D I E N T E S\n2 patatas tipo russet\n15 gramos de maicena o almidón de\npatata\n21 mililitros de aceite vegetal\n8 gramos de sal kosher y una pizca\nmás para sazonar al gusto\n5 gramos de cebolla en polvo\n5 gramos de ajo en polvo\n5 gramos de pimentón\n2 gramos de chile molido\n2 gramos de pimienta de cayena\nP R E P A R A C I Ó N\n1.\nPelar las patatas y cortar los extremos f inos.\n2.\nCortar las patatas por la mitad de forma transversal y\ncortar cada mitad en tiras de 6 milímetros de grosor.\n3.\nMezclar las patatas cortadas con el resto de ingredientes\nen un bol grande hasta que queden bien cubiertas.\n4.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligente y colocar las patatas en el plato escurridor.\n5.\nSeleccionar la función de Fries (Patatas fritas), ajustar el\ntiempo a 17 minutos y pulsar Start/Pause (Iniciar/Pausar).\n6.\nSacar las patatas cuando estén listas, espolvorear con sal\nal gusto y servir inmediatamente.\nACOMPAÑAMIENTOS\n87"},{"id":16,"title":"A C O M P A Ñ A M I E N T O S","category":"Verduras y guarniciones","source":"Air Fryer Master","page":89,"text":"A C O M P A Ñ A M I E N T O S\nSalteado de Berenjena y Champiñones\nI N G R E D I E N T E S\nMedia berenjena grande cortada en\ncubos de 25 milímetros\n7 champiñones cortados en cuatro\ntrozos\n30 mililitros de salsa de soja\n15 gramos de salsa hoisin\n15 gramos de miel\n7 mililitros de vinagre de vino de arroz\n1 gramo de aceite de sésamo\nArroz cocinado para servir\n1 cebolla verde para guarnición\nP R E P A R A C I Ó N\n1.\nCombinar todos los ingredientes, salvo el arroz y la cebolla\nverde en una bolsa de plástico que se pueda sellar.\n2.\nMarinar la berenjena y los champiñones durante 10\nminutos a temperatura ambiente.\n3.\nEscurrir el líquido y desechar el marinado.\n4.\nColocar la berenjena y los champiñones directamente en\nla cesta de la freidora por aire, sin el plato escurridor.\n5.\nSeleccionar la función de Veggies (Verduras), ajustar el\ntiempo a 12 minutos y pulsar Start/Pause (Iniciar/Pausar).\n6.\nSacar la berenjena y los champiñones cuando estén listos\ny servir sobre arroz, adornar con cebolla verde.\nACOMPAÑAMIENTOS\n89"},{"id":17,"title":"A C O M P A Ñ A M I E N T O S","category":"Otros","source":"Air Fryer Master","page":106,"text":"A C O M P A Ñ A M I E N T O S\nCalabaza Asada\nI N G R E D I E N T E S\n1 calabaza, pelada, sin semillas y\ncortada en cubos de 25 mm\n15 ml de aceite de oliva, además de un\npoco más para rociar\n1 g de hojas de tomillo\n6 g de sal\n1 g de pimienta negra\nP R E P A R A C I Ó N\n1.\nSelecciona Preheat en la freidora de aire y presiona\nInicio/Pausa.\n2.\nCubre los cubos de calabaza sazonada con aceite de\noliva y sazona con tomillo, sal y pimienta.\n3.\nAgrega la calabaza sazonada a la freidora de aire\nprecalentada.\n4.\nSelecciona Tubérculos y presiona Inicio/Pausa. Asegúrate\nde agitar las cestas a la mitad de la cocción (la función\nRecordatorio de Agitado te avisará cuando).\n5.\nRocía con aceite de oliva cuando termines de cocinar y\nsirve.\nACOMPAÑAMIENTOS\n106"},{"id":18,"title":"A C O M P A Ñ A M I E N T O S","category":"Panes, pasta y aperitivos","source":"Air Fryer Master","page":108,"text":"A C O M P A Ñ A M I E N T O S\nPan de Ajo\nI N G R E D I E N T E S\n1 baguette francés (305 mm), cortado\na lo largo y a lo ancho\n4 dientes de ajo picados\n43 g de mantequilla, temperatura\nambiente\n15 ml de aceite de oliva\n10 g de queso parmesano, rallado\n8 g de perejil, recién picado\nP R E P A R A C I Ó N\n1.\nCorta el baguette por la mitad a lo largo, luego, divide\ncada pieza a la mitad a lo ancho, creando 4 rebanadas\nde 152 mm de largo.\n2.\nSelecciona Preheat en la freidora de aire, ajústala a 160°C\ny presiona Inicio/Pausa.\n3.\nCombina el ajo, la mantequilla y el aceite de oliva para\nformar una pasta.\n4.\nExtiende la pasta uniformemente en el pan y espolvorea\ncon queso Parmesano.\n5.\nColoca el pan en la freidora de aire precalentada.\n6.\nSelecciona Pan y presiona Inicio/Pausa.\n7.\nAdorna con perejil recién picado cuando termines de\ncocinar.\nACOMPAÑAMIENTOS\n108"},{"id":19,"title":"A C O M P A Ñ A M I E N T O S","category":"Postres","source":"Air Fryer Master","page":109,"text":"A C O M P A Ñ A M I E N T O S\nPastelillos de Maíz con Queso\nI N G R E D I E N T E S\n60 g de harina todo uso\n79 g de harina de maíz\n38 g de azúcar blanca\n6 g de sal\n7 g de polvo de hornear\n118 ml de leche\n45 g de mantequilla derretida\n1 huevo\n165 g de maíz\n3 cebollines, picados\n120 g de queso cheddar, rallado\nAceite en aerosol antiadherente\nP R E P A R A C I Ó N\n1.\nCombina harina, harina de maíz, azúcar, sal y polvo de\nhornear en un tazón y mezcla todo.\n2.\nBate la leche, la mantequilla y el huevo hasta que estén\nbien unidos.\n3.\nMezcla los ingredientes secos con los ingredientes\nhúmedos. Dobla el maíz, las cebolletas y el queso cheddar.\n4.\nSelecciona Preheat en la freidora de aire, ajústala a 160°C\ny presiona Inicio/Pausa.\n5.\nEngrasa los moldes para muffins con aceite en aerosol y\ncoloca la mezcla en los moldes hasta que estén a ¾.\n6.\nAgrega los muffins a la freidora de aire precalentada.\n7.\nSelecciona Pan, ajusta el tiempo a 15 minutos y presiona\nInicio/Pausa.\n8.\nSirve los muffins con mantequilla o disfrútalos como solos.\nACOMPAÑAMIENTOS\n109"},{"id":20,"title":"F A V O R I T O D E L A C H E F","category":"Otros","source":"Air Fryer Master","page":118,"text":"F A V O R I T O D E L A C H E F\nMagdalenas de Streusel y Café\nI N G R E D I E N T E S\nLas migas:\n13 gramos de azúcar blanco\n16 gramos de azúcar moreno\n1 gramo de canela\nUna pizca de sal\n30 gramos de mantequilla sin sal,\nfundida\n30 gramos de harina común\nBollos:\n100 gramos de harina común\n49 gramos de azúcar moreno\n4 gramos de levadura en polvo\n1 gramo de bicarbonato de sodio\n2 gramos de canela\n1 gramo de sal fina\n98 gramos de crema agria\n44 gramos de mantequilla sin sal,\nfundida\n1 huevo\n5 mililitros de extracto de vainilla\nEspray de aceite\nUtensilios necesarios:\nMoldes de magdalena de silicona o 6\nmoldes individuales metálicos de\nmagdalenas\nP R E P A R A C I Ó N\n1.\nMezclar todos los ingredientes de las migas hasta que se\nformen migas gruesas. Reservar.\n2.\nMezclar la harina, el azúcar moreno, la levadura en polvo,\nla canela y la sal en un bol grande.\n3.\nBatir la crema agria, la mantequilla, el huevo y el extracto\nde vainilla en un bol por separado hasta que se mezclen\nbien.\n4.\nIncorporar los ingredientes líquidos a los secos hasta que\nquede una mezcla homogénea.\n5.\nEngrasar los moldes de las magdalenas con espray de\naceite y verter la mezcla hasta llenar tres cuartas partes\ndel molde.\n6.\nEspolvorear las magdalenas con la mezcla de las migas.\n7.\nColocar las magdalenas directamente en la cesta de la\nfreidora por aire, sin el plato escurridor.\n8.\nSeleccionar la función de Bake (Hornear), ajustar la\ntemperatura a 150 °C y el tiempo a 12 minutos, y luego\npulsar Start/Pause (Iniciar/Pausar).\n9.\nSacar las magdalenas cuando estén hechas y servir\ncalientes.\nPOSTRES\n118"},{"id":21,"title":"F A V O R I T O D E L A C H E F","category":"Verduras y guarniciones","source":"Air Fryer Master","page":119,"text":"F A V O R I T O D E L A C H E F\nPatatas Fritas Crujientes Sazonadas\nI N G R E D I E N T E S\n2 patatas tipo russet\n15 gramos de maicena o almidón de\npatata\n21 mililitros de aceite vegetal\n8 gramos de sal kosher y una pizca\nmás para sazonar al gusto\n5 gramos de cebolla en polvo\n5 gramos de ajo en polvo\n5 gramos de pimentón\n2 gramos de chile molido\n2 gramos de pimienta de cayena\nP R E P A R A C I Ó N\n1.\nPelar las patatas y cortar los extremos f inos.\n2.\nCortar las patatas por la mitad de forma transversal y\ncortar cada mitad en tiras de 6 milímetros de grosor.\n3.\nMezclar las patatas cortadas con el resto de ingredientes\nen un bol grande hasta que queden bien cubiertas.\n4.\nColocar el plato escurridor en la cesta de la freidora por\naire inteligente y colocar las patatas en el plato escurridor.\n5.\nSeleccionar la función de Fries (Patatas fritas), ajustar el\ntiempo a 17 minutos y pulsar Start/Pause (Iniciar/Pausar).\n6.\nSacar las patatas cuando estén listas, espolvorear con sal\nal gusto y servir inmediatamente.\nACOMPAÑAMIENTOS\n119"},{"id":22,"title":"F A V O R I T O D E L A C H E F","category":"Verduras y guarniciones","source":"Air Fryer Master","page":120,"text":"F A V O R I T O D E L A C H E F\nSanta María Ribeye\nI N G R E D I E N T E S\n1 chuletón sin hueso (450 g)\n5 gramos de sal kosher\n2 gramos de pimienta negra molida\n2 gramos de ajo en polvo\n2 gramos de cebolla en polvo\n2 gramos de orégano seco\nUna pizca de romero seco\nUna pizca de pimienta de cayena\nUna pizca de salvia seca\n15 mililitros de aceite de oliva\nP R E P A R A C I Ó N\n1.\nSacar el filete del frigorífico 30 minutos antes de cocinar.\n2.\nSecar el filete con papel de cocina y sazonar ambos lados\ncon sal y pimienta.\n3.\nMezclar los condimentos espolvorear sobre el filete de\nforma uniforme.\n4.\nRociar el filete con aceite de oliva.\n5.\nColocar el filete directamente en la cesta de la freidora\npor aire inteligente, sin el plato escurridor.\n6.\nSeleccionar la función de Steak (Filete), ajustar el tiempo a\n10 minutos y pulsar Start/Pause (Iniciar/Pausar). De esta\nforma, estará medio hecho.\n7.\nSacar cuando estén listas.\n8.\nDejar reposar el filete durante 5 minutos antes de cortar y\nservir.\nCENAS\n120"},{"id":23,"title":"G U Í A S Y R E C U R S O S","category":"Otros","source":"Air Fryer Master","page":122,"text":"G U Í A S Y R E C U R S O S\nConsejos y errores comunes\nPrecalienta la Air Fryer unos minutos antes de cocinar para resultados más uniformes.\nNo sobrecargues la canasta: deja espacio para que el aire circule entre los alimentos.\nUsa poco aceite en espray: es suficiente para lograr un dorado crujiente.\nAgita o voltea los alimentos a la mitad de la cocción para un dorado parejo.\nUsa moldes o papel apto para Air Fryer cuando la receta lo indique.\nAjusta siempre el tiempo según el modelo y tamaño de tu Air Fryer.\nE R R O R E S C O M U N E S A E V I T A R\nSobrecargar la canasta\nNo precalentar la Air Fryer\nUsar demasiado aceite\nNo agitar o voltear los alimentos\nGUÍAS Y RECURSOS\n122"},{"id":24,"title":"G U Í A S Y R E C U R S O S","category":"Verduras y guarniciones","source":"Air Fryer Master","page":124,"text":"G U Í A S Y R E C U R S O S\nLista de compras\nPlantilla imprimible para organizar tus compras antes de cocinar.\nPROTEÍNAS\nVERDURAS\nDESPENSA\nOTROS\nGUÍAS Y RECURSOS\n124"},{"id":25,"title":"I N S P I R A C I Ó N","category":"Otros","source":"Air Fryer Master","page":126,"text":"I N S P I R A C I Ó N\nGracias por elegir\nAIR FRYER MASTER\nEsperamos que disfrutes cada receta y que este recetario se convierta en tu mejor\naliado en la cocina.\n¡A cocinar y disfrutar!"},{"id":26,"title":"INTRODUCCIÓN","category":"Otros","source":"365 recetas sin aceite","page":16,"text":"INTRODUCCIÓN\nLa tecnología sigue evolucionando a través de las ideas de los responsables\nde cambiar el mundo. No es diferente en el mundo de la cocina, donde\nsiempre se hacen innovaciones, buscando mejorar las cosas en esta área.\nUno de los puntos en los que se enfocan principalmente estos cambios es en\nla parte sana de las personas y cómo afecta la comida que ingerimos.\nEsto se debe a que con la prisa de los habitantes de nuestro planeta, los\nalimentos procesados e ingredientes que contienen elementos nocivos para\nel cuerpo humano están cada vez más disponibles en los estantes de\ndiversas tiendas en cualquier parte del mundo. Particularmente entre estas\ncreaciones se encuentra la freidora de aire, que se ha convertido en una\nrevolución en las formas tradicionales de cocinar los alimentos, cuando se\npreparan en una sartén de aceite a alta temperatura.\nUna de sus grandes ventajas es que elimina, en gran medida, el contenido\ngraso de los alimentos en los que se procesa. Hay que reconocer que\ncontiene aceite, y el objetivo de esto es hacer que la comida tenga un sabor\nsimilar al de los productos fritos.\nPor supuesto, la cantidad es muy pequeña, puede considerarse\ninsignificante. Es más, si piensas que este pequeño aceite es aceite de oliva\ny no de los que se usan comúnmente en la cocina.\nLos alimentos que se pueden preparar son muy diversos, no solo salados\nsino también dulces. Por esta razón, este contenido está diseñado para\nbrindarle al lector una gran cantidad de recetas donde pueda cubrir todas\nsus comidas diarias sin tener que ir a ningún otro lado para encontrar esta\ninformación.\nIgualmente se tocaron ciertos puntos de mucho interés, para todo aquel que\nquiera hacer uso de este electrodoméstico, donde podrá encontrar:"},{"id":27,"title":"COMO FUNCIONA LA FREIDORA DE AIRE","category":"Otros","source":"365 recetas sin aceite","page":18,"text":"COMO FUNCIONA LA FREIDORA DE AIRE\nLas freidoras de aire funcionan con un calentador y un sistema de aire que\ncircula dentro del aparato para cocinar los alimentos.\nAunque cabe señalar que se utiliza mal el término sartén, para freír es\nnecesario sumergir los alimentos en una gran cantidad de aceite\nprecalentado. En este caso, funciona como una especie de horno eléctrico,\ncon un flujo constante de aire caliente.\nLa diferencia en la forma de cocinar los alimentos, entre un horno eléctrico\ny una freidora de aire, es que el aire circula por el sistema de ventilación, lo\nque ayuda a calentar todo el ambiente de los alimentos que se encuentran\nallí. En cambio, en un horno convencional eléctrico o de gas, el calor solo\nsale por la parte inferior del mismo, por lo que podemos ver que por este\nlado los alimentos se cocinan más rápido y tienden a calentarse. área.\nCon una freidora de aire, la comida del interior se procesará de manera\nuniforme, lo que hace que la cocción sea mucho más rápida. Esta es una\ngran ventaja, ya que la comida se puede pedir inmediatamente después de\najustar la temperatura.\nEl proceso como tal es muy sencillo, y consta de los siguientes pasos.\n1. Se debe seleccionar la comida a preparar. Esta no puede ser en cantidades\nmuy grandes, ya que se correría el riesgo de que la misma pudiera quedar\ncruda en su interior, considerando también el lapso de tiempo. Se coloca en\nla respectiva cesta.\n2. Se coloca algo de aceite de oliva en la parte inferior, o también se puede\nrociar sobre los alimentos. Se introduce dentro de la freidora de aire."},{"id":28,"title":"LAS DIFERENCIAS ENTRE LA FREIDORA DE","category":"Otros","source":"365 recetas sin aceite","page":20,"text":"LAS DIFERENCIAS ENTRE LA FREIDORA DE\nAIRE Y EL HORNO DE CONVECCIÓN\nEn primer lugar, definiremos qué es un horno de convección, pues es\nnecesario conocer sus características para luego construir sus diferencias\ncon respecto a una bandeja de convección.\nEsta es una representación moderna de un horno convencional, que usa\nelectricidad o gas como fuente de energía, mucho más pequeño que los\nhornos anteriores. Su mecanismo es similar al de una freidora de aire, en el\nsentido de que utiliza una resistencia al igual que la electricidad para\ngenerar calor y un ventilador para distribuir el aire caliente por todo el\ninterior.\nEstá diseñado de tal manera que ingresa al interior a través de una puerta\nfrontal, que puede ser vertical u horizontal, según la orientación del objeto.\nDado que su sistema operativo es algo similar, se pueden ver resultados\nmuy similares a la hora de cocinar los alimentos.\nLa convección se define como la transferencia de calor, que se transmite de\nun cuerpo o sistema a otro, por el movimiento de un líquido o gas. En este\ncaso es a través del aire interior.\nPara que el horno tenga convección, el horno debe tener un sistema de\nventilación para mover el aire caliente desde la fuente hasta el lugar donde\nse almacenan los alimentos. Por lo tanto, para saber si tu horno tiene\nconvección o no, necesitas saber si hay un ventilador detrás del horno.\nEn algunos de estos hornos, el uso de un sistema de convección es opcional,\nya que es una alternativa mediante un botón para encender o no el\nventilador. ."},{"id":29,"title":"del hogar, esto debido a que en cualquier lugar se puede guardar luego de","category":"Otros","source":"365 recetas sin aceite","page":23,"text":"del hogar, esto debido a que en cualquier lugar se puede guardar luego de\nhaber sido utilizada.\n7. Aislamiento. El horno de convección transmite fácilmente el calor a su\nparte externa, por tal razón se debe poner mucho cuidado sobre todo aquello\nque se encuentre cerca, mientras el mismo esté en funcionamiento.\nEn el caso de la freidora de aire, la canasta donde se colocan los alimentos\nestá muy bien constituida, donde no permite que el calor salga al exterior.\nIgualmente, el electrodoméstico, en su totalidad, se encuentra también\nrecubierto de un material que funciona como una capa aislante de calor.\n8. Accesorios. Las freidoras de aire permiten fácilmente la implementación\nde otros accesorios de cocina, tales como: cestas, bandejas, rejillas,\nasadores o brochetas.\n9. Consumo de energía entre el horno convección y la freidora de aire.\nUna freidora de aire consume aproximadamente 1440 watts, mientras que\nun horno puede ubicarse en un rango comprendido entre 1000 y 5000 watts.\nTodo tiene que ver con su tamaño y especificaciones.\nTal vez entre estos dos artefactos, con dimensiones similares, el consumo\nenergético fuera casi el mismo, lo que sucede es que, al cocinar más rápido\nen la freidora de aire, lógicamente el tiempo de consumo de energía\ntambién será menor, con el respectivo resultado.\n10. Precio. Anteriormente los hornos de convección eran más económicos\nque las freidoras de aire. En la actualidad, gracias al proceso de innovación"},{"id":30,"title":"LOS BENEFICIOS DE LA FREIDORA DE AIRE","category":"Otros","source":"365 recetas sin aceite","page":25,"text":"LOS BENEFICIOS DE LA FREIDORA DE AIRE\nLa principal ventaja de una freidora de aire, como su nombre indica, es que\ntu comida se puede preparar de manera muy similar a cocinar en una\nfreidora, pero con un contenido de grasa muy bajo que la hace mucho más\nsaludable. .\nEntre sus ventajas tenemos:\nNo salpican con aceite ni manchan.\nSu proceso de cocción es muy rápido.\nMuy bajo consumo de aceite.\nBajo consumo de electricidad.\nFáciles y rápidas de limpiar.\nNo emite ningún tipo de olor.\nFunciona sin supervisión.\nFáciles de utilizar.\nVersatilidad. Brinda muchas opciones de uso.\nOfrecen mayor seguridad en la cocina."},{"id":31,"title":"CAZUELA DE ARÁNDANOS","category":"Desayunos","source":"365 recetas sin aceite","page":34,"text":"CAZUELA DE ARÁNDANOS\nNivel de dificultad Fácil\nTiempo de preparación 16 minutos\nTiempo de cocción 30 minutos\nPorciones 4 personas\nINGREDIENTES\n3 ½ cda de azúcar moreno\n65 g de harina\n½ cda de canela en polvo\n4 ½ cda de margarina\n2 ½ cda de azúcar blanco\nPARA LA CAZUELA\n3 huevos\n2 ½ cda de harina blanca\n½ cdta de polvo para hornear\n½ cdta de bicarbonato de sodio\n2 ½ cda de azúcar\n3 ½ cda de margarina\n130 ml de leche\n135 g de arándanos\n1 cda de ralladura de limón\nPREPARACIÓN\nEn el bol, mezcla los ingredientes y luego agrega en el molde de la freidora,\nen otro envase incorpora y mezclar el azúcar con la harina, la mantequilla y\nla canela, hasta integrar todo, y distribuirlo sobre los arándanos."},{"id":32,"title":"COCINAR CAZUELA DE ARÁNDANOS","category":"Otros","source":"365 recetas sin aceite","page":35,"text":"COCINAR CAZUELA DE ARÁNDANOS\nCalienta la freidora de aire eligiendo el modo horno, pon la temperatura a\n150°C. Transfiere la mezcla a la sartén y hornea por 30 minutos."},{"id":33,"title":"WAFFLES SUERO DE LECHE Dificultad: Media","category":"Desayunos","source":"365 recetas sin aceite","page":36,"text":"WAFFLES SUERO DE LECHE\nDificultad: Media\nTiempo de preparación: 6 minutos\nTiempo de cocción: 3-4 minutos\nPorciones: 5 Personas\nINGREDIENTES\n250 g de harina\n2 huevos\n2 ½ cdta de azúcar\n1 cdta extracto de vainilla\n½ cdta de sal\n½ cdta bicarbonato\n2 cdta de levadura en polvo\n120 g de mantequilla\n500 ml de suero de leche\nPREPARACIÓN\nMezcla todos los ingredientes secos, azúcar, harina, sal, bicarbonato de\nsodio, polvo de hornear, luego los ingredientes húmedos, el extracto de\nvainilla y el suero de leche e integra en un tazón.\nCOCINAR WAFFLES SUERO DE LECHE\nCalienta la freidora de aire con todos los ingredientes en la sartén a 150°C y\nhornea. En 3 minutos retira y sirve."},{"id":34,"title":"TOSTADAS FRANCESAS Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":37,"text":"TOSTADAS FRANCESAS\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 6 minutos\nPorciones: 4 Personas\nINGREDIENTES\n4 rodajas de pan\n1 cdta Vainilla\n4 huevos\n1 ½ cda de mantequilla\nPREPARACIÓN\nEn un tazón, bate los huevos y la vainilla, unta el pan con la mantequilla,\nsumerja en la mezcla de huevo y déjalo marinar.\nCOCINAR TOSTADAS FRANCESAS\nCalienta la sartén de la freidora de aire colocándola en el modo de\nhorneado, ajusta la temperatura a 190°C, inserte el plato de pizza, luego\ncolócalo en la rejilla para pizza de la freidora y programa el tiempo durante\n6 minutos, voltea después de 3 minutos."},{"id":35,"title":"AVENA DE FRAMBUESA Dificultad: Fácil","category":"Otros","source":"365 recetas sin aceite","page":38,"text":"AVENA DE FRAMBUESA\nDificultad: Fácil\nTiempo de preparación: 11 minutos\nTiempo de cocción: 15 minutos\nPorciones: 4 Personas\nINGREDIENTES\n85 g de coco rallado\n1 cdta de canela en polvo\n500 ml leche de almendras\n70 g de frambuesas\nPREPARACIÓN\nCombina los ingredientes: el coco rallado, la canela en polvo, la leche de\nalmendras y frambuesas, intégralos todos los en un tazón, vierta en la\nbandeja para hornear de la sartén de la freidora de aire.\nCOCINAR AVENA DE FRAMBUESA\nTransfiere la mezcla a la sartén en el modo para horneado y programa la\ntemperatura a 180°C. Hornea durante 15 minutos. Retira y sirve"},{"id":36,"title":"HUEVOS DE DESAYUNO Y TOMATES Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":39,"text":"HUEVOS DE DESAYUNO Y TOMATES\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 24 minutos\nPorciones: 4 personas\nINGREDIENTES\nPizca de sal\nPimienta al gusto\n4 huevos\n4 tomates grandes\nPREPARACIÓN\nCorta la parte superior de los tomates, quita las semillas y la pulpa con una\ncucharilla, e incorpora los huevos a cada tomate colocándolos en la sartén,\nintroduce la misma en la freidora de aire.\nCOCINAR HUEVOS DE DESAYUNO Y TOMATES\nCalienta la sartén de la freidora de aire seleccionando el modo de cocción\nhorno, ajusta la temperatura a 190°C, comienza a cocinar por 24 minutos.\nAñade sal y pimienta al gusto"},{"id":37,"title":"TORTILLAS Y PANCETAS DE PERRITOS CALIENTES Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":40,"text":"TORTILLAS Y PANCETAS DE PERRITOS\nCALIENTES\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 10 minutos\nPorciones: 2 personas\nINGREDIENTES\n100 g de panceta picada\n2 salchichas picadas\n4 huevos\n¼ cdta de romero seco\n½ cdta de perejil seco\n2 cebollas picadas\nPREPARACIÓN\nEn un tazón, coloca los huevos y todos los demás ingredientes, el tocino\npicado, las hojas de romero seco, las salchichas picadas, el perejil seco y la\ncebolla picada, mezcla bien y coloca en la bandeja para hornear.\nCOCINAR TORTILLAS Y PANCETAS DE PERRITOS CALIENTES\nPrecalentada la freidora de aire, selecciona el ajuste de la temperatura a\n160°C, modo freír, coloca el tiempo durante 10 minutos. Retira y sirve."},{"id":38,"title":"TORTILLA DE SALCHICHA Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":41,"text":"TORTILLA DE SALCHICHA\nDificultad: Fácil\nTiempo de preparación: 7 minutos\nTiempo de cocción: 10 minutos\nPorciones: 2 personas\nINGREDIENTES\n2 salchichas picadas\n1 ½ puerros picados\n1 pieza pequeña de tocino en rodajas\n4 huevos\nPREPARACIÓN\nEn un recipiente, agrega la salchicha picada, los puerros picados, el tocino\nen rodajas, los huevos, mezcle todos los ingredientes, vierta en la freidora\nde aire para hornear el plato, luego póngalo en la freidora.\nCOCINAR TORTILLA DE SALCHICHA\nCaliente la sartén seleccionando el modo de freidora de aire, ajuste la\ntemperatura a 160°C y pon el tiempo durante 10 minutos para su\npreparación."},{"id":39,"title":"TORTILLA DE PEPPERONI Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":42,"text":"TORTILLA DE PEPPERONI\nDificultad: Fácil\nTiempo de preparación: 6 minutos\nTiempo de cocción: 12 minutos\nPorciones: 2 personas\nINGREDIENTES\n2 ½ cda de leche\n4 huevos\n15 rodajas de pepperoni\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nEn un recipiente mediano agregar cucharadas de leche, los huevos, las\nrodajas de pepperoni, sal y pimienta negra molida. Combina todos los\ningredientes, vierte en una bandeja para hornear, transfiere a la sartén de la\nfreidora de aire.\nCOCINAR TORTILLA DE PEPPERONI\nColoca la sartén seleccionando el modo freír, programa la temperatura a\n180°C y la duración a 5 minutos, para precalentar. Coloca la sartén y fríe al\naire durante 12 minutos. Retira y sirve."},{"id":40,"title":"BUÑUELOS DE CALABACÍN Dificultad: Media","category":"Desayunos","source":"365 recetas sin aceite","page":43,"text":"BUÑUELOS DE CALABACÍN\nDificultad: Media\nTiempo de preparación: 9 minutos\nTiempo de cocción: 7 minutos\nPorciones: 4 personas\nINGREDIENTES\n300 g de calabacín\n250 g de queso mozzarela\n3 huevos\n35 g de harina para todo uso\n1 ½ cdta de eneldo seco\nSal\nPimienta negra al gusto\nPREPARACIÓN\nEn un envase, agrega los calabacines cortados, el queso mozzarela, los\nhuevos, la harina para todo uso, coloca el eneldo seco, la sal y pimienta\nnegra al gusto, incorpora todos los ingredientes, haz unas tortas con la\nmezcla.\nCOCINAR BUÑUELOS DE CALABACÍN\nPrecalienta la sartén eligiendo el modo horneado, programa la temperatura a\n180°C, y el tiempo a 5 minutos. Después pon las masas en la sartén de aire\ny hornea por 7 minutos. Retira y sirve."},{"id":41,"title":"HUEVOS REVUELTOS CON TOMATE Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":44,"text":"HUEVOS REVUELTOS CON TOMATE\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 7 minutos\nPorción: 1 persona\nINGREDIENTES\n3 huevos\n3 cda de mantequilla\n100 g de queso\n2 tomates, limpios, sin semilla y cortados en trozos\nPREPARACIÓN\nCon la mantequilla impregna la bandeja de la freidora. En un bol mezcla\ntodos los ingredientes, incluyendo los huevos. Transfiere a la bandeja.\nCOCINAR HUEVOS REVUELTOS CON TOMATE\nCon la temperatura fijada en 150°C, el temporizador en 5 minutos y en\nmodo freír, inicia el proceso de cocción, luego de finalizado sirve."},{"id":42,"title":"SALCHICHAS ENVUELTAS Dificultad: Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":45,"text":"SALCHICHAS ENVUELTAS\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 7 minutos\nPorciones: 2 personas\nINGREDIENTES\n250 g de queso mozzarella\n10 salchichas\n10 unidades de masa enrollada en media luna\nPREPARACIÓN\nPon la masa, colocando el queso en una punta de esta, luego colocas la\nsalchicha y enrollas, tomando en cuenta el colocarle un palillo para darle\nvueltas y envoltura de salchicha, ya terminado el procedimiento colócalas\nen la bandeja de hornear de la freidora de aire.\nCOCINAR SALCHICHAS ENVUELTAS\nPon a calentar la freidora de aire en el modo hornear, colocando la\ntemperatura a 190°C y el temporizador a 5 minutos, procede a hornear\ndurante 7 minutos. Finalizada la cocción, retira y sirve."},{"id":43,"title":"ZANAHORIA CRUJIENTE Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":46,"text":"ZANAHORIA CRUJIENTE\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 12 minutos\nPorciones: 2 personas\nINGREDIENTES\n1 ½ cda de aceite de oliva\n5 zanahorias en rodajas\n2 ½ cdta de sal\nPREPARACIÓN\nIncorporando en un molde agrega el aceite de oliva, la sal, vertiéndosela\nsobre la zanahoria ya rebanada en rodajas, colocar en el molde de freír,\ncoloca todos los ingredientes ya incorporados y mezclados previamente en\nla sartén de la freidora de aire.\nCOCINAR ZANAHORIA CRUJIENTE\nEn modo freír, cocina durante 12 minutos, colocándole la temperatura a\n180°C. Finalizado el proceso, retira y sirve."},{"id":44,"title":"SALCHICHAS DE VERANO Dificultad: Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":47,"text":"SALCHICHAS DE VERANO\nDificultad: Media\nTiempo de preparación: 9 minutos\nTiempo de cocción: 4 horas\nPorciones: 6 personas\nINGREDIENTES\n3 cdta de pimienta negra molida\n2 k de carne de venado molida\n4 cdta de sal\n3 cdta de semillas de mostaza\n1 ½ cdta de humo líquido\n2 ½ cdta de sal\n3 cdta de ajo\n1 ½ cdta de sal de nogal\nPREPARACIÓN\nEn un envase, incorpora la carne de venado molida, las semillas de mostaza,\nla pimienta negra y el humo líquido, añade la sal, el ajo y la sal de nogal,\ncorta en 6 porciones y haz con los ingredientes ya mezclados un rollo, el\ncual se va a cortar en seis partes iguales.\nCOCINAR SALCHICHAS DE VERANO\nColócalas en la freidora de aire, ajusta en la función de asar al aire, cocina\ndurante 4 horas a 65°C. Retira y sirve."},{"id":45,"title":"ALBÓNDIGAS DE VENADO Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":48,"text":"ALBÓNDIGAS DE VENADO\nDificultad: Fácil\nTiempo de preparación: 10 minutos\nTiempo de cocción: 30 minutos\nPorciones: 4 personas\nINGREDIENTES\n1 cdta de sal\n460 g de carne de venado molida\n1 cdta de nuez moscada\n2 taza de agua\n2 huevos\n135 g de pan rallado\n1 ½ lata de sopa de champiñones\n1 ½ cdta de tomillo\n1 ½ paquete de sopa de cebolla seca\nPREPARACIÓN\nIncorpora en un envase la sal, la carne, la nuez moscada, el huevo y el\ntomillo, haz pequeñas bolas con todos los ingredientes, pásalas por el pan\nrallado, coloca luego las albóndigas en la sartén de la freidora de aire.\nCOCINAR ALBÓNDIGAS DE VENADO\nPrograma en la función de freír al aire, luego inicia el proceso por 30\nminutos a 180°C. Retira y sirve."},{"id":46,"title":"SALCHICHA DE JAMÓN AHUMADO Dificultad: Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":49,"text":"SALCHICHA DE JAMÓN AHUMADO\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 15 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 cdta de salvia Cayena\n1 ½ cdta de tomillo\n2 kg de carne de venado\n2 cdta de sal\n2 kg de jamón ahumado\n2 cdta de pimienta molida\n240 g de tocino\nPREPARACIÓN\nEn un recipiente, incorpora la carne de venado, el tomillo, la salvia, la\npimienta molida, la sal y la cayena, corta las carnes en trozos medianos,\ncuadrados. Incorporados ya todos los ingredientes, colócalos en la bandeja\nde la freidora de aire, dándole la forma alargada.\nCOCINAR SALCHICHA DE JAMÓN AHUMADO\nColoca la en la sartén de la freidora de aire, prográmala en la función de\nasar, durante 15 minutos a 200°C. Retira y sirve."},{"id":47,"title":"PAN DE CARNE DE VENADO Dificultad: Media","category":"Postres","source":"365 recetas sin aceite","page":50,"text":"PAN DE CARNE DE VENADO\nDificultad: Media\nTiempo de preparación: 9 minutos\nTiempo de cocción: 60 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 Cebollas picadas\n460 g de salchicha de cerdo molida\n300 ml de leche\n3 huevos\n235 ml de salsa barbacoa\n250 g de migas de galleta\n500 g de carne de venado molida\nPREPARACIÓN\nEn un envase incorpora las migas de galleta bien trituradas, la leche, el\nvenado molido y la salsa barbacoa, añade las salchichas, los huevos y las\ncebollas, colocar todos los ingredientes previamente incorporados en la\nsartén.\nCOCINAR PAN DE CARNE DE VENADO\nPrograma la freidora de aire en función de freír con aire, procede con la\ncocción durante 1 hora a 180°C. Luego de finalizado, retira y sirve."},{"id":48,"title":"CODORNIZ A LA PARRILLA Dificultada: Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":51,"text":"CODORNIZ A LA PARRILLA\nDificultada: Fácil\nTiempo de preparación: 50 minutos\nTiempo de cocción: 45 minutos a 1 hora\nPorciones: 4 personas\nINGREDIENTES\n180 g de carne de codorniz\n300 ml de caldo de verduras\n25 g de tiras de tocino\nSalsa Worcestershire\nPimienta negra molida al gusto\nSal\nRelleno al gusto\nPREPARACIÓN\nCortar en presas las codornices, rosear pimienta y sal al gusto sobre las\ncodornices, añadir el relleno y el caldo, envolver la codorniz y la tira de\ntocino juntas, rociar con la salsa Worcestershire, colócalo en la sartén de la\nfreidora de aire.\nCOCINAR CODORNIZ A LA PARRILLA\nEn función asar, temperatura a 200°C, durante 15 minutos. Repite el\nprocedimiento, dándole vueltas. Revisar previamente que estén bien\ncocidas. Retirar y servir."},{"id":49,"title":"PUDÍN DE PAN DE CANELA Dificultad: Media","category":"Postres","source":"365 recetas sin aceite","page":52,"text":"PUDÍN DE PAN DE CANELA\nDificultad: Media\nTiempo de preparación: 9 minutos\nTiempo de cocción: 60 minutos\nPorciones: 8 personas\nINGREDIENTES\n4 huevos\n1 ½ cda de vainilla\n800 ml de leche entera\n4 yemas de huevo\n2 ½ cdta de canela\n8 ½ cda de mantequilla\n150 g de pan francés cortado en cubos\n230 g de azúcar\nPREPARACIÓN\nIncorpora la leche y la mantequilla, introdúcelos en el microondas por 2\nminutos, bate el huevo aparte en un envase, agregándole la canela, el\nazúcar, los huevos, la vainilla, combina con la leche, añade los cubos de pan\nseco, remueve bien hasta que el pan esté empapado con los líquidos ya\nintegrados, coloca todos los ingredientes previamente mezclados en un bol.\nCOCINAR PUDIN DE PAN DE CANELA\nIntroduce la sartén de la freidora de aire con el bol, programándola en\ntostado, cocina 60 minutos a 130°C. Retira y sirve."},{"id":50,"title":"PAN DE QUESO Dificultad: Media","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":53,"text":"PAN DE QUESO\nDificultad: Media\nTiempo de preparación: 8 minutos\nTiempo de cocción: 8 minutos\nPorciones: 4 personas\nINGREDIENTES\n6 dientes de ajo\n250 g de queso mozzarella\n10 rodajas de pan\n8 cdta de tomates secos\n6 cda de mantequilla\nPREPARACIÓN\nColoca las rodajas de pan en una superficie plana como una bandeja, coloca\nla mantequilla derretida, el ajo y la pasta de tomate, el queso, úntalo al pan\nllevándolo a la sartén.\nCOCINAR PAN DE QUESO\nColocando la programación de la freidora de aire en función de tostado,\ndeja cocinar durante 8 minutos a 180°C. Luego de finalizado el proceso,\nretira y sirve."},{"id":51,"title":"HUEVOS AL HORNO Dificultad: Fácil","category":"Postres","source":"365 recetas sin aceite","page":54,"text":"HUEVOS AL HORNO\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 20 minutos\nPorciones: 6 personas\nINGREDIENTES\nAceite en Aerosol para cocinar\n16 huevos\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nUnta un molde para muffins con aceite en Aerosol para cocinar, colocando\nun huevo en cada orificio del molde y asegúrate de no romper la yema.\nIntroduce el molde para muffins en la rejilla para pizzas.\nCOCINAR HUEVOS AL HORNO\nSelecciona horneado y coloca la temperatura a 175°C y el temporizador a\n20 minutos. Observando si los huevos están cocidos introduciendo\ndelicadamente la punta de un palillo por un huevo, si ya se comprobó que\nestán listos, colócale la sal y pimienta deseada. Retira y sirve."},{"id":52,"title":"HUEVOS REVUELTOS Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":55,"text":"HUEVOS REVUELTOS\nDificultad: Fácil\nTiempo de preparación: 7 minutos\nTiempo de cocción: 7 minutos\nPorciones: 1 persona\nINGREDIENTES\n3 huevos\n3 cda mantequilla\n60 g de queso mozzarela\n2 tomates pequeños\nPREPARACIÓN\nUnta la bandeja del horno con la mantequilla, en un envase ve añadiendo\nlos huevos, las cucharadas de mantequilla derretida, el queso, el tomate.\nIncorpora todos los ingredientes, vierte todos los ingredientes, ya\nmezclados, en la bandeja de la freidora de aire.\nCOCINAR HUEVOS REVUELTOS\nCalienta la freidora de aire en el modo de freír, colocando la temperatura a\n145°C, programa el tiempo a 5 minutos para precalentar. Procede luego en\nfreír al aire durante 7 minutos todo el compuesto preparado anteriormente.\nRetira y sirve."},{"id":53,"title":"CAZUELA DE HUEVOS CON SALCHICHA Y CHAMPIÑON Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":56,"text":"CAZUELA DE HUEVOS CON SALCHICHA Y\nCHAMPIÑON\nDificultad: Fácil\nTiempo de preparación: 16 minutos\nTiempo de cocción: 40 minutos\nPorciones: 8 personas\nINGREDIENTES\nAceite en Aerosol comestible\n360 g de salchicha de cerdo\n2 cda de mantequilla\n250 g de champiñones cortados en rodajas finas\n14 huevos\n130 ml de leche entera\n2 cda de sal\n1 cda de pimienta negra\n250 g de queso cheddar, rallado\nPREPARACIÓN\nUnta una bandeja de horno con aceite en Aerosol comestible, coloca dos\nhojas de papel de cocina en una bandeja, reservada para escurrir las\nsalchichas, cocina estas en una sartén a fuego medio-alto durante 7 minutos\no hasta que se doren, rebana las salchichas en trozos a tu gusto, luego\ntransfiere las salchichas cocidas al envase con toallas de papel. Añade\nmantequilla a la sartén y cocina los champiñones previamente cortados, por\nunos 6 minutos, hasta que se hayan dorado y deshidratados. Bate los\nhuevos, la leche, la sal y la pimienta en un envase, añade la salchicha"},{"id":54,"title":"cocida, los champiñones y cubre con el queso, mezcla hasta que todo esté","category":"Desayunos","source":"365 recetas sin aceite","page":57,"text":"cocida, los champiñones y cubre con el queso, mezcla hasta que todo esté\nbien integrado.\nCOCINAR CAZUELA DE HUEVOS CON SALCHICHA Y\nCHAMPIÑON\nAgrega todo en la bandeja y colócalo en la rejilla para pizzas de la freidora\nde aire, programando hornear, coloca la temperatura a 180°C por 40\nminutos. Cuando esté lista, comprueba si está totalmente cocida a tu gusto.\nRetira y sirve."},{"id":55,"title":"CAZUELA DE HUEVOS CON SALCHICHA Y QUESO Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":58,"text":"CAZUELA DE HUEVOS CON SALCHICHA Y\nQUESO\nDificultad: Fácil\nTiempo de preparación: 5 minutos\nTiempo de cocción: 45 minutos\nPorciones: 10 personas\nINGREDIENTES\nAceite en Aerosol comestible\n400 g de salchicha de cerdo\n16 huevos\n150 ml de leche entera\n1 cda de sal\n1 cda de pimienta negra\n300 g de queso cheddar, rallado\nPREPARACIÓN\nUnta una bandeja con aceite en Aerosol para cocinar comestible y colocar\ndos hojas de papel de cocina en una bandeja y reservar, para escurrir las\nsalchichas, cocina las salchichas en una sartén a fuego lento por 7 minutos,\no hasta que se dore, corta las salchichas en trozos, transfiere estas a la\nbandeja con toallas de papel, revuelva los huevos, leche, sal y la pimienta\nen un envase, añade la salchicha y cubre con queso, incorpora hasta que\ntodo esté bien distribuido.\nCOCINAR CAZUELA DE HUEVOS CON SALCHICHA Y QUESO"},{"id":56,"title":"CAZUELA DE HUEVOS CON ESPINACAS Y ALCACHOFA Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":60,"text":"CAZUELA DE HUEVOS CON ESPINACAS Y\nALCACHOFA\nDificultad: Fácil\nTiempo de preparación: 10 minutos\nTiempo de cocción: 45 minutos\nPorciones: 8 personas\nINGREDIENTES\nAceite en Aerosol para cocinar\n1 ½ cda de aceite de oliva\n220 g de espinacas\n450 g de alcachofas de lata\n14 huevos\n1 cebolla picada\n160 g de crema agria\n2 cda de ajo en polvo\n2 cda de sal\n2 cda de pimienta negra\n200 g de queso mozzarella rallado\nPREPARACIÓN\nUnta una bandeja para hornear con aceite en Aerosol para cocinar, caliente\nel aceite de oliva en una sartén a fuego medio, agregando las espinacas y\nsaltea durante 2 minutos, agrega las alcachofas para ir cociéndolas durante\n1 minuto más, luego en un envase, incorpora los huevos, cebollas picadas,\ncrema agria, ajo, sal y la pimienta, incorpora las espinacas salteadas, las\nalcachofas ya escurridas y el queso, ve distribuyendo bien los ingredientes."},{"id":57,"title":"COCINAR","category":"Desayunos","source":"365 recetas sin aceite","page":61,"text":"COCINAR\nCAZUELA\nDE\nHUEVOS\nCON\nESPINACAS\nY\nALCACHOFA\nColoca la rejilla para pizza de la freidora de aire para introducir la sartén,\najústalo en la función de horneado, a la temperatura de 180°C, colocando el\ntemporizador en 45 minutos. Luego de finalizado el proceso de cocción,\nretira y sirve."},{"id":58,"title":"MERENGUE DE VAINILLA Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":62,"text":"MERENGUE DE VAINILLA\nDificultad: Fácil\nTiempo de preparación: 30 minutos\nTiempo de cocción: 30 minutos\nPorciones: 4 personas\nINGREDIENTES\n5 claras de huevo\n380 g de azúcar\n1 cdta de sal\n½ cdta de vainilla\nPREPARACIÓN\nVe incorporando el azúcar y la sal en un envase, batiendo a velocidad media\nlas claras en un bol, hasta que estén a punto de nieve, formando picos\nsuaves, ve incorporando poco a poco el azúcar, continúa batiendo, añade el\nextracto de vainilla a las mismas, y ve aumentando la velocidad, para que se\nforme más aire dentro de estas y tengan una consistencia más compacta,\npasa las claras a una manga pastelera con punta de estrella, y coloca\npequeños montículos en la bandeja, coloca en tres rejillas de la freidora de\naire forradas previamente con papel pergamino.\nCOCINAR MERENGUE DE VAINILLA\nColócalas en los tres niveles de estantes, presiona el encendido, después la\nfunción del deshidratador, coloca la temperatura a 75°C, el temporizador en\n30 minutos. Procede a la cocción, al terminar deja reposar y sirve."},{"id":59,"title":"BOLAS DE ARROZ A LA CAZUELA Y JUDÍAS VERDES Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":63,"text":"BOLAS DE ARROZ A LA CAZUELA Y JUDÍAS\nVERDES\nDificultad: Fácil\nTiempo de preparación: 14 minutos\nTiempo de cocción: 30 minutos\nPorciones: 4 personas\nINGREDIENTES\n135 g de ricotta de leche entera\n80 g de crema de champiñones\n3 huevos batidos\n150 g de cebollas fritas\n235 g de arroz para sushi, cocido\nSal\nPimienta negra molida al gusto\n260 g de harina para todo uso\n230 g de queso mozzarella\n450 g de judías verdes cortadas (lata)\nPREPARACIÓN\nEn un envase, coloca la mozzarella, el arroz, el requesón, la crema de\nchampiñones y las judías verdes cortadas, incorpora los ingredientes\nremoviéndole, colocarle la sal y pimienta, introdúcele el relleno ligeramente\nsalado, para que el arroz tome su sabor, llévalo a refrigerar durante 30\nminutos aproximadamente. Previamente reserva las cebollas fritas en una\nbolsa de plástico, y después las colocarás cortadas en trozos, poniéndolas en\nun recipiente poco profundo. Acomoda la mezcla de arroz en bolas, del"},{"id":60,"title":"tamaño de una de billar, sumérgelas en harina, luego en el huevo y pásalas","category":"Desayunos","source":"365 recetas sin aceite","page":64,"text":"tamaño de una de billar, sumérgelas en harina, luego en el huevo y pásalas\npor los pedazos de cebolla, introdúcelas en la freidora de aire.\nCOCINAR BOLAS DE ARROZ A LA CAZUELA Y JUDÍAS\nVERDES\nAjusta a 190°C, en modo freír, hasta que se doren completamente.\nProgramando para 30 minutos, espera a que finalice el proceso y sirve."},{"id":61,"title":"ROLLO DE TERNERA Y JUDÍAS Dificultad: Media","category":"Desayunos","source":"365 recetas sin aceite","page":65,"text":"ROLLO DE TERNERA Y JUDÍAS\nDificultad: Media\nTiempo de preparación: 4 minutos\nTiempo de cocción: 16 minutos\nPorciones: 4 personas\nINGREDIENTES\n500 g de carne de ternera molida y cocida\n4 claras de huevo\n2 dientes de ajos picados\n100 g de judías\n60 g de tomates picados\n150 g de guisantes\n1 zanahoria\nSal\nPimienta negra al gusto\nPREPARACIÓN\nHierve: las judías verdes, los guisantes y las zanahorias cortadas en\ncuadritos. Cuando estas estén cocidas, escurre y reserva. Pon la carne en un\nbol y añade las claras de huevo, el ajo, el perejil, el pan rallado, la sal y la\npimienta. Remueve hasta obtener un compuesto uniforme. Extiende la\nmezcla sobre papel de horno y forma un rectángulo de unos 2 cm de\nespesor. Coloca las verduras sobre la carne, y envuelve la carne con el\npapel, y pon los extremos sellados. Transfiere los rollos a una fuente para\nhornear, forrada con papel de horno para evitar que se pegue y cubre con\npapel de aluminio."},{"id":62,"title":"COCINAR ROLLO DE TERNERA Y JUDÍAS","category":"Carnes y aves","source":"365 recetas sin aceite","page":66,"text":"COCINAR ROLLO DE TERNERA Y JUDÍAS\nPrecalienta el horno a 200°C y cocina durante 45 minutos. Tapa y continúa\ncocinando por otros 15 minutos más. Deja que la carne se enfríe, luego\ncórtala en rodajas finas. Lo puedes servir con tomates picados, perejil y sal."},{"id":63,"title":"CERDO Y JUDÍAS VERDES Dificultad: Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":67,"text":"CERDO Y JUDÍAS VERDES\nDificultad: Fácil\nTiempo de preparación: 5 minutos\nTiempo de cocción: 15 minutos\nPorciones: 4 personas\nINGREDIENTES\n30 g de harina todo uso\n25 g de queso parmesano rallado\n1 cdta de pimentón\n1 cdta de ajo en polvo\n4 chuletas de cerdo\n300 g de judías verdes, recortadas y cocidas al vapor\nAceite en aerosol para cocinar\nPREPARACIÓN\nImpregna la bandeja con aceite, incorpora los ingredientes, la harina, el\nqueso parmesano rallado, la cucharadita de pimentón, la cucharadita de ajo\nen polvo, reservando las chuletas de cerdo y las judías verdes cocidas al\nvapor, agrégale a las chuletas, aderezando con las especias.\nCOCINAR CERDO Y JUDÍAS VERDES\nCaliente la freidora de aire a una temperatura de 190°C, en modo freír,\ncocina durante 15 minutos, por ambos lados hasta que estén doradas las\nchuletas. Retira y sirve."},{"id":64,"title":"ALCACHOFAS BALSÁMICAS Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":68,"text":"ALCACHOFAS BALSÁMICAS\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 14 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 cdta de vinagre balsámico\n55 ml de aceite de oliva\n1 cdta de orégano\n3 alcachofas grandes cortadas\n1 cda de zumo de limón\n2 dientes de ajo\nPimienta negra al gusto\nSal\nPREPARACIÓN\nColoca las alcachofas con pimienta y sal en un envase, agrégale el aceite y\nañade zumo de limón. Aparte, para la vinagreta, incorpora el ajo, la\npimienta, el vinagre y el aceite en un recipiente, luego añade orégano y la\nsal, bate bien.\nCOCINAR ALCACHOFAS BALSÁMICAS\nIntroduce las alcachofas en la freidora de aire, en modo freír y colocándole\nel temporizador a 7 minutos a 180°C, deja que termine el procedimiento,\nretira y sirve las alcachofas con la vinagreta de balsámico ya preparado\nanteriormente."},{"id":65,"title":"ALCACHOFAS CON QUESO Dificultad: Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":69,"text":"ALCACHOFAS CON QUESO\nDificultad: Fácil\nTiempo de preparación: 5 minutos\nTiempo de cocción: 6 minutos\nPorciones: 5 personas\nINGREDIENTES\n1 ½ cdta de cebolla en polvo\n130 ml de caldo de pollo\n400 g de corazones de alcachofa\n230 g de mozzarella\n130 g de mayonesa\n230 g de queso crema\n300 g de espinacas\n5 dientes de ajo\n260 g de queso parmesano rallado\n140 g de crema agria\nPREPARACIÓN\nIncorpora en un envase la cebolla en polvo, el queso crema, el caldo de\npollo, las alcachofas, la crema agria, la mayonesa y las espinacas, coloca\ntodos los ingredientes en la sartén de la freidora de aire.\nCOCINAR ALCACHOFAS CON QUESO\nPrográmala en la función de freír, programa el temporizador a 6 minutos a\n180°C. Espera que culmine el proceso de cocción, retira y sirve con el\nqueso parmesano, el mozzarela y el queso crema."},{"id":66,"title":"ENSALADA DE REMOLACHA CON ADEREZO DE PEREJIL Dificultad: Fácil","category":"Otros","source":"365 recetas sin aceite","page":70,"text":"ENSALADA DE REMOLACHA CON ADEREZO\nDE PEREJIL\nDificultad: Fácil\nTiempo de preparación: 17 minutos\nTiempo de cocción: 15 minutos\nPorciones: 4 personas\nINGREDIENTES\n5 remolachas\n3 dientes de ajo\n3 cda de vinagre balsámico\n1 cda de alcaparras\n3 cda de perejil picado\n2 ½ cda de aceite de oliva\nPimienta negra molida al gusto\nSal\nPREPARACIÓN\nEn un envase, incorpora la pimienta, el ajo, las alcaparras, la sal y el aceite\nde oliva, lo mezclas todo bien.\nCOCINAR ENSALADA DE REMOLACHA CON ADEREZO DE\nPEREJIL\nIntroduce las remolachas en la sartén, programa la freidora en función freír,\nprogramando el temporizador a 15 minutos y la temperatura 180°C. Espera\nsu cocción. Saca las remolachas de la freidora y colócalas en una superficie"},{"id":67,"title":"ENSALADA DE REMOLACHA Y QUESO AZUL Dificultad: Fácil","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":72,"text":"ENSALADA DE REMOLACHA Y QUESO AZUL\nDificultad: Fácil\nTiempo de preparación: 12 minutos\nTiempo de cocción: 15 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 cda de aceite de oliva\n5 remolachas\n60 g de queso azul\nPimienta negra molida\nSal\nPREPARACIÓN\nIntroduce las remolachas en la sartén, agrégale la pimienta y la sal,\npreparando la freidora en función de freír.\nCOCINAR ENSALADA DE REMOLACHA Y QUESO AZUL\nPrograma el temporizador a 15 minutos, en una temperatura de 180°C, sirve\nen un plato, agrega la pimienta, queso azul, aceite y la sal."},{"id":68,"title":"ENSALADA DE BRÓCOLI Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":73,"text":"ENSALADA DE BRÓCOLI\nDificultad: Fácil\nTiempo de preparación: 13 minutos\nTiempo de cocción: 9 minutos\nPorciones: 4 personas\nINGREDIENTES\n5 dientes de ajo picados\n1 brócoli\n2 cda de vinagre\n2 cda de aceite de oliva\nPimienta negra molida al gusto\nSal\nPREPARACIÓN\nEn un recipiente incorpora el aceite, la sal, el brócoli y la pimienta.\nCOCINAR ENSALADA DE BRÓCOLI\nColoca en la sartén de la freidora de aire en la función de freír, prográmala a\ncocción en 9 minutos a una temperatura de 180°C. Retira y sirve. Presenta\nel brócoli en la ensaladera y añade el aceite de oliva, el vinagre y el ajo."},{"id":69,"title":"COL DE BRUSELAS CON TOMATES CHERRY Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":74,"text":"COL DE BRUSELAS CON TOMATES CHERRY\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 10 minutos\nPorciones: 3 personas\nINGREDIENTES\n8 tomates cherry cortados por la mitad\n1 cda de aceite de oliva\n460 g de coles de Bruselas\n20 g de cebollas verdes picadas\nPimienta negra molida al gusto\nSal\nPREPARACIÓN\nAgrégale la pimienta y la sal sobre a las coles de Bruselas.\nCOCINAR COL DE BRUSELAS CON TOMATES CHERRY\nIncorpora en la sartén de la freidora de aire, programándola en la función de\nfreír, durante 10 minutos a 180°C. En un envase coloca la col cocida;\nincorpora el pimiento, la cebolla verde, la sal, el aceite de oliva y los\ntomates cherry, removiendo bien antes de servir."},{"id":70,"title":"COLES DE BRUSELAS CON QUESO Dificultad: Fácil","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":75,"text":"COLES DE BRUSELAS CON QUESO\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 8 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 zumo de limón\n3 cda de mantequilla\n480 g de coles de Bruselas\n5 cda de parmesano rallado\nSal\nPimienta negra al gusto\nPREPARACIÓN\nLa col de Bruselas incorpórala en la sartén de la freidora de aire. Derrite la\nmantequilla en una sartén a fuego bajo, colócale la pimienta, el zumo de\nlimón y la sal, luego la col de Bruselas y el parmesano, introduce en el\nmolde de la freidora.\nCOCINAR COLES DE BRUSELAS CON QUESO\nPon en la programación el modo de freír, durante 8 minutos, a una\ntemperatura 180°C. Luego de finalizado, retira y sirve."},{"id":71,"title":"COL PICANTE Dificultad: Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":76,"text":"COL PICANTE\nDificultad: Fácil\nTiempo de preparación: 6 minutos\nTiempo de cocción: 8 minutos\nPorciones: 4 personas\nINGREDIENTES\n1 ½ zanahoria rallada\n½ cdta de pimienta de cayena\n65 ml de vinagre de sidra de manzana\n2 coles\n1 ½ cdta de pimienta roja\n1 ½ cda de aceite de sésamo\n70 ml de zumo de manzana\nPREPARACIÓN\nEn un recipiente incorporara la zanahoria, la cayena, la col y el aceite en la\nsartén de la freidora de aire, agrega el vinagre, los copos de pimienta y el\nzumo de manzana.\nCOCINAR COL PICANTE\nPrograma la freidora con la función de freír al aire, programa para una\nduración 8 minutos en una temperatura de 180°C."},{"id":72,"title":"ZANAHORIAS DULCES Dificultad: Fácil","category":"Postres","source":"365 recetas sin aceite","page":77,"text":"ZANAHORIAS DULCES\nDificultad: Fácil\nTiempo de preparación: 9 minutos\nTiempo de cocción: 10 minutos\nPorciones: 4 personas\nINGREDIENTES\n1 ½ cda de azúcar morena\n260 g de zanahorias pequeñas\n1 cda de mantequilla\nPimienta negra molida al gusto\nSal\nPREPARACIÓN\nIncorpora en un recipiente la mantequilla ya derretida, el azúcar, la\npimienta, la zanahoria y la sal, luego pasa los ingredientes a la sartén de la\nfreidora de aire.\nCOCINAR ZANAHORIAS DULCES\nPrograma la función de freír con aire, durante 10 minutos, a una\ntemperatura de 180°C. Finalizado el proceso, retira y sirve."},{"id":73,"title":"MINI PANCAKE Dificultad: Media","category":"Desayunos","source":"365 recetas sin aceite","page":78,"text":"MINI PANCAKE\nDificultad: Media\nTiempo de preparación: 9 minutos\nTiempo de cocción: 10 minutos\nPorciones: 4 personas\nINGREDIENTES\n2 ½ cdta de perejil seco\n4 cda de mantequilla\n160 g de harina de almendras\n2 ½ cdta de albahaca seca\nSal\nPimienta negra al gusto\n4 huevos\nPREPARACIÓN\nIncorpora en un envase la albahaca, harina de almendras, huevos,\nmantequilla, perejil, pimienta y la sal, vierte los ingredientes en un\nrefractario y mételo dentro de la sartén de la freidora de aire engrasada.\nCOCINAR MINI PANCAKE\nPrograma para freír, durante 10 minutos a 200°C. Luego de finalizado,\nretira y sirve."},{"id":74,"title":"BAGEL SIMPLE Dificultad: Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":79,"text":"BAGEL SIMPLE\nDificultad: Fácil\nTiempo de preparación: 18 minutos\nTiempo de cocción: 20-25 minutos\nPorciones: 4 personas\nINGREDIENTES\n150 g de harina\n2 clara de huevo batida\n3 cdta de sal\n2 cdta de levadura en polvo\n260 g de yogur\nPREPARACIÓN\nPara la preparación de la masa incorpora los ingredientes, la harina, las\nclaras de los huevos batida, las cu
