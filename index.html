de oliva\n3 g de sal\n1 g de pimienta negra\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Coloca los floretes de coliflor en un envase, rocía con\naceite de oliva y sazona con sal y pimienta, cubriendo\nlos floretes uniformemente.\n3 Agrega la coliflor a la freidora de aire precalentada.\n15 minutos a 160-170°C\n4 Deja reposar 3 minutos para servir"},{"id":510,"title":"Coliflor Asada con Cúrcuma","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":109,"text":"Coliflor Asada con Cúrcuma\nRINDE 2-3 PORCIONES\n284 g de coliflor\n10 ml de aceite de oliva\n2 g de polvo de cúrcuma\n2 g de ajo en polvo\n1 g de cebolla en polvo\n3 g de sal\n1 g de pimienta negra\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Coloca los floretes de coliflor en un envase, rocía\ncon aceite de oliva hasta que estén cubiertos\nuniformemente.\n3 Mezcla la coliflor con los condimentos.\n4 Agrega la coliflor a la freidora de aire precalentada.\n15 minutos a 160-170°C 5 Deja reposar 3 minutos para\nservir"},{"id":511,"title":"Maíz Asado RINDE 2 PORCIONES","category":"Otros","source":"120 recetas para comer mejor","page":110,"text":"Maíz Asado\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n1 mazorca de maíz, con\ncáscaras y sedas retiradas, y\ncortadas por la mitad\n14 g de mantequilla derretida\n2 g de sal\n1 Preheat\n2 Pasa la mantequilla derretida sobre el maíz y sazona\ncon sal.\n3 Coloca el maíz en la freidora de aire precalentada.\n4 Ajusta el tiempo a 12-15 a 170°C\n5 Asegúrate de agitar las cestas a la mitad de la\ncocción\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":512,"title":"Calabaza Asada RINDE 2-4 PORCIONES","category":"Otros","source":"120 recetas para comer mejor","page":111,"text":"Calabaza Asada\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n1 calabaza, pelada, sin\nsemillas y cortada en cubos\nde 25 mm\n15 ml de aceite de oliva,\nademás de un poco más para\nrociar\n1 g de hojas de tomillo\n6 g de sal\n1 g de pimienta negra\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cubre los cubos de calabaza sazonada con aceite\nde oliva y sazona con tomillo, sal y pimienta.\n3 Agrega la calabaza sazonada a la freidora de aire\nprecalentada.\n4 Ajusta el tiempo a 12-15 a 180°C\n5 Rocía con aceite de oliva cuando termines de cocinar\ny sirve"},{"id":513,"title":"Berenjena Asada RINDE 1-2 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":112,"text":"Berenjena Asada\nRINDE 1-2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n1 berenjena japonesa, cortada\nen rodajas de 13 mm de\nespesor\n30 ml de aceite de oliva\n3 g de sal\n2 g de ajo en polvo\n1 g de pimienta negra\n1 g de cebolla en polvo\n1 g de comino molido\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Corta la berenjena pelada en rodajas de 13 mm de\ngrosor.\n3 Combina el aceite y los condimentos en un tazón\ngrande hasta que estén bien combinados y mezcla la\nberenjena hasta que todas las piezas estén bien\ncubiertas.\n4 Coloca la berenjena en la freidora de aire\nprecalentada y cocina a 205°C durante 12 minutos."},{"id":514,"title":"Pan de Ajo RINDE 4 PORCIONES","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":113,"text":"Pan de Ajo\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n1 baguette francés (305 mm),\ncortado a lo largo y a lo\nancho\n4 dientes de ajo picados\n43 g de mantequilla,\ntemperatura ambiente\n15 ml de aceite de oliva\n10 g de queso parmesano,\nrallado\n8 g de perejil, recién picado\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta el baguette por la mitad a lo largo, luego, divide\ncada pieza a la mitad a lo ancho, creando 4 rebanadas\nde 152 mm de largo.\n2 Preheat\n3 Combina el ajo, la mantequilla y el aceite de oliva\npara formar una pasta.\n4 Extiende la pasta uniformemente en el pan y\nespolvorea con queso Parmesano.\n5 Coloca el pan en la freidora de aire precalentada. 8\nminutos a 190°C 6 Adorna con perejil recién picado\ncuando termines de cocinar."},{"id":515,"title":"Pastelillos de Maíz con Queso RINDE 6 TORTAS","category":"Postres","source":"120 recetas para comer mejor","page":114,"text":"Pastelillos de Maíz con Queso\nRINDE 6 TORTAS\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n60 g de harina todo uso\n79 g de harina de maíz\n38 g de azúcar blanca\n6 g de sal\n7 g de polvo de hornear\n118 ml de leche\n45 g de mantequilla derretida\n1 huevo\n165 g de maíz\n3 cebollines, picados\n120 g de queso cheddar,\nrallado\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina harina, harina de maíz, azúcar, sal y polvo\nde hornear en un tazón y mezcla todo.\n2 Bate la leche, la mantequilla y el huevo hasta que\nestén bien unidos.\n3 Mezcla los ingredientes secos con los ingredientes\nhúmedos. Dobla el maíz, las cebolletas y el queso\ncheddar.\n4 Preheat\n5 Engrasa los moldes para muffins con aceite en\naerosol y coloca la mezcla en los moldes hasta que\nestén a ¾.\n6\nprecalentada.\n7 Ajusta el tiempo a 15 minutos a 170°.\n8 Sirve los muffins con mantequilla o disfrútalos como\nsolos\nAgrega\nlos\nmuffins\na\nla\nfreidora\nde\naire"},{"id":516,"title":"Galletas de Suero de Leche con Cheddar RINDE 4 GALLETAS","category":"Postres","source":"120 recetas para comer mejor","page":115,"text":"Galletas de Suero de Leche con Cheddar\nRINDE 4 GALLETAS\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n5 g de polvo de hornear\n5 g de sal kosher\n4 g de azúcar\n1 g de bicarbonato de sodio\n210 g de harina todo uso, y un\npoco más para rociar\n113 g (1 barra) de mantequilla\nsin sal, refrigerada, cortada\nen trozos de 6 mm\n62 g de queso cheddar,\nrallado\n112 g de suero de leche,\nrefrigerado\nMantequilla, derretida, para\naplicar en la superficie\n1 Mezcla el polvo de hornear, la sal, el azúcar, el\nbicarbonato de sodio y la harina.\n2 Tritura la mantequilla fría utilizando una batidora o\nun procesador de alimentos hasta que quede como\nmigas gruesas.\n3 Mezcla el queso cheddar y el suero de leche hasta\nque se forme una masa. La masa debe estar seca.\n4 Forma la maza en un cuadrado grueso de 13 mm.\n5 Preheat\n6 Corta los panecillos redondos utilizando un cortador\nde galletas.\n7 Coloca papel para hornear en las cestas dentro de la\nfreidora de aire precalentada.\n8 Cepilla los biscochos con la mantequilla derretida y\ncolócalos sobre el papel para hornear.\n9 Cocina las galletas a 180°C durante 12-15 minutos.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":517,"title":"Galletas de Suero de Leche con Cheddar RINDE 2-4 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":116,"text":"Galletas de Suero de Leche con Cheddar\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n284 g de coles de Bruselas,\nreducidas a la mitad\n2 tiras de panceta, cortadas\nen cubitos\n20 ml de aceite de oliva\n2 g de ajo en polvo\nSal y pimienta, al gusto\n5 g de queso parmesano,\nrecién rallado\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Corta los tallos de los coles de Bruselas y luego\ncórtalos por la mitad.\n3 Combina las mitades de los coles de brúcelas, el\naceite de oliva, el ajo en polvo, el sal y la pimienta en\nun tazón.\n4 Agrega la mezcla a la freidora de aire precalentada.\n5 Ajuste el tiempo 10-12 minutos a 170°C.\n6 Ralla queso parmesano para adornar y sirve."},{"id":518,"title":"CHURROS DE CHOCOLATE RINDE 16 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":118,"text":"CHURROS DE CHOCOLATE\nRINDE 16 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n2 tazas de agua\n2 cucharadas de azúcar\n1 cucharadita de café de sal\n1 cucharada de sopa de\naceite\n2 tazas de harina\n2 cucharadas de sopa de\nchocolate en polvo\n1/2 taza de azúcar mezclada\ncon 1 cucharada rasa de\ncanela en polvo para\nespolvorear\nEl dulce de leche para llenar\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 En un bol poner el agua, el azúcar, la sal y el aceite,\nllevar a fuego alto hasta que hierva. Cuando hierva,\nverter la harina mezclada con el chocolate una vez\ntodavía en el fuego encendido y mezclar rápidamente\ncon una cuchara de madera hasta la masa se queda\nhomogénea. Apagar el fuego y dejar enfriar la masa.\n2 Coloque la masa aún caliente en una máquina de\nchurros y les modelar con unos 6 cm de longitud y\npincelar con aceite. Reserva. Si no tiene máquina de\nchurros utilizar una manga pastelera con un pico más\nabierto, pero no va quedar con el agujero en el centro\npara llenar.\n3 Precalentar\n4 Coloque la mitad de los churros en la cesta de la\nAirfryer y establecer el tiempo de 15 minutos a 200°.\nGire en la mitad del tiempo.\n5 Todavía caliente, pasarlos en la mezcla de azúcar y\ncanela y luego rellenar con el dulce."},{"id":519,"title":"PETIT GATEAU RINDE 12 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":119,"text":"PETIT GATEAU\nRINDE 12 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 8\nminutos\n200 g de chocolate semidulce\n2 cucharadas de mantequilla\n1 cucharada de azúcar\n2 cucharadas de harina de\ntrigo\n2 huevos\n2 yemas de huevo\nEl chocolate en polvo para\nespolvorear\n12 moldes de silicona o\naluminio untado y\nespolvoreado con cacao en\npolvo\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Precalentar\n2 Batir los huevos y las yemas de huevo con el azúcar en\nla batidora hasta que se queden bien clara. Añadir el\nchocolate y la harina fundido, mezclando con una\nespátula. Llenar 2/3 de cada molde con la masa.\n3 Coloque 6 moldes individuales en la cesta de la\nAirfryer. Ajuste el tiempo de siete minutos en moldes de\nsilicona y moldes de metal 8 a 10 minutos a 200°C, y\npulse el botón de encendido. En la mitad del tiempo\nverifique para acompañar si ya están con la superficie\ndorada. El Petit gateau no debe quedar totalmente\nhorneado para que el chocolate se derretía en el\ncentro. Retire los moldes con la ayuda de una espátula\ny repita con las otras 6 moldes individuales.\n4 Desmoldar todavía caliente con la ayuda de un\ncuchillo y colocar directamente en un plato hondo. Debe\nir acompañado con helado de vainilla y jarabe de\nchocolate."},{"id":520,"title":"Rollos de Canela RINDE 8-10 ROLLOS DE CANELA","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":120,"text":"Rollos de Canela\nRINDE 8-10 ROLLOS DE CANELA\nTIEMPO DE PREPARACIÓN: 1\nhora 20 minutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\nCREMA GLASEADO\n120 g de queso crema,\ntemperatura ambiente\n120 g de azúcar glas\n114 g de mantequilla sin sal,\ntemperatura ambiente\n3 ml de extracto de vainilla\nROLLOS DE CANELA\n237 ml de leche caliente\n57 g de mantequilla sin sal,\nderretida\n50 g de azúcar blanco\n½ paquete de levadura seca\nactiva\n280 g de harina todo uso, un\npoco más para empolvar\n2 g de polvo de hornear\n6 g de sal\n57 g de mantequilla sin sal\nablandada\n100 g de azúcar morena\noscura\n7 g de canela molida\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla todos los ingredientes congelados hasta que\nno haya grumos. Deja de un lado. 2 Combina la leche\ntibia, la mantequilla derretida, el azúcar blanco y la\nlevadura seca activa en un tazón grande y deja\nreposar por 1 minutos. 3 Mezcla en 240 g de harina\ntodo uso hasta que esté todo bien combinado. Cubre\ndurante 1 hora y coloca la mezcla en un área cálida. 4\nMezcla la harina restante, el polvo de hornear y la sal.\n5 Amasa la masa en una superficie enharinada y\nextiéndela hasta que tenga un espesor de 6 mm. 6\nExtiende la mantequilla blanda sobre la masa y\nespolvorea con azúcar morena y canela. 7 Pasa el\nrodillo por la masa con fuerza, empezando por el\nborde blanco hasta que se forme una masa larga. 8\nCorta la masa en rebanadas de 25 a 38 mm y\ncolócalas en una sartén con mantequilla y cubre con\nuna toalla durante 30 minutos. 9 Preheat 10 Coloca\nlos roles de canela en papel para hornear y en la\nfreidora de aire precalentada. 11 Cocina los roles de\ncanela a 170°C durante 12 minutos. 12 Extiende el\nglaseado de queso crema encima cuando termines de\ncocinar"},{"id":521,"title":"Suflé de Chocolate RINDE 2 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":121,"text":"Suflé de Chocolate\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 13-15\nminutos\nMantequilla, para engrasar\nAzúcar, para recubrimiento\n85 g de chocolate agridulce,\npicado\n28 g de mantequilla sin sal\n2 huevos, yemas separadas de\nlas claras\n3 ml de extracto puro de\nvainilla\n18 g de harina todo uso\n36 g de azúcar\nAzúcar en glas, para\nespolvorear\n1 Engrasa dos moldes de 170 g con mantequilla.\nEspolvorea azúcar en los moldes y sacúdelos para\nextender el azúcar. Elimina al final el exceso de azúcar.\n2 Derrite el chocolate y la mantequilla juntos en el\nmicroondas en intervalos de 30 segundos hasta que el\nchocolate esté totalmente derretido, lo que tardará de\n30 segundos a 1 minuto.\n3 Bata las yemas de huevo y el extracto de vainilla\nvigorosamente en el chocolate derretido para que\nqueden bien mezclados. Agrega harina hasta que no\nqueden grumos y deje enfriar.\n4 Bata las claras de huevo en un tazón grande con una\nbatidora eléctrica a velocidad media hasta que queden\ncomo nubes. 5 Agrega el azúcar, poco a poco, y\ncontinúa batiendo a velocidad media e incrementa la\nvelocidad hasta que la mezcla quede rígida. Deja de\nlado.\n6 Preheat\n7 Revuelve alrededor de ½ taza de claras en la mezcla\nde chocolate para aclararlo. Luego, agrega la mezcla\nde\nchocolate\na\nlas\nclaras\nrestantes,\nbatiendo\nsuavemente, pero con consistencia.\n8 Coloca la masa en los moldes y colócala en la\nfreidora de aire precalentada.\n9 Hornea los suflés a 170°C durante 13-15 minutos.\n10 Espolvorea los suflés con azúcar en polvo y sirve de\ninmediato\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":522,"title":"Pan de Plátano y Nuez RINDE 1 PAN PEQUEÑO","category":"Desayunos","source":"120 recetas para comer mejor","page":122,"text":"Pan de Plátano y Nuez\nRINDE 1 PAN PEQUEÑO\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 40\nminutos\n28 g de mantequilla sin sal,\nablandada\n100 g de azúcar 1 huevo,\nbatido\n2 plátanos maduros en puré\n2 ml de extracto puro de\nvainilla\n20 g de harina todo uso\n3 g de bicarbonato de sodio\n2 g de sal\n40 g de nueces picadas\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la mantequilla con el azúcar.\n2 Mezcla los huevos, el puré de plátano y la vainilla.\nDeja de lado.\n3 Preheat\n4 Tamiza la harina, el bicarbonato de sodio y la sal.\n5 Une los ingredientes secos en los húmedos hasta que\nse combinen. Mezcla luego las nueces picadas.\n6 Engrasa 1 molde para mini panes con aceite en\naerosol y llénalo con la mezcla. Coloca en la freidora de\naire precalentada.\n7 Ajusta a 40 minutos a 160°C"},{"id":523,"title":"Mini Pasteles de Manzana RINDE 2 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":123,"text":"Mini Pasteles de Manzana\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 manzana mediana, pelada y\ncortada en cubos, en trozos\ndel tamaño de un bocado\n18 g de azúcar granulada\n18 g de mantequilla sin sal\n2 g de canela molida\n1 g de nuez moscada molida\n1 g de pimienta de Jamaica\nmolida\n1 hoja de masa de pastel\nprefabricada\n1 huevo batido\n5 ml de leche\n1 Combina las manzanas cortadas en cubitos, la azúcar\ngranulada, la mantequilla, la canela, la nuez moscada y\nla pimienta de Jamaica en una cacerola mediana o en\nun sartén a fuego medio-bajo.\n2 Cocina a fuego lento durante 2 minutos y retire del\nfuego.\n3 Permite que las manzanas se enfríen, descubiertas a\ntemperatura ambiente durante 30 minutos.\n4 Corta la masa para pastel en círculos de 127 mm.\n5 Agrega el relleno al centro de cada círculo y usa el\ndedo para aplicar agua a los extremos externos. Se\ndejará algo de relleno sin usar.\n6 Cierra el pastel corta una pequeña abertura en la\nparte superior.\n7 Preheat\n8 Mezcla los huevos y la leche y pasa la mezcla sobre\ncada pie.\n9\nprecalentada y cocina a 180°C durante 12 minutos\nhasta que los pasteles se doren. Voltea a mitad de\ntiempo\nColoca\nlos\npasteles\nen\nla\nfreidora\nde\naire\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":524,"title":"Tarta de Pera Rústica con Nueces RINDE 4 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":124,"text":"Tarta de Pera Rústica con Nueces\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 1\nhora 10 minutos\nTIEMPO DE COCCIÓN: 45\nminutos\nTARTA\n100 g de harina todo uso\n1 g de sal\n12 g de azúcar granulada\n84 g de mantequilla sin sal,\nfría, cortada en trozos de\n13 mm\n30 ml de agua, helada\n1 huevo, batido\n12 g de azúcar turbinado\nAceite en aerosol\nantiadherente\n20 g de miel\n5 ml de agua\nNueces tostadas, picadas,\npara decorar\nRELLENO\n1 pera grande, pelada, picada\nen rodajas finas\n5 g de almidón de maíz\n24 g de azúcar morena\n1 g de canela molida Una sal\npizca\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla 90 g de harina, sal y azúcar granulada en un\ntazón grande hasta que estén bien combinados.\n2 Une la mantequilla a la mezcla usando una batidora\nde pastelería o un procesador de alimentos hasta que\nse formen migas gruesas.\n3 Agrega agua fría y mezcla hasta que se una.\n4 Forma la masa en un tazón, cubre con plástico y\ndeja enfriar en el refrigerador durante 1 hora.\n5 Mezcla los ingredientes del relleno en un tazón\nhasta que estén combinados.\n6 Pasa un rodillo por tu masa enfriada hasta que\ntenga 216 mm de diámetro.\n7 Agrega 10 g de harina en la parte superior de la\nmasa dejando 38 mm sin harina.\n8 Coloca las rodajas de pera en círculos decorativos\nsuperpuestos en la parte enharinada de la corteza.\nRetira cualquier jugo de pera restante sobre las\nrebanadas. Dobla el borde sobre el relleno.\n9 Cubre los bordes con huevos batidos y espolvorea el\nazúcar sobre toda la tarta. Deja de lado.\n10 Preheat\n11 Rocía la freidora de aire precalentada con aceite en\naerosol y coloca la tarta dentro.\n12 Ajusta el tiempo 45 minutos a 170°C\n13 Mezcla la miel y el agua y pasa la mezcla por la\ntarta cuando termines de cocinar.\n14 Decora con nueces picadas tostadas"},{"id":525,"title":"Biscocho de Limón RINDE 1 PAN PEQUEÑO","category":"Desayunos","source":"120 recetas para comer mejor","page":125,"text":"Biscocho de Limón\nRINDE 1 PAN PEQUEÑO\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 30\nminutos\n120 g de harina todo uso\n4 g de polvo de hornear Una\npizca de sal\n84 g de mantequilla sin sal,\nablandada\n130 g de azúcar granulada\n1 huevo grande\n15 g de jugo de limón fresco\n1 limón, ralladura de limón\n56 g de suero de leche\n1 Mezcla la harina, el polvo de hornear y la sal en un\ntazón. Deja de lado.\n2 Agrega la mantequilla ablandada a una batidora\nelectica y bátela hasta que esté suave y esponjosa.\nAproximadamente 3 minutos.\n3 Bate el azúcar en la mantequilla durante 1 minuto.\n4 Bate la mezcla de harina en la mantequilla hasta que\nesté completamente unida, durante aproximadamente 1\nminuto.\n5 Agrega el huevo, el jugo de limón y la ralladura de\nlimón. Mezcla hasta que todo esté completamente\nunido.\n6 Vierte lentamente el suero de leche mientras mezclas\na velocidad media.\n7 Agrega la mezcla a una bandeja de mini panes\nengrasada en la parte superior.\n8 Preheat\n9 Coloca la torta en la freidora de aire precalentada.\n10 Ajusta el tiempo a 30 minutos a 170°C\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":526,"title":"Muffins de Arándano y Limón RINDE 6-8 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":126,"text":"Muffins de Arándano y Limón\nRINDE 6-8 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n5 ml de jugo de limón\n112 g de leche de coco o leche\nde soja\n120 g de harina todo uso\n4 g de polvo de hornear\n2 g de bicarbonato de sodio\n1 g de sal\n50 g de azúcar granulada\n60 ml de aceite de coco,\nliquido\n1 limón, ralladura de limón\n5 ml de extracto de vainilla\n75 g de arándanos frescos\nAceite en aerosol\nantiadherente\n1 Combina el jugo de limón y la leche de coco en un\ntazón pequeño y luego deja la mezcla de lado.\n2 Mezcla la harina, el polvo de hornear, el bicarbonato\nde sodio y la sal en un recipiente aparte y déjalos a un\nlado.\n3 Mezcla el azúcar, el aceite de coco, la ralladura de\nlimón y el extracto de vainilla en un tazón adicional.\nLuego, combina con la mezcla de coco y limón y\nrevuelve para combinar.\n4 Mezcla los ingredientes secos a los húmedos\ngradualmente, hasta que quede suave la mezcla.\nColoca suavemente los arándanos.\n5 Preheat\n6 Engrasa los moldes para muffins con aceite en\naerosol y vierte la mezcla hasta que las tazas estén a\n¾.\n7 Coloca los moldes para muffins con cuidado en la\nfreidora de aire precalentada. Ajusta el tiempo 15\nminutos a 160°C\n8 Retira los muffins cuando termines de cocinarlos y\ndeja que se enfríen durante 10 minutos. Luego, sírvelos.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":527,"title":"Muffins de Chocolate Espresso RINDE 8 MUFFINS","category":"Postres","source":"120 recetas para comer mejor","page":127,"text":"Muffins de Chocolate Espresso\nRINDE 8 MUFFINS\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n120 g de harina todo uso\n60 g de cacao en polvo\n150 g de azúcar morena clara\n2 g de polvo de hornear\n2 g de polvo de café expreso\n3 g de bicarbonato de sodio\n1 g de sal\n1 huevo grande\n170 ml de leche\n5 ml de extracto de vainilla\n5 ml de vinagre de sidra de\nmanzana\n80 ml de aceite vegetal\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la harina, el polvo de cacao, el azúcar, el\npolvo de hornear, el polvo de café expreso, el\nbicarbonato de sodio y la sal en un tazón grande.\n2 Bate el huevo, la leche, la vainilla, el vinagre y el\naceite en un tazón separado.\n3 Mezcla los ingredientes húmedos en los secos hasta\nque estén bien combinados.\n4 Engrasa los moldes para muffins con aceite en aerosol\ny vierte la mezcla hasta que estén llenas a ¾.\n5 Preheat\n6 Coloca los moldes para muffins con cuidado en la\nfreidora de aire precalentada. Es posible que debas\ntrabajar en partes.\n7 Ajusta el tiempo 15 minutos a 160°C"},{"id":528,"title":"Macarrones de Coco RINDE 5-6 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":128,"text":"Macarrones de Coco\nRINDE 5-6 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n100 g de leche condensada\nazucarada\n1 clara de huevo\n2 ml de extracto de almendra\n2 ml de extracto de vainilla\nUna pizca de sal\n175 g de coco sin azúcar y\ndesmenuzado\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la leche condensada, la clara de huevos, el\nextracto de almendras y la sal en un tazón.\n2 Agrega 160 g de coco rallado y mezcla hasta que\nesté bien combinado. La mezcla debe ser capaz de\nmantener su forma.\n3 Forma bolas de 38 mm con tus manos. En un plato\naparte, agrega 25 g de coco rallado.\n4 Rueda los macarrones de coco en el coco rallado\nhasta que estén cubiertos.\n5 Preheat\n6 Agrega los macarrones de coco a la freidora de\naire precalentada.\n7 Ajusta el tiempo 15 minutos a 160°C.\n8 Deja que los macarrones se enfríen durante 5-10\nminutos y sirve cuando terminen de enfriarse."},{"id":529,"title":"Muffins de Arándano y Naranja","category":"Postres","source":"120 recetas para comer mejor","page":129,"text":"Muffins de Arándano y Naranja\nRINDE 6-8 MUFFINS\n120 g de harina todo uso\n66 g de azúcar\n4 g de polvo de hornear\n2 g de bicarbonato de sodio\nUna sal pizca\n100 g de arándanos\n1 huevo\n80 ml de jugo de naranja\n60 ml de aceite vegetal\n1 naranja, ralladura\nAceite en aerosol\nantiadherente\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la harina, el polvo de hornear, el bicarbonato\nde sodio, la sal y los arándanos en un tazón grande.\n2 Bate el huevo, el jugo de naranja, el aceite y la\nralladura de naranja en un tazón aparte.\n3 Mezcla los ingredientes húmedos y los secos hasta\nque estén bien combinados.\n4 Engrasa los moldes para muffins con aceite en\naerosol y vierte la mezcla hasta que estén llenas a ¾.\n5 Preheat\n6 Coloca los moldes para muffins con cuidado en la\nfreidora de aire precalentada. Es posible que debas\ntrabajar en partes.\n7 Ajusta el tiempo a 15 minutos a 160°C\n8 Deja reposar 5 minutos y sirve"},{"id":530,"title":"Muffins de Arándano y Naranja RINDE 6-8 MUFFINS","category":"Postres","source":"120 recetas para comer mejor","page":130,"text":"Muffins de Arándano y Naranja\nRINDE 6-8 MUFFINS\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n50 g de azúcar granulada\n125 ml de leche de coco o\nleche de soja\n60 ml de aceite de coco,\nliquido\n5 ml de extracto de vainilla\n120 g de harina todo uso\n14 g de cacao en polvo\n4 g de polvo de hornear\n2 g de bicarbonato de sodio\nUna pizca de sal\n85 g de chips de chocolate\n25 g de pistachos, agrietados\n(Opcional)\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina el azúcar, la leche de coco, el aceite de\ncoco y el extracto de vainilla en un recipiente pequeño,\nluego déjalos a un lado.\n2 Mezcla la harina, el cacao en polvo, el polvo de\nhornear, el bicarbonato de sodio y la sal en un\nrecipiente aparte y déjalos a un lado.\n3 Mezcla los ingredientes secos con los húmedos\ngradualmente, hasta que quede suave. Luego une con\nel chocolate y el pistacho.\n4 Preheat\n5 Engrasa los moldes para muffins con aceite en\naerosol y vierte la mezcla hasta que estén llenas a ¾.\n6 Coloca los moldes para muffins con cuidado en la\nfreidora de aire precalentada. Ajusta el tiempo 15\nminutos a 160°C\n7 Retira los muffins cuando termine la cocción y déjalos\nenfriar por 10 minutos antes de servirlos."},{"id":531,"title":"Torrijas de la abuela RINDE 4-6 porciones","category":"Postres","source":"120 recetas para comer mejor","page":131,"text":"Torrijas de la abuela\nRINDE 4-6 porciones\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\nPan blanco.\n2 huevos.\n60 ml de leche.\n15 ml de sirope de arce.\n2 ml de extracto de vainilla.\nAceite en aerosol.\n38 g de azúcar.\n3 g de canela molida.\nAzúcar glas\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Utilizar rebanadas de pan blanco y cortar en trozos\nde dos dedos de ancho.\n2 Batir los huevos, la leche, el sirope de arce y la\nvainilla.\n3 Precalentar la freidora durante un tiempo de 5\nminutos a 170 °C.\n4 Sumergir el pan en la mezcla de huevo y colocarlo en\nla freidora de aire precalentada. Rociar las torrijas\ngenerosamente con aceite en aerosol.\n5 Cocinar las torrijas durante 10 minutos a 175 °C. Se\nrecomienda girar las torrijas a mitad de cocción.\n6 Mezclar azúcar y canela en un recipiente.\n7 Cubrir las torrijas con la mezcla de azúcar y canela\ncuando haya finalizado la cocción.\n8 Espolvorear con azúcar glas"},{"id":532,"title":"Roscas de azúcar","category":"Postres","source":"120 recetas para comer mejor","page":132,"text":"Roscas de azúcar\nRINDE 4-6 porciones\n500 g de harina.\n1 huevo.\n10 g de levadura.\n150 ml de leche.\n100 ml de agua.\n4 g de sal.\n80 g de azúcar.\n40 g de mantequilla.\n1 cuchara de extracto de\nvainilla.\nAzúcar glas.\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 En un recipiente, mezclar la levadura, la harina, el\nazúcar y la sal.\n2 Añadir el huevo, la mantequilla, el extracto de vainilla,\nla leche y el agua. Mezclar de nuevo hasta conseguir\nuna masa homogénea\n3 Amasar con las manos hasta quedar una masa suave y\nmaleable. Dejar reposar la masa durante una hora.\n4 Precalentar la freidora durante 5 minutos a 180 °C.\n5 Estirar la masa y dar forma de donuts ayudándose de\nun molde o dos vasos de diferente tamaño. Dejar\nreposar 30 minutos más.\n6 Introducir las roscas con papel de horno en la freidora\nprecalentada y cocinar durante 15 minutos a 180 °C.\n7 Se recomienda dar la vuelta a los donuts a mitad de la\ncocción para asegurar que se hacen de forma uniforme.\n8 Una vez listos se pueden espolvorear con azúcar glas\no cubrir con glaseado al gusto."},{"id":533,"title":"Bizcocho de naranja 1 bizcocho","category":"Postres","source":"120 recetas para comer mejor","page":133,"text":"Bizcocho de naranja\n1 bizcocho\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 35\nminutos\n120 g de harina de todo uso.\n4 g de levadura.\n85 g de mantequilla.\n120 g de azúcar\n1 huevo.\n15 g de jugo de naranja.\n1 naranja para ralladura.\n60 g de suero de leche.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezclar harina, levadura y sal en un 1 recipiente\n2 Batir la mantequilla hasta que esté suave y esponjosa.\nBatir el azúcar con la mantequilla durante un minuto\n3 Batir la mezcla de harina junto con la mantequilla\nhasta crear una mezcla homogénea. Agregar el huevo,\njuego y ralladura de naranja. Mezclar de nuevo los\ningredientes hasta que estén unidos\n4 Vertir lentamente el suero de leche mientras se bate a\nvelocidad media. 5 Precalentar la freidora durante\n5 minutos a 160°C.\n6 Colocar la mezcla en un pequeño molde e introducirlo\nen la freidora.\n7 Cocinar durante 35 minutos con una temperatura de\n160°C"},{"id":534,"title":"9","category":"Pescados y mariscos","source":"40 recetas para la familia","page":2,"text":"9\n8\nTapas y aperitivos\nMis recetas con\nAirfryer\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n1 lata pequeña de piña en su jugo\nGambas peladas c/n\nPalitos de Brochetas\n150 ml de Aceto Balsámico\n120 g de azúcar\nAbrir una lata pequeña de piña en su jugo y escurrir bien.\nPREPARACIÓN\nCortar las rodajas de piña en 4 partes y reservar.\nPelar las gambas y sacar la cola.\nPrecalentar la Airfryer a 180\no C de temperatura unos minutos e introducir las brochetas en\nla cesta. Programar el temporizador unos 10 minutos a 180\no C.\nPara preparar la salsa de Aceto balsámico: colocar en una olla pequeña el aceto y el azúcar,\nreducir a fuego lento hasta que espese pero sin dejar que se haga caramelo.\nDejar reposar hasta que se enfríe.\n15’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nVALORACIÓN NUTRICIONAL POR 3 BROCHETAS\n226\n16 g.\n36 g.\n2 g.\n0 g.\n156 mg.\nEn un pincho de brocheta, colocar de forma alternada gamba-piña y así sucesivamente\nhasta llegar a cubrir la brocheta. Calcular unas tres gambas por brocheta y tres\nbrochetas por persona.\nFinalmente servir las brochetas en una fuente con la salsa.\n8.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nCONSEJO DIETÉTICO:\nEs importante remarcar que las gambas\naunque contengan colesterol no contienen\ngrasas saturadas, por eso son muy indicadas\nen una alimentación cardiosaludable.\nReceta ofrecida por: María José, Madrid\nPara la salsa:"},{"id":535,"title":"Croquetas de champiñones","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":3,"text":"11\n10\nTapas y aperitivos\nCroquetas de champiñones\nMis recetas con\nAirfryer\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 45 croquetas (aprox)\n200 g de champiñones\n1/4 de una cebolla\nSal\nNuez moscada\n3 cucharadas grandes\nde harina\n4 cucharadas de aceite o\n40 g de mantequilla\nPicar los champiñones y la cebolla.\nPREPARACIÓN\nDorar la cebolla y los champiñones con un poco de aceite en una olla, salar y cuando\nestén dorados agregar dos cucharadas de mantequilla o un buen chorro de aceite.\nAñadir las cucharadas de harina y remover bien hasta conseguir una masa muy espesa.\nIncorporar poco a poco la leche (previamente calentada), hasta obtener una masa densa.\nAñadir la sal y espolvorear con una pizca de nuez moscada.\nDejar enfriar en la nevera unas dos horas.\nHacer bolitas con la masa y pasar por harina, huevo y pan rallado.\nPrecalentar la Airfryer unos minutos a 180\noC y cuando esté lista poner las croquetas en\nla cesta y ajustar el temporizador unos 15 minutos a 180\noC.\n60’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nSe pueden acompañar con\nchampiñones frescos, rociados\ncon aceite de oliva y limón\nfresco. Esta receta tanto se\npuede servir como aperitivo que\ncomo un primer plato.\nVALORACIÓN NUTRICIONAL POR CROQUETA\n54\n2 g.\n7 g.\n2 g.\n0,5 g.\n12 mg.\nCONSEJO DIETÉTICO:\nCuando prepares croquetas o una salsa bechamel,\nte sugerimos que utilices leche desnatada en\nlugar de leche entera. Con ello contribuyes\na reducir positivamente las grasas saturadas\nde tu alimentación. Este sencillo cambio, va a\nfavorecer notablemente la salud de tu corazón.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\n1 litro de leche\ndesnatada\nPan rallado\n2 huevos\nHarina\nReceta ofrecida por: María José, Madrid"},{"id":536,"title":"13","category":"Carnes y aves","source":"40 recetas para la familia","page":4,"text":"13\n12\nTapas y aperitivos\nMis recetas con\nAirfryer\nNivel de dificultad:\nTiempo:\nINGREDIENTES\nMasa de hojaldre c/n\nSalchichas c/n\nCortar la masa de hojaldre en finas láminas de unos 5 cm de ancho.\nPREPARACIÓN\nDividir las salchichas en 2 trozos.\nPrecalentar la Airfryer unos minutos a 180\no C.\nMientras, enrollar cada trozo de salchicha con una tira de hojaldre y\npintar por encima con huevo batido.\nColocar en la cesta de la Airfryer.\nAjustar el temporizador 10 minutos a 180\no C de temperatura.\nTomar como aperitivo en cualquier época del año.\n¡A los niños les encanta!\n10’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nSe puede acompañar\ncon diferentes\nsalsas Barbacoa,\nKétchup...\nVALORACIÓN NUTRICIONAL\n135\n4 g.\n5 g.\n11 g.\n3 g.\n23 mg.\nCONSEJO DIETÉTICO:\nEste aperitivo suele tener un gran éxito, no\nobstante, desde el punto de vista nutricional\nse aconseja un consumo ocasional, debido a la\ngran cantidad de grasas que este aporta a\nnuestra alimentación.\nEs ideal para niños inapetentes.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nHojaldritos de salchichas\n(c/n = cantidad necesaria)\nPOR CADA\nMEDIA SALCHICHA\nReceta ofrecida por: María José, Madrid"},{"id":537,"title":"15","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":5,"text":"15\n14\nTapas y aperitivos\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\n2 Patatas grandes Aceite de oliva Sal\nPicar la cebolla muy fina junto con el diente de ajo y rehogar en el aceite, a fuego lento.\nIncorporar la punta de jamón y dos o tres pimientas de cayena.\nCuando la cebolla esté transparente añadir el pimentón picante (fuera del fuego para que no se queme)\ny las hebras de azafrán, dar unas vueltas y añadir el tomate triturado.\nTiempo: 20’\nPelar las patatas y cortar en dados de unos 2 o 3 cm cada uno, pasar por agua y secar muy bien.\nEspolvorear las patatas con aceite y precalentar la freidora Airfryer unos minutos a 180\no C.\nPosteriormente, introducir las patatas en la cesta y ajustar el temporizador unos 20 minutos a 180\no C.\nIr sacudiendo las patatas de vez en cuando.\nFreír las patatas hasta que estén doradas y listas. Salar y reservar.\n1.\n2.\n3.\n4.\n5.\nSUGERENCIA\nDEL CHEF:\nLas patatas deben\nser de 1a calidad\nVALORACIÓN NUTRICIONAL POR RACIÓN\n194\n5 g.\n30 g.\n6 g.\n0 g.\n0 mg.\nCONSEJO DIETÉTICO:\nPara conseguir un resultado perfecto utiliza patatas con\nmucha fécula. Un ejemplo para que te hagas una idea\ndel ahorro de calorías que supone freír con Aifryer, es\nque 100 g de patatas fritas con una freidora tradicional\ncontienen casi las mismas calorías que 300 g de patatas\nfritas con Airfryer. Con Airfryer comes más alimento y\nmás sano pero con menos calorías y grasas.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nPatatas bravas\n1 cebolla, 1 diente Ajo, 1 vaso de tomate natural triturado, 1 pizca azafrán, 1 cucharadita Azúcar,\n2 a 3 Pimientas de cayena, 1 punta jamón, 1 cucharadita pimentón picante, 1 cucharadita de colorante,\n1 cucharada sopera de harina, 1 chorro de vinagre de jerez, una cucharada de aceite de oliva, sal\nSazonar junto con la cucharadita de azúcar y dejar cocer removiendo durante 5 minutos.\nIncorporar la harina diluida en agua, mezclar, cubrir con agua, añadir el colorante y dejar cocer durante 15 min. más.\nAl final de la cocción echar el chorrito de vinagre, mezclar bien, retirar la punta de jamón y pasar el\nresto de ingredientes por la batidora.\nColar en el chino y ya está lista.\nServir las patatas con la salsa.\nIngredientes para la salsa brava\nINGREDIENTES para 4 personas\nPREPARACIÓN\nPara la preparación de la salsa brava:\n1.\n2.\n3.\n4.\n5.\n6.\n7."},{"id":538,"title":"17","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":6,"text":"17\n16\nTapas y aperitivos\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo: 20’\nCortar las patatas a la francesa. Pasar por abundante agua y secar muy bien.\nPREPARACIÓN\nEn un bol rociar con un pulverizador con aceite.\nPrecalentar unos minutos la Airfryer a 200\no C y colocar las patatas en la cesta.\nProgramar el temporizador de la freidora unos 20 o 25 minutos a 200\no C.\nEl tiempo de cocción es muy variable dependiendo del grosor y el tipo de patatas.\nIr removiendo las patatas mientras se cuecen para lograr que se tuesten todas por igual.\nUna vez listas salar y servir.\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nINGREDIENTES para 4 personas\n500 g de patatas\nSal\nAceite\nSUGERENCIA\nDEL CHEF:\nEstas patatas se\npueden acompañar\ncon un gran\nabanico de salsas.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n115\n3 g.\n19 g.\n3 g.\n0 g.\n0 mg.\nCONSEJO DIETÉTICO:\n¡Nunca las patatas fritas han sido tan ligeras\ny saludables! Una de las claves para que estas\npatatas sean un éxito es que utilices una clase\nde patata con mucha fécula y cuando las laves\nsécalas muy bien. De este modo el tostado y el\ndorado de las patatas será más uniforme.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nPatatas fritas"},{"id":539,"title":"Pimientos rellenos de tortilla de patata","category":"Desayunos","source":"40 recetas para la familia","page":7,"text":"19\n18\nTapas y aperitivos\nPimientos rellenos\nde tortilla de patata\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n2 pimientos grandes (verdes, rojos...)\n2 patatas medianas\n1 huevo\n1 cucharada de aceite de oliva\nSal\nPrecalentar la Airfryer unos 4 minutos a 180\no C. Mientras se calienta, pelar y\ncortar las patatas como para tortilla. Pasar por abundante agua y secar muy bien.\nPREPARACIÓN\nPulverizar las patatas cortadas con un poco de aceite de oliva y colocar en la\ncesta de la freidora.\nIntroducir la cesta en el Airfryer y ajustar el temporizador a unos 12 minutos a\n180\no C de temperatura. Remover las patatas a mitad de la cocción.\nMientras se cuecen las patatas, limpiar los pimientos, cortarles la parte de arriba y sacar\ntodas las pepitas. Pulverizar los pimientos con aceite de oliva y salarlos ligeramente.\nCuando las patatas estén listas, salar. Batir el huevo y mezclarlo con las patatas.\nRellenar los pimientos con esta mezcla y ponerlos en la cesta\nIntroducirla de nuevo en la Airfryer y programar unos 7 minutos a 200\no C.\n30’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nComprobar que la\ntortilla esté bien\ncuajada y cortar los\npimientos rellenos en\nrodajas para servirlos.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n133\n5 g.\n17 g.\n5 g.\n1 g.\n50 mg.\nCONSEJO DIETÉTICO:\nLos pimientos rojos poseen antioxidantes\ncomo la vitamina C y los carotenos.\nLa vitamina C es muy importante para\nla absorción del hierro y los carotenos\ncontribuyen, entre otras muchas funciones,\nal buen estado de nuestra piel.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:"},{"id":540,"title":"21","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":8,"text":"21\n20\nTapas y aperitivos\nMis recetas con\nAirfryer\nReceta ofrecida por: Ana, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\nUna rodaja de\nqueso Provolone\n1 tomate rojo maduro\n1 berenjena\n1 calabacín\nCortar las verduras en láminas y reservar.\nPREPARACIÓN\nPrecalentar la Airfryrer unos minutos a 180\no C.\nPoner el separador de la Airfryer y distribuir la berenjena por un lado y el calabacín por\nel otro, cocer durante 15 minutos a 180\no C. Una vez finalizado, retirar y corregir de sal.\nA continuación hacer lo mismo con la cebolla y el pimiento. Reservar junto al resto de verduras.\nColocar unas rodajas de tomate en el fondo de una cazuela de barro e introducir en la\ncesta de la Airfryer durante 3 minutos a 180\no C de temperatura.\nDespués añadir, el queso Provolone espolvoreando por encima con un poco de orégano al\ngusto. Ajustar el temporizador unos 8 minutos a 180\no C.\nCuando el queso esté derretido y dorado, poner en el plato y rodear con la parrillada\nde verduras.\n20’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nLa verdura sale más\ncrujiente si se rocía\nsobre ella un poco de\naceite de oliva con un\nvaporizador\nVALORACIÓN NUTRICIONAL POR RACIÓN\n245\n15 g.\n8 g.\n17 g.\n11 g.\n55 mg.\nCONSEJO DIETÉTICO:\nEl queso es una excelente fuente de calcio\ny proteínas. Una curiosidad de los quesos\nes, que cuanto más curados son, más\nconcentración de calcio y grasas aporta a\nnuestra dieta\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nServir de inmediato.\n8.\n1 cebolla\n1 pimiento rojo\nSal"},{"id":541,"title":"Primeros platos Arroz al horno (Arròs Al Forn , típico de Valencia)","category":"Carnes y aves","source":"40 recetas para la familia","page":10,"text":"o\nPrimeros platos\n25\n24\nArroz al horno\n(Arròs Al Forn , típico de Valencia)\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 2 personas\n50 g garbanzos cocidos\n6 trocitos costillas cerdo\n100 g nabo\n1 butifarra\n1 tomate mediano\nEn una olla, con un poco de aceite, sofreír los trocitos de costilla y añadir el\nnabo troceado.\nPREPARACIÓN\nUna vez doradito añadir agua (400ml), cuando empiece a hervir añadir los\ngarbanzos, el azafrán, la sal y dejar cocer durante 30 minutos.\nEn una cazuela de barro colocar el arroz, la butifarra, el tomate partido en dos, la\ncabeza de ajos y los ingredientes que hemos utilizado para hacer el caldo (costilla, nabo\ny garbanzos). Seguidamente añadir el caldo para cocer, el doble de caldo que arroz.\nPrecalentar la Airfryer unos minutos a 200\no C.\nColocar la cazuela de barro en la cesta de la Airfryer y ajustar el temporizador\nunos 45 minutos a 200\no C de temperatura.\n60’\n1.\n2.\n3.\n4.\n5.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n707\n25 g.\n55 g.\n43 g.\n10 g.\n83 mg.\nCONSEJO DIETÉTICO:\nLa base de la dieta mediterránea son los cereales\ny alimentos ricos en hidratos de carbono. El\narroz es el cereal que más protagonismo tiene\nen nuestra gastronomía. Platos únicos a base de\narroz, pasta, legumbre o patata pueden ser una\nalternativa muy saludable para toda la familia.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\n1 cabeza ajo\nArroz (1 taza café\npor persona)\nAzafrán, aceite, sal y agua\nAceite de oliva"},{"id":542,"title":"Primeros platos","category":"Pescados y mariscos","source":"40 recetas para la familia","page":11,"text":"o\nPrimeros platos\n27\n26\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n4 Berenjenas\n200 g de bacalao desmigado\n100 g de Queso camembert\nSal y Pimenta\n50 g queso rallado para gratinar\nSal\nCortar las berenjenas por la mitad (a lo ancho de la berenjena no a lo largo) y\nvaciar reservando la pulpa.\nPREPARACIÓN\nCortar el queso en taquitos pequeños y reservar.\nMezclar la pulpa de las berenjenas con los taquitos de queso y el bacalao,\npreviamente desalado. Rectificar de sal.\nCortar un poquito la base de las berenjenas para que se mantengan en pie.\nRellenar las berenjenas con la mezcla, apretando un poco para que se rellenen bien.\nPrecalentar la Airfryer unos minutos a 180\no C y una vez lista distribuir las berenjenas\nrellenas en la cesta de la Airfryer. Ajustar el temporizador durante unos 15 minutos a 180\no C.\nFinalizado el tiempo, abrir la Airfryer y espolvorear con el queso rallado.\n25’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nEl bacalao hay\nque desalarlo\nantes\nVALORACIÓN NUTRICIONAL POR RACIÓN\n198\n19 g.\n8 g.\n10 g.\n6 g.\n60 mg.\nCONSEJO DIETÉTICO:\nLas berenjenas rellenas pueden ser un plato de\nverdura muy saludable y atractivo, en esta ocasión,\nal cocinarse con la Airfryer no es necesario utilizar\nuna grasa de cocción. Como resultado, obtenemos\nuna receta más saludable y digestiva. Puedes variar\nel tipo de relleno por pisto, atún, arroz, etc.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nVolver a programar el temporizador otros 5 minutos a 180\no C.\n8."},{"id":543,"title":"Primeros platos","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":12,"text":"o\nPrimeros platos\n29\n28\nVALORACIÓN NUTRICIONAL POR RACIÓN\n114\n6 g.\n9 g.\n6 g.\n2 g.\n11 mg.\nCONSEJO DIETÉTICO:\nEn muchas ocasiones, el poco consumo de\nla verdura es por falta de ideas y de tiempo\na la hora de prepararla, con la Airfryer\nesto dejará de ser un problema, podrás\ndisfrutar de nuevas recetas tan rápidas\ncomo atractivas.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nCalabacines horneados\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n2 calabacines medianos\nAjo en polvo\nPerejil\nPimienta negra molida\nSal\n2 cucharadas de pan rallado\n4 cucharadas de queso rallado\nAceite de oliva\nPrecalentar la Airfryer unos minutos a 200\no C.\nPREPARACIÓN\nLavar los calabacines y cortar cada uno en 4 partes.\nProgramar el temporizador de la Airfryer durante 15 a 20 minutos hasta\nque estén blandos.\nEspolvorear con ajo en polvo, perejil, sal y pimienta negra.\nCubrir con pan rallado y finalmente con el queso rallado.\nPulverizar con aceite de oliva.\nAjustar el temporizador de la Airfryer unos 15 minutos a 180\no C, hasta que\nestén dorados a nuestro gusto y servir medio calabacín por ración.\n20’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nEs interesante probar\nlos panes rallados que ya\nvienen con ajo y perejil u\notras hierbas (o mejor,\nprepáralos tú mismo)."},{"id":544,"title":"Primeros platos","category":"Panes, pasta y aperitivos","source":"40 recetas para la familia","page":13,"text":"o\nPrimeros platos\n31\n30\nVALORACIÓN NUTRICIONAL POR CROQUETA\n70\n3 g.\n10 g.\n2 g.\n0,5 g.\n15 mg.\nCONSEJO DIETÉTICO:\nEl aceite de oliva, es nuestro oro alimenticio, gracias a\nlas excelentes propiedades nutritivas que este posee.\nNo obstante, es el alimento que más calorías aporta a\nnuestra dieta, pues lo utilizamos en casi todas las comidas\nque realizamos a lo largo del día. Airfryer nos permite\nreducir notablemente el aceite de nuestras cocciones sin\nrenunciar al placer de comer. Estas croquetas son un\nclaro ejemplo de ello.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nMis recetas con\nAirfryer\nINGREDIENTES para unas 30 croquetas\n1 puerro mediano\nUna cucharada de aceite de oliva\n500 g de espinacas\n20 g de mantequilla\n3 cucharadas soperas de\nharina de trigo\nPochar, en una sartén, el puerro picado con un chorrito de aceite de oliva. Cuando adquiera un\ncolor doradito, añadir las espinacas y saltear 2 o 3 minutos más.\nPREPARACIÓN\nA continuación, añadir la mantequilla. En cuanto esta esté derretida, echar la harina, removiendo\ncontinuamente para evitar la formación de grumos. Después añadiremos la leche previamente\ncalentada y seguiremos removiendo durante unos 10 minutos a fuego medio.\nA la masa resultante iremos añadiendo la sal de hierbas, una pizca de pimienta blanca y otra\nde nuez moscada, removiendo constantemente.\nPodemos rectificar de leche, dependiendo del espesor que se desee conseguir. Con más leche\nla masa tendrá una consistencia más clara, con menos más espesa.\nDejar enfriar la masa, primero a temperatura ambiente y luego en el frigorífico (tapada para\nque no se reseque) durante al menos 2 horas.\nEl siguiente paso será moldear las croquetas y rebozarlas por harina, huevo y pan rallado.\nTiempo: 60’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nNivel de dificultad:\nSUGERENCIA\nDEL CHEF:\nLas croquetas de\nespinacas pueden ser\nun primer plato o una\ntapa de un aperitivo.\nCroquetas de espinacas\n250 ml de leche desnatada\nSal de hierbas\nPimienta blanca molida\n1 pizca de nuez moscada\n2 huevos\n250 g de pan rallado\nFinalmente, precalentar la Airfryer unos minutos a 180\noC, luego meter nuestras croquetas en\nla cesta de la Airfryer y ajustar el temporizador unos 12-15 minutos y a 180\noC de temperatura.\nReceta ofrecida por: María José, Madrid"},{"id":545,"title":"Primeros platos","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":14,"text":"o\nPrimeros platos\n33\n32\nMis recetas con\nAirfryer\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n4 rebanadas de pan de molde\n4 cucharadas de queso fresco\ntipo Quark\nUn poco de cebollino picado\nHojas de espinacas\nChampiñones laminados\nUntar cada rebanada de pan de molde con una cucharada de queso fresco tipo Quark.\nPREPARACIÓN\nEspolvorear con una poco de cebollino picado y agregar encima unas hojas de espinacas.\nLimpiar los champiñones y cortar en láminas finas, rociar con zumo de limón para\nevitar que se ennegrezcan. Agregar los champiñones a las pizzas. Añadir la pimienta.\nIncorporar el queso de cabra cortado en trocitos y espolvorear los piñones.\nPrecalentar la Airfryer unos minutos a 200\noC.\nIncorporar el queso de cabra cortado en trocitos y espolvorear los piñones por encima.\nAjustar el temporizador de la Airfryer de 7 a 10 minutos a 200\noC.\n20’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nSUGERENCIA\nDEL CHEF:\nEste tipo de piza permite un sin\nfin de alternativas: atún, jamón y\nqueso, escalibada y anchoas, tomate\ny mozzarella, etc. Puedes sustituir\nel pan de molde por pan de payés o\nbases de pizza pequeñas.\nVALORACIÓN NUTRICIONAL POR REBANADA\n216\n11 g.\n16 g.\n12 g.\n4 g.\n4 mg.\nCONSEJO DIETÉTICO:\nReceta ideal para improvisar una cena rápida pero\nnutritiva, que seguramente va a gustar a toda la familia.\nDe manera sencilla conseguimos una gran variedad\nde alimentos y como resultado un mayor número de\nnutrientes. Si lo deseas puedes emplear pan de molde\nintegral o pan redondo de semillas o cereales.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nPizzas caseras\nServir de inmediato.\n8.\n100 g de Queso\nfresco de cabra\n25 g de piñones\nPimienta\nSal\nReceta ofrecida por: María José, Madrid"},{"id":546,"title":"Primeros platos","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":15,"text":"o\nPrimeros platos\n35\n34\nMis recetas con\nAirfryer\nINGREDIENTES para 8 personas\n4 Puerros bien lavados y cortados\n1 Cebolla\n1 terrina de 250 g de queso\nfresco tipo Quark\n4 cucharadas de queso rallado\nLavar los puerros y picar la parte blanca.\nPREPARACIÓN\nCorta la cebolla y picar.\nPochar los puerros junto con la cebolla, en una sartén con un poco de aceite.\nSalpimentar y tapar, si se absorbe todo el aceite, añadir un poco de agua y terminar de\npochar. Cuando tenemos listo los puerros con la cebolla, reservar.\nMientras tanto, en un bol aparte echar los huevos y batir, añadir el queso fresco y mezclar\nhasta obtener una crema homogénea. Luego salar e incorporar el queso rallado.\nDisponer la masa brisa sobre un recipiente y pinchar con un tenedor para evitar que se\nhinche. Depositar las verduras pochadas por encima, repartiéndolas bien e incorporar la\npreparación de los huevos y demás ingredientes.\nCubrir con papel de aluminio.\nTiempo: 20’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nNivel de dificultad:\nSUGERENCIA\nDEL CHEF:\nPinchar el centro si\nsale seco esta lista,\nsi no dejarla unos\nminutos más\nVALORACIÓN NUTRICIONAL POR RACIÓN\n261\n10 g.\n17 g.\n17 g.\n8 g.\n131 mg.\nCONSEJO DIETÉTICO:\nEn esta receta te ofrecemos una alternativa de\ncómo preparar una quiche más saludable y más\nnutritiva que la quiche tradicional. Además puedes\nsustituir los puerros por cualquier verdura de\ntemporada. Ideal para que los poco amantes de\nlas verduras descubran nuevas alternativas.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nReceta ofrecida por: María José, Madrid\n4 huevos\n2 cucharadas de\naceite de oliva\nSal y pimienta\n1 masa de pasta brisa\nPrecalentar la Airfryer unos minutos a 180\noC.\nIntroducir el recipiente en la cesta de la Airfryer y ajustar el temporizador unos 25 minutos a 180\noC.\nSi no cabe todo en un mismo recipiente lo puedes hacer en dos fases.\nPinchar con un palito para verificar que se haya cocido correctamente.\n8.\n9.\n10.\n11."},{"id":547,"title":"Primeros platos Saquitos de setas cultivadas con jamón","category":"Otros","source":"40 recetas para la familia","page":16,"text":"o\nPrimeros platos\n37\n36\nSaquitos de setas cultivadas\ncon jamón\nMis recetas con\nAirfryer\nReceta ofrecida por: Pep, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n150 g de setas cultivadas\n1 brick pequeño de nata para cocinar\n100 g de jamón serrano\n230 g de masa quebrada\nSal\nPimienta\nCortar las setas y el jamón en trozos pequeños. Luego mezclar en un bol con la\nnata y salpimentar.\nPREPARACIÓN\nDividir y cortar la masa quebrada en ocho cuadrados de 10 cm cada uno. Rellenar\nel centro de cada cuadrado con una cucharada de la mezcla anterior.\nPara cerrar los saquitos, unir cada esquina del cuadrado hacia el centro, luego\npinchar un poco la masa y pintar con huevo batido.\nPrecalentar la Airfryer unos minutos a 200\noC. Colocar los saquitos en la cesta de la\nAirfryer y ajustar el temporizador unos 15 minutos a 200\noC de temperatura.\n10’\n1.\n2.\n3.\n4.\nVALORACIÓN NUTRICIONAL POR SAQUITO\n227\n7 g.\n16 g.\n15 g.\n8 g.\n49 mg.\nCONSEJO DIETÉTICO:\nSi deseas obtener una receta más saludable\npuedes sustituir la masa quebrada por masa\nfilo y la nata por queso fresco tipo Quark.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:"},{"id":548,"title":"Segundos platos Alitas de pollo al ajillo","category":"Carnes y aves","source":"40 recetas para la familia","page":18,"text":"Segundos platos\n41\n40\nAlitas de pollo\nal ajillo\nMis recetas con\nAirfryer\nReceta ofrecida por: Isabel, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES\nAlitas de pollo (cantidad necesaria)\nAjo\nPerejil fresco\nSal\nPelar los ajos y majar en el mortero con un poco de sal.\nUna vez bien majados mezclar con el perejil picado.\nA continuación incorporar esta picada sobre las alitas de pollo, previamente limpias.\nPrecalentar la Airfryer durante 3 minutos aproximadamente a 180\no C de temperatura.\nUna vez alcanzada la temperatura, introducir las alitas en la cesta de la Airfryer.\nProgramar el temporizador de 15 a 20 minutos, a una temperatura de 180\no C.\nServir en una fuente.\nPREPARACIÓN\n15’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nVALORACIÓN NUTRICIONAL POR CADA ALITA\n70\n13 g.\n0 g.\n2 g.\n0,5 g.\n45 mg.\nCONSEJO DIETÉTICO:\nFreír con la Airfryer te permite comer menos grasas\nde las que especificamos en la valoración nutricional,\nesto es gracias a que el alimento al freírse suelta su\npropia grasa, quedando depositadaen la sartén que se\nencuentra debajo de la cesta donde introducimos los\nalimentos para freír.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSUGERENCIA\nDEL CHEF:\nDependiendo de cómo\nnos guste, las sacaremos\nantes o después para\nque estén más o menos\ndoradas. Esta receta\ntambién se puede servir\ncomo tapa o aperitivo."},{"id":549,"title":"Segundos platos Albóndigas de carne","category":"Desayunos","source":"40 recetas para la familia","page":19,"text":"Segundos platos\n43\n42\nAlbóndigas de carne\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n200 g de carne picada de ternera\n300 g de carne picada de cerdo\n1 huevo\n2 rebanadas de pan de molde\nMedio vaso de leche\n1 diente de ajo picado\nPerejil\nHarina\nSal y pimienta\nAceite de oliva\n1 Bote de tomate frito\nEn un recipiente amplio y hondo, mezclar los dos tipos de carne picada, el huevo, el ajo\ny el perejil picaditos. Añadir sal y pimienta al gusto.\nEn otro recipiente más pequeño empapar las rebanadas de pan de molde con la leche.\nEscurrir y mezclar con la carne. Si la mezcla queda demasiado blanda añadir un poquito\nde harina o pan rallado.\nFormar las albóndigas.\nPoner las albóndigas en una cazuela de barro de la medida de la cesta de la Airfryer.\nCubrir las albóndigas con el tomate frito.\nPrecalentar la Airfryer unos minutos a 180\no C.\nIntroducir la cazuela de barro en la cesta de la Airfryer y ajustar el temporizador\n20 minutos a 180\no C.\nPREPARACIÓN\n30’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n315\n29 g.\n16 g.\n15 g.\n4 g.\n136 mg.\nCONSEJO DIETÉTICO:\nEste tipo de platos sabe mejor al día siguiente.\nTe animamos a que la acompañes con una\ncrema de setas o de verduras, dependiendo de\nla época del año en la que nos encontremos y\nuna guarniciónde arroz blanco.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:"},{"id":550,"title":"Segundos platos","category":"Verduras y guarniciones","source":"40 recetas para la familia","page":20,"text":"Segundos platos\n45\n44\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n400 g de rape\n240 g de tomates Cherry\n1 calabacín\n4 champiñones\n1 pimiento verde\n1 cucharada de aceite de oliva\nSal\nPalillos\nMontar las brochetas intercalando tomate Cherry, rape, calabacín, champiñón,\npimiento, hasta completar el palillo o brocheta como se ve en la foto.\nPrecalentar la Airfryer unos minutos a 180\no C.\nMientras, pincelarlas las brochetas con un poco de aceite.\nIntroducirlas en la cesta y ajustar el temporizador unos 5 minutos a 180\no C\nde temperatura.\nDar la vuelta cuando estén un poco doradas.\nAcabar de dorar y servir.\nPREPARACIÓN\n20’\n1.\n2.\n3.\n4.\n5.\n6.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n97\n18 g.\n4 g.\n1 g.\n0 g.\n17 mg.\nCONSEJO DIETÉTICO:\nLas brochetas pueden sacarte de muchos apuros a la\nhora de improvisar una cena ligera y variada. Ideal para\ncualquier edad. Sírvelas con alguna salsa para hacerlas más\natractivas y apetitosas. Es importante tener recursos\npara cocinar más variado y lograr una alimentación más\nsaludable. Pues en la variedad está el equilibrio.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nBrochetas de rape\ncon verduras"},{"id":551,"title":"Segundos platos","category":"Carnes y aves","source":"40 recetas para la familia","page":21,"text":"Segundos platos\n47\n46\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n500 g de solomillo vacuno\n1 Zanahoria\n1 Cebolla\n1 Brócoli\n1 Pimiento\nSalsa de Soja\n30’\nLimpiar el solomillo y cortar en cubos de 5 cm y reservar.\nLavar las verduras y cortar en cubitos o la forma que uno quiera.\nPrecalentar la Airfryer unos minutos a 180\no C.\nIntroducir un recipiente en la cesta de la Airfryer con un poquito de agua,\nagregar las verduras con sal y pimienta y programar el temporizador unos\n30 minutos a 180\no C.\nCuando al pinchar las verduras estas estén crujientes, agregar la carne y un\nbuen chorro de salsa de soja.\nDejar cocer unos 15 minutos más.\nRetirar el recipiente de la Airfryer y colar todo el jugo que hizo al cocer la\ncarne con las verduras y salsa de soja.\nEn un cazo, aparte, reducir la salsa al fuego 5 minutos y volver a añadir a la\ncarne con verduras.\nServir en una fuente acompañado de arroz, cuscús o quinoa.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\n6.\n7.\n8.\n9.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n189\n9 g.\n7 g.\n5 g.\n2 g.\n92 mg.\nCONSEJO DIETÉTICO:\nLas carnes rojas son una importante fuente de hierro y\nvitamina B12 en nuestra alimentación, además de proteínas de\nalto valor biológico, poseen otras vitaminas y minerales. Desde el\npunto de vista dietético, lo más importante es que elijas piezas de\ncarne muy magras, para conseguir el máximo de nutrientes y la\nmínima cantidad de grasas, el solomillo es una pieza muy magra.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nCazuela de solomillo y verduras\ncon salsa de soja"},{"id":552,"title":"Segundos platos","category":"Carnes y aves","source":"40 recetas para la familia","page":22,"text":"Segundos platos\n49\n48\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para unas 46 croquetas\nCarne del cocido sin piel: jamón,\npollo, chorizo.\n1/2 cebolla\nAceite de oliva Virgen extra\nSal\nPimienta\n2 cucharadas de harina\n2 cucharadas de mantequilla\n750 ml de leche desnatada\nNuez moscada\nPan rallado\n2 huevos\nSal\n60’\nPicar la cebolla bien picada y pochar en una sartén con aceite de oliva virgen extra.\nA continuación agregar 2 cucharadas de harina y 2 cucharadas de margarina.\nRemover lentamente y poco a poco ir añadiendo la leche (previamente caliente), sin dejar\nde remover. Agregar una pizca de nuez moscada y sal.\nMezclar hasta conseguir una consistencia cremosa, añadir la carne del cocido y una\npizca de sal.\nUna vez lograda una pasta homogénea, dejar enfriar en nevera unas 2 horas.\nA continuación, dar forma a las croquetas, pasar por huevo batido, harina y pan rallado.\nMientras precalentar la Airfryer unos minutos a 180\no C.\nIntroducir las croquetas en la cesta de la Airfryer y programar el temporizador 15\nminutos a 180\no C.\nHacer las croquetas por tandas.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\n6.\n7.\n8.\nVALORACIÓN NUTRICIONAL POR CROQUETA\n58\n4 g.\n6 g.\n2 g.\n1 g.\n19 mg.\nCONSEJO DIETÉTICO:\nLa alternativa más saludable para comer unas\ncroquetas ligeras pero muy sabrosas, es cocinarlas con\nla Airfryer. Gracias a que no precisa aceite para su\ncocción estas son más fáciles de digerir y por lo tanto,\nlas puedes tomar en cualquier momento del día. Son una\nexcelente solución para las cenas de tus hijos.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nCroquetas caseras\nde cocido\nPara la bechamel:\nPara el rebozado:"},{"id":553,"title":"Segundos platos Empanada de atún","category":"Desayunos","source":"40 recetas para la familia","page":23,"text":"Segundos platos\n51\n50\nEmpanada de atún\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n2 huevos duros\n2 latas de atún.\n200 ml tomate frito.\n1 lámina de masa quebrada.\nCortar los huevos en cachitos y mezclar con el atún y el tomate.\nExtender la lámina de masa quebrada y cortar en dos cuadrados iguales.\nPoner la mezcla de atún, huevos y tomate sobre uno de los cuadrados.\nCubrir con el otro, juntar por los extremos y decorar con cachitos sobrantes.\nPrecalentar la Airfryer unos minutos a 180\no C.\nIntroducir en la cesta de la Airfryer y ajustar el temporizador 15 minutos a 180\no C.\nPREPARACIÓN\n30’\n1.\n2.\n3.\n4.\n5.\n6.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n460\n20 g.\n32 g.\n28 g.\n12 g.\n166 mg.\nCONSEJO DIETÉTICO:\nPara conseguir un correcto equilibrio nutricional\nte sugerimos acompañar esta receta con una\nensalada o crema de verduras.\nLa empanada la puedes preparar con otro tipo\nde relleno como espinacas con piñones y huevo\nduro, escalibada, pisto, etc.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:"},{"id":554,"title":"Segundos platos","category":"Desayunos","source":"40 recetas para la familia","page":24,"text":"Segundos platos\n53\n52\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n4 panecillos de pan de hamburguesas\n1 Tomate fresco\nHojas de Lechuga (cantidad necesaria)\n250 g Carne picada\n1 huevo batido\n600 g de patatas\nOrégano\nAjo picado\nCebolla picada\nSal\nPimienta\nMostaza\n20’\nPelar y cortar las patatas. Pasar por agua y secar muy bien. Poner en un bol y rociar\ncon aceite.\nPrecalentar la Airfryer unos minutos a 200\no C.\nIntroducir las patatas en la cesta de la Airfryer y ajustar el temporizador 20 minutos a\n200\no C. Cuando estén listas añadir sal y reservar.\nAparte mezclar la carne picada con el orégano, ajo picado, mostaza, cebolla picada y\nhuevo batido. Formar cuatro bolas de carne y dar forma de hamburguesa a cada una de ellas.\nPrecalentar la Airfryer unos minutos a 180\no C. Introducir las hamburguesas en la cesta y\najustar el temporizador unos 10 minutos a 180\no C.\nPreparar cada panecillo con unas rodajas de tomate, unas hojas de lechuga y unas\nrodajas de cebolla. Luego incorporar la hamburguesa y cerrar el panecillo.\nServir con las patatas fritas.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n359\n22 g.\n52 g.\n7 g.\n2 g.\n93 mg.\nCONSEJO DIETÉTICO:\n¿Quién puede resistirse a esta suculenta Burguer?\nSaber comer bien no tiene porqué estar reñido con el placer de\ncomer. Además, de alimento observa que pocas grasas damos en\ncada ración de esta receta. Muchas veces la clave de una\nalimentación saludable está en cómo cocinamos, aprende a cocinar\nsano con Airfryer, inviertes hoy pero los resultados los ves a diario.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nHamburguesa con\npatatas fritas\nSUGERENCIA\nDEL CHEF:\nPuedes optar por\nponer un poco de\nmayonesa o kétchup."},{"id":555,"title":"Segundos platos Huevos al plato","category":"Desayunos","source":"40 recetas para la familia","page":25,"text":"Segundos platos\n55\n54\nHuevos al plato\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para cada comensal\nPrecalentar la Airfryer unos 3 minutos a 180\no C.\nPincelar ligeramente la cazuelita de barro con el aceite.\nEsparcir la salsa de tomate sobre la base de la cazuela y colocar los guisantes por\nencima (no es necesario descongelarlos).\nCascar los dos huevos y colocarlos con cuidado sobre la cama de guisantes.\nRepartir los trocitos de sobrasada alrededor de los huevos y salpimentar al gusto.\nPoner la cazuela en la cesta, cerrar y programar el temporizador unos 12 minutos\na 180\no C, (pueden ser un par de minutos más o un par de minutos menos, según se\nprefieran los huevos más o menos cuajados).\nSacar la cazuela con mucho cuidado para no quemarse y servir en el mismo recipiente.\nPREPARACIÓN\n25’\n1.\n2.\n3.\n4.\n5.\n6.\n7.\n2 huevos\n1 cucharada de salsa de tomate\n1 buen puñado de guisantes congelados\n1 loncha de sobrasada cortada a trocitos\n1 chorrito de aceite de oliva\nsal y pimienta\nNecesitaremos una cazuelita de barro por comensal\nVALORACIÓN NUTRICIONAL POR RACIÓN\n304\n18 g.\n4 g.\n24 g.\n7 g.\n415 mg.\nCONSEJO DIETÉTICO:\nLa clara de huevo posee la proteína más pura que hay en un\nalimento y la yema de huevo contiene cantidades importantes de\nhierro y vitaminas D y A. ¡No todo es colesterol! Cabe destacar,\nque los huevos poseen muy poca cantidad de grasas saturadas.\nPor todos estos motivos, en una alimentación equilibrada se\naconseja su consumo de tres a cuatro veces por semana.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSUGERENCIA\nDEL CHEF:\nSe puede sustituir la\nsobrasada por taquitos\nde jamón o de chorizo."},{"id":556,"title":"Segundos platos","category":"Desayunos","source":"40 recetas para la familia","page":26,"text":"Segundos platos\n57\n56\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES\n600 g de patatas\nSal\n1 cucharada de aceite de oliva\n100 g de Jamón Ibérico\n4 huevos\n20’\nCortar las patatas alargadas a la francesa, pasar por abundante agua y secar bien con\npapel de cocina.\nPulverizar con aceite y precalentar la Airfryer unos minutos a 200\no C.\nColocar las patatas en la cesta de la Airfryer y programar el temporizador 25 minutos a\n200\no C.\nCuando veamos que están empezando a quedar doradas, poner papel vegetal debajo de las\npatatas y echar los huevos.\nVolver a poner en la Airfryer 5 minutos más.\nPor último agregar lascas de Jamón Ibérico.\nSi quieres ir más rápido mientras se fríen las patatas en la Airfryer puedes preparar los huevos\na la plancha en una sartén pequeña y luego mezclar con las patatas y el jamón en el plato.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\n6.\n7.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n250\n17 g.\n23 g.\n10 g.\n2 g.\n217 mg.\nCONSEJO DIETÉTICO:\n¿A quien no se le hace la boca agua cuando vemos\no pensamos en un plato de huevos estrellados\ncon patatas fritas? Pues bien, ya no es necesario\nsoñar porque con Airfryer es una realidad que\npodrás degustar con los tuyos, sin que suponga\nuna bomba de calorías.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nHuesvos estrellados con\npatatas fritas y jamón"},{"id":557,"title":"Segundos platos Flamenquines caseros","category":"Desayunos","source":"40 recetas para la familia","page":27,"text":"Segundos platos\n59\n58\nFlamenquines caseros\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\nHacer un rollo con los filetes de cerdo, introducir en su interior medio huevo cocido y el\njamón serrano. Para que el rollo no pierda su forma, sujetar con un cordel o palillos.\nPasar los rollos por huevo batido y a continuación por el pan rallado hasta formar una\nbuena capa.\nPrecalentar la Airfryer unos minutos a 180\no C.\nIntroducir los rollos en la cesta y programar el temporizador unos 8 minutos a 180\no C.\nServir enseguida.\nPREPARACIÓN\n30’\n1.\n2.\n3.\n4.\n5.\n6.\n400 g de filetes de cerdo cortados muy finos\nc/n\n2 huevos cocidos y picados\n100 g de jamón serrano picado\n1 huevo batido\nPan rallado\nVALORACIÓN NUTRICIONAL POR RACIÓN\n269\n26 g.\n12 g.\n13 g.\n4 g.\n204 mg.\nCONSEJO DIETÉTICO:\nUna técnica culinaria que nos permita utilizar el\nmínimo de grasa posible para cocinar los alimentos,\nes la clave para comer más saludable. Esta receta\nes un ejemplo de cómo conseguir las calorías justas\npara un segundo plato.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSUGERENCIA\nDEL CHEF:\nEsta receta también\nse puede hacer con\nlonchas de jamón de\nyork en lugar de\nlos filetes de cerdo."},{"id":558,"title":"Segundos platos Filetes empanados","category":"Desayunos","source":"40 recetas para la familia","page":28,"text":"Segundos platos\n61\n60\nFiletes empanados\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\nCortar los filetes finos y salpimentar.\nPasar por harina, huevo batido (mezclado ya con perejil y ajo) y por último\npasar por pan rallado.\nPulverizar con aceite y precalentar la Airfryer unos minutos a 180\no C.\nPoner los filetes en la cesta de la Airfryer y ajustar el temporizador\n15 minutos a 180\no C.\nPREPARACIÓN\n20’\n1.\n2.\n3.\n4.\n400 g de filetes de pollo (pechugas)\n1 huevo\nPerejil\nAjo\nSal\nAceite de oliva\nHarina\nPan rallado\nVALORACIÓN NUTRICIONAL POR RACIÓN\n219\n25 g.\n14 g.\n7 g.\n2 g.\n113 mg.\nCONSEJO DIETÉTICO:\nPor fin en el siglo XXI vamos a poder freír sin aceite y sin\nrenunciar al placer de comer. El hecho de cocinar sin aceite\nte supone un sinfín de ventajas como por ejemplo: el ahorro\neconómico que esto supone; un ahorro en tiempo a la hora de\nlimpiar; nos evitamos reutilizar elaceite; prescindimos de olores\na fritos y mejora nuestra digestión. ¡Qué más se puede pedir!\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSUGERENCIA\nDEL CHEF:\nAcompañar de unas\npatatas fritas con\nla Airfryer y una\nensalada."},{"id":559,"title":"Segundos platos","category":"Carnes y aves","source":"40 recetas para la familia","page":29,"text":"Segundos platos\n63\n62\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\n8 muslos de pollo\n250 g de setas\n200 ml Nata para cocinar\n1 cebolla picada\nSal\nPimienta\n25’\nPrecalentar la Airfryer unos 5 minutos a 190\no C.\nPoner un molde de silicona o similar en la cesta de la Airfryer. Cubrir la superficie con\nlos muslos de pollo.\nBañar con una capa de nata líquida, agregar la mitad de la cebolla picada y cubrir con\nlas setas y salpimentar.\nVolver a bañar con el resto de nata y cebolla picada.\nAjustar el temporizador de la Airfryer unos 25 minutos a 190\no C de temperatura.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\nVALORACIÓN NUTRICIONAL POR RACIÓN\n164\n10 g.\n4 g.\n12 g.\n7 g.\n59 mg.\nCONSEJO DIETÉTICO:\nEl consumo de carne en una alimentación equilibrada\nse aconseja que sea de tres a cuatro veces por\nsemana y siempre que podamos, es aconsejable elegir\npiezas de carne magra. Esto también incluyelas\ncarnes blancas como la de pollo o pavo.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nMuslos de pollo con setas\ny nata encebollada\nSUGERENCIA\nDEL CHEF:\nLa cebolla aunque la\npongamos en crudo\nse cuece con la\ntemperatura y la nata."},{"id":560,"title":"Segundos platos Pastel de pescado","category":"Postres","source":"40 recetas para la familia","page":30,"text":"Segundos platos\n65\n64\nPastel de pescado\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\nMezclar todos los ingredientes menos los huevos.\nCon una batidora triturarlo todo muy bien.\nUna vez formada una pasta agregar los huevos de uno en uno.\nMezclar bien y colocar en un recipiente untado con aceite.\nTapar con papel de aluminio.\nPrecalentar la Airfryer unos minutos a 180\no C.\nIntroducir el recipiente con el pastel, en la cesta de la Airfryer.\nAjustar el temporizador 30 minutos a 180\no C.\nUna vez templado desmoldar y cortar.\nPREPARACIÓN\n30’\n1.\n2.\n3.\n5.\n7.\n4.\n6.\n9.\n8.\n200 g de rape o Merluza\n200 ml nata\n100 ml tomate frito\n4 huevos\nSal y pimienta\nVALORACIÓN NUTRICIONAL POR RACIÓN\n229\n16 g.\n3 g.\n17 g.\n8 g.\n244 mg.\nCONSEJO DIETÉTICO:\nLos pasteles de pescado son ideales para\nfavorecer el consumo de este nutritivo alimento,\nsobre todo pensando en los más pequeños de\nla casa.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSUGERENCIA\nDEL CHEF:\nAcompañar con ensalada\nPinchar el centro con un\npalito si sale seco esta\nlisto, si no dejarlo unos\nminutos más."},{"id":561,"title":"Segundos platos","category":"Pescados y mariscos","source":"40 recetas para la familia","page":31,"text":"Segundos platos\n67\n66\nMis recetas con\nAirfryer\nReceta ofrecida por: Nuria, Barcelona\nNivel de dificultad:\nTiempo:\nINGREDIENTES por comensal\n1 lomo de salmón por persona (130g)\nMasa filo\nEneldo\nLimón\nSal y pimienta\n20’\nRociar el salmón con unas gotas de zumo de limón, salpimentar y agregar el eneldo.\nDisponer cada lomo de salmón encima de una hoja de masa filo. Envolver el salmón y\npincelar con aceite de oliva o huevo batido.\nPrecalentar la Airfryer unos minutos a 180\no C.\nPoner los paquetes de salmón en la cesta de la Airfryer y ajustar el temporizador\nentre 10 y 15 minutos a 180\no C, según el grosor del salmón.\nServir acompañado con salsa de soja y una refrescante ensalada.\nPREPARACIÓN\n1.\n2.\n3.\n4.\n5.\nVALORACIÓN NUTRICIONAL POR UNIDAD\n303\n27 g.\n6 g.\n19 g.\n4 g.\n73 mg.\nCONSEJO DIETÉTICO:\nEl salmón es una fuente importante de vitamina D, (vitamina\nimprescindible para la absorción del calcio) y ácidos grasos\nomega 3 (necesarios para nuestra salud cardiovascular),\nademás de otros nutrientes. Por eso el consumo semanal de\nsalmón o el de otros pescados azules, de pequeño tamaño,\nes aconsejable como mínimo dos veces por semana.\nCalorías:\nProteínas:\nHidratos de carbono:\nGrasa totales:\nDe las cuales son grasas saturadas:\nColesterol:\nSalmón envuelto\nen masa filo\nSUGERENCIA\nDEL CHEF:\nEsta receta también\nse puede preparar con\nmasa de hojaldre en\nlugar de masa filo."},{"id":562,"title":"Segundos platos Tortilla casera","category":"Desayunos","source":"40 recetas para la familia","page":32,"text":"Segundos platos\n69\n68\nTortilla casera\nMis recetas con\nAirfryer\nReceta ofrecida por: María José, Madrid\nNivel de dificultad:\nTiempo:\nINGREDIENTES para 4 personas\nPelar y cortar las patatas a láminas finas. Rociar las patatas con un poco de aceite.\nPrecalentar la Airfryer unos minutos a 200\no C.\nLuego disponer las patatas en la cesta de la Airfryer y ajustar el temporizador 10 minutos a\n200\no C. Reservar.\nA continuación cortar la cebolla, el pimiento y el perejil.\nEn un bol batir los huevos, añadir el queso cremoso y sazonar con sal y pimienta al gusto.\nMezclar los huevos batidos con las patatas, las verduras y el jamón cortado a trocitos.\nPrecalentar la Airfryer unos 3 minutos a 180\no C.\nMientras pasar la mezcl
