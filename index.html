f á cil","category":"Verduras y guarniciones","source":"Libro para principiantes","page":84,"text":"Br ó coli frito f á cil\nTiempo de preparación y cocción: 30 minutos | Raciones: 4\nIngredientes:\nJugo de ½ limón\n1 cucharada de semillas de sésamo\n1 cucharada de grasa de pato\n1 cabeza de brócoli\n3 dientes de ajo\nInstrucciones:\n1. Cabeza de brócoli, floretes separados, dientes de ajo; picados.\n2. Caliente su freidora de aire a 350°F.\n3. Añade la grasa de pato y caliéntala también.\n4. Añade el brócoli, el ajo, el zumo de limón y las semillas de sésamo;\n5. Mezclar y cocinar durante 20 minutos.\n6. Divida en los platos y sirva como а guarnición.\nValor nutricional (por raci ó n):\nCalorías: 132\nGrasa: 3 g\nCarbohidratos: 6 g\nProteínas: 4 g"},{"id":634,"title":"Plato de calabacines fritos","category":"Desayunos","source":"Libro para principiantes","page":85,"text":"Plato de calabacines fritos\nTiempo de preparación y cocción: 22 minutos | Raciones: 4\nIngredientes:\n1 taza de pan rallado\nUn chorrito de aceite de oliva\n½ taza de harina\n1 calabacín\n2 huevos\nSal y pimienta negra\nInstrucciones:\n1. Calabacín, cortado en bastones medianos, huevos, batidos.\n2. Poner la harina en un bol y mezclarla con la sal y la pimienta y remover.\n3. Poner el pan rallado en otro bol.\n4. En а tercer bol mezclar los huevos con а pizca de sal y pimienta.\n5. Pasar las patatas fritas de calabacín por harina; luego por los huevos y el\npan rallado al final.\n6. Engrasa tu freidora de aire con un poco de aceite de oliva, calienta a\n400°F.\n7. Añade las patatas fritas de calabacín y cocínalas durante 12 minutos.\n8. Sírvelas como una guarnición.\nValor nutricional (por raci ó n):\nCalorías: 172\nGrasa: 3 g\nCarbohidratos: 7 g\nProteínas: 3 g"},{"id":635,"title":"Br ó coli a la parmesana r á pido","category":"Verduras y guarniciones","source":"Libro para principiantes","page":86,"text":"Cap í tulo 7: Recetas de verduras\nBr ó coli a la parmesana r á pido\nTiempo de preparación y cocción: 15 minutos | Raciones: 2\nIngredientes:\n¼ de taza de queso parmesano\n3 tazas de ramilletes de brócoli\n2 dientes de ajo\n2 cucharadas de aceite de oliva\nInstrucciones:\n1. Queso rallado, dientes de ajo picados.\n2. Precalentar la freidora de aire a 360°F.\n3. Añadir todos los ingredientes en el bol grande y mezclar bien.\n4. Transfiera la mezcla de brócoli a la cesta de la freidora de aire.\n5. Cocinar durante unos 5 minutos.\n6. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 182\nGrasa: 15,2 g\nCarbohidratos: 10,2 g\nProteínas: 5,1 g"},{"id":636,"title":"Sabrosa y r á pida crema de espinacas","category":"Verduras y guarniciones","source":"Libro para principiantes","page":87,"text":"Sabrosa y r á pida crema de espinacas\nTiempo de preparación y cocción: 25 minutos | Raciones: 2\nIngredientes:\n¼ taza de queso parmesano\n½ cucharadita de nuez moscada molida\n2 cucharaditas de ajo picado\n4 onzas de queso crema\n1 cebolla pequeña\n10 oz de espinacas\n1 cucharadita de pimienta\n1 cucharadita de sal\nInstrucciones:\n1. Queso parmesano rallado, queso crema en dados, cebolla picada.\n2. Rociar una sartén de 6 pulgadas con aceite en aerosol y reservar.\n3. En un bol, mezclar las espinacas, el ajo, la cebolla, el queso crema, la nuez\nmoscada, la pimienta y la sal.\n4. Vierta la mezcla de espinacas en el molde preparado.\n5. Colocar el plato en la cesta de la freidora de aire y freír a 350°F durante 10\nminutos.\n6. Abrir la cesta de la freidora y espolvorear el queso parmesano sobre la\nmezcla de espinacas y freír a 400°F durante 5 minutos más.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 265\nGrasa: 21,4 g\nCarbohidratos: 11,9 g\nProteínas: 10,2 g"},{"id":637,"title":"Salsa de mantequilla y coles de Bruselas","category":"Otros","source":"Libro para principiantes","page":88,"text":"Salsa de mantequilla y coles de Bruselas\nTiempo de preparación y cocción: 14 minutos | Raciones: 4\nIngredientes:\n1 libra de coles de Bruselas\n1 cucharada de mostaza\n½ taza de tocino\n1 cucharada de mantequilla\n2 cucharadas de eneldo\nSal y pimienta negra\nInstrucciones:\n1. Tocino cocido y picado, eneldo finamente picado\n2. Ponga las coles de Bruselas en su freidora de aire y cocínelas a 350°F\ndurante 10 minutos.\n3. Calienta а sartén con la mantequilla a fuego medio-alto, añade el bacon, la\nmostaza y el eneldo y bate bien.\n4. Divida las coles de Bruselas entre los platos.\n5. Rociar la salsa de mantequilla por encima, y servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 162\nGrasa: 8 g\nCarbohidratos: 14 g\nProteínas: 5 g"},{"id":638,"title":"Deliciosos champiñones Portobello","category":"Verduras y guarniciones","source":"Libro para principiantes","page":89,"text":"Deliciosos champiñones Portobello\nTiempo de preparación y cocción: 22 minutos | Raciones: 4\nIngredientes:\n4 champiñones Portobello\n1 taza de almendras\n8 tomates cherry\n1 taza de espinacas baby\n3 dientes de ajo\n10 hojas de albahaca\n1 cucharada de perejil\n¼ de taza de aceite de oliva\nSal y pimienta negra\nInstrucciones:\n1. Los champiñones, sin los tallos y picados, los dientes de ajo, picados.\n2. Almendras, picadas gruesas, tomates, cortados por la mitad.\n3. En su procesador de alimentos, mezcle la albahaca con las espinacas, el\nperejil, el ajo, las almendras, el aceite, la sal, la pimienta negra al gusto y los\ntallos de los champiñones y mezcle bien.\n4. Rellena cada champiñón con esta mezcla, colócalos en tu freidora de aire\n5. Cocine a 350°F durante 12 minutos.\n6. Divida los champiñones entre los platos.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 145\nGrasa: 3 g\nCarbohidratos: 6 g\nProteínas: 17 g"},{"id":639,"title":"Tofu crujiente cl á sico","category":"Otros","source":"Libro para principiantes","page":90,"text":"Tofu crujiente cl á sico\nTiempo de preparación y cocción: 30 minutos | Raciones: 4\nIngredientes:\n1 bloque de tofu firme\n1 cucharada de harina de arrurruz\n2 cucharadas de salsa de soja\n2 cucharaditas de aceite de sésamo\n1 cucharadita de vinagre\nInstrucciones:\n1. Tofu, prensado y cortado en cubos de 1 pulgada.\n2. En un bol, mezcle el tofu con el vinagre, el aceite y la salsa de soja y déjelo\nreposar durante 15 minutos.\n3. Mezclar el tofu marinado con la harina de arrurruz.\n4. Rocíe la cesta de la freidora de aire con spray de cocina.\n5. Añada el tofu en la cesta de la freidora de aire y cocine durante 20 minutos\na 370 °F.\n6. Agite la cesta a mitad de camino.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 42\nGrasa: 0,5 g\nCarbohidratos: 1,3 g\nProteínas: 12,4 g"},{"id":640,"title":"Cazuela de jud í as verdes con setas","category":"Verduras y guarniciones","source":"Libro para principiantes","page":91,"text":"Cazuela de jud í as verdes con setas\nTiempo de preparación y cocción: 22 minutos | Raciones: 6\nIngredientes:\n1 ½ lbs de judías verdes\n2 tazas de champiñones\n½ cucharada de ajo en polvo\n½ cucharadita de salvia molida\n1 cucharadita de cebolla en polvo\n1 jugo de limón fresco\n¼ cucharadita de pimienta\n½ cucharadita de sal\nInstrucciones:\n1. Las judías verdes, recortadas, los champiñones, cortados en rodajas.\n2. En un tazón grande, combine todos los ingredientes y revuélvalos.\n3. Rocíe la cesta de la freidora de aire con spray de cocina.\n4. Transfiera la mezcla de judías verdes a la cesta de la freidora de aire.\n5. Cocine durante unos 12 minutos a 400°F.\n6. Agitar después de cada 3 minutos.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 45\nGrasa: 0,2 g\nCarbohidratos: 9,8 g\nProteínas: 3 g"},{"id":641,"title":"Coles de Bruselas tiernas","category":"Otros","source":"Libro para principiantes","page":92,"text":"Coles de Bruselas tiernas\nTiempo de preparación y cocción: 20 minutos | Raciones: 2\nIngredientes:\n2 tazas de coles de Bruselas\n1 cucharada de vinagre balsámico\n1 cucharada de aceite de oliva\n¼ cucharadita de sal marina\nInstrucciones:\n1. Coles de Bruselas, cortadas en rodajas.\n2. Añadir todos los ingredientes en el bol grande y mezclar bien.\n3. Rocía la cesta de la freidora de aire con spray de cocina.\n4. Transfiera la mezcla de coles de Bruselas a la cesta de la freidora de aire.\n5. Cocine las coles de Bruselas a 400°F durante 10 minutos.\n6. Agitar la cesta a mitad de camino.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 100\nGrasa: 7,3 g\nCarbohidratos: 8,1 g\nProteínas: 3 g"},{"id":642,"title":"Receta de jud í as y tomates","category":"Otros","source":"Libro para principiantes","page":93,"text":"Receta de jud í as y tomates\nTiempo de preparación y cocción: 25 minutos | Raciones: 4\nIngredientes:\n1 pinta de tomates cherry\n1 libra de judías verdes\n2 cucharadas de aceite de oliva\nSal y pimienta negra\nInstrucciones:\n1. En un tazón, combine todos los ingredientes y revuélvalos.\n2. Transfiera a su freidora de aire y cocine a 400°F, durante 15 minutos.\n3. Divida en platos y sirva de inmediato.\n4. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 162\nGrasa: 6 g\nCarbohidratos: 8 g\nProteínas: 9 g"},{"id":643,"title":"Coliflor sabrosa","category":"Verduras y guarniciones","source":"Libro para principiantes","page":94,"text":"Coliflor sabrosa\nTiempo de preparación y cocción: 57 minutos | Raciones: 2\nIngredientes:\n¼ de taza de queso parmesano\n3 cucharadas de mostaza de Dijon\n1 cucharadita de ajo en polvo\n1 cabeza de coliflor\n4 cucharadas de mantequilla\n1 zumo de limón\n2 cucharadas de aceite de oliva\n½ cucharadita de pimienta\n½ cucharadita de sal\nInstrucciones:\n1. Cabeza de coliflor, recortar las hojas exteriores, queso, rallado.\n2. Precalentar la freidora de aire a 400°F.\n3. En un bol pequeño, mezclar la mantequilla, el zumo de limón, el aceite, el\najo en polvo, la mostaza, la pimienta y la sal.\n4. Unte la coliflor con la mezcla de mantequilla y colóquela en la freidora de\naire.\n5. Cocinar la coliflor durante unos 45 minutos o hasta que esté tierna.\n6. Espolvorear con el queso parmesano y cocinar durante unos 5 minutos\nmás.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 655\nGrasa: 55 g\nCarbohidratos: 5,1 g\nProteínas: 25 g"},{"id":644,"title":"Jud í as verdes asi á ticas r á pidas","category":"Otros","source":"Libro para principiantes","page":95,"text":"Jud í as verdes asi á ticas r á pidas\nTiempo de preparación y cocción: 15 minutos | Raciones: 2\nIngredientes:\n8 oz de judías verdes\n1 cucharadita de aceite de sésamo\n1 cucharada de tamari\nInstrucciones:\n1. Las judías, recortadas y cortadas por la mitad.\n2. Añadir todos los ingredientes en el bol grande para mezclar y mezclar bien.\n3. Rocíe la cesta de la freidora de aire con spray de cocina.\n4. Transfiera las judías verdes a la cesta de la freidora de aire.\n5. Cocine a 400°F durante 10 minutos.\n6. Remover a mitad de camino.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 58\nGrasa: 2 g\nCarbohidratos: 8 g\nProteínas: 3 g"},{"id":645,"title":"Salsa de tomates y pimientos","category":"Verduras y guarniciones","source":"Libro para principiantes","page":96,"text":"Salsa de tomates y pimientos\nTiempo de preparación y cocción: 25 minutos | Raciones: 4\nIngredientes:\n1 cucharada de vinagre balsámico\n1 libra de tomates cherry\n1 cucharadita de romero seco\n2 pimientos rojos\n2 tomates\n2 cucharadas de aceite de oliva\n3 hojas de laurel\nSal y pimienta negra\nInstrucciones:\n1. Pimientos picados, tomates cortados por la mitad, tomates cortados por la\nmitad.\n2. En un bol mezclar los tomates con el ajo, la pimienta negra, la sal, el\nromero, las hojas de laurel, la mitad del vinagre y la mitad del aceite, remover\npara cubrir.\n3. Introducir en la freidora de aire y asarlos a 320°F, durante 15 minutos.\n4. Mientras tanto, en su procesador de alimentos, mezcle los pimientos con а\npizca de sal marina, pimienta negra, el resto del aceite y el resto del vinagre y\nmezcle muy bien.\n4. Divida los tomates asados entre los platos y rocíe la salsa de pimientos\nsobre ellos.\n5. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 123\nGrasa: 1 g\nCarbohidratos: 8 g\nProteínas: 10 g"},{"id":646,"title":"Receta de Patatas al Bals á mico","category":"Verduras y guarniciones","source":"Libro para principiantes","page":97,"text":"Receta de Patatas al Bals á mico\nTiempo de preparación y cocción: 30 minutos | Raciones: 4\nIngredientes:\n1 ½ cucharadas de vinagre balsámico\n1 ½ lbs de papas baby\n9 oz de tomates cherry\n2 ramitas de tomillo\n2 dientes de ajo\n3 cucharadas de aceite de oliva\n2 cebollas rojas\nSal y pimienta negra\nInstrucciones:\n1. Patatas cortadas por la mitad, ramitas de tomillo, dientes de ajo y cebollas\nrojas picadas.\n2. En su procesador de alimentos, mezcle el ajo con las cebollas, el aceite, el\nvinagre, el tomillo, la sal y la pimienta, y pulse bien.\n3. En un bol, mezclar las patatas con los tomates y la marinada de balsámico.\n4. Mezclar bien, transferir a su freidora de aire y cocinar a 380 °F durante 20\nminutos.\n5. 5. Dividir en platos y servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 301\nGrasa: 6 g\nCarbohidratos: 18 g\nProteínas: 6 g"},{"id":647,"title":"Berenjena crujiente picante","category":"Verduras y guarniciones","source":"Libro para principiantes","page":98,"text":"Cap í tulo 8: Recetas de bocadillos y aperitivos\nBerenjena crujiente picante\nTiempo de preparación y cocción: 25 minutos | Raciones: 4\nIngredientes:\n½ cucharadita de condimento italiano\n1 cucharadita de ajo en polvo\n½ cucharadita de pimienta roja\n2 cucharadas de aceite de oliva\n1 cucharadita de pimentón\n1 berenjena\nInstrucciones:\n1. Berenjena, cortada en trozos de 1 pulgada.\n2. Añadir todos los ingredientes en el bol grande y mezclar bien.\n3. Transfiera la mezcla de berenjenas a la cesta de la freidora de aire.\n4. Cocine a 375 °F durante 20 minutos.\n5. Agite la cesta a mitad de camino.\n6. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 99\nGrasa: 7,5 g\nCarbohidratos: 8,7 g\nProteínas: 1,5 g"},{"id":648,"title":"Nuggets de filete frito","category":"Desayunos","source":"Libro para principiantes","page":99,"text":"Nuggets de filete frito\nTiempo de preparación y cocción: 25 minutos | Raciones: 4\nIngredientes:\n½ taza de queso parmesano\n½ taza de corteza de cerdo\n1 libra de bistec de res\n1 huevo grande\n½ cucharadita de sal\nInstrucciones:\n1. Queso rallado, bistec de res cortado en trozos, corteza de cerdo triturada.\n2. Añadir el huevo en un bol pequeño, ligeramente batido.\n3. En un recipiente poco profundo, mezclar el queso, la corteza de cerdo y la\nsal.\n4. Sumergir cada trozo de filete en el huevo y luego cubrirlo con la mezcla de\ncorteza de cerdo.\n5. Colocar en un plato. Colocar en la nevera durante 30 minutos.\n6. Rocíe la cesta de la freidora de aire con spray de cocina.\n7. Precalentar la freidora de aire a 400°F.\n8. Colocar los nuggets de filete en la cesta de la freidora de aire y cocinar\ndurante unos 18 minutos.\n9. Agitar después de cada 4 minutos.\n10. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 609\nGrasa: 38 g\nCarbohidratos: 2 g\nProteínas: 63 g"},{"id":649,"title":"Chips de clara de huevo crujiente","category":"Desayunos","source":"Libro para principiantes","page":100,"text":"Chips de clara de huevo crujiente\nTiempo de preparación y cocción: 13 minutos | Raciones: 2\nIngredientes:\n2 cucharadas de parmesano\n½ cucharada de agua\n4 claras de huevo\nSal y pimienta negra\nInstrucciones:\n1. Parmesano rallado.\n2. En un bol, mezclar las claras de huevo con la pimienta, la sal y el agua y\nbatir bien.\n3. Vierte esto en а molde para muffins que se adapte a tu freidora de aire,\nespolvorea el queso por encima.\n4. Introdúcelo en tu freidora de aire, y cocina a 350°F, durante 8 minutos.\n5. 5. Coloca los chips de clara de huevo en una bandeja y sírvelos como un\naperitivo.\nValor nutricional (por raci ó n):\nCalorías: 180\nGrasa: 2 g\nCarbohidratos: 12 g\nProteínas: 7 g"},{"id":650,"title":"Bolas de Tocino con Jalapeños","category":"Verduras y guarniciones","source":"Libro para principiantes","page":101,"text":"Bolas de Tocino con Jalapeños\nTiempo de preparación y cocción: 14 minutos | Raciones: 3\nIngredientes:\n1 chile jalapeño picado\n3 oz de queso crema\n¼ cucharadita de cebolla en polvo\n½ cucharadita de perejil seco\n¼ cucharadita de ajo en polvo\nSal y pimienta negra\n3 rebanadas de tocino\nInstrucciones:\n1. Las lonchas de bacon, cocidas y desmenuzadas.\n2. En un tazón, mezcle el queso crema con el chile jalapeño, el ajo y la\ncebolla en polvo, el perejil, la sal y la pimienta del tocino y revuelva bien.\n3. Forma pequeñas bolas con esta mezcla, colócalas en la cesta de tu freidora\nde aire.\n4. Cocine a 350°F durante 4 minutos.\n5. Colocar en un plato y servir como aperitivo.\nValor nutricional (por raci ó n):\nCalorías: 172\nGrasa: 4 g\nCarbohidratos: 12 g\nProteínas: 5 g"},{"id":651,"title":"Tocino frito al aire f á cil y r á pido","category":"Carnes y aves","source":"Libro para principiantes","page":102,"text":"Tocino frito al aire f á cil y r á pido\nTiempo de preparación y cocción: 15 minutos | Raciones: 11\nIngredientes:\n11 rebanadas de tocino\nInstrucciones:\n1. Colocar la mitad de las lonchas de bacon en una cesta de la freidora de\naire.\n2. Cocine a 400°F durante 10 minutos.\n3. Cocine las medias rebanadas de tocino restantes siguiendo los mismos\npasos.\n4. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 103\nGrasa: 7,9 g\nCarbohidratos: 0,3 g\nProteínas: 7 g"},{"id":652,"title":"Bocaditos f á ciles de tocino crujiente","category":"Carnes y aves","source":"Libro para principiantes","page":103,"text":"Bocaditos f á ciles de tocino crujiente\nTiempo de preparación y cocción: 15 minutos | Raciones: 4\nIngredientes:\n4 tiras de tocino\n½ taza de cortezas de cerdo\n¼ de taza de salsa picante\nInstrucciones:\n1. Las tiras de tocino, cortadas en trozos pequeños, las cortezas de cerdo,\ntrituradas.\n2. Añadir los trozos de tocino a un bol, añadir la salsa picante y mezclar bien.\n3. 3. Añadir las cortezas de cerdo trituradas y mezclar hasta que los trozos de\ntocino estén bien cubiertos.\n4. Transfiera los trozos de tocino en una cesta de la freidora de aire y cocine a\n350 °F durante 10 minutos.\n5. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 112\nGrasa: 9,7 g\nCarbohidratos: 0,3 g\nProteínas: 5,2 g"},{"id":653,"title":"Paleta de jalapeños f á cil y r á pida","category":"Panes, pasta y aperitivos","source":"Libro para principiantes","page":104,"text":"Paleta de jalapeños f á cil y r á pida\nTiempo de preparación y cocción: 23 minutos | Raciones: 5\nIngredientes:\n5 chiles jalapeños\n¼ cucharadita de chile en polvo\n4 oz de queso de cabra\n½ cucharadita de ajo\n2 cucharadas de salsa\nPimienta y sal\nInstrucciones:\n1. Los chiles jalapeños, cortados por la mitad y sin semillas, el queso,\ndesmenuzado, el ajo, picado.\n2. En un tazón pequeño, combine todos los ingredientes excepto los chiles\njalapeños.\n3. Colocar la mezcla de queso en cada una de las mitades de los jalapeños y\ncolocarlas en la cesta de la freidora de aire.\n4. Cocinar los jalapeños poppers a 350°F durante 13 minutos.\n5. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 111\nGrasa: 8,3 g\nCarbohidratos: 2,1 g\nProteínas: 7,3 g"},{"id":654,"title":"Chips de repollo f á ciles","category":"Carnes y aves","source":"Libro para principiantes","page":105,"text":"Chips de repollo f á ciles\nTiempo de preparación y cocción: 40 minutos | Raciones: 6\nIngredientes:\n¼ de taza de queso parmesano rallado\n1 cabeza de col grande\n2 cucharadas de aceite de oliva\nPimienta y sal\nInstrucciones:\n1. Cabeza de col, romper las hojas de la col en trozos\n2. Precaliente la freidora de aire a 250°F.\n3. Añadir todos los ingredientes en el bol grande para mezclar y mezclar bien.\n4. Rocíe la cesta de la freidora de aire con spray de cocina.\n5. Dividir el repollo en tandas.\n6. Añade una tanda de trozos de col en la cesta de la freidora de aire.\n7. Cocinar durante 25-30 minutos a 250°F o hasta que los chips estén\ncrujientes y ligeramente dorados.\n8. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 96\nGrasa: 5,1 g\nCarbohidratos: 12,1 g\nProteínas: 3 g"},{"id":655,"title":"Palitos de queso crujientes fritos al aire","category":"Panes, pasta y aperitivos","source":"Libro para principiantes","page":106,"text":"Palitos de queso crujientes fritos al aire\nTiempo de preparación y cocción: 18 minutos | Raciones: 4\nIngredientes:\n½ taza de queso parmesano rallado\n6 palitos de queso mozzarella\n1 cucharadita de condimento italiano\n¼ cucharadita de ajo en polvo\n⅓ taza de harina de almendras\n¼ cucharadita de sal marina\n1 huevo grande\nInstrucciones:\n1. En un bol pequeño, bate el huevo.\n2. En un bol poco profundo, mezclar la harina de almendras, el condimento\nitaliano, el queso parmesano, el ajo en polvo y la sal.\n3. Sumergir el palito de queso mozzarella en el huevo y luego cubrirlo con la\nmezcla de harina de almendras y colocarlo en un plato.\n4. Colocar en la nevera durante 1 hora.\n5. Rocíe la cesta de la freidora de aire con spray de cocina.\n6. Colocar los palitos de queso mozzarella preparados en la cesta de la\nfreidora de aire.\n7. Cocine a 375 F durante 8 minutos.\n8. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 245\nGrasa: 18 g\nCarbohidratos: 3 g\nProteínas: 19 g"},{"id":656,"title":"Alb ó ndigas de cordero al estilo griego","category":"Carnes y aves","source":"Libro para principiantes","page":107,"text":"Alb ó ndigas de cordero al estilo griego\nTiempo de preparación y cocción: 18 minutos | Raciones: 10\nIngredientes:\n1 rebanada de pan\n2 cucharadas de queso feta desmenuzado\n½ cucharada de cáscara de limón rallada\n4 onzas de carne de cordero picada\n1 cucharada de orégano picado\nSal y pimienta negra\nInstrucciones:\n1. Tostar el pan y desmenuzarlo en forma de migas.\n2. En un bol pequeño, combinar todos los ingredientes y mezclar bien.\n3. Dar forma a las albóndigas del tamaño adecuado y colocarlas en la freidora\nde aire.\n4. Cocinar a 400°F durante 8 minutos.\n5. Colóquelas en una bandeja y sírvalas como aperitivo.\nValor nutricional (por raci ó n):\nCalorías: 234\nGrasa: 12 g\nCarbohidratos: 20 g\nProteínas: 30 g"},{"id":657,"title":"Pimientos rellenos crujientes","category":"Verduras y guarniciones","source":"Libro para principiantes","page":108,"text":"Pimientos rellenos crujientes\nTiempo de preparación y cocción: 18 minutos | Raciones: 8\nIngredientes:\n8 pimientos pequeños\n3.5 oz de queso de cabra\n1 cucharada de aceite de oliva\nSal y pimienta negra\nInstrucciones:\n1. Pimientos morrones; se les corta la parte superior y se les quita las\nsemillas, el queso, se corta en 8 pedazos.\n2. En а bol, mezclar el queso con el aceite con sal y pimienta y revolver para\ncubrir.\n3. Rellene cada pimiento con queso de cabra, colóquelos en la cesta de su\nfreidora de aire.\n4. Cocinar a 400°F durante 8 minutos.\n5. Colóquelos en una bandeja y sírvalos como aperitivo.\nValor nutricional (por raci ó n):\nCalorías: 120\nGrasa: 1 g\nCarbohidratos: 12 g\nProteínas: 8 g"},{"id":658,"title":"Salsa de Cangrejo Perfecta y R á pida","category":"Carnes y aves","source":"Libro para principiantes","page":109,"text":"Salsa de Cangrejo Perfecta y R á pida\nTiempo de preparación y cocción: 12 minutos | Raciones: 4\nIngredientes:\n2 cucharadas de jugo de limón fresco\n½ taza de cebolla verde\n¼ de taza de mayonesa\n2 cucharadas de perejil\n2 tazas de queso\n2 cucharadas de salsa picante\n1 taza de carne de cangrejo\n¼ cucharadita de pimienta\n½ cucharadita de sal\nInstrucciones:\n1. Cebolla, en rodajas, queso, rallado, perejil, picado.\n2. En un plato, mezclar el queso, la carne de cangrejo, la salsa picante, la\nmayonesa, la pimienta y la sal.\n3. Coloque el plato en la cesta de la freidora de aire y cocine el dip a 400°F\ndurante 7 minutos.\n4. Retire el plato de la freidora de aire.\n5. Rociar el dip con jugo de limón y adornar con perejil.\n6. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 313\nGrasa: 23,9 g\nCarbohidratos: 8,8 g\nProteínas: 16,2 g"},{"id":659,"title":"Chips de manzana especiales con salsa","category":"Postres","source":"Libro para principiantes","page":110,"text":"Cap í tulo 9: Recetas de postres\nChips de manzana especiales con salsa\nTiempo de preparación y cocción: 22 minutos | Raciones: 4\nIngredientes:\n1 cucharadita de canela molida\n1 cucharada de mantequilla de almendras\n¼ de taza de yogur natural\n4 gotas de stevia líquida\n2 cucharaditas de aceite de oliva\n1 manzana\nInstrucciones:\n1. La manzana, en rodajas finas.\n2. Añadir las rodajas de manzana, la canela y el aceite en un bol grande y\nmezclar bien.\n3. Rocía la cesta de la freidora de aire con spray de cocina.\n4. Colocar las rodajas de manzana en la cesta de la freidora de aire.\n5. Cocine a 375°F durante 12 minutos.\n6. Girar cada 4 minutos.\n7. Mientras tanto, en un tazón pequeño, mezclar la mantequilla de almendras,\nel edulcorante y el yogur.\n8. Servir los chips de manzana con la salsa y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 86\nGrasa: 4,9 g\nCarbohidratos: 10 g\nProteínas: 1,9 g"},{"id":660,"title":"Receta de pastel de semillas de amapola dulce","category":"Postres","source":"Libro para principiantes","page":111,"text":"Receta de pastel de semillas de amapola dulce\nTiempo de preparación y cocción: 40 minutos | Raciones: 6\nIngredientes:\n1 cucharada de ralladura de naranja\n2 cucharaditas de ralladura de lima\n2 cucharadas de semillas de amapola\n1 cucharadita de polvo de hornear\n1 ¼ tazas de harina\n½ taza de mantequilla\n2 huevos\n½ cucharadita de extracto de vainilla\n¾ de taza de azúcar\n1 taza de leche\nPara la crema\n½ taza de puré de maracuyá\n3 cucharadas de mantequilla\n1 taza de azúcar\n4 yemas de huevo\nInstrucciones:\n1. En un tazón, mezcle la harina con el polvo para hornear, la ralladura de\nnaranja, ¾ de taza de azúcar y la ralladura de lima, y revuelva.\n2. Añadir ½ taza de mantequilla, vainilla, huevos, semillas de amapola y\nleche.\n3. Revuelve con tu batidora, vierte en а molde para pasteles que se ajuste a tu\nfreidora de aire.\n4. Cocine a 350°F durante unos 30 minutos.\n5. Mientras tanto calienta а sartén con 3 cucharadas de mantequilla a fuego\nmedio, añade el azúcar y remueve hasta que se disuelva.\n6. Retirar del fuego, añadir poco a poco las yemas de huevo y el puré de"},{"id":661,"title":"Manzanas con especias que hacen la boca agua","category":"Postres","source":"Libro para principiantes","page":113,"text":"Manzanas con especias que hacen la boca agua\nTiempo de preparación y cocción: 20 minutos | Raciones: 6\nIngredientes:\n2 cucharadas de aceite de coco\n4 manzanas pequeñas, cortadas en rodajas\n1 cucharadita de especias para tartas de manzana\n½ taza de eritritol\nInstrucciones:\n1. Colocar la manzana pequeña, cortarla en rodajas.\n2. Añade las rodajas de manzana en un bol para mezclar y la especia para\ntartas de manzana, espolvorea el edulcorante y el aceite de coco sobre la\nmanzana, y remueve para cubrirla.\n3. Transfiera las rodajas de manzana a un plato de la freidora de aire.\n4. Coloque el plato en la cesta de la freidora de aire y cocine a 350 °F durante\n10 minutos.\n5. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 73\nGrasa: 4,6 g\nCarbohidratos: 8,2 g\nProteínas: 0 g"},{"id":662,"title":"Deliciosas galletas de naranja","category":"Postres","source":"Libro para principiantes","page":114,"text":"Deliciosas galletas de naranja\nTiempo de preparación y cocción: 22 minutos | Raciones: 8\nIngredientes:\n1 cucharada de ralladura de naranja\n1 cucharadita de polvo de hornear\n1 cucharadita de extracto de vainilla\n½ taza de mantequilla\n1 huevo\n¾ de taza de azúcar\n2 tazas de harina\nPara el relleno\n4 onzas de queso crema\n2 tazas de azúcar en polvo\n½ taza de mantequilla\nInstrucciones:\n1. Batir los huevos.\n2. En а tazón, mezclar el queso crema con ½ taza de mantequilla y 2 tazas de\nazúcar en polvo.\n3. Remover bien con la batidora y dejar de lado por ahora.\n4. En otro bol, mezcla la harina con la levadura en polvo.\n5. En а tercer bol, mezcla ½ taza de mantequilla con el huevo, ¾ de taza de\nazúcar, el extracto de vainilla y la ralladura de naranja y bate bien.\n6. Combinar la harina con la mezcla de naranja.\n7. Revuelve bien y pon 1 cucharada de la mezcla en а bandeja de horno\nforrada que se ajuste a tu freidora de aire.\n8. Repita con el resto de la masa de naranja, introduzca en la freidora y\ncocine a 340°F durante 12 minutos.\n9. Deje enfriar las galletas, extienda el relleno de crema en la mitad de la\nparte superior con las otras galletas."},{"id":663,"title":"Pud í n de almendras y mandarinas","category":"Desayunos","source":"Libro para principiantes","page":116,"text":"Pud í n de almendras y mandarinas\nTiempo de preparación y cocción: 60 minutos | Raciones: 8\nIngredientes:\nZumo de 2 mandarinas\n2 cucharadas de azúcar moreno\n¾ de taza de harina blanca\n¾ de taza de almendras\n4 onzas de mantequilla blanda\n¾ de taza de azúcar\n1 mandarina\n2 huevos\nMiel\nInstrucciones:\n1. Mandarina pelada y cortada en rodajas, almendras molidas.\n2. Engrasar а molde de pan con un poco de mantequilla, espolvorear azúcar\nmoreno en el fondo y disponer las rodajas de mandarina.\n3. En а bol, mezclar la mantequilla con los huevos, las almendras, el azúcar,\nla harina y el jugo de las mandarinas.\n4. Revuelve, pon esto sobre las rodajas de mandarina, coloca la sartén en tu\nfreidora de aire, y cocina a 360°F, durante 40 minutos.\n5. Transfiera el pudín a un plato y sírvalo con miel por encima.\nValor nutricional (por raci ó n):\nCalorías: 162\nGrasa: 3 g\nCarbohidratos: 3 g\nProteínas: 6 g"},{"id":664,"title":"Sabrosas Galletas de Choco Chips","category":"Postres","source":"Libro para principiantes","page":117,"text":"Sabrosas Galletas de Choco Chips\nTiempo de preparación y cocción: 25 minutos | Raciones: 4\nIngredientes:\n2 cucharadas de chips de chocolate sin azúcar\n2 cucharadas de nueces de macadamia trituradas\n¼ cucharadita de levadura en polvo\n1 taza de harina de almendra\n3 cucharadas de mantequilla\n1 cucharadita de vainilla\nUna pizca de sal\n1 huevo\nInstrucciones:\n1. En un bol, bata el huevo con la batidora.\n2. Añadir la mantequilla, la harina de almendras, la levadura en polvo, la\nvainilla y la sal y mezclar bien.\n3. Añadir las nueces de macadamia y los chips de Chocó y mezclar hasta que\nse forme la masa.\n4. Precalentar la freidora de aire a 360°F.\n5. Hacer las galletas con la masa y colocarlas en la freidora de aire.\n6. Cocine durante 15 minutos.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 215\nGrasa: 20 g\nCarbohidratos: 4,5 g\nProteínas: 4 g"},{"id":665,"title":"Receta de barritas de lim ó n caseras","category":"Desayunos","source":"Libro para principiantes","page":118,"text":"Receta de barritas de lim ó n caseras\nTiempo de preparación y cocción: 35 minutos | Raciones: 6\nIngredientes:\nJugo de 2 limones\n1 taza de mantequilla blanda\n2 ¼ tazas de harina\n2 tazas de azúcar\n4 huevos\nInstrucciones:\n1. En а tazón, mezcle la mantequilla con 2 tazas de harina y ½ taza de azúcar,\nrevuelva bien.\n2. Presione en el fondo de а sartén que se ajuste a su freidora de aire,\nintroduzca en la freidora.\n3. Cocinar a 350°F durante 10 minutos.\n4. En otro recipiente, mezcle el resto del azúcar con el resto de la harina, el\njugo de limón y los huevos, bata bien y extienda sobre la corteza.\n5. Introducir en la freidora a 350°F durante 15 minutos más.\n6. Dejar enfriar, cortar las barras y servirlas.\nValor nutricional (por raci ó n):\nCalorías: 125\nGrasa: 4 g\nCarbohidratos: 16 g\nProteínas: 2 g"},{"id":666,"title":"Receta de galletas de lentejas con coco","category":"Postres","source":"Libro para principiantes","page":119,"text":"Receta de galletas de lentejas con coco\nTiempo de preparación y cocción: 35 minutos | Raciones: 36\nIngredientes:\n1 taza de coco\n1 taza de lentejas enlatadas\n1 taza de mantequilla blanda\n1 taza de harina blanca\n½ taza de azúcar moreno\n½ taza de azúcar blanco\n½ cucharadita de nuez moscada molida\n1 cucharadita de canela en polvo\n1 taza de harina de trigo integral\n1 cucharadita de polvo de hornear\n2 cucharaditas de extracto de almendra\n1 taza de pasas\n1 taza de copos de avena\n1 huevo\n1 taza de agua\nInstrucciones:\n1. Coco, sin endulzar y rallado, lentejas enlatadas, escurridas y machacadas.\n2. En un bol, mezclar la harina blanca y la harina integral con la canela, la sal,\nla levadura en polvo y la nuez moscada y remover.\n3. En а bol, mezclar la mantequilla con el azúcar blanco y moreno y remover\ncon la batidora de cocina durante 2 minutos.\n4. Añade el huevo, el extracto de almendra, la mezcla de lentejas, la mezcla\nde harina, la avena, el coco y las pasas, y remueve todo bien.\n5. Poner cucharadas de masa en una bandeja de horno forrada que se ajuste a\ntu freidora de aire, introducirlas en la freidora y cocinar a 350 °F, durante 15\nminutos."},{"id":667,"title":"Tarta de queso f á cil y deliciosa","category":"Postres","source":"Libro para principiantes","page":121,"text":"Tarta de queso f á cil y deliciosa\nTiempo de preparación y cocción: 20 minutos | Raciones: 6\nIngredientes:\n16 oz de queso crema ablandado\n½ cucharadita de jugo de limón fresco\n2 cucharadas de crema agria\n¾ de taza de eritritol\n1 cucharadita de vainilla\n2 huevos\nInstrucciones:\n1. Precaliente la freidora de aire a 350°F.\n2. Añadir el zumo de limón, los huevos, la vainilla y el edulcorante en un bol\ngrande y batir con una batidora de mano hasta que esté suave.\n3. Añadir la crema agria y el queso crema y batir hasta que esté esponjoso.\n4. Verter la masa en 2 moldes de cuatro pulgadas, colocarlos en la cesta de la\nfreidora de aire.\n5. Cocinar a 350°F durante unos 10 minutos.\n6. Sacar de la freidora de aire y dejar enfriar completamente.\n7. Colocar en el refrigerador durante toda la noche.\n8. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 296\nGrasa: 28 g\nCarbohidratos: 2,4 g\nProteínas: 7,7 g"},{"id":668,"title":"Receta de tarta de lim ó n y ciruelas","category":"Postres","source":"Libro para principiantes","page":122,"text":"Receta de tarta de lim ó n y ciruelas\nTiempo de preparación y cocción: 1 hora y 20 minutos | Raciones: 8\nIngredientes:\n1 paquete de levadura seca\n1 oz de copos de almendra\n3 oz de leche tibia\n1 oz de mantequilla blanda\n1 huevo batido\n1 limón rallado\n1 ¾ lbs de ciruelas\n5 cucharadas de azúcar\n7 onzas de harina\nInstrucciones:\n1. Ciruelas deshuesadas y cortadas en cuartos.\n2. En un bol, mezclar la levadura con la mantequilla, la harina y 3 cucharadas\nde azúcar y remover bien.\n3. Añadir la leche y el huevo y batir durante 4 minutos hasta obtener а masa.\n4. Dispón la masa en а molde desmontable que se adapte a tu freidora de aire\ny que hayas engrasado con un poco de mantequilla, tápalo y déjalo reposar\ndurante 1 hora.\n5. Acomoda las gorditas sobre la mantequilla, espolvorea el resto del azúcar,\nintroduce en tu freidora de aire a 350°F, hornea por 36 minutos.\n6. Enfriar, espolvorear copos de almendra y ralladura de limón por encima,\ncortar en rodajas.\n7. Servir y disfrutar.\nValor nutricional (por raci ó n):\nCalorías: 192\nGrasa: 4 g\nCarbohidratos: 6 g"},{"id":669,"title":"Mezcla de mantequilla de coco e higos","category":"Desayunos","source":"Libro para principiantes","page":124,"text":"Mezcla de mantequilla de coco e higos\nTiempo de preparación y cocción: 10 minutos | Raciones: 3\nIngredientes:\n2 cucharadas de mantequilla de coco\n1 taza de almendras\n¼ taza de azúcar\n12 higos\nInstrucciones:\n1. Las almendras, tostadas y picadas, los higos, partidos por la mitad.\n2. Ponga la mantequilla en una sartén que se ajuste a su freidora de aire y\nderrítala a fuego medio-alto.\n3. Añada el azúcar, los higos y las almendras, mezcle, introduzca en su\nfreidora de aire y cocine a 300°F durante 4 minutos.\n3. 4. Divida en tazones y sirva frío.\nValor nutricional (por raci ó n):\nCalorías: 170\nGrasa: 4 g\nCarbohidratos: 7 g\nProteínas: 9 g"},{"id":670,"title":"Pastel cl á sico de coco","category":"Postres","source":"Libro para principiantes","page":125,"text":"Pastel cl á sico de coco\nTiempo de preparación y cocción: 22 minutos | Raciones: 6\nIngredientes:\n1 taza de coco rallado\n1 ½ tazas de leche de coco\n½ taza de harina de coco\n½ taza de eritritol\n1 ½ cucharadita de vainilla\n¼ taza de mantequilla\n2 huevos\nInstrucciones:\n1. Añadir todos los ingredientes en el bol grande y mezclar hasta que estén\nbien combinados.\n2. Rociar una fuente de horno con aceite en aerosol.\n3. Vierta la masa en la fuente preparada y colóquela en la cesta de la freidora\nde aire.\n4. Cocinar a 350°F durante 1os 12 minutos aproximadamente.\n5. Cortar y servir.\nValor nutricional (por raci ó n):\nCalorías: 282\nGrasa: 28,9 g\nCarbohidratos: 6,3 g\nProteínas: 4 g"},{"id":671,"title":"PIZZA FUGAZZETA (CEBOLLA Y QUESO) PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":10,"text":"PIZZA FUGAZZETA\n(CEBOLLA Y QUESO)\nPROCEDIMIENTO\nINGREDIENTES\nRINDE: 1 PIZZA INDIVIDUAL\nRehogá la cebolla con un poco\nde aceite hasta que esté\ntransparente.\nColocá sobre la base de pizza,\ncubrí con queso y espolvoreá\norégano.\nCociná 10 minutos a 190 °C\nTIEMPO TOTAL:25 MINUTOS\n1 prepizza o base casera\n1 cebolla grande en pluma\n150 g de muzzarella\nAceite de oliva, sal y\norégano"},{"id":672,"title":"MINI PIZZAS CON TAPA DE EMPANADA PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":11,"text":"MINI PIZZAS CON\nTAPA DE\nEMPANADA\nPROCEDIMIENTO\nINGREDIENTES\nRINDE: 1 PIZZA INDIVIDUAL\nArmá las tapitas con salsa y\nqueso.\nSumá toppings si querés.\nCociná 6–8 minutos a 200 °C, de\na tandas.\nTIEMPO TOTAL:15 MINUTOS\n4 tapas de empanada\n(hojaldradas o criollas)\nSalsa de tomate\nQueso rallado o muzzarella\nOpcionales: jamón,\naceitunas, choclo"},{"id":673,"title":"PIZZA CON BASE DE AVENA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":12,"text":"PIZZA CON\nBASE DE AVENA\nPROCEDIMIENTO\nINGREDIENTES\nRINDE: 1 PIZZA INDIVIDUAL\nMezclá la avena, el huevo, sal,\norégano y queso rallado si usás.\nFormá un círculo tipo base sobre\npapel manteca o papel aluminio\ncon spray antiadherente.\nPre-cociná la base en la air fryer a\n180°C por 5 minutos.\nSacá, agregá la salsa, el queso y\nlos toppings.\nVolvé a cocinar a 180°C por 5-7\nminutos más hasta que derrita el\nqueso.\nTIEMPO TOTAL: 15 MINUTOS\n4 cucharadas de avena\nmolida o instantánea\n1 huevo\n2 cucharadas de queso\nrallado (opcional)\n1 pizca de sal y orégano\n2 cucharadas de salsa de\ntomate natural\n30 g de queso bajo en grasa\n(tipo mozzarella light)\nVerduras a gusto: tomate,\nmorrón, champiñones, etc."},{"id":674,"title":"PIZZA CON TORTILLA INTEGRAL PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":13,"text":"PIZZA CON\nTORTILLA\nINTEGRAL\nPROCEDIMIENTO\nINGREDIENTES\nRINDE:1 PIZZA FINA Y CROCANTE\nColocá la tortilla en la canasta de\nla air fryer.\nAgregá salsa, queso, toppings.\nCociná a 180°C por 6-8 minutos\nhasta que el queso se derrita y la\nbase quede crocante.\nTIEMPO TOTAL: 10 MINUTOS\n1 tortilla integral (tamaño\nwrap)\n2 cucharadas de salsa de\ntomate natural\n40 g de queso mozzarella\nlight o vegano\n2 cucharadas de choclo\ncocido\n2 rodajas de tomate\nAlbahaca o rúcula\n(opcional)"},{"id":675,"title":"MINI PIZZA CON BASE DE BERENJENA PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":14,"text":"MINI PIZZA\nCON BASE DE\nBERENJENA\nPROCEDIMIENTO\nINGREDIENTES\nRINDE:2 MINI PIZZAS (1 PERSONA)\nRociá las rodajas de berenjena\ncon aceite y condimentos.\nCociná en la air fryer a 180°C por\n6-7 minutos.\nAgregá salsa, queso y toppings.\nVolvé a cocinar a 180°C por 5\nminutos más.\nTIEMPO TOTAL: 15 MINUTOS\n1 berenjena mediana en\nrodajas de 1,5 cm\n2 cucharadas de salsa de\ntomate\n30 g de queso light rallado\nOrégano, pimienta, ajo en\npolvo\nAceite en spray"},{"id":676,"title":"PIZZA CON BASE DE GARBANZO PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":15,"text":"PIZZA CON\nBASE DE\nGARBANZO\nPROCEDIMIENTO\nINGREDIENTES\nRINDE:1 PIZZA (1-2 PERSONAS)\nMezclá la harina, agua, aceite y\ncondimentos. Dejá reposar 5\nminutos.\nVerté en forma de círculo sobre\npapel manteca.\nPre-cociná en la air fryer a 180°C\npor 6 minutos.\nAñadí salsa, queso y toppings.\nCociná 6-8 minutos más a 180°C.\nTIEMPO TOTAL: 20 MINUTOS\n4 cucharadas de harina de\ngarbanzo\n4 cucharadas de agua\n1 cucharadita de aceite de\noliva\nSal, ajo en polvo y orégano\n2 cucharadas de salsa de\ntomate\n40 g de queso mozzarella\nlight\nToppings: cebolla,\nchampiñón, espinaca, etc."},{"id":677,"title":"PIZZA PROTEICA CON BASE DE POLLO PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":16,"text":"PIZZA\nPROTEICA CON\nBASE DE POLLO\nPROCEDIMIENTO\nINGREDIENTES\nRINDE:1 PIZZA PERSONAL\nMezclá el pollo picado, la clara, el\nqueso y condimentos.\nFormá una base redonda sobre\npapel manteca.\nCociná a 180°C por 7-8 minutos\nhasta que se dore.\nAgregá salsa, queso y toppings.\nVolvé a la air fryer por 5-7\nminutos más.\nTIEMPO TOTAL: 20 MINUTOS\n100 g de pechuga de pollo\ncocida y procesada\n1 clara de huevo\n1 cucharada de queso\nrallado light (opcional)\nEspecias a gusto\n2 cucharadas de salsa de\ntomate\n30 g de queso bajo en grasa\nVerduras a gusto"},{"id":678,"title":"PIZZA CON BASE DE ARROZ INTEGRAL PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":17,"text":"PIZZA CON\nBASE DE\nARROZ\nINTEGRAL\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA (1-2 PERSONAS)\nMezclá el arroz cocido con el\nhuevo, queso y condimentos.\nFormá la base sobre papel\nmanteca, aplastando bien.\nCociná en la air fryer a 180°C por\n8 minutos.\nAgregá salsa, queso y toppings.\nVolvé a cocinar a 180°C por 6-8\nminutos más.\nTOTAL: 20 MINUTOS\n1 taza de arroz integral\ncocido\n1 huevo\n2 cucharadas de queso\nrallado (opcional)\nSal, orégano\n2 cucharadas de salsa de\ntomate\n30-40 g de queso bajo en\ngrasa\nToppings: cebolla morada,\nchampiñones, albahaca\nRINDE:\nTIEMPO:"},{"id":679,"title":"PIZZA DE ZUCCHINI PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":18,"text":"PIZZA DE\nZUCCHINI\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA PERSONAL\nMezclá el zucchini escurrido con\nel huevo, avena y condimentos.\nFormá la base sobre papel\nmanteca.\nCociná a 180°C por 8-10 minutos,\nhasta que se dore.\nSumá salsa, queso y toppings.\nCociná 6 minutos más a 180°C.\n25 MINUTOS\n1 zucchini rallado y\nescurrido\n1 huevo\n1 cucharada de avena o\nharina de almendras\n(opcional)\nSal, pimienta, orégano\nSalsa de tomate natural\nQueso light o vegano\nToppings: aceitunas, tomate\nseco, rúcula\nRINDE:\nTIEMPO:"},{"id":680,"title":"PIZZA CON PAN ÁRABE INTEGRAL PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":19,"text":"PIZZA CON\nPAN ÁRABE\nINTEGRAL\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA PERSONAL\nColocá el pan árabe en la air\nfryer.\nSumá salsa, queso y toppings.\nCociná a 180°C por 5 minutos.\nSi le vas a agregar un huevo,\nhacelo ahora y cociná 5 minutos\nmás o hasta que se cocine la\nclara.\n10 MINUTOS\n1 pan árabe integral fino\n2 cucharadas de salsa de\ntomate casera\n30 g de queso mozzarella\nlight\n1 huevo (opcional, para\nhacerla tipo pizza a caballo)\nToppings: espinaca\nsalteada, cebolla\ncaramelizada\nRINDE:\nTIEMPO:"},{"id":681,"title":"PIZZA CON BASE DE LENTEJAS PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":20,"text":"PIZZA CON\nBASE DE\nLENTEJAS\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA PERSONAL\nProcesá las lentejas con el huevo\ny condimentos hasta formar una\nmasa.\nFormá la base y cociná en la air\nfryer a 180°C por 10 minutos.\nSumá salsa, queso y toppings.\nCociná a 180°C por 7-8 minutos\nmás.\n25 MINUTOS\n1 taza de lentejas cocidas\n1 huevo\n1 cucharadita de comino o\npimentón\n2 cucharadas de avena\n(opcional para dar textura)\nSalsa de tomate natural\nQueso light\nToppings: morrón, cebolla,\narvejas\nRINDE:\nTIEMPO:"},{"id":682,"title":"PIZZA DULCE SALUDABLE PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":21,"text":"PIZZA\nDULCE\nSALUDABLE\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\nColocá la base en la air fryer y\ncociná sola 3-4 minutos a 180°C\nhasta que esté apenas crocante.\nUntá con la mantequilla de maní\no yogur, agregá frutas y\nchocolate o coco.\nVolvé a calentar por 2-3 minutos\nmás para derretir el chocolate.\n¡Listo!\n10 MINUTOS\n1 tortilla integral o pan de\narroz redondo\n1 cucharada de mantequilla\nde maní o yogur griego\nRodajas de banana o frutilla\nChips de chocolate 70% o\ncoco rallado\nCanela (opcional)\nRINDE:\nTIEMPO:"},{"id":683,"title":". PIZZA CAPRESE CON BASE DE COLIFLOR PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":22,"text":". PIZZA\nCAPRESE CON\nBASE DE\nCOLIFLOR\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA MEDIANA\nMezclá la coliflor con el huevo,\nqueso y condimentos.\nFormá la base sobre papel\nmanteca y cociná a 180°C por 8-\n10 minutos.\nAgregá la salsa, queso y rodajas\nde tomate.\nVolvé a cocinar 6-8 minutos más.\nDecorá con albahaca fresca al\nfinal.\n25 MINUTOS\n1 taza de coliflor cocida y\nprocesada\n1 huevo\n2 cucharadas de queso\nrallado (opcional)\nSal, pimienta, orégano\n2 cucharadas de salsa de\ntomate\n3 rodajas de tomate\n3-4 rodajas de mozzarella\nlight o queso vegano\nHojas de albahaca fresca\nRINDE:\nTIEMPO:"},{"id":684,"title":"PIZZA MEDITERRÁNEA CON HUMMUS (SIN QUESO) PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":23,"text":"PIZZA\nMEDITERRÁNEA\nCON HUMMUS\n(SIN QUESO)\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA INDIVIDUAL\nUntá la base con hummus.\nAgregá los vegetales y\ncondimentos.\nCociná en la air fryer a 180°C por\n6-7 minutos hasta que la base\nesté crocante y los vegetales\ndoraditos.\n10 MINUTOS\n1 pan pita integral o tortilla\n2 cucharadas de hummus\nnatural\n4 rodajas de tomate cherry\n2 cucharadas de aceitunas\nnegras en rodajas\nCebolla morada en tiras\nfinas\nOrégano y un chorrito de\noliva\nRINDE:\nTIEMPO:"},{"id":685,"title":"PIZZA DE CHAMPIÑONES Y ESPINACA PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":24,"text":"PIZZA DE\nCHAMPIÑONES\nY ESPINACA\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA INDIVIDUAL\nArmá la base con salsa, espinaca,\nchampiñones y queso.\nCociná en la air fryer a 180°C por\n7-8 minutos o hasta que el queso\nderrita y la base se dore.\n15 MINUTOS\n1 base de avena, garbanzo o\npan árabe integral\n2 cucharadas de salsa de\ntomate casera\n40 g de queso mozzarella\nlight o vegano\n½ taza de espinaca cocida o\ncruda\n3 champiñones frescos\nfileteados\nAjo en polvo, pimienta\nRINDE:\nTIEMPO:"},{"id":686,"title":"PIZZA DE CALABAZA Y RICOTA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":25,"text":"PIZZA DE\nCALABAZA Y\nRICOTA\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA INDIVIDUAL\nUntá la base con puré de\ncalabaza y ricota.\nEspolvoreá con queso y semillas.\nCociná a 180°C por 8 minutos.\nAgregá hojas verdes al servir.\n20 MINUTOS\n1 base de tortilla o avena\n3 cucharadas de puré de\ncalabaza condimentado\n(sal, nuez moscada)\n2 cucharadas de ricota\nmagra o vegana\nQueso rallado light\n(opcional)\nSemillas de sésamo o\ngirasol\nHojas verdes (rúcula o\nespinaca cruda)\nRINDE:\nTIEMPO:"},{"id":687,"title":"PIZZA TROPICAL VEGETARIANA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":26,"text":"PIZZA\nTROPICAL\nVEGETARIANA\nPROCEDIMIENTO\nINGREDIENTES\n1 PIZZA INDIVIDUAL\nArmá la pizza con la salsa, queso,\nananá y morrón.\nCociná a 180°C por 8-10 minutos\nhasta que el queso se gratine.\n10-12 MINUTOS\n1 tortilla o pan pita integral\n2 cucharadas de salsa de\ntomate o pesto\n30 g de queso mozzarella\nlight\n2 rodajas de ananá natural o\nen su jugo (no en almíbar)\nMorrón en tiras\nOrégano y pimienta\nRINDE:\nTIEMPO:"},{"id":688,"title":"SALTEADO DE BRÓCOLI Y ZANAHORIA AL LIMÓN PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":27,"text":"SALTEADO DE\nBRÓCOLI Y\nZANAHORIA AL\nLIMÓN\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\nMezclá las verduras con aceite,\nsal, pimienta y ralladura de\nlimón.\nCociná en la air fryer a 180°C por\n10-12 minutos, moviendo a mitad\nde cocción.\n12 MINUTOS\n1 taza de brócoli en ramitos\n1 zanahoria en bastones\nfinos\n1 cucharadita de aceite de\noliva\nRalladura de ½ limón\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":689,"title":"SALTEADO DE MORRONES TRICOLOR CON CEBOLLA PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":28,"text":"SALTEADO DE\nMORRONES\nTRICOLOR CON\nCEBOLLA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\nMezclá todo en un bowl.\nCociná a 180°C por 10-12 minutos,\nrevolviendo a la mitad.\n12 MINUTOS\n½ morrón rojo, ½ amarillo y\n½ verde, en tiras\n½ cebolla en pluma\n1 cucharadita de aceite\nOrégano, sal, ajo en polvo\nRINDE:\nTIEMPO:"},{"id":690,"title":"MIX DE BERENJENA, ZUCCHINI Y TOMATE CHERRY PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":29,"text":"MIX DE\nBERENJENA,\nZUCCHINI Y\nTOMATE CHERRY\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\nMezclá todos los ingredientes.\nCociná en la air fryer a 180°C por\n13-14 minutos.\n14 MINUTOS\n½ berenjena en cubos\n½ zucchini en rodajas\n6 tomates cherry enteros\n1 cucharadita de aceite de\noliva\nSal, albahaca seca, pimienta\nRINDE:\nTIEMPO:"},{"id":691,"title":"ZANAHORIA GLASEADA CON MIEL Y TOMILLO PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":30,"text":"ZANAHORIA\nGLASEADA CON\nMIEL Y TOMILLO\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\nMezclá bien los ingredientes.\nCociná a 180°C por 15 minutos,\nrevolviendo a la mitad.\n15 MINUTOS\n1 zanahoria grande en\nbastones\n1 cucharadita de miel o\nsirope natural\n1 cucharadita de aceite\nTomillo seco, sal\nRINDE:\nTIEMPO:"},{"id":692,"title":"REPOLLO SALTEADO CON CEBOLLA Y COMINO PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":31,"text":"REPOLLO\nSALTEADO CON\nCEBOLLA Y\nCOMINO\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\nMezclá todo y cociná en la air fryer\na 180°C por 10 minutos, moviendo\nuna vez.\n10 MINUTOS\n1 taza de repollo en tiras\nfinas\n½ cebolla\n1 cucharadita de aceite\nComino, sal y pimienta\nRINDE:\nTIEMPO:"},{"id":693,"title":"CHAMPIÑONES CON AJO Y PEREJIL PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":32,"text":"CHAMPIÑONES\nCON AJO Y\nPEREJIL\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Cociná a 180°C por 10 minutos.\n10 MINUTOS\n1 taza de champiñones\nfileteados\n1 diente de ajo picado\n1 cucharadita de aceite\nSal, pimienta, perejil picado\nRINDE:\nTIEMPO:"},{"id":694,"title":"CEBOLLA CARAMELIZADA SALUDABLE PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":33,"text":"CEBOLLA\nCARAMELIZADA\nSALUDABLE\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todo y colocá sobre\npapel aluminio (para que no se\nescape el jugo).\n2.Cociná a 180°C por 14-15\nminutos, revolviendo a la mitad.\n15 MINUTOS\n1 cebolla grande en tiras\nfinas\n1 cucharadita de aceite\n1 cucharadita de aceto\nbalsámico\n½ cucharadita de azúcar\nmascabo (opcional)\nSal\nRINDE:\nTIEMPO:"},{"id":695,"title":"SALTEADO DE PAPA, BATATA Y CALABAZA PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":34,"text":"SALTEADO DE\nPAPA, BATATA Y\nCALABAZA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Cortá en cubos similares y\nmezclá con condimentos.\n2.Cociná a 190°C por 18-20\nminutos, revolviendo a mitad de\ntiempo.\n20 MINUTOS\n½ papa, ½ batata, ½ taza de\ncalabaza en cubos\n1 cucharadita de aceite\nPimentón, ajo en polvo, sal,\npimienta\nRINDE:\nTIEMPO:"},{"id":696,"title":"CHOCLO, ZUCCHINI Y PIMIENTO DULCE PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":35,"text":"CHOCLO,\nZUCCHINI Y\nPIMIENTO DULCE\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Cociná a 180°C por 10-12\nminutos.\n12 MINUTOS\n½ taza de granos de choclo\ncocido\n½ zucchini en rodajas\n¼ morrón rojo en cubitos\n1 cucharadita de aceite\nSal, pimienta y pizca de\ncurry\nRINDE:\nTIEMPO:"},{"id":697,"title":"MIX DE VERDES AL LIMÓN PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":36,"text":"MIX DE\nVERDURAS\nVERDES AL\nLIMÓN\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todo.\n2.Cociná a 180°C por 10 minutos,\nhasta que las verduras estén\ntiernas y doradas.\n10 MINUTOS\n½ taza de arvejas (pueden\nser congeladas)\n½ taza de brócoli\n½ zucchini en cubitos\n1 cucharadita de aceite\nJugo y ralladura de ½ limón\nSal, pimienta\nRINDE:\nTIEMPO:"},{"id":698,"title":"SALTEADO ESTILO ASIÁTICO DE BRÓCOLI Y PAK CHOI CON SALSA DE SOJA Y SÉSAMO PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":37,"text":"SALTEADO ESTILO\nASIÁTICO DE\nBRÓCOLI Y PAK\nCHOI CON SALSA\nDE SOJA Y SÉSAMO\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá el brócoli y el pak choi\ncon el aceite y la salsa de soja.\n2.Colocá en la canasta de la air\nfryer sobre una bandejita o\npapel aluminio (para que no\ngotee la soja).\n3.Cociná a 185°C por 10 minutos,\nrevolviendo a la mitad.\n4.Al servir, espolvoreá con sésamo\ntostado.\n12 MINUTOS\n1 taza de brócoli en ramitos\n1 taza de pak choi en tiras\n(también puede ser acelga)\n1 cucharada de salsa de soja\nbaja en sodio\n1 cucharadita de aceite de\nsésamo o girasol\n1 cucharadita de semillas de\nsésamo tostado\nPimienta negra\nRINDE:\nTIEMPO:"},{"id":699,"title":"CHAMPIÑONES AL AJILLO CON CEBOLLA MORADA PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":38,"text":"CHAMPIÑONES AL\nAJILLO CON\nCEBOLLA\nMORADA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes\nen un bowl.\n2.Ponelos sobre papel manteca o\nsilicona.\n3.Cociná en la air fryer a 175°C por\n12 minutos, mezclando a la\nmitad.\n4.Decorá con perejil al final.\n12 MINUTOS\n1 taza de champiñones en\nláminas\n½ cebolla morada en pluma\n1 diente de ajo picado\n1 cucharadita de aceite de\noliva\nSal, pimienta, perejil fresco\no seco\nRINDE:\nTIEMPO:"},{"id":700,"title":"MIX CRIOLLO DE BATATA, MORRÓN Y CEBOLLA PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":39,"text":"MIX CRIOLLO DE\nBATATA, MORRÓN\nY CEBOLLA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá las verduras con el\naceite y condimentos.\n2.Distribuí en la canasta sin\namontonar.\n3.Cociná a 190°C por 18 minutos,\nrevolviendo a los 9.\n18 MINUTOS\n½ batata en cubos chicos\n½ morrón rojo en tiras\n½ cebolla en pluma\n1 cucharadita de aceite\n½ cucharadita de pimentón\nahumado\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":701,"title":"MEDITERRÁNEO DE ZUCCHINI, BERENJENA Y TOMATE SECO PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":40,"text":"MEDITERRÁNEO\nDE ZUCCHINI,\nBERENJENA Y\nTOMATE SECO\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Hidratar los tomates si hace\nfalta.\n2.Mezclá todos los ingredientes.\n3.Cociná en la air fryer a 185°C por\n15 minutos, mezclando a los 7.\n15 MINUTOS\n½ zucchini en medias lunas\n½ berenjena en cubos\n3 tomates secos hidratados\ny picados\n1 cucharadita de aceite de\noliva\nAjo en polvo, orégano, sal\nRINDE:\nTIEMPO:"},{"id":702,"title":"REPOLLITOS DE BRUSELAS CON MIEL Y MOSTAZA PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":41,"text":"REPOLLITOS DE\nBRUSELAS CON\nMIEL Y MOSTAZA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá las coles con miel,\nmostaza, aceite y condimentos.\n2.Colocá en la canasta con el\ncorte hacia abajo.\n3.Cociná a 190°C por 16 minutos,\ngirando a los 8 minutos.\n15 MINUTOS\n1 taza de coles de Bruselas\ncortadas a la mitad\n1 cucharadita de miel\n½ cucharadita de mostaza\n1 cucharadita de aceite\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":703,"title":"CEBOLLA, ZANAHORIA Y JENGIBRE DULCE- PICANTE PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":42,"text":"CEBOLLA,\nZANAHORIA Y\nJENGIBRE DULCE-\nPICANTE\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá bien todos los\ningredientes.\n2.Colocá sobre papel aluminio\npara evitar que se seque.\n3.Cociná a 180°C por 12 minutos,\nmezclando a los 6.\n4.\n10 MINUTOS\n1 cebolla blanca en pluma\n1 zanahoria en juliana\n½ cucharadita de jengibre\nrallado\n1 cucharadita de aceite\n½ cucharadita de miel\nPizca de ají molido\n(opcional)\nRINDE:\nTIEMPO:"},{"id":704,"title":"PAPAS RÚSTICAS CON ROMERO Y AJO PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":43,"text":"PAPAS\nRÚSTICAS CON\nROMERO Y AJO\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá la papa con ajo, aceite y\ncondimentos.\n2.Cociná en la air fryer a 200°C\npor 18 minutos, mezclando a los\n9 minutos.\n18 MINUTOS\n1 papa chica con cáscara en\ncubos o gajos\n1 diente de ajo picado\n1 cucharadita de aceite\nRomero seco o fresco\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":705,"title":"ARVEJAS CON CEBOLLA Y CURRY PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":44,"text":"ARVEJAS CON\nCEBOLLA Y\nCURRY\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Cociná en la air fryer a 180°C por\n10 minutos, moviendo a los 5.\n10 MINUTOS\n½ taza de arvejas cocidas\n½ cebolla en cubos\n½ cucharadita de curry\n1 cucharadita de aceite\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":706,"title":"SALTEADO ORIENTAL DE REPOLLO MORADO Y ZANAHORIA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":45,"text":"SALTEADO\nORIENTAL DE\nREPOLLO\nMORADO Y\nZANAHORIA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá bien todos los\ningredientes.\n2.Colocá sobre bandeja o\naluminio.\n3.Cociná a 180°C por 10 minutos,\nrevolviendo a los 5 minutos.\n10 MINUTOS\n1 taza de repollo morado en\ntiras\n½ zanahoria rallada\n1 cucharada de salsa de soja\nbaja en sodio\n1 cucharadita de aceite de\nsésamo\n½ cucharadita de azúcar\nmascabo o miel\nRINDE:\nTIEMPO:"},{"id":707,"title":"WRAP DE HUMMUS, PALTA Y VEGETALES CROCANTES PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":46,"text":"WRAP DE\nHUMMUS, PALTA\nY VEGETALES\nCROCANTES\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Untá la tortilla con hummus y\npalta.\n2.Distribuí espinaca, zanahoria,\npepino y condimentá con\nlimón, sal y pimienta.\n3.Enrollá el wrap bien apretado,\ncerrando los bordes hacia\nadentro para que no se\ndesarme.\n4.Colocá en la air fryer con la\nunión hacia abajo.\n5.Cociná a 185°C por 6-7 minutos,\nhasta que quede dorado y\ncrocante.\n10 MINUTOS\n1 tortilla integral (grande)\n2 cucharadas de hummus\n¼ palta pisada\n½ zanahoria rallada\n¼ pepino en bastones finos\n4 hojas de espinaca fresca\nJugo de limón, sal y\npimienta\nRINDE:\nTIEMPO:"},{"id":708,"title":"WRAP DE TOFU GRILLADO CON COL MORADA Y SÉSAMO PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":47,"text":"WRAP DE TOFU\nGRILLADO CON\nCOL MORADA Y\nSÉSAMO\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá el tofu con la salsa,\naceite y especias. Cocinalo en la\nair fryer a 190°C por 8 minutos.\n2.Armá el wrap con el tofu cocido\ny la col morada.\n3.Enrollá y llevá a la air fryer a\n185°C por 5-6 minutos hasta que\nse dore.\n15 MINUTOS\n1 tortilla integral o de avena\n100 g de tofu en cubos\n½ taza de col morada en\ntiras\n1 cucharadita de salsa de\nsoja\n1 cucharadita de aceite\nAjo en polvo, jengibre y\nsemillas de sésamo\nRINDE:\nTIEMPO:"},{"id":709,"title":"WRAP DE HUEVO REVUELTO CON MORRÓN Y CEBOLLA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":48,"text":"WRAP DE\nHUEVO\nREVUELTO CON\nMORRÓN Y\nCEBOLLA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.En un bowl, batí los huevos con\nlas verduras y condimentos.\n2.Cociná esa mezcla en sartén o\nmicroondas hasta que cuaje.\n3.Colocá el revuelto en la tortilla,\nenrollá firme.\n4.Llevá el wrap a la air fryer a\n185°C por 6-7 minutos.\n13 MINUTOS\n1 tortilla integral\n2 huevos\n¼ morrón rojo en cubitos\n2 cucharadas de cebolla\npicada\nSal, pimienta, orégano\nRINDE:\nTIEMPO:"},{"id":710,"title":"WRAP MEDITERRÁNEO CON QUESO FETA, TOMATE Y ALBAHACA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":49,"text":"WRAP MEDITERRÁNEO\nCON QUESO FETA,\nTOMATE Y ALBAHACA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Untá la tortilla con el queso.\n2.Agregá tomates, hojas y oliva.\n3.Enrollá el wrap y llevá a la air\nfryer a 180°C por 5-6 minutos\npara dorarlo.\n13 MINUTOS\n1 tortilla integral\n2 cucharadas de queso feta\no ricota\n4 tomates cherry en\nmitades\n3 hojas de albahaca fresca o\nrúcula\n1 cucharadita de aceite de\noliva\nPimienta negra\nRINDE:\nTIEMPO:"},{"id":711,"title":"WRAP DE FALAFEL CON SALSA DE YOGUR PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":50,"text":"WRAP DE\nFALAFEL CON\nSALSA DE YOGUR\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá el yogur con el pepino,\nlimón y sal.\n2.Colocá los falafels y hojas sobre\nla tortilla, sumá la salsa.\n3.Enrollá y cociná en la air fryer a\n185°C por 7 minutos.\n15 MINUTOS\n1 tortilla de maíz o integral\n2-3 falafels pequeños\ncocidos\n2 cucharadas de yogur\nnatural\n¼ pepino rallado\nHojas verdes\nJugo de limón, sal\nRINDE:\nTIEMPO:"},{"id":712,"title":"WRAP DE BATATA ASADA Y ESPINACA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":51,"text":"WRAP DE\nBATATA ASADA Y\nESPINACA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Cociná las rodajas de batata en\nla air fryer a 190°C por 12-15\nminutos.\n2.Untá la tortilla con hummus,\nagregá batata y espinaca.\n3.Enrollá bien y cociná a 185°C por\n5 minutos hasta dorar.\n20 MINUTOS\n1 tortilla integral\n½ batata chica en rodajas\nfinas\n½ taza de espinaca cruda\n1 cucharada de hummus\nSal, pimienta, pimentón\ndulce\nRINDE:\nTIEMPO:"},{"id":713,"title":"WRAP CAPRESE CON TOMATE, MOZZARELLA Y ALBAHACA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":52,"text":"WRAP CAPRESE\nCON TOMATE,\nMOZZARELLA Y\nALBAHACA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Armá el wrap con los\ningredientes crudos.\n2.Enrollá y llevá a la air fryer a\n185°C por 5 minutos, hasta que\nel queso se derrita y la tortilla\nquede crujiente.\n10 MINUTOS\n1 tortilla\n3 rodajas de tomate\n3 rodajas de mozzarella\nlight\nHojas de albahaca\n1 cucharadita de oliva, sal,\npimienta\nRINDE:\nTIEMPO:"},{"id":714,"title":"WRAP TEX-MEX DE POROTOS NEGROS Y PALTA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":53,"text":"WRAP TEX-MEX\nDE POROTOS\nNEGROS Y PALTA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá los porotos, choclo,\ntomate y condimentos.\n2.Untá la tortilla con la palta,\nagregá la mezcla.\n3.Enrollá y cociná a 185°C por 6-7\nminutos en la air fryer.\n12 MINUTOS\n1 tortilla\n¼ taza de porotos negros\ncocidos\n¼ palta pisada\n2 cucharadas de choclo\n2 cucharadas de tomate en\ncubitos\nLimón, sal, comino\nRINDE:\nTIEMPO:"},{"id":715,"title":"WRAP DE CHAMPIÑONES SALTEADOS CON RÚCULA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":54,"text":"WRAP DE\nCHAMPIÑONES\nSALTEADOS CON\nRÚCULA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Cociná los champiñones con ajo\ny aceite en air fryer a 185°C por 8\nminutos.\n2.Armá el wrap con rúcula y\nchampiñones cocidos.\n3.Enrollá y dorá el wrap en air\nfryer a 185°C por 4 minutos.\n12 MINUTOS\n1 tortilla integral\n1 taza de champiñones\nfileteados\n1 diente de ajo picado\n½ cucharadita de aceite de\noliva\n½ taza de rúcula\nRINDE:\nTIEMPO:"},{"id":716,"title":"WRAP DULCE DE BANANA, MANTEQUILLA DE MANÍ Y CANELA PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":55,"text":"WRAP DULCE DE\nBANANA,\nMANTEQUILLA DE\nMANÍ Y CANELA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Untá la tortilla con mantequilla\nde maní.\n2.Agregá las rodajas de banana y\nespolvoreá con canela.\n3.Enrollá y cociná en la air fryer a\n180°C por 5-6 minutos.\n7 MINUTOS\n1 tortilla integral\n1 banana chica en rodajas\n1 cucharada de mantequilla\nde maní\nCanela en polvo\n(Opcional: chips de\nchocolate o semillas)\nRINDE:\nTIEMPO:"},{"id":717,"title":"WRAP DE POLLO GRILLADO CON TOMATE Y ESPINACA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":56,"text":"WRAP DE POLLO\nGRILLADO CON\nTOMATE Y\nESPINACA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Cortá el pollo en tiras,\ncondimentá con aceite, sal,\npimienta y orégano.\n2.Cociná en air fryer a 190°C por 10\nminutos, girando a la mitad.\n3.Armá el wrap con pollo,\nespinaca y tomate.\n4.Enrollá y dorá en air fryer a 185°C\npor 5 minutos.\n15 MINUTOS\n1 tortilla integral\n100 g de pechuga de pollo\n½ tomate en rodajas\n½ taza de espinaca cruda\n1 cucharadita de aceite de\noliva\nSal, pimienta, orégano\nRINDE:\nTIEMPO:"},{"id":718,"title":"WRAP DE ATÚN CON PALTA Y HUEVO DURO PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":57,"text":"WRAP DE ATÚN\nCON PALTA Y\nHUEVO DURO\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá el atún con palta, limón,\nsal y pimienta.\n2.Colocá la mezcla sobre la\ntortilla, agregá el huevo en\nrodajas.\n3.Enrollá y cociná en air fryer a\n180°C por 6-7 minutos.\n10 MINUTOS\n1 tortilla\n1 lata de atún al natural,\nescurrido\n¼ palta pisada\n1 huevo duro en rodajas\nJugo de limón, sal y\npimienta\nRINDE:\nTIEMPO:"},{"id":719,"title":"WRAP DE CARNE MAGRA CON MORRONES Y CEBOLLA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":58,"text":"WRAP DE CARNE\nMAGRA CON\nMORRONES Y\nCEBOLLA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá la carne con las\nverduras, aceite y condimentos.\n2.Cociná en air fryer a 200°C por\n12 minutos, moviendo a la\nmitad.\n3.Armá el wrap con ese relleno y\ndorá a 185°C por 5 minutos.\n18 MINUTOS\n1 tortilla integral\n100 g de carne vacuna\nmagra (tipo cuadrada o\nnalga) en tiritas\n¼ morrón en tiras\n2 cucharadas de cebolla\npicada\n1 cucharadita de aceite, sal y\ncondimentos\nRINDE:\nTIEMPO:"},{"id":720,"title":"WRAP DE JAMÓN, QUESO Y HUEVO REVUELTO PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":59,"text":"WRAP DE JAMÓN,\nQUESO Y HUEVO\nREVUELTO\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Hacelo tipo omelette o revuelto.\nColocá sobre la tortilla con el\njamón y queso.\n2.Enrollá y cociná en air fryer a\n185°C por 6 minutos.\n10 MINUTOS\n1 tortilla\n1 huevo\n1 feta de jamón natural\n1 feta de queso bajo en\ngrasa\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":721,"title":"WRAP DE POLLO AL CURRY Y YOGUR PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":60,"text":"WRAP DE POLLO\nAL CURRY Y\nYOGUR\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Condimentá el pollo con curry,\nsal y pimienta. Cociná en air\nfryer a 190°C por 10 minutos.\n2.Mezclá con el yogur.\n3.Armá el wrap con lechuga y el\npollo cremoso. Dorá a 185°C por\n5 minutos.\n15 MINUTOS\n1 tortilla integral\n100 g de pechuga de pollo\nen cubos\n1 cucharadita de curry\n1 cucharada de yogur\nnatural\n½ taza de lechuga picada\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":722,"title":"WRAP DE CARNE PICADA CON TOMATE Y QUESO PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":61,"text":"WRAP DE CARNE\nPICADA CON\nTOMATE Y\nQUESO\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Cociná la carne picada con los\ncondimentos en air fryer sobre\npapel aluminio a 190°C por 10\nminutos.\n2.Mezclá con el tomate y el queso.\n3.Armá el wrap, enrollá y dorá en\nair fryer a 185°C por 5 minutos.\n15 MINUTOS\n1 tortilla\n100 g de carne picada\nmagra\n1 tomate en cubitos\n30 g de queso rallado light\nCondimentos: ajo, comino,\nsal, pimienta\nRINDE:\nTIEMPO:"},{"id":723,"title":"WRAP DE POLLO DESMENUZADO CON BARBACOA CASERA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":62,"text":"WRAP DE POLLO\nDESMENUZADO\nCON BARBACOA\nCASERA\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá el pollo con la barbacoa.\n2.Armá el wrap con lechuga y\nzanahoria.\n3.Enrollá y cociná a 185°C por 6\nminutos.\n20 MINUTOS\n1 tortilla\n100 g de pollo cocido y\ndesmenuzado\n1 cucharada de salsa\nbarbacoa casera light\n2 hojas de lechuga o repollo\n1 cucharada de zanahoria\nrallada\nRINDE:\nTIEMPO:"},{"id":724,"title":"WRAP DE HUEVO, PALTA Y JAMÓN COCIDO PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":63,"text":"WRAP DE HUEVO,\nPALTA Y JAMÓN\nCOCIDO\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Untá la tortilla con palta.\n2.Agregá huevo y jamón.\n3.Enrollá y dorá en air fryer a\n180°C por 5-6 minutos.\n10 MINUTOS\n1 tortilla\n1 huevo duro en rodajas\n¼ palta pisada\n1 feta de jamón cocido\nnatural\nSal y pimienta\nRINDE:\nTIEMPO:"},{"id":725,"title":"WRAP DE ATÚN AL CURRY CON ZANAHORIA Y YOGUR PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":64,"text":"WRAP DE ATÚN\nAL CURRY CON\nZANAHORIA Y\nYOGUR\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Mezclá el atún con yogur, curry\ny zanahoria.\n2.Colocá sobre la tortilla, enrollá\nbien.\n3.Cociná en air fryer a 185°C por 6\nminutos.\n12 MINUTOS\n1 tortilla\n1 lata de atún al natural\n1 cucharada de yogur\nnatural\n½ cucharadita de curry\n¼ zanahoria rallada\nRINDE:\nTIEMPO:"},{"id":726,"title":"WRAP DE CARNE TIPO KEBAB CON REPOLLO Y YOGUR PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":65,"text":"WRAP DE CARNE\nTIPO KEBAB CON\nREPOLLO Y\nYOGUR\nPROCEDIMIENTO\nINGREDIENTES\n1 WRAP\n1.Cociná la carne con comino y\nsal en la air fryer a 190°C por 10\nminutos.\n2.Mezclá con el repollo y el yogur.\n3.Enrollá y cociná el wrap a 185°C\npor 5 minutos.\n15 MINUTOS\n1 tortilla\n100 g de carne magra en\ntiritas (puede ser vaca o\ncordero)\n½ taza de repollo en tiras\nfinas\n1 cucharada de yogur\nnatural\n½ cucharadita de comino,\nsal, pimienta, jugo de limón\nRINDE:\nTIEMPO:"},{"id":727,"title":"TIRITAS DE POLLO CROCANTES CON AVENA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":66,"text":"TIRITAS DE\nPOLLO\nCROCANTES CON\nAVENA\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Pasá las tiras de pollo por la\nclara y luego por la avena\nmezclada con especias.\n2.Colocá en la canasta de la air\nfryer.\n3.Cociná a 195°C por 15 minutos,\ngirando a los 8 minutos.\n4.Serví con limón o salsa casera.\n18 MINUTOS\n100 g de pechuga de pollo\nen tiras\n1 clara de huevo\n3 cucharadas de avena\nmolida o en hojuelas\nSal, pimentón, ajo en polvo,\norégano\nRINDE:\nTIEMPO:"},{"id":728,"title":"ALBÓNDIGAS DE CARNE MAGRA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":67,"text":"ALBÓNDIGAS\nDE CARNE\nMAGRA\nPROCEDIMIENTO\nINGREDIENTES\nPORCIÓN (6 UNIDADES)\n1.Mezclá todos los ingredientes y\narmá bolitas pequeñas.\n2.Colocá en la canasta con\nespacio entre ellas.\n3.Cociná a 190°C por 15-17\nminutos, girando a la mitad.\n20 MINUTOS\n100 g de carne picada\nmagra\n1 cucharada de avena o pan\nrallado integral\n1 clara de huevo\nPerejil, ajo en polvo, sal y\npimienta\nRINDE:\nTIEMPO:"},{"id":729,"title":"FILETE DE PESCADO CON COSTRA DE AJO Y LIMÓN PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":68,"text":"FILETE DE\nPESCADO CON\nCOSTRA DE AJO\nY LIMÓN\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Pintá el pescado con aceite y\ncondimentos.\n2.Colocá sobre papel aluminio en\nla air fryer.\n3.Cociná a 180°C por 12-15\nminutos, hasta que esté dorado.\n15 MINUTOS\n1 filete de merluza o\npescado blanco (150 g)\n1 cucharadita de aceite de\noliva\nRalladura de limón, ajo en\npolvo, sal, perejil\nRINDE:\nTIEMPO:"},{"id":730,"title":"BROCHETTES DE POLLO CON VEGETALES PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":69,"text":"BROCHETTES DE\nPOLLO CON\nVEGETALES\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Armá los palitos intercalando\npollo y verduras.\n2.Rociá con aceite y condimentos.\n3.Cociná en la air fryer a 190°C por\n15 minutos, girando a la mitad.\n18 MINUTOS\n100 g de pechuga de pollo\nen cubos\n¼ morrón en cubos\n¼ cebolla en trozos\n1 cucharadita de aceite\nSal, orégano, pimienta\nRINDE:\nTIEMPO:"},{"id":731,"title":"HUEVOS DUROS PERFECTOS EN AIR FRYER PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":70,"text":"HUEVOS DUROS\nPERFECTOS EN\nAIR FRYER\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN (2 UNIDADES)\n1.Colocá los huevos enteros (con\ncáscara) en la air fryer.\n2.Cociná a 130°C por 14 minutos.\n3.Pasá a agua fría y pelá. Quedan\ncremosos, no secos.\n15 MINUTOS\n2 huevos\nRINDE:\nTIEMPO:"},{"id":732,"title":"BIFE DE POLLO A LA MOSTAZA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":71,"text":"BIFE DE POLLO A\nLA MOSTAZA\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Untá el pollo con mostaza y\nespecias.\n2.Colocá en la air fryer sobre\npapel manteca.\n3.Cociná a 190°C por 15-17\nminutos, girando a los 8.\n17 MINUTOS\n100 g de pechuga\naplastada\n1 cucharadita de mostaza o\nyogur natural\nCondimentos: sal, ajo,\npimentón\nRINDE:\nTIEMPO:"},{"id":733,"title":"BASTONES DE PESCADO CON AVENA PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":72,"text":"BASTONES DE\nPESCADO CON\nAVENA\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN (4 BASTONES)\n1.Cortá el filete en bastones.\n2.Pasá por clara y avena con\nespecias.\n3.Cociná a 195°C por 15-18\nminutos, hasta dorar.\n18 MINUTOS\n1 filete de merluza o\nlenguado\n1 clara de huevo\n2 cucharadas de avena\nmolida\nSal, ajo en polvo, limón\nRINDE:\nTIEMPO:"},{"id":734,"title":"HAMBURGUESA CASERA DE POLLO PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":73,"text":"HAMBURGUESA\nCASERA DE\nPOLLO\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Formá una hamburguesa con la\nmezcla.\n2.Colocá en la canasta de la air\nfryer con papel manteca.\n3.Cociná a 190°C por 15-17\nminutos, girando a la mitad.\n20 MINUTOS\n100 g de pollo picado o\nmolido\n1 cucharadita de avena\nSal, ajo, perejil, curry\n(opcional)\nRINDE:\nTIEMPO:"},{"id":735,"title":"PINCHOS DE CARNE MAGRA CON MOSTAZA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":74,"text":"PINCHOS DE\nCARNE MAGRA\nCON MOSTAZA\nPROCEDIMIENTO\nINGREDIENTES\n1 PORCIÓN\n1.Mariná los cubos en mostaza y\nespecias.\n2.Armá los pinchos (podés\nagregar cebolla o morrón).\n3.Cociná en air fryer a 200°C por\n15-18 minutos, girando a los 8.\n18 MINUTOS\n100 g de carne vacuna en\ncubos\n1 cucharadita de mostaza\nSal, pimienta, tomillo o\nromero\nRINDE:\nTIEMPO:"},{"id":736,"title":"MUSLITOS DE POLLO MARINADOS PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":75,"text":"MUSLITOS DE\nPOLLO\nMARINADOS\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá el aceite con el\npimentón, el ajo, el jugo de\nlimón, sal y pimienta.\n2.Embadurná bien los muslitos y\ndejalos marinar 30 minutos (en\nheladera).\n3.Precalentá la air fryer 5 minutos\na 180 °C.\n4.Colocá los muslitos sin\nencimarlos en la canasta.\n5.Cociná 25 minutos a 180 °C. A la\nmitad del tiempo, dales la\nvuelta.\n50 MINUTOS\n4 muslitos de pollo\n(jamoncitos)\n2 cdas de aceite de oliva\n1 cda de pimentón dulce\n1 cdita de ajo en polvo\nJugo de 1 limón\nSal y pimienta a gusto\nRINDE:\nTIEMPO:"},{"id":737,"title":"TIRITAS DE CARNE JUGOSA PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":76,"text":"TIRITAS DE\nCARNE\nJUGOSA\nPROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cortá la carne en tiras finas.\n2.Mezclá con la mostaza, aceite y\ncondimentos.\n3.Precalentá la air fryer a 200 °C\npor 5 minutos.\n4.Cociná 10 minutos a 200 °C,\nrevolviendo a la mitad del\ntiempo.\n20 MINUTOS\n300 g de carne (nalga,\ncuadrada o bola de lomo)\n1 cda de mostaza\n1 cda de aceite\nSal, pimienta, ajo en polvo\na gusto\nRINDE:\nTIEMPO:"},{"id":738,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":77,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Batí el huevo con ajo, perejil, sal,\npimienta y leche.\n2.Pasá el pollo por esa mezcla y\nluego por pan rallado.\n3.Rocialo con aceite en spray o\npincelá con aceite.\n4.Cociná en la air fryer 12 minutos\na 200 °C, dándolas vuelta a la\nmitad.\n25 MINUTOS\n2 filetes de pechuga de\npollo\n1 huevo\nPan rallado c/n\nAjo y perejil picados\nSal, pimienta y un chorrito\nde leche\nRINDE:\nTIEMPO:\nMILANESAS\nDE POLLO\nCROCANTES"},{"id":739,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":78,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la miel, mostaza, soja, sal\ny pimienta.\n2.Embadurná las costillas y\ndejalas 20 minutos en heladera.\n3.Cociná 20 minutos a 180 °C,\ngirando a la mitad.\n4.Subí la temperatura a 200 °C y\ncociná 5 minutos más para\ndorar.\n40 MINUTOS\n500 g de costillitas de\ncerdo\n2 cdas de miel\n1 cda de mostaza\n1 cda de salsa de soja\nSal y pimienta\nRINDE:\nTIEMPO:\nCOSTILLITAS\nDE CERDO\nGLASEADAS"},{"id":740,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":79,"text":"PROCEDIMIENTO\nINGREDIENTES\n3 PORCIÓN\n1.Mezclá todo y armá bolitas\npequeñas.\n2.Precalentá la air fryer a 190 °C.\n3.Cociná 12–15 minutos,\nmoviéndolas a mitad del\ntiempo.\n25 MINUTOS\n300 g carne picada (vacuna\no mezcla)\n1 huevo\n2 cdas de avena\ninstantánea o pan rallado\nAjo, perejil, sal y pimienta\nRINDE:\nTIEMPO:\nALBONDIGUITAS\nCRIOLLAS"},{"id":741,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":80,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todos los ingredientes y\ndejá marinar 30 minutos.\n2.Cociná 30 minutos a 180 °C,\ngirando a la mitad del tiempo.\n35 MINUTOS\n2 patas muslo\nJugo de 1 limón\n1 cda de aceite\nRomero fresco o seco\nSal y pimienta\nRINDE:\nTIEMPO:\nPOLLO AL\nLIMÓN CON\nROMERO"},{"id":742,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":81,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Untá cada churrasquito con\nmostaza.\n2.Colocá el jamón y el queso y\nenrollá.\n3.Sujetá con palillos y cociná 18\nminutos a 200 °C.\n35 MINUTOS\n2 churrasquitos finos de\nnalga\n2 fetas de jamón cocido\n2 fetas de queso\nMostaza\nSal y pimienta\nRINDE:\nTIEMPO:\nCHURRASQUITOS\nRELLENOS"},{"id":743,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":82,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mariná el pollo con los\ncondimentos y aceite.\n2.Cociná 15 minutos por lado a\n200 °C.\n30 MINUTOS\n2 piezas de pata muslo\ndeshuesadas\n1 cda de chimichurri seco\n2 cdas de aceite\nSal y pimienta\nRINDE:\nTIEMPO:\nPOLLO\nDESHUESADO\nESTILO\nPARRILLA"},{"id":744,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":83,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Precalentá la air fryer 5 min a\n180 °C.\n2.Colocá las milanesas cocidas\nsobre papel aluminio, poneles\nsalsa de tomate, tomate en\nrodajas y queso.\n3.Cocinalas 5 minutos a 180 °C\npara que se gratinen.\n4.Tostá el pan en la air fryer 3\nminutos.\n5.Armá los sánguches con la\nmilanesa caliente, orégano por\nencima y serví.\n25 MINUTOS\n2 milanesas de carne ya\ncocidas (pueden ser de\nayer)\n4 rodajas de pan tipo\nfrancés o figaza\n4 fetas de queso\nmuzzarella\n4 rodajas de tomate\nSalsa de tomate c/n\nOrégano y aceite en spray\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nMILANESA\nNAPOLITANO"},{"id":745,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":
