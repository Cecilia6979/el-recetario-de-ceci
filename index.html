"Almuerzos y cenas","page":84,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Desmenuzá la bondiola y\nmezclala con salsa barbacoa.\n2.Colocá la carne sobre papel\naluminio y llevá 8 minutos a\n180 °C para que se caliente y\ncaramelice un poco.\n3.Tostá los panes 3 minutos.\n4.Armá el sánguche con bondiola,\ncebolla caramelizada y queso.\n5.Volvé a meter 3 minutos en la\nair fryer armados, para que se\nintegren los sabores.\n30 MINUTOS\n300 g de bondiola cocida o\nprecocida\n2 panes de hamburguesa\ntipo casero\n2 cdas de salsa barbacoa\n2 cdas de cebolla\ncaramelizada (opcional)\n2 fetas de queso\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nBONDIOLA\nBARBACOA"},{"id":746,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":85,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Armá los sánguches con\ntomate, queso y albahaca.\n2.Pincelá el pan con aceite por\nfuera.\n3.Colocá en la air fryer y cociná 6\nminutos a 200 °C, dándolos\nvuelta a mitad de tiempo para\nque el pan quede crocante y el\nqueso derretido.\n15 MINUTOS\n4 rodajas de pan tipo\ncampo o lactal\n4 rodajas de tomate\n100 g de queso fresco o\nmuzzarella\nHojas de albahaca fresca\nAceite de oliva\nRINDE:\nTIEMPO:\nSÁNGUCHE\nCAPRESSE\nCALIENTE"},{"id":747,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":86,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná las pechugas\nempanadas 20 minutos a 190 °C,\ndándolas vuelta a la mitad.\n2.Mezclá el repollo, zanahoria y\naderezo para hacer el coleslaw.\n3.Tostá los panes 3 minutos.\n4.Armá los sánguches con pollo\ncaliente, coleslaw y un toque\nmás de mayonesa si querés.\n30 MINUTOS\n2 filetes de pechuga\nempanados\n2 panes tipo brioche o\nfrancés\n½ taza de repollo +\nzanahoria rallados\n1 cda de mayonesa + 1 cdita\nde mostaza + jugo de limón\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nPOLLO\nCROCANTE CON\nCOLESLAW"},{"id":748,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":87,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Rociá las rodajas de berenjena\ncon aceite, sal y pimienta.\n2.Cocinalas en la air fryer 12\nminutos a 200 °C, dándolas\nvuelta a mitad de tiempo.\n3.Armá el sánguche con queso,\nberenjena caliente y hojas\nverdes frescas.\n4.Si querés, calentá el sánguche\nya armado 3 minutos para que\nse derrita el queso.\n25 MINUTOS\n1 berenjena en rodajas\n2 panes de salvado o\nmulticereal\n100 g de queso cremoso o\nmuzzarella\nHojas de rúcula o espinaca\nAceite de oliva, sal y\npimienta\nRINDE:\nTIEMPO:\nSÁNGUCHE\nVEGGIE CON\nBERENJENA Y\nQUESO"},{"id":749,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":88,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná los churrasquitos en la\nair fryer 8 minutos a 200 °C.\n2.Aparte, cociná los huevos en\nsartén o hervidos.\n3.Tostá los panes 2–3 minutos.\n4.Armá el sánguche con\nchurrasco caliente, huevo y\ncondimento a gusto.\n20 MINUTOS\n2 churrasquitos finos (nalga\no cuadrada)\n2 panes tipo pebete o\nfigaza\n2 huevos\nSal, pimienta, mostaza o\nketchup\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nCHURRASQUITO\nY HUEVO"},{"id":750,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":89,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.rmá los sánguches con todos los\ningredientes.\n2.Llevá a la air fryer 6–8 minutos a\n180 °C para que el pan quede\ndorado y el queso se derrita.\n15 MINUTOS\n4 rodajas de pan de campo\n4 fetas de jamón crudo\n100 g de queso cremoso o\nmuzzarella\nTomates secos hidratados\nen agua o aceite\nAlbahaca o rúcula\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nJAMÓN CRUDO,\nQUESO Y\nTOMATE SECO"},{"id":751,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":90,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná los medallones 8–10\nminutos a 200 °C.\n2.A los últimos 2 minutos, poneles\nel queso arriba.\n3.Tostá los panes y armá el\nsánguche con los toppings y\nsalsa criolla.\n20 MINUTOS\n2 medallones de carne\nvacuna\n2 panes tipo hamburguesa\n2 fetas de queso\n2 rodajas de tomate +\nlechuga\nChimichurri o salsa criolla\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nHAMBURGUESA\nCRIOLLA"},{"id":752,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":91,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná los lomitos en la air fryer\n10 minutos a 200 °C.\n2.Armá los sánguches con queso\ny aderezo.\n3.Llevá 5 minutos a la air fryer\npara tostar el pan y derretir el\nqueso, girando a mitad del\ntiempo.\n18 MINUTOS\n2 lomitos finos (lomo,\ncuadril o bondiola)\n4 rodajas de pan lactal o\nintegral\n4 fetas de queso\nMostaza, mayonesa o\naderezo a gusto\nRINDE:\nTIEMPO:\nSÁNGUCHE\nTOSTADO DE\nLOMITO Y\nQUESO"},{"id":753,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":92,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Hacé un omelette simple con\nhuevo, queso, sal y pimienta.\n2.Tostá el pan en la air fryer 3\nminutos.\n3.Armá el sánguche con palta\npisada y el omelette doblado.\n4.Si querés, calentá el sánguche\ncompleto 2 minutos más para\nque quede más sellado.\n15 MINUTOS\n4 rodajas de pan integral o\nmulticereal\n2 huevos\n2 cdas de queso rallado\n½ palta pisada\nSal y pimienta\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nOMELETTE,\nQUESO Y PALTA"},{"id":754,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":93,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Condimentá el pollo con sal,\npimienta y unas gotas de limón.\n2.Cociná 12–15 minutos en la air\nfryer a 190 °C, dándolo vuelta a la\nmitad.\n3.Tostá los panes 2–3 minutos.\n4.Armá el sánguche con palta\npisada, pollo caliente y rúcula\nfresca.\n25 MINUTOS\n2 filetes de pechuga chica\n2 panes integrales\n½ palta pisada\n1 taza de rúcula\nJugo de limón, sal y\npimienta\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nPOLLO GRILLADO\nCON PALTA Y\nRÚCULA"},{"id":755,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":94,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá el atún con un chorrito\nde aceite de oliva y orégano.\n2.Armá los sánguches con el\ntomate fresco y la mezcla de\natún.\n3.Llevá 5 minutos a la air fryer a\n190 °C para que se dore el pan y\ntome sabor.\n15 MINUTOS\n1 lata de atún al natural\nescurrida\n4 rodajas de tomate\n2 panes de salvado\nOrégano, oliva y pimienta\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nATÚN Y TOMATE\nAL ORÉGANO"},{"id":756,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":95,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná los medallones 10\nminutos a 200 °C, girando a\nmitad del tiempo.\n2.Tostá los panes 2 minutos.\n3.Armá el sánguche con vegetales\nfrescos y el aderezo elegido.\n20 MINUTOS\n2 medallones de lentejas\ncaseros o comprados\n2 panes integrales\nRodajas de pepino y\nlechuga\nMostaza o yogur natural\ncomo aderezo\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nHAMBURGUESA\nDE LENTEJAS"},{"id":757,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":96,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cortá el tofu en fetas y mariná\ncon salsa de soja, ajo y jengibre\n15 minutos.\n2.Cociná en la air fryer 10 minutos\na 200 °C, dándolo vuelta.\n3.Armá el sánguche con el tofu\ncaliente, espinaca y zanahoria.\n30 MINUTOS\n200 g de tofu firme\n2 panes de centeno o\nsalvado\nSalsa de soja, ajo y jengibre\nHojas de espinaca y\nzanahoria rallada\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nTOFU MARINADO"},{"id":758,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":97,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Prepará los huevos revueltos\ncon un poco de sal y orégano.\n2.Tostá los panes 3 minutos.\n3.Armá con tomate y huevo\ncaliente. Llevá armado 2\nminutos más para sellar.\n15 MINUTOS\n4 claras + 1 huevo entero\n2 panes integrales\n4 rodajas de tomate\nOrégano y sal\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nHUEVO\nREVUELTO Y\nTOMATE"},{"id":759,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":98,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná el zucchini en la air fryer\n10 minutos a 190 °C con un poco\nde oliva.\n2.Armá el sánguche con queso y\nzucchini caliente.\n3.Tostá armado 4 minutos para\nfundir el queso.\n20 MINUTOS\n1 zucchini en rodajas finas\n100 g de queso port salut\ndescremado\n2 panes integrales\nPimienta y oliva\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nZUCCHINI Y\nQUESO\nDESCREMADO"},{"id":760,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":99,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná el pollo en la air fryer 12\nminutos a 190 °C.\n2.Tostá el pan 2 minutos.\n3.Untá con hummus, agregá\nespinaca y pollo caliente.\n25 MINUTOS\n2 filetes finos de pechuga\n2 panes integrales o de pita\n2 cdas de hummus\nHojas de espinaca fresca\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nPOLLO,\nESPINACA Y\nHUMMUS"},{"id":761,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":100,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cociná la berenjena en la air\nfryer 12 minutos con sal y oliva.\n2.Armá el sánguche con\nberenjena, queso y tomate seco.\n3.Volvé a calentar armado 4\nminutos para que quede bien\ntierno y sabroso.\n25 MINUTOS\n1 berenjena en rodajas\n2 panes integrales\n80 g de queso fresco\ndescremado\nTomates secos\nrehidratados\nRINDE:\nTIEMPO:\nSÁNGUCHE DE\nBERENJENA, QUESO\nLIGHT Y TOMATE\nSECO"},{"id":762,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":101,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la pasta cocida con los\nquesos, la crema, sal, pimienta y\nnuez moscada.\n2.Poné la mezcla en una fuente\napta para air fryer (de vidrio o\nsilicona).\n3.Cociná 10–12 minutos a 190 °C\nhasta que gratine y se forme\ncostra dorada por arriba.\n25 MINUTOS\n200 g de coditos o\nmostacholes cocidos al\ndente\n150 g de queso muzzarella\nrallado\n30 g de queso rallado tipo\nreggianito\n50 ml de crema o leche\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nMAC & CHEESE\nGRATINADO (ESTILO\nAMERICANO)"},{"id":763,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":102,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Colocá los ravioles cocidos en\nuna fuente y bañalos con salsa\nblanca.\n2.Agregá queso por encima y\nespolvoreá nuez moscada.\n3.Llevá 10–12 minutos a la air fryer\na 190 °C, hasta dorar bien la\nsuperficie.\n25 MINUTOS\n250 g de ravioles cocidos\n(de verdura, carne o ricota)\n1 taza de salsa blanca\ncasera o comprada\n100 g de queso cremoso o\nmuzzarella\nNuez moscada, sal y\npimienta\nRINDE:\nTIEMPO:\nRAVIOLES\nGRATINADOS CON\nSALSA BLANCA"},{"id":764,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":103,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Secá bien la pasta cocida y\nmezclala con los condimentos y\nel aceite.\n2.Cociná en la canasta de la air\nfryer 12–15 minutos a 200 °C,\nagitando cada 4 minutos.\n3.Serví como snack, quedan\ncrocantes como papitas.\n20 MINUTOS\n200 g de penne rigate o\ntirabuzón cocido al dente\n2 cdas de aceite de oliva\n1 cdita de ajo en polvo\n1 cdita de queso rallado\nOrégano, sal y pimienta\nRINDE:\nTIEMPO:\nPASTA CHIPS\nCROCANTES\n(SNACK)"},{"id":765,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":104,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Armá capas en una fuente\npequeña: placa, salsa con carne,\nricota, muzzarella.\n2.Repetí hasta agotar\ningredientes.\n3.Llevá 12–15 minutos a 190 °C\nhasta que se gratine.\n30 MINUTOS\n3 placas de lasagna cocidas\n150 g de carne picada\ncocida con salsa de tomate\n100 g de ricota o queso\ncrema\n100 g de muzzarella rallada\nOrégano y ajo\nRINDE:\nTIEMPO:\nLASAGNA RÁPIDA\nEN AIR FRYER"},{"id":766,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":105,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la pasta cocida con\nmanteca derretida y salvia.\n2.Pasá todo a una fuente y\nespolvoreá con queso.\n3.Cociná 8–10 minutos a 190 °C\npara que quede gratinado.\n20 MINUTOS\n250 g de sorrentinos\ncocidos (jamón y queso o\nverdura)\n1 cda de manteca\n4 hojas de salvia (o ½ cdita\nseca)\n50 g de queso rallado\nRINDE:\nTIEMPO:\nSORRENTINOS CON\nMANTECA Y SALVIA\nGRATINADOS"},{"id":767,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":106,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Secá los ñoquis cocidos y\nmezclalos con aceite y especias.\n2.Cociná en la air fryer 12 minutos\na 200 °C, agitando a la mitad.\n3.Quedan crocantes por fuera,\ntipo snack o para topping.\n20 MINUTOS\n250 g de ñoquis cocidos\n1 cda de aceite\nAjo en polvo, pimentón, sal\ny pimienta\nRINDE:\nTIEMPO:\nÑOQUIS\nCROCANTES ESTILO\nSNACK"},{"id":768,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":107,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Poné los canelones en una\nfuente con salsa arriba.\n2.Agregá el queso por encima y\nllevá 12–15 minutos a 190 °C.\n3.Serví bien caliente, doraditos.\n25 MINUTOS\n4 canelones cocidos y\nrellenos (espinaca y ricota o\ncarne)\n½ taza de salsa de tomate\n50 g de muzzarella rallada\nQueso rallado para gratinar\nRINDE:\nTIEMPO:\nCANELONES\nEXPRESS\nGRATINADOS"},{"id":769,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":108,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá los fideos con el huevo,\nqueso y condimentos.\n2.Ponelos en una fuente\nenmantecada.\n3.Cociná 15 minutos a 190 °C,\nhasta que se forme una capa\nfirme arriba.\n25 MINUTOS\n200 g de fideos cocidos\n(tirabuzones o moñitos)\n1 huevo\n2 cdas de queso rallado\n50 g de queso cremoso\nSal, pimienta, orégano\nRINDE:\nTIEMPO:\nPASTEL DE FIDEOS\nAL HORNO\n(VERSIÓN AIR\nFRYER)"},{"id":770,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":109,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Pinchá los ravioles en los palitos\ncomo si fueran brochettes.\n2.Rocialos con aceite y\ncondimentos.\n3.Cociná en la air fryer 10–12\nminutos a 200 °C.\n4.Serví con un dip de salsa fileto o\ncrema.\n25 MINUTOS\n250 g de ravioles cocidos y\nbien escurridos\n1 cda de aceite\nQueso rallado, orégano, ajo\nen polvo\nPalitos de brochette\nRINDE:\nTIEMPO:\nRAVIOLES EN\nBROCHETTE\nCROCANTE"},{"id":771,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":110,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la pasta con los\nvegetales cocidos, salsa blanca y\nqueso.\n2.Colocá en una fuente pequeña.\n3.Gratinar 10–12 minutos a 190 °C\nhasta que esté bien dorado.\n25 MINUTOS\n200 g de fideos cocidos\n½ taza de zapallito o\nzanahoria rallada salteada\n2 cdas de salsa blanca\n100 g de muzzarella\nSal y pimienta\nRINDE:\nTIEMPO:\nGRATINADO DE\nFIDEOS CON\nVEGETALES"},{"id":772,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":111,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Secá bien los tortellinis cocidos\ny mezclalos con aceite y\ncondimentos.\n2.Llevá a la air fryer 12–15 minutos\na 200 °C, sacudiendo a mitad de\ntiempo.\n3.Quedan crocantes y sabrosos,\nideales como snack con salsa\nfileto\n20 MINUTOS\n250 g de tortellinis cocidos\n(de ricota, verdura o carne)\n1 cda de aceite\nAjo en polvo, queso rallado\ny orégano\nRINDE:\nTIEMPO:\nTORTELLINIS\nCROCANTES\nTIPO CHIPS"},{"id":773,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":112,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la pasta con la salsa de\ntomate y queso crema.\n2.Colocá en una fuente, agregá\nmuzzarella arriba.\n3.Gratinar 12 minutos a 190 °C.\nPodés espolvorear albahaca al\nfinal.\n20 MINUTOS\n200 g de penne o rigatoni\ncocido\n½ taza de salsa de tomate\n2 cdas de queso crema\n100 g de muzzarella\nSal, pimienta y albahaca\nRINDE:\nTIEMPO:\nGRATINADO DE\nPENNE CON\nSALSA ROSA"},{"id":774,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":113,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá los ñoquis cocidos con la\nboloñesa.\n2.Ponelos en una fuente, cubrí\ncon los quesos.\n3.Cociná 10–12 minutos a 190 °C\nhasta que se gratinen.\n20 MINUTOS\n300 g de ñoquis cocidos\n1 taza de salsa boloñesa\n(con carne)\n100 g de queso muzzarella\nQueso rallado para dorar\nRINDE:\nTIEMPO:\nÑOQUIS\nGRATINADOS\nCON SALSA\nBOLOÑESA"},{"id":775,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":114,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la pasta, el coliflor, el\nqueso y los condimentos.\n2.Llevá a una fuente y cociná 10–12\nminutos a 190 °C.\n3.Queda cremoso, con una costra\ndorada suave arriba.\n20 MINUTOS\n150 g de coditos cocidos\n100 g de coliflor cocida en\ntrocitos\n100 g de queso cremoso\n1 cda de leche o crema\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nMAC & CHEESE\nCON COLIFLOR"},{"id":776,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":115,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Rellená cada placa con la\nmezcla de espinaca y ricota,\nenrollá.\n2.Ponelos en una fuente, cubrilos\ncon salsa y queso.\n3.Cociná 15 minutos a 190 °C.\n30 MINUTOS\n3 placas de lasagna cocidas\n200 g de espinaca cocida +\nricota\nSalsa de tomate\nQueso rallado\nRINDE:\nTIEMPO:\nROLLITOS DE\nLASAGNA (TIPO\nCANELÓN)"},{"id":777,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":116,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todo y colocá en una\nfuente.\n2.Cociná 8–10 minutos a 190 °C.\nQueda sabroso y liviano.\n20 MINUTOS\n200 g de pasta cocida\n(moñitos o tirabuzones)\n2 cdas de pesto (casero o\ncomprado)\n8 tomates cherry cortados\n1 cda de queso rallado\nRINDE:\nTIEMPO:\nFIDEOS CON\nPESTO Y TOMATES\nCHERRY AL\nHORNO"},{"id":778,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":117,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Pasá los ravioles por huevo y\nluego pan rallado.\n2.Cociná en la air fryer 10–12\nminutos a 200 °C.\n3.Servilos con salsa fileto o\nbarbacoa para mojar.\n20 MINUTOS\n250 g de ravioles cocidos y\nfríos\n1 huevo batido\nPan rallado con ajo en\npolvo y orégano\nSalsa para acompañar\nRINDE:\nTIEMPO:\nRAVIOLES FRITOS\nRELLENOS CON\nDIP"},{"id":779,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":118,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todo, colocá en una\nfuente y rociá con queso.\n2.Cociná 12 minutos a 190 °C para\ngratinar.\n25 MINUTOS\n200 g de moñitos cocidos\n1 taza de verduras salteadas\n(zapallito, cebolla, morrón)\n100 g de queso fresco\nSal, pimienta y oliva\nRINDE:\nTIEMPO:\nMOÑITOS CON\nVEGETALES\nSALTEADOS\nGRATINADOS"},{"id":780,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":119,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todo, ponelo en una\nfuente.\n2.Gratinar 10–12 minutos a 190 °C.\n25 MINUTOS\n200 g de pasta cocida\n(penne o tirabuzón)\n100 g de jamón cocido en\ntiritas\n½ taza de arvejas\n100 g de muzzarella\nSalsa blanca o 2 cdas de\nqueso crema\nRINDE:\nTIEMPO:\nPASTA\nGRATINADA CON\nJAMÓN Y ARVEJAS"},{"id":781,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":120,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la carne con los fideos y\nhuevo.\n2.Poné en una fuente, cubrí con el\npuré y queso.\n3.Cociná 15 minutos a 190 °C hasta\ndorar arriba.\n30 MINUTOS\n200 g de fideos cocidos\n200 g de carne picada\ncocida con cebolla y\ntomate\n1 huevo\n100 g de puré de papa\nQueso rallado\nRINDE:\nTIEMPO:\nPASTA ESTILO\nPASTEL DE PAPAS"},{"id":782,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":121,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Untá los choclos con la manteca\nmezclada con las especias.\n2.Envolvelos en papel aluminio.\n3.Cociná 15 minutos a 200 °C,\ngirando a la mitad del tiempo.\n4.Servilos calientes, podés agregar\nqueso rallado por encima.\n20 MINUTOS\n2 choclos enteros\n1 cda de manteca\n½ cdita de pimentón dulce\nSal, pimienta y ajo en polvo\nRINDE:\nTIEMPO:\nCHOCLOS\nASADOS CON\nMANTECA\nESPECIADA"},{"id":783,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":122,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todos los ingredientes\nhasta formar una masa.\n2.Armá bolitas o montoncitos con\nuna cuchara.\n3.Cociná 12–14 minutos a 190 °C,\nrociando con aceite en spray.\n25 MINUTOS\n1 taza de espinaca cocida y\npicada\n½ taza de queso rallado\n1 huevo\n3 cdas de avena\ninstantánea\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nBUÑUELOS DE\nESPINACA Y\nQUESO"},{"id":784,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":123,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cortá el zapallito en tiras finas.\n2.Pasalas por huevo y luego pan\nrallado condimentado.\n3.Cociná 10–12 minutos a 200 °C\nhasta que estén doradas.\n20 MINUTOS\n1 zapallito verde grande\n1 huevo batido\nPan rallado c/n\nAjo en polvo, sal y orégano\nRINDE:\nTIEMPO:\nTIRITAS DE\nZAPALLITO\nEMPANADO\nCROCANTE"},{"id":785,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":124,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Batí los huevos con leche, sal,\npimienta y queso.\n2.Mojá bien cada rebanada.\n3.Cociná 8 minutos a 200 °C,\ndándolas vuelta a la mitad.\n15 MINUTOS\n4 rebanadas de pan\nintegral o lactal\n2 huevos\n2 cdas de leche\nSal, pimienta y queso\nrallado\nRINDE:\nTIEMPO:\nTOSTADAS\nFRANCESAS\n(VERSIÓN\nSALADA)"},{"id":786,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":125,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Procesá todo hasta formar una\npasta moldeable.\n2.Armá bolitas y colocá en la air\nfryer.\n3.Cociná 15 minutos a 190 °C,\ngirando a la mitad.\n25 MINUTOS\n1 taza de garbanzos\ncocidos\n1 diente de ajo\nPerejil y cebolla a gusto\n1 cda de harina de\ngarbanzo o avena\nComino, sal y pimienta\nRINDE:\nTIEMPO:\nFALAFEL\nCROCANTE SIN\nFRITURA"},{"id":787,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":126,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Cortá las batatas en bastones y\nsecá con papel.\n2.Mezclá con el aceite y especias.\n3.Cociná 15 minutos a 200 °C,\nagitando cada 5 minutos.\n20 MINUTOS\n2 batatas medianas\n1 cda de aceite de oliva\nPimentón, ajo en polvo y\nsal\nRINDE:\nTIEMPO:\nBATATAS FRITAS\nSALUDABLES"},{"id":788,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":127,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todo y colocá en un\nmolde pequeño apto para air\nfryer.\n2.Cociná 20–25 minutos a 180 °C\nhasta que esté firme y dorado.\n20 MINUTOS\n2 tomates redondos\ngrandes\n½ lata de atún o ½ taza de\narroz cocido\n1 cda de queso rallado\nOrégano, oliva, sal y\npimienta\nRINDE:\nTIEMPO:\nTARTA SIN MASA\nDE VEGETALES"},{"id":789,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":128,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Ahuecá los tomates y mezclá el\nrelleno con queso y\ncondimentos.\n2.Rellenalos y espolvoreá más\nqueso encima.\n3.Cociná 10 minutos a 200 °C.\n20 MINUTOS\n2 tomates redondos\ngrandes\n½ lata de atún o ½ taza de\narroz cocido\n1 cda de queso rallado\nOrégano, oliva, sal y\npimienta\nRINDE:\nTIEMPO:\nTOMATES\nRELLENOS\nGRATINADOS"},{"id":790,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":129,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Colocá las rodajas de morrón\nsobre papel aluminio.\n2.Rompé un huevo en el centro\nde cada una.\n3.Cociná 8–10 minutos a 180 °C\nhasta que cuaje la clara.\n15 MINUTOS\n2 rodajas gruesas de\nmorrón\n2 huevos\nSal, pimienta y orégano\nRINDE:\nTIEMPO:\nHUEVITOS EN\nPIMIENTO"},{"id":791,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":130,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá todos los ingredientes\nen un bowl.\n2.Poné en un molde chico (tipo\nflanera) con aceite.\n3.Cociná 15–20 minutos a 180 °C,\nhasta que esté dorada.\n25 MINUTOS\n1 papa chica hervida y\ncortada en cubitos\n1 huevo + 1 clara\n2 cdas de cebolla salteada\nSal, pimienta y aceite en\nspray\nRINDE:\nTIEMPO:\nTORTILLA\nINDIVIDUAL DE\nPAPA Y CEBOLLA"},{"id":792,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":131,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Colocá el zapallito rallado sobre\nun repasador limpio, exprimí\nbien para sacar el agua.\n2.Mezclá con los huevos, queso y\ncondimentos.\n3.Verté en un molde chico\npreviamente rociado con aceite.\n4.Cociná 15–18 minutos a 180 °C,\nhasta que esté doradita y firme.\n25 MINUTOS\n1 zapallito verde grande\nrallado (sin semillas)\n2 huevos\n2 cdas de queso rallado\n(tipo reggianito o cremoso)\nSal, pimienta y nuez\nmoscada\nRocío vegetal o aceite\nRINDE:\nTIEMPO:\nTORTILLA DE\nZAPALLITO Y\nQUESO"},{"id":793,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":132,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Salteá la cebolla hasta que esté\ntierna.\n2.Mezclá con espinaca, huevos,\navena y condimentos.\n3.Verté en un molde chico con\nrocío vegetal.\n4.Cociná 18–20 minutos a 180 °C.\nSe puede servir caliente o fría.\n30 MINUTOS\n1 taza de espinaca cocida y\npicada\n½ cebolla picada y salteada\n2 huevos + 1 clara\n1 cda de avena instantánea\n(opcional para firmeza)\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nTORTILLA DE\nESPINACA Y\nCEBOLLA"},{"id":794,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":133,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá la calabaza con los\nhuevos, el queso y los\ncondimentos.\n2.Verté en un molde chico\npreviamente aceitado.\n3.Cociná 20 minutos a 180 °C,\nhasta que se note dorada en\nsuperficie y cuajada.\n30 MINUTOS\n1 taza de calabaza cocida y\npisada\n2 huevos\n2 cdas de queso port salut\nen cubos o rallado\nSal, pimienta, ajo en polvo\nRINDE:\nTIEMPO:\nTORTILLA DE\nCALABAZA Y\nQUESO"},{"id":795,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":134,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Salteá el puerro con un poco de\naceite hasta ablandar.\n2.Mezclá con zanahoria, huevos,\nqueso y condimentos.\n3.Poné en molde chico con aceite\ny cociná 18–20 minutos a 180 °C.\n30 MINUTOS\n1 zanahoria rallada\n½ taza de puerro picado\n2 huevos\n1 cda de queso crema o\nricota\nSal, pimienta, cúrcuma o\ncomino (opcional)\nRINDE:\nTIEMPO:\nTORTILLA DE\nZANAHORIA Y\nPUERRO"},{"id":796,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":135,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá el arroz con espinaca,\nhuevos, queso y condimentos.\n2.Verté en molde pequeño con\nrocío vegetal.\n3.Cociná 18–20 minutos a 180 °C,\nhasta que esté dorada.\n25 MINUTOS\n1 taza de arroz cocido\n1 taza de espinaca cocida y\npicada\n2 huevos\n2 cdas de queso rallado\nSal, pimienta y ajo en polvo\nRINDE:\nTIEMPO:\nTORTILLA DE\nARROZ Y\nESPINACA (IDEAL\nPARA SOBRAS)"},{"id":797,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":136,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Salteá la cebolla y agregá el\nzapallito escurrido. Enfriá un\npoco.\n2.Mezclá con huevos, queso y\ncondimentos.\n3.Colocá la tapa en un molde\nchico y rellená.\n4.Cociná 18–20 minutos a 180 °C,\nhasta que esté firme y doradita.\n25 MINUTOS\n1 tapa de tarta (criolla o\nhojaldrada)\n1 zapallito verde rallado y\nescurrido\n½ cebolla picada y salteada\n2 huevos\n2 cdas de queso rallado\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nTARTA DE\nZAPALLITOS Y\nCEBOLLA"},{"id":798,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":137,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Poné la tapa en un molde,\npinchá la base con tenedor.\n2.Armá la tarta: jamón, tomate,\nqueso y orégano.\n3.Rociá con un chorrito de oliva.\n4.Cociná 15–20 minutos a 190 °C.\n25 MINUTOS\n1 tapa de tarta\n3 fetas de jamón cocido\n3 rodajas de tomate\n100 g de queso cremoso o\nmuzzarella\nOrégano y aceite de oliva\nRINDE:\nTIEMPO:\nTARTA DE JAMÓN,\nQUESO Y TOMATE"},{"id":799,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":138,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIÓN\n1.Mezclá espinaca, ricota, huevo y\ncondimentos.\n2.Colocá en un molde chico con\nla tapa abajo.\n3.Rellená y cociná 20–22 minutos\na 180 °C.\n30 MINUTOS\n1 tapa de tarta\n1 taza de espinaca cocida y\npicada\n100 g de ricota\n1 huevo\nSal, pimienta y nuez\nmoscada\nRINDE:\nTIEMPO:\nMINI TARTA DE\nESPINACA Y\nRICOTA"},{"id":800,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":139,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 EMPANADAS)\n1.Salteá la carne con cebolla y\ncondimentos.\n2.Agregá el huevo picado una vez\nfrío el relleno.\n3.Armá las empanadas, sellalas\ncon repulgue o tenedor.\n4.Cociná 10–12 minutos a 200 °C,\nrociadas con aceite en spray.\n20 MINUTOS\n250 g de carne picada\n½ cebolla picada\n½ huevo duro\n4 tapas de empanadas\ncriollas\nComino, sal, pimienta y\npimentón\nRINDE:\nTIEMPO:\nEMPANADAS DE\nCARNE CLÁSICAS"},{"id":801,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":140,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 EMPANADAS)\n1.Cociná la cebolla con un poco\nde aceite hasta que esté dorada,\nagregá el azúcar.\n2.En moldes de muffin o silicona,\ncolocá las tapas formando\ncanastitas.\n3.Rellená con cebolla y queso.\n4.Cociná 10–12 minutos a 190 °C.\n.\n20 MINUTOS\n4 tapas de empanadas\nhojaldradas\n1 cebolla grande en pluma\n2 cdas de azúcar mascabo\no común\n80 g de queso port salut o\nmuzzarella\nRINDE:\nTIEMPO:\n. EMPANADAS\nCAPRESSE\n(TOMATE, QUESO\nY ALBAHACA)"},{"id":802,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":141,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Cociná la cebolla con un poco\nde aceite hasta que esté dorada,\nagregá el azúcar.\n2.En moldes de muffin o silicona,\ncolocá las tapas formando\ncanastitas.\n3.Rellená con cebolla y queso.\n4.Cociná 10–12 minutos a 190 °C.\n.\n20 MINUTOS\n4 tapas de empanadas\nhojaldradas\n1 cebolla grande en pluma\n2 cdas de azúcar mascabo\no común\n80 g de queso port salut o\nmuzzarella\nRINDE:\nTIEMPO:\nCANASTITAS DE\nCEBOLLA\nCARAMELIZADA Y\nQUESO"},{"id":803,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":142,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Poné las tapas en moldes tipo\nmuffin.\n2.Rellená con los vegetales y verté\nun poco de huevo batido en\ncada una.\n3.Espolvoreá con queso.\n4.Cociná 10–12 minutos a 190 °C.\n20 MINUTOS\n4 tapas de empanadas\n2 huevos\n¼ taza de morrón y cebolla\nsalteados\nQueso rallado, sal y\npimienta\nRINDE:\nTIEMPO:\nCANASTITAS DE\nHUEVO Y\nVEGETALES"},{"id":804,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":143,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá el choclo con queso\ncrema y condimentos.\n2.Armá las canastitas en moldes y\nrellená.\n3.Espolvoreá con queso rallado.\n4.Cociná 10–12 minutos a 190 °C.\n20 MINUTOS\n4 tapas de empanadas\n½ taza de choclo cocido o\nen lata\n2 cdas de queso crema\nNuez moscada y queso\nrallado\nRINDE:\nTIEMPO:\nCANASTITAS DE\nCHOCLO Y QUESO\nCREMA"},{"id":805,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":144,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá todos los ingredientes\ndel relleno.\n2.Armá las canastitas en moldes\nindividuales.\n3.Cociná 10 minutos a 190 °C. Se\npueden comer calientes o frías.\n20 MINUTOS\n4 tapas de empanadas\n1 lata de atún al natural\nescurrida\n1 huevo duro picado\n1 cda de mayonesa o queso\nuntable\nSal, pimienta, jugo de\nlimón\nRINDE:\nTIEMPO:\nCANASTITAS DE\nATÚN Y HUEVO\nDURO"},{"id":806,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":145,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá todos los ingredientes\nde la masa hasta formar una\npastita moldeable.\n2.Forrá un molde chico de\nsilicona o aluminio con esa\nmasa, aplastando con una\ncuchara.\n3.Cociná sola la base 8 minutos a\n180 °C.\n4.Mezclá los ingredientes del\nrelleno y volcalo encima.\n5.Cociná 15–18 minutos más hasta\nque esté firme y doradita.\n30 MINUTOS\nIngredientes para la masa:\n4 cdas de avena\ninstantánea\n½ zapallito rallado y\nescurrido\n1 cda de aceite de oliva\nSal a gusto\nIngredientes del relleno:\n2 huevos\n2 cdas de queso untable\ndescremado\n¼ cebolla salteada\nOrégano\nRINDE:\nTIEMPO:\nMINI TARTA CON\nMASA DE AVENA Y\nZAPALLITO"},{"id":807,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":146,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá la zanahoria con harina,\naceite y sal. Amasá hasta que no\nse pegue.\n2.Estirá y cortá 4 círculos finos.\n3.Mezclá el relleno y armá las\nempanadas. Cerrá con tenedor.\n4.Cociná 12–15 minutos a 200 °C,\ncon un toque de aceite en spray.\n35 MINUTOS\nIngredientes para la masa:\n1 zanahoria mediana\ncocida y pisada\n6 cdas de harina integral\n1 cda de aceite de oliva\nSal, agua si hace falta\nIngredientes del relleno:\n1 taza de espinaca cocida y\npicada\n2 cdas de ricota o queso\nuntable descremado\nNuez moscada, sal y\npimienta\nRINDE:\nTIEMPO:\nEMPANADAS CON\nMASA DE\nZANAHORIA Y\nHARINA INTEGRAL"},{"id":808,"title":"PROCEDIMIENTO","category":"Postres","source":"Almuerzos y cenas","page":147,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá los ingredientes de la\nmasa y forrá moldes de silicona\n(tipo muffin).\n2.Cociná solo la masa 6 minutos a\n180 °C para que tome forma.\n3.Rellená con la mezcla de atún y\nclara.\n4.Volvé a cocinar 10 minutos más\nhasta dorar.\n25 MINUTOS\nIngredientes para la masa:\n4 cdas de avena\n1 huevo\nSal, ajo en polvo y orégano\nRelleno sugerido:\n½ lata de atún + 1 clara + 1\ncda de queso untable +\nlimón\nRINDE:\nTIEMPO:\nCANASTITAS CON\nMASA DE AVENA Y\nHUEVO (SIN HARINAS)"},{"id":809,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":148,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Hacé una masa suave\nmezclando los ingredientes.\nDejá descansar 5 minutos.\n2.Estirá y cortá 4 tapas.\n3.Rellená con calabaza y queso,\ncerrá y sellá.\n4.Cociná 12–15 minutos a 200 °C,\npincelando con agua o aceite\npor arriba.\n35 MINUTOS\nIngredientes para la masa:\n1 taza de harina integral\n1 cda de aceite de coco (o\nde oliva)\n¼ taza de agua tibia\nSal\nRelleno sugerido:\n½ taza de calabaza cocida\nen cubos + ¼ taza de queso\nport salut light\nRINDE:\nTIEMPO:\nTARTA INTEGRAL\nDE VERDURAS"},{"id":810,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":149,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Hacé una masa suave\nmezclando los ingredientes.\nDejá descansar 5 minutos.\n2.Estirá y cortá 4 tapas.\n3.Rellená con calabaza y queso,\ncerrá y sellá.\n4.Cociná 12–15 minutos a 200 °C,\npincelando con agua o aceite\npor arriba.\n35 MINUTOS\nIngredientes para la masa:\n1 taza de harina integral\n1 cda de aceite de coco (o\nde oliva)\n¼ taza de agua tibia\nSal\nRelleno sugerido:\n½ taza de calabaza cocida\nen cubos + ¼ taza de queso\nport salut light\nRINDE:\nTIEMPO:\n. EMPANADAS\nCON MASA DE\nHARINA INTEGRAL\nY ACEITE DE COCO"},{"id":811,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":150,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Procesá todos los ingredientes\nhasta formar una pasta firme.\n2.Formá medallones con las\nmanos húmedas.\n3.Llevá a la air fryer sobre papel\nmanteca.\n4.Air fryer: 190°C por 15 minutos,\ndándolos vuelta a la mitad.\n25 MINUTOS\n1 lata de atún al natural\nescurrida\n1 taza de garbanzos\ncocidos\n1 huevo\n1 cda de mostaza\n2 cdas de avena\ninstantánea\n½ cebolla chica\n1 diente de ajo\nSal, pimienta, pimentón y\njugo de limón al gusto\nRINDE:\nTIEMPO:\nMEDALLONES DE\nATÚN Y\nGARBANZOS"},{"id":812,"title":"PROCEDIMIENTO","category":"Otros","source":"Almuerzos y cenas","page":151,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 (4 UNIDADES)\n1.Mezclá todo y estirá en una\nplaca.\n2.Cortá bastones y llevá a la\nheladera 30 min.\n3.Rociá con aceite y cociná en la\nair fryer.\n4.Air fryer: 200°C por 15 minutos,\ngirando a la mitad.\n30 MINUTOS (+ TIEMPO DE\nENFRIADO)\n1 taza de polenta cocida y\nfría\n2 cdas de queso\nparmesano rallado\n1 cda de almidón de maíz\n½ cdita de ajo en polvo\nSal y pimienta\nRINDE:\nTIEMPO:\nBASTONES DE\nPOLENTA\nCROCANTE CON\nPARMESANO"},{"id":813,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":152,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá la mostaza con miel y\npintá el pescado.\n2.Cubrí con las almendras\npicadas.\n3.Colocá en la bandeja con papel\naluminio aceitado.\n4.Air fryer: 190°C por 12–15\nminutos.\n20 MINUTOS\n2 filets de merluza\n¼ taza de almendras\npicadas\n1 cda de mostaza\n1 cdita de miel\nSal, pimienta, limón\nRINDE:\nTIEMPO:\nFILET DE MERLUZA\nCON CROCANTE\nDE ALMENDRAS"},{"id":814,"title":"PROCEDIMIENTO","category":"Pescados y mariscos","source":"Almuerzos y cenas","page":153,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá la mostaza con miel y\npintá el pescado.\n2.Cubrí con las almendras\npicadas.\n3.Colocá en la bandeja con papel\naluminio aceitado.\n4.Air fryer: 190°C por 12–15\nminutos.\n25 MINUTOS\n2 filets de merluza\n¼ taza de almendras\npicadas\n1 cda de mostaza\n1 cdita de miel\nSal, pimienta, limón\nRINDE:\nTIEMPO:\nTORTITAS DE\nESPINACA Y\nRICOTA"},{"id":815,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":154,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Procesá todo hasta formar\nmasa.\n2.Formá bolitas chicas.\n3.Colocá en la bandeja con rocío\nvegetal.\n4.Air fryer: 200°C por 15 minutos.\n25 MINUTOS\n½ taza de lentejas cocidas\n½ taza de arroz integral\ncocido\n1 huevo\n2 cdas de pan rallado o\navena\n½ cebolla\nCondimentos: comino,\npimentón, sal, orégano\nRINDE:\nTIEMPO:\nMINI ALBÓNDIGAS\nDE LENTEJAS Y\nARROZ INTEGRAL"},{"id":816,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":155,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Procesá todos los ingredientes\nhasta formar una pasta espesa.\n2.Formá bolitas o medallones y\ncocinalos.\n3.Serví en wraps con vegetales y\nyogur natural.\n4.Air fryer: 190°C por 15 minutos.\n30 MINUTOS\n1 taza de garbanzos\ncocidos\n1 diente de ajo\n¼ cebolla\nPerejil y cilantro a gusto\n1 cdita de comino\n1 cda de harina de\ngarbanzo (o común)\nSal, pimienta\nRINDE:\nTIEMPO:\nWRAP DE FALAFEL\nCASERO"},{"id":817,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":156,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mariná el pollo y zanahoria con\nespecias.\n2.Cociná en la air fryer sobre\npapel aluminio.\n3.Serví en tacos con hojas verdes.\n4.Air fryer: 200°C por 12 minutos.\n25 MINUTOS\n200 g de pechuga de pollo\nen tiras\n1 zanahoria rallada\n1 cdita de cúrcuma\n½ cdita de comino\nSal, pimienta, jugo de\nlimón\nTortillas integrales\nRINDE:\nTIEMPO:\nTACOS DE POLLO\nY ZANAHORIA\nESPECIADA"},{"id":818,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":157,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Formá cucharadas y colocá\nsobre papel manteca aceitado.\n3.Air fryer: 190°C por 12–15\nminutos.\n25 MINUTOS\n1 taza de puré de calabaza\n1 huevo\n3 cdas de avena\ninstantánea\n2 cdas de queso rallado\nSal, nuez moscada,\npimienta\nRINDE:\nTIEMPO:\nBUÑUELOS DE\nCALABAZA Y\nAVENA"},{"id":819,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":158,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Dorá las berenjenas\npreviamente en la air fryer.\n2.Armá los sándwiches con el\nqueso y berenjena.\n3.Llevá los sándwiches a dorar.\n4.Air fryer:\n5.Berenjenas: 200°C por 10 min\n6.Sándwich: 200°C por 5–6\nminutos\n20 MINUTOS\n4 rodajas de pan integral\n1 berenjena chica en\nrodajas\n2 fetas de queso\nmozzarella\n1 cda de aceite de oliva\nOrégano, ajo en polvo\nRINDE:\nTIEMPO:\nSÁNDWICH\nCALIENTE DE\nBERENJENA Y\nMOZZARELLA"},{"id":820,"title":"PROCEDIMIENTO","category":"Panes, pasta y aperitivos","source":"Almuerzos y cenas","page":159,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Armá tortitas con una cuchara\nsobre papel manteca aceitado.\n3.Cociná en la air fryer hasta\ndorar.\n4.Air fryer: 200°C por 10 minutos\npor lado.\n20 MINUTOS\n1 taza de choclo cocido\n½ taza de queso cremoso o\nmozzarella rallada\n1 huevo\n2 cdas de harina integral\nSal, pimienta\nRINDE:\nTIEMPO:\nTORTITAS DE\nCHOCLO Y QUESO"},{"id":821,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":160,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Procesá el pollo con la\nzanahoria, huevo y\ncondimentos.\n2.Formá nuggets con las manos\nhúmedas y pasalos por avena.\n3.Colocá en la air fryer con rocío\nvegetal.\n4.Air fryer: 200°C por 15 minutos,\ngirando a la mitad.\n25 MINUTOS\n200 g de pechuga de pollo\n1 zanahoria rallada\n1 huevo\n2 cdas de avena molida o\npan rallado\n1 cdita de ajo en polvo\nSal, pimienta, pimentón\nRINDE:\nTIEMPO:\nNUGGETS DE\nPOLLO Y\nZANAHORIA\nCASEROS"},{"id":822,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":161,"text":"PROCEDIMIENTO\nINGREDIENTES\n2 PORCIONES\n1.Cortá el zucchini en láminas\nfinas y ablandalas 5 min en la air\nfryer (200°C).\n2.Mezclá la ricota, huevo y\ncondimentos.\n3.Armá los canelones, cubrí con\nsalsa y queso.\n4.Air fryer: 180°C por 10–12\nminutos.\n30 MINUTOS\n1 zucchini grande\n½ taza de ricota\n1 cda de queso rallado\n1 huevo\nSal, pimienta, nuez\nmoscada\nSalsa de tomate natural\nRINDE:\nTIEMPO:\nCANELONES DE\nZUCCHINI CON\nRICOTA"},{"id":823,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":162,"text":"PROCEDIMIENTO\nINGREDIENTES\n1-2 PORCIONES\n1.Mezclá todos los ingredientes.\n2.Verté en un molde pequeño\naceitado apto para air fryer.\n3.Cociná hasta que cuaje y se\ndore.\n4.Air fryer: 180°C por 15–18\nminutos.\n30 MINUTOS\n½ taza de papa cocida en\ncubitos\n½ taza de brócoli hervido o\nal vapor\n2 huevos\nSal, pimienta, ajo en polvo\nRINDE:\nTIEMPO:\nTORTILLA\nINDIVIDUAL DE\nBRÓCOLI Y PAPA"},{"id":824,"title":"PROCEDIMIENTO","category":"Carnes y aves","source":"Almuerzos y cenas","page":163,"text":"PROCEDIMIENTO\nINGREDIENTES\n1-2 PORCIONES\n1.Mezclá carne, verduras y\nespecias.\n2.Cociná sobre papel aluminio en\nla air fryer.\n3.Serví en tacos con palta o yogur\nnatural.\n4.Air fryer: 200°C por 12 minutos.\n20 MINUTOS\n200 g de carne picada\nmagra\n½ morrón rojo en tiras\n½ cebolla en juliana\n1 cdita de comino\n½ cdita de pimentón\nSal y pimienta\nTortillas integrales\nRINDE:\nTIEMPO:\nTACOS DE\nCARNE\nESPECIADA CON\nMORRÓN"},{"id":825,"title":"PROCEDIMIENTO","category":"Desayunos","source":"Almuerzos y cenas","page":164,"text":"PROCEDIMIENTO\nINGREDIENTES\n1-2 PORCIONES\n1.Pasá las rodajas por huevo y\nluego por el rebozado con\nsemillas.\n2.Colocá sobre papel manteca\naceitado.\n3.Air fryer: 200°C por 10 minutos\npor lado.\n25 MINUTOS\n1 berenjena en rodajas\n1 huevo batido\nPan rallado + semillas de\nsésamo y chía (opcional)\nSal y orégano\nRINDE:\nTIEMPO:\nBERENJENAS\n“MILANESA” CON\nMIX DE SEMILLAS"},{"id":826,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":165,"text":"PROCEDIMIENTO\nINGREDIENTES\n1-2 PORCIONES\n1.Mezclá coliflor con harina, leche,\nsalsa picante y aceite.\n2.Colocá sobre papel manteca\naceitado.\n3.Air fryer: 200°C por 15 minutos,\ngirando a la mitad.\n25 MINUTOS\n2 tazas de coliflor en\nfloretes\n1 cda de harina\n2 cdas de leche\nSalsa picante (tabasco,\nsriracha o similar)\n1 cda de aceite de oliva\nRINDE:\nTIEMPO:\nCOLIFLOR A LA\nBÚFALO\n(PICANTITA Y\nCRUJIENTE)"},{"id":827,"title":"PROCEDIMIENTO","category":"Verduras y guarniciones","source":"Almuerzos y cenas","page":166,"text":"PROCEDIMIENTO\nINGREDIENTES\n1-2 PORCIONES\n1.Mezclá los ravioles cocidos con\nel aceite y condimentos.\n2.Extendelos sin superponer en la\ncanasta.\n3.Air fryer: 200°C por 10 minutos,\nagitándolos a mitad de cocción.\n15 MINUTOS\n1 taza de ravioles cocidos y\nenfriados (rellenos de\nverdura o ricota)\n1 cda de aceite\nAjo en polvo, orégano,\npimentón\nRINDE:\nTIEMPO:\nRAVIOLES DE\nESPINACA\nCRUJIENTES (¡SÍ,\nAL AIRE!)"},{"id":828,"title":"PAN APTO","category":"Desayunos","source":"20 recetas low carb","page":2,"text":"PAN APTO\nINGREDIENTES\n1 Huevo\n1 cucharada de requesón ligero\n1 cucharadita de levadura en\npolvo\nMÉTODO DE PREPARACIÓN\nCuando esté lista, corta la masa y agrega un relleno.\nsegún tu preferencia\nTamizar el huevo y luego mezclarlo con la levadura y\nel requesón.\nEsta mezcla debe formar una masa homogénea.\nCoge la masa y colócala en un bol apto para\nreciba alta temperatura, que quepa en la freidora y que\ntener la forma de una barra de pan.\nColócalo dentro de la airfryer y déjalo durante tres minutos.\ntemperatura media, comprobando siempre si el punto está en su\nMe gusta."},{"id":829,"title":"FIT COXIN","category":"Desayunos","source":"20 recetas low carb","page":3,"text":"FIT COXIN\nMÉTODO DE PREPARACIÓN\nINGREDIENTES\n1 Huevo\n4 cucharadas de avena 1 taza de requesón 1 taza de pechuga\nde pollo cocida, sazonada y desmenuzada\nSal y otros condimentos de tu elección al gusto\nHarina de lino al gusto\nPara hacer la masa necesitarás batir la\nlicua el huevo, el requesón y los condimentos de tu\npreferencia.\nEn un bol mezclar la avena, la sal y la masa.\nlicuadora.\nLuego, con ayuda de una cucharada, tomar\nun poco de masa y agrega el pollo desmenuzado. Cerca\nla masa formando un muslo, hasta utilizar toda la masa.\nEspolvorea las baquetas con harina de linaza y colócalas\nen la airfryer hasta 15 minutos, a temperatura alta,\nsiempre comprobando el punto de fritura."},{"id":830,"title":"MÉTODO DE PREPARACIÓN","category":"Carnes y aves","source":"20 recetas low carb","page":4,"text":"MÉTODO DE PREPARACIÓN\nPOLLO APTO EMPANADO\nINGREDIENTES\n200 gr Filete de pechuga de\npollo y Condimentos de tu\nelección + Harina de avena\nminutos.\nHornear por el otro lado, siempre a temperatura media.\nComprueba el punto y estarás listo.\nSazona los filetes de pollo y déjalos probar.\nEn un recipiente coloca la harina de avena para cubrir el pollo.\nigualmente.\nDespués de pasar cada filete por harina, colóquelos en la freidora durante 15\nObserva el color de los filetes, voltéalos y déjalos por otros 15 minutos."},{"id":831,"title":"MÉTODO DE PREPARACIÓN","category":"Postres","source":"20 recetas low carb","page":5,"text":"MÉTODO DE PREPARACIÓN\nPASTEL DE CHOCOLATE FIT\nINGREDIENTES\n6 cucharadas de harina de avena\n2 huevos\n1/2 taza de agua\n3 cucharadas y media de azúcar moreno\n3 cucharadas de cacao en polvo\n2 cucharaditas de levadura en polvo\nEn un recipiente mezclar todos los ingredientes y dividir la\nmasa en moldes de silicona.\nColoca los moldes en la airfryer y déjalos hornear durante 10 minutos,\nAsegúrate de comprobar que la masa esté cocida para evitar que se queme."},{"id":832,"title":"PIZZA AJUSTE","category":"Desayunos","source":"20 recetas low carb","page":6,"text":"PIZZA AJUSTE\nINGREDIENTES\n50g de queso parmesano rallado\nSal al gusto\nSalsa de tomate al gusto\nQueso mozzarella\nRelleno de su elección\n5 cucharadas de harina de almendras\n3 cucharadas de harina de coco\n3 cucharadas de harina de berenjena\n3 cucharadas de crema\n8 huevos\nEmpezando por la masa, coger los huevos, la nata y\nsal y mezclar en un bol. Luego agrega el queso,\nharina y seguir mezclando.\nColoca la masa en la airfryer durante 20 minutos a temperatura\nmedio, comprobando el punto de la masa. Libro.\nCon la masa fría untar un poco de salsa de tomate\nencima, así como el queso mozzarella y el relleno de su\npreferencia.\nColoque la pizza en la freidora por un mínimo de 8 minutos.\na temperatura media y observar el punto que más te guste.\nMÉTODO DE PREPARACIÓN"},{"id":833,"title":"TORTILLA FIT","category":"Desayunos","source":"20 recetas low carb","page":7,"text":"TORTILLA FIT\nMÉTODO DE PREPARACIÓN\nINGREDIENTES\n2 huevos\n1 cebolla picada § 1 tomate picado\nQueso mozzarella light al gusto\nRelleno a tu elección\nCondimentos a tu gusto\nSal\nDéjalo hornear en la airfryer durante 5 minutos a temperatura media.\nBatir los huevos y añadir la mozzarella, el relleno que\nelegir y condimentos, mezclar."},{"id":834,"title":"PIZZA BAJA EN CARBUROS EN LA AIRFRYER","category":"Desayunos","source":"20 recetas low carb","page":8,"text":"PIZZA BAJA EN CARBUROS EN LA AIRFRYER\nINGREDIENTES\n· ½ taza de harina de almendras;\n· 1/3 taza de harina de berenjena;\n· ½ taza de queso parmesano\nrallado;\n· ¼ de taza de crema;\n· 8 huevos;\n· Sal.\nfreír durante 20 minutos a 180°C.\nCuando haya pasado el tiempo, retiramos la masa, esperamos a que se enfríe y luego\nCompleta tu pia fit con un relleno de margarita: añade\nsalsa de tomate, cubrir con mozzarella rallada y, encima,\nagregue hojas de albahaca y tomates cherry\ncortar por la mitad. Devuelve la pizza a la AirFryer por otros 10\nminutos a la misma temperatura.\nEn un recipiente combine los ingredientes secos para la masa, la\nharina y queso parmesano.\nEn otro recipiente batir los huevos con la nata y\nuna pizca de sal. Agrega los ingredientes secos y mezcla.\nbien, hasta obtener una masa tersa y homogénea.\nDale forma a la masa y colócala en la cesta de la AirFryer. Programa el\nRelleno\n· Queso mozzarella rallado;\n· Salsa de tomate;\n· Albahaca;\ntomates cherry\nMÉTODO DE PREPARACIÓN"},{"id":835,"title":"MÉTODO DE PREPARACIÓN","category":"Postres","source":"20 recetas low carb","page":9,"text":"MÉTODO DE PREPARACIÓN\nCOXINHA BAJA EN CARB EN LA\nAIRFRYER\nINGREDIENTES\n· 100g de pechuga de pollo desmenuzada;\n· 1/3 taza de salvado de avena;\n· 1 taza de harina de linaza;\n· 1 taza de requesón;\n· 1 huevo;\n· 1 cucharada de postre de condimento de pimentón;\n· Finas hierbas;\n· Pimienta;\n· Sal.\nal gusto y una pizca de sal. Batir todo hasta que la masa esté\nhomogéneo. Hacer bolitas con la masa y aplanarlas con las manos.\nRellena cada porción de masa con pollo desmenuzado. Cierra el\nmasa, dándoles forma de muslo. pan el\nmuslos en harina de linaza y sofreírlos en tu\nfreidora eléctrica programada a 200°C durante 15 minutos\nCocina el pollo desmenuzado y sazona como prefieras. Libro.\nEn una licuadora coloca el salvado de avena, el huevo, el queso,\ncondimento de pimentón, las finas hierbas de tu elección, pimienta"},{"id":836,"title":"· 1 taza de queso parmesano rallado;","category":"Desayunos","source":"20 recetas low carb","page":10,"text":"· 1 taza de queso parmesano rallado;\n· 1 taza de queso de Minas semicurado rallado;\n· 1 huevo.\nPAN DE QUESO BAJO EN CARBOHIDRATOS EN LA\nAIRFREIDORA\nINGREDIENTES\nMÉTODO DE PREPARACIÓN\nBatir bien el huevo y mezclar con el queso.\nMezclar todo bien, hasta llegar al punto en el que puedas darle forma a la\nlunares.\nColoca cada bola de pan de queso bajo en carbohidratos en moldes.\npapel o silicona, porque si lo pones recto sobre una bandeja de horno,\nse abrirán y se pegarán.\nColoca los moldes en la AirFryer precalentada a 180°C durante 10\nminutos."},{"id":837,"title":"PAN DE PLÁTANO BAJO EN CARBUROS EN LA AIRFREIDORA","category":"Desayunos","source":"20 recetas low carb","page":11,"text":"PAN DE PLÁTANO BAJO EN CARBUROS EN LA\nAIRFREIDORA\nINGREDIENTES\n· 450g de puré de plátanos;\n· 220g de harina de almendras;\n· 180 g de azúcar moreno;\n· 2 huevos;\n· 100g de nueces picadas;\n· 75 g de mantequilla;\n· ¼ de cucharadita de bicarbonato de sodio;\n· Canela;\n· Sal.\ntiempo, reduzca la temperatura a 170°C durante otros 15\nminutos.\nAgrega los huevos, la harina y el bicarbonato de sodio.\nRemueve bien hasta que quede una masa homogénea. Añade el\nplátanos y nueces a la masa y mezclar nuevamente. Cuando\nQuede bien integrada la masa, viértela en un molde.\nengrasado que cabe dentro de su AirFryer. Precalentar el\nfreidora a 180°C. Colocar el molde con la masa de pan.\nMÉTODO DE PREPARACIÓN\nen la canasta y dejar reposar durante 10 minutos. Pasado esto\n1. Mezclar los plátanos y la mantequilla hasta que quede cremoso."},{"id":838,"title":"TARTA DE ZANAHORIA CON cuajada baja en carbohidratos en","category":"Postres","source":"20 recetas low carb","page":12,"text":"TARTA DE ZANAHORIA CON\ncuajada baja en carbohidratos en\nla airfryer\nINGREDIENTES\n· 60g de zanahoria rallada; · 120 g de azúcar\nmoreno; · 100 g de harina de arroz; · 100 g de\ncuajada; · 80ml de leche entera;\n· 60ml de aceite de oliva;\n· 20g de nueces picadas; · 10 g de pasas; · 1\ncucharadita de polvo químico para hornear; · ½\ncucharadita de bicarbonato de sodio.\n1. En la licuadora coloca la zanahoria rallada, el aceite de oliva,\nleche, cuajada y azúcar.\nlicuadora en un bol y agregue la harina,\nlevadura y bicarbonato de sodio. Mezclar bien hasta\nSe incorporan los ingredientes secos y la masa queda suave y\nuniforme.\n3. Añade las pasas y las nueces picadas. mezclar uno\núltima vez y verter la masa en un molde engrasado que\nCabe en tu Airfryer, ya precalentada a 160°C. hornear el pastel\na esta temperatura durante 20 minutos.\nMÉTODO DE PREPARACIÓN\n2. Batir hasta obtener una crema homogénea. Transferir el contenido de"},{"id":839,"title":"PECHUGA DE POLLO RELLENA BAJA EN","category":"Carnes y aves","source":"20 recetas low carb","page":13,"text":"PECHUGA DE POLLO RELLENA BAJA EN\nCARBOHIDRATOS EN LA AIRFRYER\nINGREDIENTES\n4 filetes de pechuga de pollo;\n4 lonchas de jamón;\n4 cucharadas de requesón; 2\ncucharadas de mostaza; 1\ncucharada de miel.\n½ naranja;\nRevuelve bien para mezclar e incorporar los condimentos.\nasegurándose de que el caldo llegue a todos los lados del pollo,\nincluyendo el corte lateral. Tapar el recipiente y dejar\nmarinando en el frigorífico durante una hora. Mientras tanto, mezcla\nel requesón con cebollino picado, un poco de aceite de oliva y\npeperoni al gusto. Libro. Retire el pollo de\nfrigorífico, escurrir la marinada y rellenar cada filete de pechuga\ncon una loncha de jamón y una cucharada de queso crema\ntemplado. Programe la AirFryer durante 25 minutos a una\ntemperatura de 180°C. Dar la vuelta a los filetes a la mitad.\n· Hojuelas de pimienta de Calabria;\n· Pimienta negra molida;\n· Pimentón dulce;\n· Sal;\nmiel y un chorrito de aceite de oliva. Agrega las 4 pechugas de pollo a esto.\ncaldo y sazonar con sal, pimienta negra y pimentón dulce.\n· Cebolleta;\n· Aceite;\nHaga un corte en el costado de cada pechuga de pollo. en un\nrecipiente, exprimir el jugo de la naranja, agregar la mostaza,\nMÉTODO DE PREPARACIÓN"},{"id":840,"title":"RATATOUILLE CON QUESO LOW CARB EN LA AIRFREIDORA","category":"Verduras y guarniciones","source":"20 recetas low carb","page":14,"text":"RATATOUILLE CON QUESO LOW CARB\nEN LA AIRFREIDORA\nINGREDIENTES\n· 1 berenjena; · 1 tomate; · 1\nzanahoria; · ½ cebolla blanca; ·\n½ cebolla morada; · Cubitos\nde queso provolone; · Queso\nmozzarella\nen\nbolitas;\n·\nRomero;\n·\nOrégano;\n·\nChimichurri;\n·\nVinagre\nbalsámico; · Aceite;\nSal.\nde la AirFryer, alternativamente, junto con los cubitos y bolas de\nqueso. Rocíe con aceite de oliva y vinagre balsámico y sazona\ncon sal, chimichurri, romero y orégano al gusto. Cubra la\ncanasta de la AirFryer con papel de aluminio y ajuste el freír a\n200°C durante 15 minutos. quitar el papel aluminio y programar\notros 10 minutos a 160°C.\nMÉTODO DE PREPARACIÓN\nCorta las verduras en rodajas y colócalas “en posición vertical” en la cesta."},{"id":841,"title":"MÉTODO DE PREPARACIÓN","category":"Desayunos","source":"20 recetas low carb","page":15,"text":"MÉTODO DE PREPARACIÓN\nSETAS EMPANADAS CON CRACKING\nEN LA AIRFREIDORA\nINGREDIENTES\n· 350g de champiñones de París;\n· 2 tazas de chicharrón;\n· ¼ de taza de queso parmesano rallado;\n· 1 huevo;\n· Albahaca deshidratada;\n· Hojuelas de ajo;\n· Hojuelas de perejil;\n· pimentón;\n· Sal.\ntiempo. Luego aumentar la temperatura a 220° y dejar\ncocine durante aproximadamente 1 minuto más, para que los champiñones estén\nmuy crujiente. Servir los champiñones con una salsa de\nhacer un seguimiento.\nLuego, cúbrelos con las migas crujientes. Engrasar la cesta\nAirFryer y colocar los champiñones rebozados. Horario para las 10\nminutos a 190°C, recordando darles la vuelta a los champiñones a mitad de cocción\nEn una procesadora colocar los chicharrones, el queso parmesano y\ncondimentos al gusto. Batir hasta obtener migas. separar dos\nRecipientes: uno para colocar el huevo batido y otro para la farofa.\nCortar los champiñones por la mitad, pasarlos por huevo batido y luego"},{"id":842,"title":"BOLA DE BACALAO FRITA","category":"Desayunos","source":"20 recetas low carb","page":16,"text":"BOLA DE BACALAO FRITA\nMÉTODO DE PREPARACIÓN\nINGREDIENTES\n· 350g de calabaza cabotiá picada\n· 15 g (1 cucharada) de mantequilla o queso crema\n· 2 huevos\n· 250g bacalao desmenuzado · 25g (2 cucharadas) de harina de\nmaracuyá (se puede sustituir por otra harina baja en carbohidratos)\n· 30 g (2 cucharadas) de harina de almendras\n· 30 g (3 cucharadas) de queso parmesano rallado\n· sal y condimento al gusto\n10. ·Retirar de la airfryer, esperar a que se enfríe, disfrutar.\n8. · Remojar las empanadillas en el huevo batido, luego en la mezcla de harina\n3. · Revuelve bien hasta obtener un puré de calabaza;\n4. Añade el bacalao y mezcla bien;\n5. Agrega la harina de maracuyá poco a poco hasta obtener la textura\n1. ·Ablanda la calabaza en el microondas o en el horno;\ny queso rallado - 2 veces en cada recipiente para cada\ngalletas;\n2. · Tritura la calabaza y mezcla la mantequilla y 1 huevo;\nairfryer durante unos 20 a 30 minutos (puede ser interesante\ndar la vuelta a las albóndigas a mitad del proceso);\nadquirir una consistencia que se pueda enrollar;\n6. ·Enrollar trozos de masa en forma de bolitas de bacalao;\n7. ·En un recipiente coloca 1 huevo bien batido, y en otro\nEn el recipiente coloca la harina de almendras y el queso rallado;\n9. ·Colocar las empanadillas “empanizadas” en una bandeja de horno y meter en el horno."},{"id":843,"title":"— BOLA DE QUESO BAJA EN CARBOHIDRATOS","category":"Desayunos","source":"20 recetas low carb","page":17,"text":"— BOLA DE QUESO BAJA EN\nCARBOHIDRATOS\nINGREDIENTES\n· 150g de queso de tu elección\n· 15 g (1 cucharada) de requesón\n· 1 huevo\n· 70 g (1 taza) de harina de linaza\n· Queso parmesano rallado (la cantidad\nque necesites)\n· Sal y condimentos al gusto.\n15 minutos (hasta que la superficie de las bolitas esté seca);\n1. · Pica bien los quesos y mézclalos con el queso crema;\n2. · Hacer bolitas con la mezcla (puede ser necesario\nañadir un poco de queso parmesano rallado\ndejar la mezcla consistente en ese punto);\n3. · Empanizar las bolitas dos veces (mojar las bolitas en el huevo,\nluego cúbrelos con linaza y repite el proceso una vez más.\no dos veces);\n5. ·Retirar de la airfryer, esperar a que se enfríe y servir.\n4. · Coloca las bolitas en la airfryer a temperatura alta durante aproximadamente\nMÉTODO DE PREPARACIÓN"},{"id":844,"title":"— KIBE DE CALABAZA CETOGÉNICA","category":"Carnes y aves","source":"20 recetas low carb","page":18,"text":"— KIBE DE CALABAZA\nCETOGÉNICA\nMÉTODO DE PREPARACIÓN\nINGREDIENTES\n· 250g de carne molida\n· 100 g (1 taza) de harina de linaza (o almendras)\n· 250g de calabaza cocida\n· 1 cucharada de aceite de oliva\n· sal y condimento al gusto\n1. Mezclar todos los ingredientes con las manos;\n2. ·Tomar trozos de masa y enrollarlos en forma de kibbeh;\n3. ·Distribuir el kibbeh en una bandeja para horno;\n4. ·Coloque la sartén en la airfryer durante unos 20 a 30 minutos;\n5. ·Retirar y servir."},{"id":845,"title":"PALO DE POLLO BAJO EN CARBOHIDRATOS","category":"Carnes y aves","source":"20 recetas low carb","page":19,"text":"PALO DE POLLO BAJO EN\nCARBOHIDRATOS\nINGREDIENTES\n· Sal al gusto\n· 50 g (½ taza) de queso parmesano rallado\n· 30 g (½ taza) de harina de linaza\n· 15g (¼ taza) de harina de coco 1\n300 g de pollo desmenuzado\n· 150 g (¾ taza) de requesón\n· Condimentos al gusto (perejil, cebollino, cúrcuma)\nen la airfryer durante unos 15 a 25 minutos;\n4. · Remojar los muslos en esta mezcla, luego pasarlos por el huevo y\nluego pasarlos nuevamente por la mezcla de harina y queso\nralladas (hasta cubrirlas por completo);\nhuevo entero batido\nMÉTODO DE PREPARACIÓN\n6. ·Retirar de la airfryer y servir.\n1. Mezclar el pollo, el queso crema, los condimentos y la sal en un\nrecipiente hasta obtener una mezcla homogénea;\n2. ·Modele piezas de esta “masa” para darles la “forma de masa”;\n3. Mezclar la harina de coco, la harina de linaza y el queso.\nrallado en un recipiente;\n5. · Coloca las baquetas en un molde o fuente para horno y llévalas"},{"id":846,"title":"CROQUETA DE CARNE","category":"Carnes y aves","source":"20 recetas low carb","page":20,"text":"CROQUETA DE CARNE\nMÉTODO DE PREPARACIÓN\nINGREDIENTES\n· ¼ de taza de queso rallado\n· ¼ taza de harina de linaza\n· 2 cucharadas de harina de\nalmendras\n· 100g de carne picada de ternera (hecha y\nsazonada al gusto)\n· 200g de calabaza cabotiá pelada (japonesa)\n· sal y condimento al gusto\n· 1 cucharada de requesón\n· 3 huevos\n10. ·Coloca las croquetas en la airfryer durante unos 20 minutos, dándoles la vuelta.\ndespués de 10 minutos;\n6. · En un plato mezclar el queso rallado y la harina, y en otro\n7. ·Formar las croquetas con carne molida, pasarlas por\nharina, luego los huevos, nuevamente la harina y resérvelos;\n8. ·Repite el proceso hasta que te quedes sin carne molida;\n9. ·(Puede ser necesario usar más mezcla de harina con\nqueso rallado);\n1. Cocina la calabaza hasta que esté muy suave;\n2. Triture la calabaza cocida hasta formar un puré; 3. Mezclar la carne\nmolida, el puré de calabaza, 1 huevo y el queso crema;\n4. Espera a que se enfríe y coloca la mezcla en el frigorífico durante 1 hora aproximadamente;\n5. ·Después de preparar la carne molida usando los condimentos que prefieras;\n11. ·Esperar a que se enfríe y servir.\nbatir en un plato los dos huevos;"}];
const categories=['Todas','Favoritas',...new Set(RECIPES.map(r=>r.category))];let active='Todas',current=null;const $=id=>document.getElementById(id);let favorites=new Set(JSON.parse(localStorage.getItem('ceci_favs')||'[]'));
function saveFav(){localStorage.setItem('ceci_favs',JSON.stringify([...favorites]));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function drawFilters(){$('filters').innerHTML=categories.map(c=>`<button class="chip ${c===active?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;drawFilters();draw();});}
function draw(){let q=$('q').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let arr=RECIPES.filter(r=>(active==='Todas'||(active==='Favoritas'?favorites.has(r.id):r.category===active))&&(!q||(r.title+' '+r.text+' '+r.source+' '+r.category).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q)));arr.sort((a,b)=>$('sort').value==='source'?(a.source.localeCompare(b.source)||a.title.localeCompare(b.title,'es')):a.title.localeCompare(b.title,'es'));$('stats').textContent=`${arr.length} recetas${active!=='Todas'?' · '+active:''} · ${favorites.size} favoritas`; $('empty').classList.toggle('hide',arr.length>0);$('grid').innerHTML=arr.slice(0,1200).map(r=>`<button class="recipe" data-id="${r.id}"><div><span class="tag">${esc(r.category)}</span><button class="star ${favorites.has(r.id)?'on':''}" data-fav="${r.id}" aria-label="Guardar favorita">${favorites.has(r.id)?'★':'☆'}</button></div><h3>${esc(r.title)}</h3><div class="source">${esc(r.source)} · pág. ${r.page}</div></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.id));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=+b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);saveFav();draw();});}
function openRecipe(id){current=RECIPES.find(r=>r.id===id);$('mcat').textContent=current.category;$('mtitle').textContent=current.title;$('msource').textContent=current.source+' · página '+current.page;$('mtext').textContent=current.text;$('favdetail').textContent=favorites.has(id)?'★ Quitar de favoritas':'☆ Guardar favorita';$('modal').classList.add('open');}
$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('q').oninput=draw;$('sort').onchange=draw;$('favdetail').onclick=()=>{if(!current)return;favorites.has(current.id)?favorites.delete(current.id):favorites.add(current.id);saveFav();$('favdetail').textContent=favorites.has(current.id)?'★ Quitar de favoritas':'☆ Guardar favorita';draw();};$('copy').onclick=()=>{if(current)navigator.clipboard?.writeText(current.title+'\n\n'+current.text);$('copy').textContent='Copiada (si el navegador lo permite)';};drawFilters();draw();
</script></body></html>
