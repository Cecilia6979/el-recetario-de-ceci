nte sólidos en que\nse cocieron en el caldo, para luego añadir el líquido de este asegurándonos\nque sea el doble del arroz nada más."},{"id":168,"title":"COCINAR ARROZ AL HORNO","category":"Otros","source":"365 recetas sin aceite","page":192,"text":"COCINAR ARROZ AL HORNO\nCon la freidora precalentada a 200°C, coloca la cazuela dentro de la cesta y\ncocínala durante 45 minutos y sirve."},{"id":169,"title":"COCHINILLO FRITO Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":193,"text":"COCHINILLO FRITO\nDificultad Media\nTiempo de preparación 10 minutos\nTiempo de cocción 75 minutos\nPara 5 personas\nINGREDIENTES\nMedio cochinillo\nManteca de cerdo\nBrandy\nSal\n1 medio limón\n1 patatas\nAceite de oliva\nPREPARACIÓN\nPela y corta la patata en rodajas y cubre la bandeja con ellas hasta hacer una\nfina capa. Cubre el cochinillo con la manteca de cerdo, y después echarle\npor encima el limón exprimido junto a la sal. Llévalo a la bandeja de la\nfreidora, estando ahí agrega un chorrito del brandy sobre él.\nCOCINAR COCHINILLO FRITO\nCon la freidora precalentada a 180°C, cocina el cochinillo durante 45\nminutos, pasado el tiempo sácalo y voltéalo para volver a cocinarlo otros 30\nminutos y después servirlo."},{"id":170,"title":"CACHOPO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":194,"text":"CACHOPO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n2 filetes de ternera\n2 huevos\n160 g de pan rallado\nLonchas de jamón y queso\nSal\n1 cda de ajo en polvo\nPimienta\n1 ramita de tomillo\n125 g de harina\nPREPARACIÓN\nPrimero pon uno de los filetes como base, sobre este vas a poner las lochas\nde jamón y queso. Coloca el segundo sobre estos y trata de cerrar las orillas\ndonde suaves golpes para que quede sellado. Cúbrelo con el aceite, alíñalo\ncon el ajo en polvo, sal y tomillo. Pásalo por harina en ambas caras, luego\npor los huevos batidos y por último el pan rallado. Cúbrelo con otra capa de\naceite.\nCOCINAR CACHOPO\nCon la freidora precalentada a 180ºC, cocina durante aproximadamente 12\nminutos y sirve."},{"id":171,"title":"CHULETAS DE CORDERO FRITA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":196,"text":"CHULETAS DE CORDERO FRITA\nDificultad Fácil\nTiempo de preparación 4 horas\nTiempo de cocción 20 minutos\nPara 3 personas\nINGREDIENTES\n6 chuletas de costilla de cordero pequeñas\n2 cda de ajo picado\nSal\n1 ½ cda de romero picado\n1 cdta de pimiento rojo en polvo\nPREPARACIÓN\nEn un bol mezcla el ajo con el romero y el pimiento en polvo. Con ayuda de\nuna cuchara sobre cada chuleta con la preparación. Agrégales sal por\nencima y déjalas reposar en el refrigerador por 4 horas. Pasado el tiempo\ncolócalas en la canasta de la freidora.\nCOCINAR CHULETAS DE CORDERO FRITA\nCon la freidora precalentada a 200°C, cocina las chuletas durante\naproximadamente 10 a 15 minutos y sirve."},{"id":172,"title":"CROQUETAS DE CARNE MOLIDA Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":197,"text":"CROQUETAS DE CARNE MOLIDA\nDificultad Medio\nTiempo de preparación 30 minutos\nTiempo de cocción 20 minutos\nPara 1 persona\nINGREDIENTES\n250 g de carne de res molida\n750 ml de leche semidesnatada\n1 Cebolla\nPimienta negra\nNuez moscada\nHarina de trigo\nAceite de oliva\n3 Huevos\nPan rallado\nPREPARACIÓN\nCocina en una sartén la cebolla picada con un poco de aceite y sal hasta que\nesté transparente. Añade la carne y sofríe todo por unos minutos. Sin dejar\nde revolver agrega tres cucharas de harina y vierte la leche poco a poco. Por\núltimo hecha pimienta negra y nuez moscada. Sácala del fuego y deja que\nenfríe por una hora y media. Con una cuchara toma porciones y dales forma\nde croquetas. Bate los huevos en un recipiente y agrega pan rallado en un\nplato. Sumerge las croquetas primero en el huevo y luego en el pan rallado.\nLlévalas a la cesta.\nCOCINAR CROQUETAS DE CARNE MOLIDA"},{"id":173,"title":"FILETES DE RES EN SALSA DE MANTEQUILLA Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":199,"text":"FILETES DE RES EN SALSA DE\nMANTEQUILLA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 2 personas\nINGREDIENTES\n2 filetes de res\n4 cdta de cáscara de limón rallada\n2 cda de cebollin picado\n7 cda de mantequilla\n2 cda de aceite de oliva\n3 cda de jugo de limón\nSal\nPimienta\nPREPARACIÓN\nEn una sartén a fuego medio coloca la mantequilla y mézclala con el jugo\nde limón, la ralladura de limón, el cebollín, la sal y la pimienta. Espera\nhasta que se forme una salsa espesa, retira del fuego y reserva. Espolvorea\nsobre los filetes sal y pimienta. Colócalos en la cesta, échales un chorrito de\naceite por arriba y llévalos a la freidora.\nCOCINAR FILETES DE RES EN SALSA DE MANTEQUILLA\nCon la freidora precalentada a 180°C, cocina los filetes durante 25 minutos\naproximadamente hasta que estén dorados. Cuando estén listos colócalos en"},{"id":174,"title":"COSTILLAS DE CERDO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":201,"text":"COSTILLAS DE CERDO\nDificultad Fácil\nTiempo de preparación 3 horas 20 minutos\nTiempo de cocción 30 minutos\nPara 5 personas\nINGREDIENTES\n1 ½ k de costillas de cerdo\n1 cdta de chile en polvo\n7 cda soperas de kétchup\n3 cda soperas de salsa de soja\n1 cda soperas de miel\n3 cda de aceite de oliva\n1 cda de vinagre balsámico\n1 cda de salsa inglesa\n1 pizca de sal\nPREPARACIÓN\nEn un tazón mezcla todos los ingredientes excepto las costillas. Limpia y\nseca las costillas. En un plato grande coloca las costillas y unta sobre ellas\nla primera preparación. Cúbrelas con papel film y déjalas marinar en el\nrefrigerador por 3 horas. Pasado el tiempo colócalas en la cesta y llévalas a\nla freidora.\nCOCINAR COSTILLAS DE CERDO\nCon la freidora precalentada a 180°C, cocina durante 30 minutos y sirve."},{"id":175,"title":"ALBÓNDIGAS DE CARNE Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":202,"text":"ALBÓNDIGAS DE CARNE\nDificultad Fácil\nTiempo de preparación 40 minutos\nTiempo de cocción 25 minutos\nPara 3-4 personas\nINGREDIENTES\n620 g de carne molida\n½ pimentón rojo finamente picado\n½ cebolla blanca finamente picada\n1 diente de ajo picado\n1 huevo\nsal\nPimienta\nCúrcuma\nAceite en aerosol\nSalsa para acompañar de tu preferencia\nPREPARACIÓN\nEn un bol mezcla la carne molida con todas las especias. En un tazón bate\nel huevo con la sal y la pimienta para luego verterlo en la carne. Tapa el bol\ncon plástico y déjalo reposar en el refrigerador por 30 minutos. Pasado el\ntiempo toma pequeñas porciones de la preparación y dales forma de\npequeñas bolas. Colócalas en la bandeja, rocíalas con aceite y llévalas a la\nfreidora.\nCOCINAR ALBÓNDIGAS DE CARNE"},{"id":176,"title":"PASTEL DE CARNE Dificultad Medio","category":"Postres","source":"365 recetas sin aceite","page":204,"text":"PASTEL DE CARNE\nDificultad Medio\nTiempo de preparación 15 minutos\nTiempo de cocción 40 minutos\nPara 5 personas\nINGREDIENTES\n1 k de carne molida\n2 huevos\n2 cebollas picadas\n60 ml de leche\n160 g de pan rallado\n55 g de perejil picado\n2 cda de salsa inglesa\n1 cdta de ajo en polvo\n2 cdta de condimento italiano\n½ tza de puré de tomate\nAceite en aerosol\nPREPARACIÓN\nEn un bol grande mezcla la carne molida con la cebolla, el perejil, la salsa y\nlos condimentos. En otro tazón aparte bate los huevos con el pan rallado y\nla leche. Une ambas preparaciones y mézclalas hasta tener una masa\nhomogénea. En un molde para pan que quepa en la freidora lo vas a cubrir\ncon papel aluminio. Rocía aceite sobre él y vierte la preparación dando\npequeños golpes para que quede firme. Saca el papel aluminio con cuidado\nde mantener la forma, colócalo en la cesta y llévalo a la freidora."},{"id":177,"title":"COCINAR PASTEL DE CARNE","category":"Postres","source":"365 recetas sin aceite","page":205,"text":"COCINAR PASTEL DE CARNE\nCon la freidora precalentada a 190°C, cocina durante 40 minutos\naproximadamente. Pasados los primeros 30 minutos vierte encima el puré\nde tomate y deja que se cocine el resto del tiempo para servir."},{"id":178,"title":"EMPANADAS DE CARNE Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":206,"text":"EMPANADAS DE CARNE\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 8 personas\nINGREDIENTES\n1 paquete de obleas para empanadas\n270 g de carne molida\n2 cebollas pequeñas picadas\n1 diente de ajo picado\n½ cdta de Perejil\n65 g de tomate triturado\n1 cdta de sazonador de carne asada\nSal\nPimienta negra molida\nAceite en aerosol\nPREPARACIÓN\nEn una sartén a fuego medio con aceite cocina el ajo junto a las cebollas\nhasta que se ablanden. Añade la carne y por encima espolvorea las especias.\nCuando este se halla sofreído, agrega la sal con el tomate picado, y deja\npasar 5 minutos a que se cocine. Espera a que enfrié y rellena las obleas con\nla preparación. Coloca una cucharada sobre una oblea, coloca otra arriba y\nsella los bordes con un tenedor. Colócalas en la cesta, rocíales aceite y\nllévalas a la freidora.\nCOCINAR EMPANADAS DE CARNE"},{"id":179,"title":"CERDO PROVENZAL Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":208,"text":"CERDO PROVENZAL\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 16 minutos\nPara 2 personas\nINGREDIENTES\n250 g de lomo de cerdo\n1 cebolla roja picada\n½ pimiento morrón picado\n1 pimiento verde picado\n1 cda de hierbas provenzales\nMostaza\n2 cdtas de aceite de oliva\nSal\nPimienta\nPREPARACIÓN\nEn la bandeja de la freidora mezcla los vegetales con 1 cucharadita de\naceite, sal y pimienta. Unta el lomo de cerdo con mostaza y el resto del\naceite, espolvoréale por encima sal y pimienta. Colócalo sobre los vegetales\ny llévalo a la freidora.\nCOCINAR CERDO PROVENZAL\nCon la freidora precalentada a 180°C, cocina durante 16 minutos\naproximadamente y sirve."},{"id":180,"title":"CORDERO ACOMPAÑADO CON COLES DE BRUSELAS CREMOSAS Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":209,"text":"CORDERO ACOMPAÑADO CON COLES DE\nBRUSELAS CREMOSAS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 1 hora\nPara 4 personas\nINGREDIENTES\n1 k de pierna de cordero\n3 cda de aceite de oliva\n1 cda de romero picado\n2 cda de tomillo limón picado\n2 dientes de ajo picados\n550 g de coles de Bruselas\n2 cda de mantequilla\n½ tza de crema agria\nSal\nPimienta negra molida\nPREPARACIÓN\nEn una sartén a fuego medio coloca las coles de Bruselas con la crema\nagria, mantequilla, ajo, sal y pimienta. Espera hasta que tome la textura de\nuna salsa espesa, retira del fuego y reserva. Únta el cordero con aceite.\nEspolvorea sobre él el romero, tomillo, sal y pimienta. Coloca en la cesta y\nllévalo a la freidora."},{"id":181,"title":"COCINAR","category":"Carnes y aves","source":"365 recetas sin aceite","page":210,"text":"COCINAR\nCORDERO\nACOMPAÑADO\nCON\nCOLES\nDE\nBRUSELAS CREMOSAS\nCon la freidora precalentada a 140°C, cocina el cordero durante 1 hora\naproximadamente hasta que esté bien cocido. Cuando estén listos córtalo en\nraciones. Acompáñalos con las coles de Bruselas y sírvelos."},{"id":182,"title":"CORDERO AL AJO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":211,"text":"CORDERO AL AJO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\n4 chuletas de cordero\n2 dientes de ajo picados\n2 cdta de orégano picado\n1 cda de cilantro picado\nSal\nPimienta negra molida\n2 cda de aceite de oliva\nPREPARACIÓN\nEn un tazón mezcla todos los ingredientes excepto las chuletas de cordero.\nUna la preparación sobre ellas por ambos lados. Colócalas en la cesta y\nllévalas a la freidora.\nCOCINAR CORDERO AL AJO\nCon la freidora precalentada a 200°C, cocina durante 10 minutos\naproximadamente y sirve."},{"id":183,"title":"PESCADO FRITO Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":214,"text":"PESCADO FRITO\nDificultad Fácil\nTiempo de preparación 1 hora 5 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n2 filetes de pescado de cualquier tipo\n½ cdta de aceite de oliva\nJugo exprimido de 1 limón\n1 pizca de sal\n1 cdta de pimienta\nPREPARACIÓN\nEn un tazón mezcla los filetes de pescado con el aceite, la sal y la pimienta.\nTápalo con plástico y déjalo reposar en el refrigerador por 1 hora. Pasado el\ntiempo colócalos en la cesta y llévalos a la freidora.\nCOCINAR PESCADO FRITO\nCon la freidora precalentada a 180°C, cocina durante 20 minutos\naproximadamente. Cuando pasen los primeros 10 minutos voltea los filetes,\ndéjalos cocinarse el resto del tiempo y sírvelos.\nFILETES DE PESCADO EMPANIZADOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 4 personas"},{"id":184,"title":"INGREDIENTES","category":"Desayunos","source":"365 recetas sin aceite","page":215,"text":"INGREDIENTES\n4 filetes de pescado\n1 cda de aceite de oliva\n1 huevo\n50 ml de leche\n½ cdta de pimentón en polvo\n1 cdta de ají en polvo\n1 cdta de ajo en polvo\n1 cdta de cebolla en polvo\n150 g de pan rallado\n1 pizca de sal\n1 cdta de pimienta\nPREPARACIÓN\nÚntales aceite a los filetes. Coloca el pan rallado en un plato, mézclalo con\nla sal, la pimienta y todas las especias. En un tazón vierte la leche con el\nhuevo y bate. Sumerge los filetes en la preparación con huevo y después\npásalos por el pan rallado. Colócalos en la canasta y llévalos a la freidora.\nCOCINAR FILETES DE PESCADO EMPANIZADOS\nCon la freidora precalentada a 200°C, cocina durante 15 minutos\naproximadamente. Cuando pasen los primeros 10 minutos voltea los filetes,\ndéjalos cocinarse el resto del tiempo y sírvelos."},{"id":185,"title":"Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":216,"text":"PESCADO CON PATATAS FRITAS\nDificultad Fácil\nTiempo de preparación 75 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n2 filetes de pescado de 150 g c/u\n2 huevos\n1 tza de pan rallado\n400 g de patatas\n1 cda de jugo de limón\n1 ½ cda de aceite de oliva\nPREPARACIÓN\nPela y corta las patatas. Remójalas en agua muy fría por unos 30 minutos.\nSécalas y coloca aceite por encima, de una manera ligera. Llévalas a la\nfreidora por 10 minutos, aproximadamente, a 200°C, hasta que estén bien\ncocidas, y ponlas aparte. En un recipiente coloca los filetes y rocíalos con el\njugo de limón. Espolvoréales sal y la pimienta. Tápalos y déjalos reposar en\nel refrigerador por 25 minutos. En un bol bate los huevos y en un plato\ncoloca el pan rallado. Pasa los filetes por el huevo y luego pásalos por el\npan rallado. Coloca en la cesta y llévalos a la freidora.\nCOCINAR PESCADO CON PATATAS FRITAS\nCon la freidora precalentada a 180°C, cocina los filetes durante 12 minutos.\nCuando estén listos sirve con las patatas."},{"id":186,"title":"Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":217,"text":"PESCADO CON VERDURAS\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 15 minutos\nPara 2 personas\nINGREDIENTES\n2 filetes de pescado\n2 cebollas pequeñas picadas\n½ pimiento verde picado\n½ pimiento rojo picado\n1 puerro picado\n1 pizca de romero\n1 pizca de ajo en polvo\nSal\nPimienta\nAceite de oliva\nPREPARACIÓN\nEn un tazón coloca los filetes y úntalos con aceite. Espolvoréales la sal, el\najo en polvo, el romero y la pimienta. Tapa con plástico y déjalo reposar en\nel refrigerador por 20 minutos. Has una superficie amplia con papel\naluminio y coloca adentro de esta las cebollas, los pimientos y el puerro.\nVierte sobre ellos un chorrito de aceite y espolvoréales una pizca de sal.\nDobla los extremos encerrando las verduras y llévalas a la freidora.\nCOCINAR PESCADO CON VERDURAS"},{"id":187,"title":"PALITOS DE PESCADO EMPANIZADOS CON SALSA Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":219,"text":"PALITOS DE PESCADO EMPANIZADOS CON\nSALSA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 2 personas\nINGREDIENTES\n185 g de mayonesa\n3 cda de condimento de pepinillo\n2 cdta de condimento para mariscos\n500 g de filetes de pescado blanco\n160 g de pan rallado\nAceite en aerosol\nPREPARACIÓN\nEn un bol mezcla la mayonesa con el condimento de pepinillos y el de\nmariscos. Corta los filetes a lo largo para que queden en forma de palitos.\nColoca en un plato plano el pan rallado. Únta los palitos con la salsa de\nmayonesa, luego pásalos por el pan rallado. Colócalos en la cesta sin que\nninguno se toque, rocíalos con aceite y llévalos a la freidora.\nCOCINAR PALITOS DE PESCADO EMPANIZADOS CON SALSA\nCon la freidora precalentada a 200°C, cocina los palitos durante 12 minutos\ny sírvelos."},{"id":188,"title":"SALMÓN FRITO Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":220,"text":"SALMÓN FRITO\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 13 minutos\nPara 1 persona\nINGREDIENTES\n1 pieza de salmón\nMedio limón exprimido\nAjo en polvo\nPimienta negra molida\nRomero\nSal\nAceite en aerosol\nPREPARACIÓN\nEn un tazón has una mezcla del jugo de limón con las especias. Coloca el\nsalmón dentro del recipiente y unta la preparación en ambos lados de este.\nLlévalo al refrigerador y déjalo reposar por 20 minutos. Pasado el tiempo\ncolócalo en la freidora, esparce el aceite por arriba y llévalo a la freidora.\nCOCINAR SALMÓN FRITO\nCon la freidora precalentada a 200°C, cocina el salmón durante 13 minutos\naproximadamente y sirve."},{"id":189,"title":"SALMÓN CON ESPINACAS SALTEADAS Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":221,"text":"SALMÓN CON ESPINACAS SALTEADAS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 15 minutos\nPara 5 personas\nINGREDIENTES\n5 filetes de salmón\n1 cdta de condimento para mariscos bajo en sodio\n½ cdta de pimienta\n1 diente de ajo picado\n1 cdta de hojas de pimiento rojo trituradas\n9 tza de espinacas tiernas frescas\n7 tomates pequeños picados y sin semillas\nAceite de oliva\nPREPARACIÓN\nPara las espinacas saltadas vas a poner una olla a fuego medio con 3\ncucharadas de aceite junto al ajo y las hojas de pimienta. Cocina un par de\nminutos y agrega las espinacas, cuando se ablanden un poco añade los\ntomates. Cocina unos pocos minutos, retira del fuego y reserva. En un tazón\ncoloca los filetes y úntalos con aceite. Espolvoréales el condimento para\nmariscos y pimienta. Colócalos en la cesta y llévalos a la freidora.\nCOCINAR SALMÓN CON ESPINACAS SALTEADAS\nCon la freidora precalentada a 200°C, cocina el salmón durante 15 minutos\naproximadamente. Coloca en un plato las espinacas y arriba de ellas el\nsalmón para servir."},{"id":190,"title":"SALMÓN ENELDO Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":223,"text":"SALMÓN ENELDO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 1 persona\nINGREDIENTES\n1 filete de salmón\nEneldo al gusto\nSal\n½ cdta de aceite de oliva\nPREPARACIÓN\nUnta el salmón con aceite por ambos lados. Espolvorea la sal y unta el\neneldo en el filete. Colócalo en la cesta y llévalo a la freidora.\nCOCINAR SALMÓN ENELDO\nCon la freidora precalentada a 200°C, cocina el salmón durante 10 minutos\ny sirve."},{"id":191,"title":"BACALAO FRITO Dificultad Medio","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":224,"text":"BACALAO FRITO\nDificultad Medio\nTiempo de preparación 5 minutos\nTiempo de cocción 12 minutos\nPara 3 personas\nINGREDIENTES\n4 Filetes de bacalao\n1 pimentón\n2 cda de orégano\nPerejil picado\nPan rallado\nAceite de oliva\nPREPARACIÓN\nAsegúrate que los filetes estén limpios y sin espinas. Pica el pimentón de tu\npreferencia y espárcelo por encima del bacalao junto con el orégano y el\nperejil. Después pásalos por el pan rallado para que tenga una capa.\nAgrégale un poco de aceite de oliva en la base de la freidora y el bacalao\ndentro.\nCOCINAR BACALAO FRITO\nCon la freidora precalentada a 180°C, cocina los filetes por 6 minutos y\npasado el tiento dales la vuelta y cocina otros 6 minutos y sirve."},{"id":192,"title":"BACALAO GRATINADO CON ALIOLI Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":225,"text":"BACALAO GRATINADO CON ALIOLI\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n8 porciones lomo de bacalao\n3 calabacines picados en cuadrados\nAceite de oliva\n2 dientes de ajo\n215 ml de aceite suave\n1 huevo\nSal\nPimienta\nPREPARACIÓN\nPara el alioli vas a poner en una licuadora los dientes de ajo sin cáscara, el\nhuevo, sal y el aceite suave. Licua por aproximadamente 1 minuto, hasta\nque se vuelva una masa homogénea y reserva. Coloca el calabacín en la\ncesta de la freidora, échale sal, aceite de oliva y cocínalo por 10 minutos a\n180ºC. Cuando esté listo remuévelo un poco y coloca encima de este las\nporciones de bacalao. Espolvoréales sal y pimienta, luego agrégales arriba\nuna capa abundante de allioli. Lleva a la freidora.\nCOCINAR BACALAO GRATINADO CON ALIOLI\nCon la freidora precalentada a 180ºC, cocina las croquetas durante 10\nminutos y sírvelas."},{"id":193,"title":"GAMBAS FRITAS Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":227,"text":"GAMBAS FRITAS\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 12 minutos\nPara 1 persona\nINGREDIENTES\n7 gambas\n2 dientes de ajo\n1 cdta de Perejil\n1 pizca de sal\n1 cda de aceite de oliva\nPREPARACIÓN\nLimpia y quítales las menudencias a las gambas. En un tazón mézclalas con\nel resto de los ingredientes. Tápalo con plástico y déjalas marinar en el\nrefrigerador por 30 minutos. Pasado el tiempo colócalas en la cesta y\nllévalas a la freidora.\nCOCINAR GAMBAS FRITAS\nCon la freidora precalentada a 160°C, cocina las gambas durante 12\nminutos. Pasados los primeros 6 minutos mueve la cesta un poco para que\nse cocinen uniformemente, deja que se cocinen el resto del tiempo y sirve."},{"id":194,"title":"GAMBAS EMPANIZADAS CON COCO RALLADO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":228,"text":"GAMBAS EMPANIZADAS CON COCO\nRALLADO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 minutos\nPara 5 personas\nINGREDIENTES\n23 gambas\n100 g de harina\n75 g de pan rallado\n75 g de coco rallado\n1 huevo\nSal\nPimienta\nAceite de oliva\nPREPARACIÓN\nLimpia y quítales las menudencias a las gambas. En un tazón mézclalas con\nla sal y la pimienta. Coloca el pan rallado en un plato, mézclalo con el coco\nrallado. En otro plato agrega la harina y en un tazón bate el huevo con una\npizca de sal. Pasa primero las gambas por la harina. Luego sumérgelas en el\nhuevo y luego pásalos por la mezcla de pan rallado y coco. Colócalas en la\ncesta sin estar muy juntas, vierte un chorrito de aceite encima de ellas y\nllévalas a la freidora.\nCOCINAR GAMBAS EMPANIZADAS CON COCO RALLADO"},{"id":195,"title":"BROCHETAS DE GAMBAS CON PIÑAS Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":230,"text":"BROCHETAS DE GAMBAS CON PIÑAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 3 personas\nINGREDIENTES\n9 gambas\n1 lata de piña en su jugo\n160 ml de aceite balsámico\n125 g de azúcar\nPREPARACIÓN\nPara la salsa en una sartén a fuego bajo vas a verter el aceite y la azúcar.\nCocine hasta que espese, retírala del juego y reserva. Limpia las gambas.\nLuego pélalas y córtales la cola. Deja escurrir la piña en lata y córtala en\npedazos del mismo tamaño que las gambas. Pincha las gambas y los trozos\nde piña con palillos de altura en el orden que prefieras. Colócalas en la\nbandeja y llévalas a la freidora.\nCOCINAR BROCHETAS DE GAMBAS CON PIÑAS\nCon la freidora precalentada a 180°C, cocina las brochetas durante 10\nminutos. Cuando estén listas esparce la salsa sobre ellas y sírvelas.\nMERLUZA CON GAMBAS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos"},{"id":196,"title":"Para 2 personas","category":"Postres","source":"365 recetas sin aceite","page":231,"text":"Para 2 personas\nINGREDIENTES\nLa mitad de una merluza cortada en forma de filetes y sin espinas\n210 g de gambas\n3 dientes de ajo picados\n35 g de perejil picado\n56 ml de vino blanco\n1 cdta de pimentón dulce\nSal\nPimienta negra molida\n1 cda de aceite de oliva\nPREPARACIÓN\nRocía la merluza con la sal. Limpia y quítales las menudencias a las\ngambas. Mezcla en un tazón el aceite con los ajos, el perejil, el pimentón y\nel vino blanco. Vierte la mitad de dicha preparación en un molde para\nhornear que quepa en la freidora y cúbrelo completamente. Coloca la\nmerluza en él y encima de esta vierte el resto de la salsa. Agrega las gambas\ny espolvorea arriba con sal y pimienta. Lleva el molde a la freidora de aire.\nCOCINAR MERLUZA CON GAMBAS\nCon la freidora precalentada a 180°C, cocina las gambas durante 10\nminutos aproximadamente y sirve."},{"id":197,"title":"MERLUZA FRITA Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":232,"text":"MERLUZA FRITA\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 1 persona\nINGREDIENTES\n4 pedazos de merluza en forma de cubo\n1 cdta de aceite de oliva\n1 cdta de ajo en polvo\n1 pizca de sal\nOrégano\nPREPARACIÓN\nÚntales aceite a los pedazos de merluza. Espolvorea sobre ellos la sal, la\npimienta y el ajo en polvo. Colócalos en la cesta y llévalos a la freidora.\nCOCINAR MERLUZA FRITA\nCon la freidora precalentada a 200°C, cocina durante 10 minutos\naproximadamente y sirve."},{"id":198,"title":"MERLUZA A LA BILBAÍNA Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":233,"text":"MERLUZA A LA BILBAÍNA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 3 personas\nINGREDIENTES\n6 piezas de merluza\n2 dientes de ajo picados\n3 Guindillas rojas picadas en trozos\n110 ml de aceite de oliva\n35 ml de vinagre a base de vino blanco\n1 cdta de pimentón dulce\n1 rama de perejil picada\nSal\nAceite en aerosol\nPREPARACIÓN\nColoca una olla a fuego medio el aceite de oliva con el ajo. Después de\nunos minutos agrega las guindillas. Vierte el vinagre de vino blanco y\ndéjalo cocinar un par de minutos. Retira del fuego y déjalo reposar. Agrega\nel perejil picado con el pimentón dulce y reserva. Cubre la canasta de la\nfreidora con papel antiadherente. Coloca la merluza y arriba de ella vas a\nrociarle el aceite y espolvoréale la sal. Lleva a la freidora.\nCOCINAR MERLUZA A LA BILBAÍNA\nCon la freidora precalentada a 200°C, cocina durante 10 minutos. Cuando\nestén listas colócalas sobre un plato, vierte una generosa cantidad de salsa"},{"id":199,"title":"MERLUZA CON SALSA VERDE Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":235,"text":"MERLUZA CON SALSA VERDE\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 3 personas\nINGREDIENTES\n6 piezas de merluza\n3 cda de aceite de oliva\n1 ½ cda de harina de trigo\n1 diente de ajo\n220 ml de caldo de pescado\n180 ml de vino blanco\n2 ramitas de Perejil picadas\nSal\nAceite en aerosol\nPREPARACIÓN\nColoca una olla a fuego medio el aceite de oliva con el ajo. Después de\nunos minutos agrega la harina. Vierte el vino blanco y sin dejar de mezclar,\ndeja que se cocine por unos dos minutos. Vierte después el caldo de\npescado, y añade el perejil con un poquito de sal. Cocina durante 8 minutos\naproximadamente, retira del fuego y reserva. Cubre la canasta de la freidora\ncon papel antiadherente. Coloca la merluza, y arriba de ella vas a rociarle el\naceite y espolvoréale la sal. Lleva a la freidora.\nCOCINAR MERLUZA CON SALSA VERDE"},{"id":200,"title":"SARDINAS FRITAS Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":237,"text":"SARDINAS FRITAS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 6 minutos\nPara 2 personas\nINGREDIENTES\n12 sardinas\n100 g de sal gruesa\nLimón\nPREPARACIÓN\nLava las sardinas. Quítales las escamas y las menudencias. En un recipiente\nagrega la sal gruesa y mézclala con las sardinas. Colócalas en la cesta y\nllévalas a la freidora.\nCOCINAR SARDINAS FRITAS\nCon la freidora precalentada a 180°C, cocina las sardinas durante 6\nminutos. Pasados los primeros 3 minutos voltéalas, deja que se cocinen el\nresto del tiempo y sirve."},{"id":201,"title":"DORADA FRITA Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":238,"text":"DORADA FRITA\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 12 minutos\nPara 3 personas\nINGREDIENTES\n3 filetes de dorada\n1 limón cortado a la mitad\n1 cebolla y media picadas\n1 cdta de ajo en polvo\n3 dientes de ajo\nSal\nPimienta\nAceite de oliva\nPREPARACIÓN\nUnta las doradas por completo con aceite. Espolvorea sobre ellas la sal, la\npimienta y el ajo en polvo. Toma una de las mitades del limón y córtala en\nrodajas. Colócalas por encima de los filetes. También coloca la cebolla\npicada y un diente de limón picado a cada una. Coloca los filetes en la\ncesta, exprime la otra mitad del limón sobre ellas y llévalas a la freidora.\nCOCINAR DORADA FRITA\nCon la freidora precalentada a 200°C, cocina los filetes de dorada durante\n12 minutos y sirve."},{"id":202,"title":"DORADA A LA SAL Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":239,"text":"DORADA A LA SAL\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 18 minutos\nPara 2 personas\nINGREDIENTES\n1 dorada entera\n1 ¼ k de sal gruesa especial para hornear\n1 pizca de romero picado\n1 pizca de tomillo picado\n1 clara de huevo\n½ limón\n1 cdta de aceite de oliva\nPREPARACIÓN\nEn un bol grande mezcla la sal con la clara de huevo, el jugo de limón, el\naceite, el tomillo y el romero. En un molde para hornear que quepa en la\nfreidora coloca una capa fina con la mitad de la sal. Arriba de esta pon la\ndorada entera y cúbrela completamente con el resto de la sal dejando solo la\nparte del ojo al descubierto. Llévala a la freidora.\nCOCINAR DORADA A LA SAL\nCon la freidora precalentada a 200°C, cocina la dorada durante 18 minutos\naproximadamente. Cuando la saques, debe tener una costra de sal alrededor\nde ella. Con un cuchillo quítale cuidadosamente la capa se sal y la piel.\nHazle un corte a lo largo y quítale la espina dorsal con cabeza y cola.\nColoca en un plato los filetes de carne de la dorada y sírvelos."},{"id":203,"title":"CAMARONES AL AJO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":241,"text":"CAMARONES AL AJO\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\n600 g de camarones sin cabeza\n1 cda de ajo en polvo\nSal\nPimienta negra molida\n2 cda de aceite de oliva\nPREPARACIÓN\nEn un tazón mezcla los camarones con el resto de los ingredientes. Tápalo\ncon plástico y déjalos marinar en el refrigerador por 20 minutos. Pasado el\ntiempo colócalos en la cesta y llévalos a la freidora.\nCOCINAR CAMARONES AL AJO\nCon la freidora precalentada a 200°C, cocina los camarones durante 10\nminutos, aproximadamente, y sirve."},{"id":204,"title":"CAMARONES EMPANIZADOS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":242,"text":"CAMARONES EMPANIZADOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 1-2 personas\nINGREDIENTES\n550 g de camarones\n2 huevos\n80 g de pan molido\n150 g de harina\nSal\nPimienta\nAceite en aerosol\nPREPARACIÓN\nLimpia los camarones y quítales las venas. Espolvoréalos con sal y\npimienta. Coloca el pan rallado en un plato. En otro agrega la harina y en un\ntazón bate el huevo. Pasa los camarones primero por la harina, luego\nsumérgelos en el huevo y por último pásalos por el pan rallado. Colócalos\nen la cesta de manera separada, rocíalos con aceite y llévalos a la freidora.\nCOCINAR CAMARONES EMPANIZADOS\nCon la freidora precalentada a 200°C, cocina durante 10 minutos y sirve."},{"id":205,"title":"ARROZ NEGRO CON SEPIA Dificultad Media","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":243,"text":"ARROZ NEGRO CON SEPIA\nDificultad Media\nTiempo de preparación 25 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n510 g de arroz\n3 sepias limpias\n1 cebolla\n1 pimiento\n3 dientes de ajos\nSal\n75 ml de vino blanco\n1 ¼ L de caldo de pescado\n5 sobres de tinta de calamares\n2 tomates triturado\nAceite de oliva\nPREPARACIÓN\nPrimero pica las sepias en trozos pequeños. Llévalos a la bandeja de la\nfreidora precalentada a 230ºC, con un poco de aceite y cocínalos unos 12\nminutos, resérvalos para después. Ahora pica la cebolla, el pimiento y\nllévalos a la freidora por 10 minutos a 230ºC. Pasado el tiempo agrega\ntambién los dientes de ajo junto al tomate y cocínalo, todo junto, otros 5\nminutos.\nCOCINAR ARROZ NEGRO CON SEPIA"},{"id":206,"title":"SEPIA AL AJILLO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":245,"text":"SEPIA AL AJILLO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 2 personas\nINGREDIENTES\n700 g de sepia\n3 dientes de ajo picados\n1 cda de perejil picado\nAceite de oliva\nPREPARACIÓN\nLimpia bien y seca las sepias. Córtalas en pedazos no muy pequeños.\nColócalos en un tazón y mézclalos con el perejil junto a los ajos. Colócalos\nahora en la cesta, échales un chorrito de aceite por encima y llévalos a la\nfreidora.\nCOCINAR SEPIA AL AJILLO\nCon la freidora precalentada a 180°C, cocina durante 15 minutos y sirve."},{"id":207,"title":"PESCADO AL HORNO CON QUESO SUIZO Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":246,"text":"PESCADO AL HORNO CON QUESO SUIZO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 18 minutos\nPara 3 personas\nINGREDIENTES\n6 filetes de pescado\n6 lonchas de queso suizo\n1 tza de crema agria\n35 g de mantequilla\nSal\nPimienta\nPREPARACIÓN\nCubre un molde para hornear que quepa en la freidora con la mantequilla.\nColoca los filetes y espolvorea sobre ellos la sal y la pimienta. Arriba de\ncada filete, coloca una loncha de queso suizo. A los lados les vas a agregar\nla crema agria. Lleva a la freidora.\nCOCINAR PESCADO AL HORNO CON QUESO SUIZO\nCon la freidora precalentada a 150°C, cocina durante 18 minutos,\naproximadamente, y sirve."},{"id":208,"title":"BAGRE FRITO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":247,"text":"BAGRE FRITO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 6 personas\nINGREDIENTES\n6 filetes de bagre\n1 cda de pimentón dulce\n2 cda de perejil picado\n3 cda de Jugo de limón\n1 cda de aceite de oliva\nSal\nPimienta negra\nPREPARACIÓN\nEn un tazón coloca los filetes y úntalos con aceite. Espolvoréales la sal, el\npimentón, el perejil y la pimienta. Colócalos en la bandeja y llévalos a la\nfreidora.\nCOCINAR BAGRE FRITO\nCon la freidora precalentada a 200°C, cocina durante 20 minutos\naproximadamente. Cuando estén listos, y aun calientes, vierte media\ncucharada de jugo de limón sobre ellos y sirve."},{"id":209,"title":"BROCHETAS DE CAMARONES CON MANTEQUILLA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":248,"text":"BROCHETAS DE CAMARONES CON\nMANTEQUILLA\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 6 minutos\nPara 3 personas\nINGREDIENTES\n9 camarones\n4 dientes de ajo picados\n6 pimientos verde cortados en rodajas\n2 cda de romero picado\n2 cda de mantequilla derretida\nSal\nPimienta\nPREPARACIÓN\nLimpia los camarones y quítales las venas. Colócalos en un tazón junto con\nel resto de los ingredientes y mezcla. Tapa con plástico, y déjalo reposar en\nel refrigerador por 15 minutos. Pasado el tiempo pincha los camarones y los\npimientos con palillos de altura en el orden que prefieras. Colócalos en la\nbandeja y llévalas a la freidora.\nCOCINAR BROCHETAS DE CAMARONES CON MANTEQUILLA\nCon la freidora precalentada a 180°C, cocina durante 6 minutos,\naproximadamente, y sirve."},{"id":210,"title":"VEGETALES CON CAMARONES Y CANGREJO Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":249,"text":"VEGETALES CON CAMARONES Y CANGREJO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n150 g de camarones pelados\n150 g de carne de cangrejo en copos\n80 g de cebolla amarilla picada\n110 g de pimientos verdes picados\n4 apios picados\n200 g de Mayonesa\n2 cdta de salsa Worcestershire\n2 cda de pan rallado\n15 g de mantequilla derretida\n1 cdta de pimentón dulce\nSal\nPimienta\nPREPARACIÓN\nEn una sartén, a fuego medio, mezcla el cangrejo y los camarones con la\ncebolla, los pimientos, los apios, la mayonesa, la salsa Worcestershire, sal y\npimienta. Después de unos minutos agrega la mantequilla, el pimentón y el\npan rallado. Retira del fuego, llévalos a la canasta y ponlos en la freidora.\nCOCINAR VEGETALES CON CAMARONES Y CANGREJO"},{"id":211,"title":"CALAMARES FRITOS Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":251,"text":"CALAMARES FRITOS\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 8 personas\nINGREDIENTES\n1 k de calamares pequeño\n1 cdta de condimento Old Bay\n160 g de harina simple\n140 g de harina de almendras\n4 tza de aceite de oliva\n1 cdta de sal\n1 pizca de pimienta\nPREPARACIÓN\nLimpia y corta los calamares, dejando únicamente los tentáculos. Colócalos\nen un tazón con todos los ingredientes, excepto el aceite, y mézclalos.\nColócalos en la cesta, cúbrelos con una considerable cantidad de aceite y\nllévalos a la freidora.\nCOCINAR CALAMARES FRITOS\nCon la freidora precalentada a 180°C, cocina los tentáculos durante 10\nminutos, aproximadamente, hasta que se tomen un color morado y sírvelos."},{"id":212,"title":"CAMARONES A LA PARMESANA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":252,"text":"CAMARONES A LA PARMESANA\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 5 personas\nINGREDIENTES\n750 g de camarones grandes\n2 dta de cebolla en polvo\n½ cdta de albahaca\n1 cdta de orégano\n2 cdta de pimienta\n½ tza de queso parmesano rallado\n2 dientes de ajo picados\n1 cda aceite de oliva\nPREPARACIÓN\nLimpia los camarones y quítales las venas. Colócalos en un tazón junto con\nel resto de los ingredientes y mézclalos. Colócalos en la cesta, agrégales\naceite por encima y llévalos a la freidora.\nCOCINAR CAMARONES A LA PARMESANA\nCon la freidora precalentada a 180°C, cocina los tentáculos durante 10\nminutos, aproximadamente, y sirva."},{"id":213,"title":"CROQUETAS DE ATÚN AL LIMÓN Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":253,"text":"CROQUETAS DE ATÚN AL LIMÓN\nDificultad Fácil\nTiempo de preparación 3 horas\nTiempo de cocción 10 minutos\nPara 1 persona\nINGREDIENTES\n190 g de atún en lata\n3 cdta de mostaza de Dijon\n160 g de pan rallado\n1 cda de jugo de limón\n1 cda de perejil picado\n1 huevo\n3 cda de aceite de canola\nSal\nPimienta\nPREPARACIÓN\nEn un tazón grande agrega el atún sin agua y mézclalo con la mostaza, el\njugo de limón, el perejil, el aceite de canola y el pan rallado. Después\nincorpora el huevo con la sal y mézclalo todo junto. Toma pequeñas\nporciones y con las manos dales forma de bolitas. Llévalas al refrigerador y\ndéjalas reposar por 3 horas. Pasado el tiempo colócalas en la bandeja y\nllévalas a la freidora.\nCOCINAR CROQUETAS DE ATÚN AL LIMÓN\nCon la freidora precalentada a 180°C, cocínalas durante 10 minutos\naproximadamente y sirve."},{"id":214,"title":"PALITOS DE CANGREJO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":255,"text":"PALITOS DE CANGREJO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\n450 g de palitos de cangrejo\n1 cdta de condimento de Cajun\n1 pizca de pimienta\n2 cdta de aceite de sésamo\nPREPARACIÓN\nCorta los palitos de cangrejo por la mitad. Colócalos en un tazón y úntalos\ncon el aceite. Espolvorea sobre ellos la pimienta con el condimento y\nmézclalos. Colócalos en la bandeja y llévalos a la freidora.\nCOCINAR PALITOS DE CANGREJO\nCon la freidora precalentada a 180°C, cocina los palitos durante 10 minutos,\naproximadamente, y sirve."},{"id":215,"title":"SALMÓN DE DIJON Dificultad Fácil","category":"Pescados y mariscos","source":"365 recetas sin aceite","page":256,"text":"SALMÓN DE DIJON\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 13 minutos\nPara 1 persona\nINGREDIENTES\n2 filetes de salmón\n2 cda de jarabe de arce\n1 cda de mostaza de Dijon\nPREPARACIÓN\nEn un tazón mezcla la mostaza con el jarabe. Únta la preparación en ambos\nfiletes. Cubre la bandeja de la freidora con papel antiadherente, coloca los\nfiletes y llévalos a la freidora.\nCOCINAR SALMÓN DE DIJON\nCon la freidora precalentada a 200°C, cocina durante 13 minutos\naproximadamente y sirve."},{"id":216,"title":"CAMARONES ENVUELTOS EN BACON Dificultad Fácil","category":"Carnes y aves","source":"365 recetas sin aceite","page":257,"text":"CAMARONES ENVUELTOS EN BACON\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 6 minutos\nPara 2-3 personas\nINGREDIENTES\n600 g de camarones\n510 g de lonchas de bacon\nPimentón en polvo\nPREPARACIÓN\nLimpia los camarones y quítales las venas. Enrolla con las lonchas de bacon\nlos camarones e insértales un palillo de cocina para que se sujeten.\nEspolvoréales una pizca de pimentón. Llévalas al refrigerador y déjalos\nreposar por 30 minutos. Pasado el tiempo colócalos en la cesta y llévalas a\nla freidora.\nCOCINAR CAMARONES ENVUELTOS EN BACON\nCon la freidora precalentada a 200°C, cocina durante 6 minutos,\naproximadamente, y sirve."},{"id":217,"title":"PAELLA MIXTA Dificultad Media","category":"Carnes y aves","source":"365 recetas sin aceite","page":258,"text":"PAELLA MIXTA\nDificultad Media\nTiempo de preparación 15 minutos\nTiempo de cocción 45 a 50 minutos\nPara 4 personas\nINGREDIENTES\n260 g de arroz para paella\n½ pimiento rojo picado\n1 pimiento verde picado\n1 cebolla picada\n1 cuarto de taza de vino cualquiera\n2 tza de caldo de pollo\n2 muslos de pollo cortados en cuadrados\n3 costillas de cerdo picados en cuadrados\n215 g de mejillones\n190 g de camarones\n½ tza de judías verdes\n2 cda de aceite de oliva\n2 dientes de ajo\n1 pizca de sal\n1 pizca de pimienta\n1 pizca de paprika\nPREPARACIÓN\nEn la cesta de la freidora de aire coloca la cebolla y los ajos junto al aceite\nde oliva y mézclalos para después llevarlos a cocinar por 4 minutos a\n180°C. Pasado el tiempo agrega los cuadrados de pollo y de cerdo con los"},{"id":218,"title":"mejillones, previamente limpiados, y vuelve a cocinar por 5 minutos. Añade","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":259,"text":"mejillones, previamente limpiados, y vuelve a cocinar por 5 minutos. Añade\nlos pimientos, judías verdes, las especias, y el resto de los ingredientes\n(excepto los camarones), a la canasta para ir mezclándolos hasta que todo\nquede unido.\nCOCINAR PAELLA MIXTA\nCon la freidora precalentada a 180°C, cocina por 35 minutos o hasta que el\ncaldo de pollo se evapore, pasado el tiempo agregamos los camarones\narriba de la preparación y volvemos a cocinar por aproximadamente 15\nminutos y dejamos reposar para servir."},{"id":219,"title":"SOPA DE TOMATE Y JUDÍAS VERDES Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":261,"text":"SOPA DE TOMATE Y JUDÍAS VERDES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 6 horas\nPorción 8 personas\nINGREDIENTES\n500 g de judías verdes frescas cortadas en trozos pequeños\n90 g de zanahorias picadas\n600 g de tomates frescos, cortados en trozos pequeños\n1 diente de ajo picado\n1 ½ L de caldo de verduras\npimienta negra al gusto\n80 g de cebollas picadas\n1 cdta de albahaca\n½ cdta de sal\nPREPARACIÓN\nColoca todos los ingredientes dentro de la olla interna y remueva bien.\nLuego tapa la olla.\nCOCINAR SOPA DE TOMATE Y JUDÍAS VERDES\nPresiona cocción lenta, y ajusta el temporizador a 6 horas, modo lento. Al\nfinalizar deja reposar unos minutos y luego sirve."},{"id":220,"title":"ESPÁRRAGOS FRITOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":262,"text":"ESPÁRRAGOS FRITOS\nDificultad Fácil\nTiempo de Preparación 7 minutos\nTiempo de Cocción 8 minutos\nPorciones 2 personas\nINGREDIENTES\n500 g de espárragos\n1 cdta de aceite de oliva\nAerosol antiadherente\nSal\nPimienta negra al gusto\nLechuga\nPREPARACIÓN\nLimpia bien los espárragos, córtalos en trozos medianos, rocíalos con\naceite.\nCOCINAR ESPÁRRAGOS FRITOS\nColoca aerosol antiadherente a la cesta freidora. Marca la opción de freír a\nuna temperatura de 135°C. El temporizador a 8 minutos. Inicia el proceso,\nal finalizar sirve sobre la hoja de lechuga."},{"id":221,"title":"PIMIENTO RELLENO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":263,"text":"PIMIENTO RELLENO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 25 minutos\nPorción 4 personas\nINGREDIENTES\n5 huevos\n20 g de floretes de brócoli\n50 g de tomates cherry\n90 g de queso cheddar rallado\n2 pimientos grandes, cortados por la mitad sin semillas\nPimienta al gusto\nSal\nPREPARACIÓN\nEn un recipiente coloca los huevos batidos, el brócoli, los tomates, pimienta\ny sal. Mezcla bien hasta hacer una masa homogénea. Coloca en los\npimientos y espolvorea queso sobre estos. Colócalos dentro de la olla y\ntápalos.\nCOCINAR PIMIENTO RELLENO\nMarca la selección de horneado, la temperatura ubícala en 200°C, por un\ntiempo de 25 minutos. Comienza con el proceso de cocción. Luego de\nfinalizar puedes servir."},{"id":222,"title":"CAZUELA DE ALCACHOFAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":264,"text":"CAZUELA DE ALCACHOFAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPorción 12 personas\nINGREDIENTES\n15 huevos\n400 g de corazones de alcachofa, escurridos y cortados en trozos\n(lata).\n½ cdta de pimienta roja molida\n½ cdta de tomillo bien picado\n120 g de queso ricotta\n130 g de queso parmesano\n250 g de queso cheddar, rallado\n280 g de espinacas bien limpias\n1 diente de ajo, picado\n20 g de cebolla picada\n1 cdta de sal\nPREPARACIÓN\nEn un recipiente limpio bate los huevos, luego añade los demás\ningredientes, exceptuando el queso ricota. Comenzando por las espinacas y\nla alcachofa, integra, y luego agrega los demás. Esa mezcla obtenida debe\nser vertida en la olla de manera uniforme, posteriormente coloca el queso\nricota sobre la masa anterior y tapa.\nCOCINAR CAZUELA DE ALCACHOFAS"},{"id":223,"title":"TOMATE AL HORNO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":266,"text":"TOMATE AL HORNO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPorción 2 personas\nINGREDIENTES\n3 huevos\n2 tomates grandes\n1 cdta de perejil fresco\nPimienta negra al gusto\nSal\nPREPARACIÓN\nCorta la parte superior del tomate y extrae toda su parte interna. Luego en\nun recipiente bate los 3 huevos con la sal, colócalos dentro del tomate.\nUbícalos en la cesta, y luego tápalos.\nCOCINAR TOMATE AL HORNO\nCon el modo de horneado seleccionado, pon la temperatura en 180°C y el\ntemporizador en 15 minutos. Inicia la cocción. Luego de finalizado, retira\nlos tomates y agrégales el perejil, la pimienta y la sal, para luego servir."},{"id":224,"title":"COLIFLOR AL HORNO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":267,"text":"COLIFLOR AL HORNO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 45 minutos\nPorción 2 personas\nINGREDIENTES\n1 coliflor pequeña, cortada en ramilletes\n2 cda de aceite de oliva\n¼ cdta de pimienta blanca\n¼ cdta de ajo en polvo\n¼ cdta de comino molido\nPimienta negra al gusto\n1 cda de cayena molida\n1 cdta de cebolla en polvo\n½ cdta de orégano seco\n¼ cdta de albahaca seca\n¼ cdta de tomillo seco\n1 cda de pimentón molido\n1 cdta de sal\nPREPARACIÓN\nEn un recipiente grande, debes unir todos los ingredientes y remover con el\naceite. Posteriormente agrega la coliflor y sigue removiendo. Luego coloca\nen la olla y tapa.\nCOCINAR COLIFLOR AL HORNO"},{"id":225,"title":"ALUBIAS AL HORNO FÁCILES Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":269,"text":"ALUBIAS AL HORNO FÁCILES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGREDIENTES\n450 g de alubias blancas, escurridas y limpias (lata)\n3 cda salsa BBQ\n1 ¼ cdta de zumo de limón\n1 cda de mostaza amarilla preparada\nPREPARACIÓN\nEn un recipiente colocar todos los ingredientes y remover bien, luego se\ndebe pasar a la olla y colocarle una tapa.\nCOCINAR ALUBIAS AL HORNO FÁCILES\nPresiona el modo de cocción lento, y el temporizador a 10 minutos. Inicia\ncon el proceso. Al culminar el tiempo, saca, remueve y sirve."},{"id":226,"title":"CAZUELA CREMOSA DE COLIFLOR Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":270,"text":"CAZUELA CREMOSA DE COLIFLOR\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPorción 6 personas\nINGREDIENTES\n1 coliflor grande, troceada en ramilletes, lavada y hervida\n500 g de queso cheddar rallado\n2 cdta de mostaza\n60 g de queso crema\n250 g de crema de leche\n1 cdta de ajo en polvo\n¼ cdta de pimienta negra\n½ cdta de sal\nPREPARACIÓN\nEn un recipiente integra todos los ingredientes y remuévelos bien, luego\npasa el compuesto a la olla de la freidora de aire, procede a taparlo todo.\nCOCINAR CAZUELA CREMOSA DE COLIFLOR\nColoca el modo horneado, en una temperatura de 190°C, y ubica el\ntemporizador a 15 minutos. Inicia el proceso, finaliza y sirve."},{"id":227,"title":"BERENJENA Y CALABACÍN AL HORNO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":271,"text":"BERENJENA Y CALABACÍN AL HORNO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 35 minutos\nPorción 6 personas\nINGREDIENTES\n2 berenjenas pequeñas cortadas en rodajas\n4 calabacines pequeños cortados en rodajas\n90 g de queso parmesano rallado\n5 cda de perejil picado\n4 cda de albahaca picada\n1 ½ cucharada de aceite de oliva\n4 dientes de ajo, picados\n200 g de tomates cherry, cortados a la mitad\n¼ cdta de pimienta negra\n¼ cdta de sal\nPREPARACIÓN\nEn un bol, agrega y mezcla los tomates, la berenjena, el calabacín, el aceite\nde oliva, el ajo, el queso, la albahaca, la pimienta y la sal, remueve bien\nhasta que se integren en un compuesto uniforme. Coloca en la olla y tapa.\nCOCINAR BERENJENA Y CALABACÍN AL HORNO\nSelecciona el modo hornear, a una temperatura de 180°C, para un tiempo de\n30 minutos. Inicia proceso de cocción, al finalizar adorna con perejil y\nsirve."},{"id":228,"title":"CAZUELA DE PAPAS CON PIMIENTOS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":272,"text":"CAZUELA DE PAPAS CON PIMIENTOS\nDificultad Fácil\nTiempo de Preparación 5 minutos\nTiempo de Cocción 35 minutos\nPorciones 6 personas\nINGREDIENTES\n6 huevos\n½ tza de queso cheddar, rallado\n4 papas pequeñas, cortadas en cuadritos\n2 pimientos verde pequeños, cortado en cuadritos\n1 cebolla mediana picada finamente\n1 ½ cda de aceite de oliva\n1 cdta de pimienta\n½ cdta de sal\nPREPARACIÓN\nAparte en una sartén sofríe la cebolla durante 1 minuto, luego añade las\npapas, los pimientos, media cucharadita de pimienta negra y la mitad de la\nsal, sofríe durante unos 4 minutos más. Luego procede a colocar este\ncompuesto en una olla, previamente impregnada con aceite en aerosol.\nAparte en un bol, bate los huevos, agregando sal y la pimienta restante. Esta\núltima mezcla deberás colocarla sobre la anterior, en la olla.\nCOCINAR CAZUELA DE PAPAS CON PIMIENTOS\nSelecciona hornear a una temperatura de 130°C, por unos 35 minutos. Inicia\nel proceso de cocción, al terminar retira y sirve."},{"id":229,"title":"CAZUELA DE BRÓCOLI Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":273,"text":"CAZUELA DE BRÓCOLI\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPorción 6 personas\nINGREDIENTES\n430 g de flores de brócoli\n1 Lata de 280 g, aproximadamente, de crema de champiñones\n245 g de queso mozzarella rallado\n85 ml de leche\n½ cdta de cebolla en polvo\nPara la cubierta:\n1 cda de mantequilla\n180 g de galletas trituradas\nPREPARACIÓN\nEn la olla coloca todos los ingredientes que no son de la cubierta, luego\nprocede a removerlos, para hacer un compuesto homogéneo. En otro\nrecipiente pequeño mezcla los ingredientes de la cubierta, la mantequilla ha\nde ir derretida. Luego colocar este último compuesto sobre el primero, de\nmanera uniforme.\nCOCINAR CAZUELA DE BRÓCOLI\nSelecciona modo horneado, a una temperatura de180°C, y un tiempo de 25\nminutos. Inicia el procedimiento de cocción, al finalizar sirve."},{"id":230,"title":"SOPA DE TOMATE Y ZANAHORIA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":274,"text":"SOPA DE TOMATE Y ZANAHORIA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 6 horas\nPorción 4 personas\nINGREDIENTES\n1 lata de 400 g de tomate, cortados en cuadritos\n2 zanahorias pequeñas, limpias y cortadas en trozos pequeños\n1 cda de cúrcuma\n500 ml de agua\n1 cdta de comino molido\n1 cdta de cilantro molido\nPimienta negra al gusto\nSal al gusto\nPREPARACIÓN\nColoca todos los ingredientes en la olla de la freidora de aire y remueve\nmuy bien, luego cúbrelo con una tapa.\nCOCINAR SOPA DE TOMATE Y ZANAHORIA\nSelecciona modo de cocción lenta, y ubica al temporizador en 6 horas.\nInicia el proceso de cocción, luego de finalizado, retira, coloca en una\nbatidora y procede a hacerla más suave, finalmente coloca sal y pimienta al\ngusto y sirve."},{"id":231,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":275,"text":"VERDURAS COCIDAS A FUEGO LENTO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 5 horas\nPorción 6 personas\nINGREDIENTES\n460 g de berenjena, limpia, pelada y troceada en cuadritos\n1 calabacín mediano picado\n4 tomates pequeños, cortados en cuadritos\n1 cebolla pequeña picada\n1 pimiento rojo pequeño troceado\n1 cda de aceite de oliva\n90 g de queso mozzarela, desmenuzado\n2 ½ cdta de albahaca seca\n1 diente de ajo picado\nPimienta negra al gusto\nSal\nPREPARACIÓN\nEn la olla de cocción coloca todos los ingredientes, menos el mozzarela, y\nremueve muy bien, luego coloca la tapa e introduce el recipiente en la\nfreidora de aire.\nCOCINAR VERDURAS COCIDAS A FUEGO LENTO\nSelecciona el modo para cocción lenta, ajustando el temporizador a 5 horas.\nInicia el proceso, luego de finalizado, retira cubre con el queso mozzarela y\nsirve."},{"id":232,"title":"PISTO DE SABORES Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":277,"text":"PISTO DE SABORES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 4 horas\nPorción 8 personas\nINGREDIENTES\n3 calabazas de verano medianas, cortadas en ruedas\n1 pimiento rojo picado\n2 berenjenas pequeñas picadas\n3 dientes de ajo picado\n½ cdta de copos de pimienta roja\n1 cdta de orégano seco\n2 cda de pasta de tomate\n200 g de tomates cherry cortados en trocitos\n1 ½ cebolla picada\n55 g de albahaca picada\n2 ½ cda de aceite de oliva\n½ cdta de pimienta negra\n½ cdta de sal marina\nPREPARACIÓN\nMezcla bien todos los ingredientes dentro de la olla, tapándola\nposteriormente.\nCOCINAR PISTO DE SABORES\nLuego de introducida la olla en la freidora de aire, seleccionar el modo\nlento de cocción, definiendo un tiempo de 4 horas. Inicia el proceso de"},{"id":233,"title":"GUISO DE JUDÍAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":279,"text":"GUISO DE JUDÍAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPorción 6 personas\nINGREDIENTES\n700 g de judías rojas cocidas\n20 g de pimientos picados\n20 g de cebolla picada finamente\n130 ml de caldo de verduras\n½ cda de aceite de oliva\nSal al gusto\nPREPARACIÓN\nEn la olla interna coloca la cebolla y el pimiento, previamente impregnada\ncon aceite, presiona modo de salteado, espera a que se ablande la cebolla,\ncancela y agrega el caldo, las alubias y la sal, y mezcla bien. Cúbrela con su\nrespectiva tapa.\nCOCINAR GUISO DE JUDÍAS\nSelecciona el modo cocción lenta, luego temporiza a 10 minutos. Inicia el\nproceso de cocción, al finalizar retira y sirve"},{"id":234,"title":"ARROZ CON ALUBIAS ROJAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":280,"text":"ARROZ CON ALUBIAS ROJAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 horas\nPorción 8 personas\nINGREDIENTES\n230 g de alubias rojas secas, remojadas desde el día anterior\n320 g de arroz blanco\n¼ cdta de tomillo\n1 cdta de zumo de limón\n700 g de caldo de verduras\n3 dientes de ajo picados\n¼ cdta de pimienta negra\n¼ cdta de pimienta roja molida\n½ cdta de sal\nPREPARACIÓN\nEscurre las alubias y ponlas a hervir por unos 15 minutos. Luego vuelve a\nescurrirlas y colócalas en la olla de la freidora de aire con los demás\ningredientes, remueve y tapa.\nCOCINAR ARROZ CON ALUBIAS ROJAS\nSelecciona el modo de cocción lenta por un tiempo de 8 horas. Inicia con el\nproceso, para retirar luego de pasado el tiempo. Ahora puedes servir."},{"id":235,"title":"CALABACINES A LA PARMESANA FRITOS AL AIRE Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":281,"text":"CALABACINES A LA PARMESANA FRITOS AL\nAIRE\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPorciones 4 personas\nINGREDIENTES\n1 ½ cda de aceite de oliva\n1 cda de mantequilla\n1 cdta de zumo de limón\n1 ½ cdta de albahaca seca\n1 cdta de perejil seco\n30 g de queso parmesano rallado\n1 cdta de ralladura de limón\n2 calabacines medianos, cortados en ruedas\nPREPARACIÓN\nColocar todos los ingredientes en un bol y mezclar, luego colocar los\ncalabacines junto con los ingredientes en una lámina de papel de aluminio.\nLuego doblar los extremos para que todo el compuesto quede recubierto.\nPosteriormente colócalo en la bandeja de la freidora de aire.\nCOCINAR CALABACINES A LA PARMESANA FRITOS AL AIRE\nSelecciona freír, a una temperatura de 180°C, por un tiempo de 30 minutos.\nInicia proceso y al finalizar, retira y sirve."},{"id":236,"title":"BRÓCOLI RABE ASADO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":282,"text":"BRÓCOLI RABE ASADO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 minutos\nPorciones 4 personas\nINGREDIENTES\n320 g de brócoli Rabe\n1 ½ cda de aceite de oliva\n1 cda de zumo de limón\n1 cdta de ajo en polvo\n20 g de queso parmesano rallado\n½ cdta de pimienta roja\nSal\nPimienta al gusto\nPREPARACIÓN\nEn un recipiente mezcla el brócoli, aceite y el zumo de limón. En otro\nrecipiente integra todos los demás ingredientes. Estos últimos deben servir\npara cubrir al brócoli ya preparado. Colócalo en la olla de la freidora de\naire.\nCOCINAR BRÓCOLI RABE ASADO\nSelecciona freír, a una temperatura de 180°C, para un tiempo de 7 minutos."},{"id":237,"title":"CHULETAS DE BERENJENA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":283,"text":"CHULETAS DE BERENJENA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 7 minutos\nPorciones 6 personas\nINGREDIENTES\n1 berenjena mediana en ruedas\nSal al gusto\n2 huevos\n55 ml de leche\n130 g de pan rallado\nPREPARACIÓN\nSala por ambos lados las ruedas de berenjenas. Luego déjalas reposar por\nunos 10 minutos. En un bol coloca el pan rallado, mientras que en otro\naprovecha para batir los huevos con la leche. Sumerge las berenjenas en la\nmezcla de huevo, luego pásalo por el pan rallado, y coloca las piezas sobre\nla bandeja de la freidora.\nCOCINAR CHULETAS DE BERENJENA\nSelecciona freír, pon la temperatura en 160°C, para un tiempo de 5 minutos,\nluego de pasado este tiempo, dales la vuelta a las berenjenas y ponle 2\nminutos más. Al finalizar puedes servir."},{"id":238,"title":"ZANAHORIAS ASADAS AL AJO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":284,"text":"ZANAHORIAS ASADAS AL AJO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPorciones 4 personas\nINGREDIENTES\n460 g de zanahorias, cortadas en cuadritos\n2 cda de aceite de oliva\nSal\nPimienta negra al gusto\n2 cdtas de ajo en polvo\nPREPARACIÓN\nPasa las zanahorias por aceite de oliva, luego sazona con la pimienta, el ajo\ny la sal. Posteriormente colócalas en la bandeja de la freidora.\nCOCINAR ZANAHORIAS ASADAS AL AJO\nSelecciona freír, la temperatura a 200°C, y el temporizador a 12 minutos.\nRemueve, haciendo pausa y continúa. Finaliza y sirve."},{"id":239,"title":"ENSALADA DE TOMATE Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":285,"text":"ENSALADA DE TOMATE\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 3 minutos\nPorciones 4 personas\nINGREDIENTES\n430 g de tomates, troceados en cuadritos\n30 g de cebollas rojas, cortadas en rodajas\n1 ½ cda de aceite de oliva\n½ cda de vinagre\nSal\nPimienta negra al gusto\nPREPARACIÓN\nMezcla los tomates con la mitad del aceite de oliva, colócalos en la bandeja\nde la freidora de aire.\nCOCINAR ENSALADA DE TOMATE\nSelecciona freír a una temperatura de 180°C, por un par de minutos. Luego\nde finalizado, pasar a un bol y mezclar con los otros ingredientes."},{"id":240,"title":"ESPÁRRAGOS ASADOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":286,"text":"ESPÁRRAGOS ASADOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPorciones 4 personas\nINGREDIENTES\n460 g de espárragos, limpios y troceados\n2 cda de aceite de oliva\nSal\n3 dientes de ajo, bien picados\n30 g de queso parmesano, rallado\nPimienta negra al gusto\nPREPARACIÓN\nEn un recipiente coloca los espárragos con aceite de oliva, la sal y la\npimienta, luego de remover incorpora el ajo. Coloca los espárragos en la\nbandeja de la freidora de aire.\nCOCINAR ESPÁRRAGOS ASADOS\nSelecciona la opción de freír, define temperatura en 200°C, y coloca un\ntiempo predeterminado de 10 minutos. Luego de finalizar agrega el queso\nparmesano en toda su superficie. Retira y sirve."},{"id":241,"title":"CALABAZA ASADA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":287,"text":"CALABAZA ASADA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPorciones 4 personas\nINGREDIENTES\n1 calabaza mediana, troceada en cuadritos\n1 ½ cda de aceite de oliva\n1 ½ cda de mantequilla\nSal\nPimienta negra al gusto\nPREPARACIÓN\nDerrite la mantequilla, lígala con el aceite de oliva y luego pasa por ese\ncompuesto los trozos de calabaza. Agrega la sal y pimienta. Luego coloca\nestos en la bandeja de la freidora de aire.\nCOCINAR CALABAZA ASADA\nSelecciona freír, a una temperatura de 190°C, durante 10 minutos. Al\nfinalizar sirve."},{"id":242,"title":"SETAS DE AJO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":288,"text":"SETAS DE AJO\nDificultad Fácil\nTiempo de preparación 9 minutos\nTiempo de cocción 13 minutos\nPorciones 5 personas\nINGREDIENTES\n230 g de champiñones, cortados en finas láminas\n1 ½ cda de aceite de oliva\n1 cdta de salsa de soja\n1 cdta de ajo en polvo\nSal\nPimienta negra al gusto\nPREPARACIÓN\nEn un recipiente mezcla las setas con la salsa de soja y el aceite de oliva,\nluego añade el ajo en polvo, la pimienta y la sal. Luego colócalas en la\nbandeja de la freidora de aire.\nCOCINAR SETAS DE AJO\nSeleccionar modo de freír, a una temperatura de 180°C, por un tiempo de\n10 minutos. Al finalizar remueve y sirve."},{"id":243,"title":"CHIPS DE ZANAHORIA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":289,"text":"CHIPS DE ZANAHORIA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPorciones 6 personas\nINGREDIENTES\n3 zanahorias medianas, cortadas en ruedas muy finas\n1 ½ cda de aceite de oliva\nSal\nPREPARACIÓN\nPasar las zanahorias por aceite y sal, luego colocar en la bandeja de la\nfreidora.\nCOCINAR CHIPS DE ZANAHORIA\nColocar modo de freír, a una temperatura de 180°C, por un tiempo de 6\nminutos. Luego de terminarse, da la vuelta y colócale 6 minutos más.\nFinalizado el procedimiento, puedes servir."},{"id":244,"title":"ARROZ DE COLIFLOR FRITO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":290,"text":"ARROZ DE COLIFLOR FRITO\nDificultad Fácil\nTiempo de Preparación 7 minutos\nTiempo de Cocción: 20 minutos\nPorciones 4 personas\nINGREDIENTES\nParte 1\n½ cdta de cúrcuma\n1 tza de zanahoria picada\n2 cebollas medianas picadas\n1 ½ cda de salsa de soja\n400 g de tofu extra firme\nParte 2\n½ tza de guisantes congelados\n2 dientes de ajo picados\n½ tza de brócoli picado\n3 cda de salsa de soja\n2 ½ tza de coliflor con arroz\nParte 1\nPREPARACIÓN\nDesmigaja el tofu en un recipiente y mezcla con todos los ingredientes\ncorrespondientes a la parte 1. Luego pásalos a una fuente para hornear e\nintrodúcela en la freidora de aire.\nCOCINAR ARROZ DE COLIFLOR FRITO"},{"id":245,"title":"Ponla en modo freír, a una temperatura de 140°C, por unos 10 minutos, luego retira. Parte 2","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":291,"text":"Ponla en modo freír, a una temperatura de 140°C, por unos 10 minutos,\nluego retira.\nParte 2\nPREPARACIÓN\nEn un recipiente aparte combina todos los ingredientes de la parte 2, luego\nde que estén bien integrados, únelos a la mezcla recién salida de la freidora\nde aire.\nCOCINAR ARROZ DE COLIFLOR FRITO\nAhora con los dos compuestos integrados en uno solo, coloca de nuevo en\nel horno, con las mismas instrucciones, por otros 10 minutos más. Luego de\nfinalizado el proceso de cocción, retira y sirve."},{"id":246,"title":"COLIFLOR CON MANTEQUILLA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":292,"text":"COLIFLOR CON MANTEQUILLA\nDificultad Fácil\nTiempo de Preparación 7 minutos\nTiempo de Cocción 15 minutos\nPorciones 4 personas\nINGREDIENTES\n500 g de coliflor, cortada en ramilletes\n1 cda de mantequilla\n1 cdta de hojuelas de pimiento rojo, triturado\nSal\nPimienta negra al gusto\nPREPARACIÓN\nDerrite la mantequilla y unifica todos los ingredientes, exceptuando la\ncoliflor, intégralos bien y luego reserva, habiéndolos tapado previamente.\nColoca posteriormente los trozos de coliflor en una bandeja para la freidora\nde aire.\nCOCINAR COLIFLOR CON MANTEQUILLA\nColoca la mezcla preparada sobre la coliflor. En modo freír, pon la\ntemperatura en 150°C, y el temporizador ajustado en 15 minutos. Inicia el\nproceso de cocción, finalizado este, puedes servir."},{"id":247,"title":"COLES DE BRUSELAS PICANTES Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":293,"text":"COLES DE BRUSELAS PICANTES\nDificultad Fácil\nTiempo de Preparación 12 minutos\nTiempo de Cocción 20 minutos\nPorciones: 4 personas\nINGREDIENTES\n500 g de coles de Bruselas, troceada en pequeños pedazos\n½ cda de vinagre balsámico\n1 ½ cda de aceite de oliva\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nEn un recipiente coloca todos los ingredientes y procede a removerlos,\nluego de haberse integrado bien, colócalos en la bandeja de la freidora de\naire.\nCOCINAR COLES DE BRUSELAS PICANTES\nSelecciona el modo freír, coloca la temperatura en 180°C, fija el\ntemporizador para 20 minutos. Inicia el proceso de cocción, al terminar,\nretira y sirve."},{"id":248,"title":"CALABACÍN ESPECIADO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":294,"text":"CALABACÍN ESPECIADO\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de Cocción 12 minutos\nPorciones 2 personas\nINGREDIENTES\n700 g de calabacín, cortado longitudinalmente en trozos de ½ pulgada\nde espesor\n2 cda de aceite de oliva\n½ cdta de ajo en polvo\n¼ cdta de pimienta roja\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nEn un recipiente integra los ingredientes del aderezo, o sea, todos menos el\ncalabacín, luego coloca este último en la bandeja de la freidora, e\nimprégnalo en su totalidad con la mezcla anteriormente preparada.\nCOCINAR CALABACÍN ESPECIADO\nIntroduce la bandeja con el calabacín en la freidora, coloca esta en modo\nfreír, a una temperatura de 200°C, para un tiempo de 12 minutos. Inicia el\nproceso de cocción, luego de culminado, retira y sirve."},{"id":249,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":295,"text":"COMBO DE VERDURAS MIXTAS\nDificultad Fácil\nTiempo de Preparación 7 minutos\nTiempo de Cocción 18 minutos\nPorciones 4 personas\nINGREDIENTES\n2 zanahorias pequeñas troceadas en cuadritos\n1 ½ tza de floretes de brócoli\n1 tza de floretes de coliflor\n1 ½ cda de aceite de oliva\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nEn un recipiente combina todos los ingredientes, buscando que todas las\nverduras queden cubiertas de aceite, sal y pimienta. Luego debes colocar\nsobre una fuente para asar dentro de la freidora de aire.\nCOCINAR COMBO DE VERDURAS MIXTAS\nCon la fuente dentro de la freidora, ubica modo freír, a una temperatura de\n190°C, por un espacio de tiempo de 18 minutos. Luego de haber pasado su\ntiempo de cocción, retira y sirve."},{"id":250,"title":"CHIPS DE CALABACÍN EMPANIZADOS CON PARMESANO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":296,"text":"CHIPS DE CALABACÍN EMPANIZADOS CON\nPARMESANO\nDificultad Fácil\nTiempo de Preparación 15 minutos\nTiempo de Cocción 20 minutos\nPorciones 5 personas\nINGREDIENTES\nPara los chips:\n2 calabacines medianos\n2 huevos\n⅓ taza de pan rallado\n⅓ taza de queso parmesano rallado\nSal\nPimienta\nAceite de cocina\nPara el alioli:\n½ taza de mayonesa\n1 cdta de aceite de oliva\n1 cdta jugo limón\n2 dientes de ajo picados\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nCorta el calabacín en ruedas de menos de 0,5 cm. En un recipiente bate los\nhuevos. En otro recipiente integra el pan rallado, el queso parmesano, la sal"},{"id":251,"title":"y la pimienta negra. Impregna la bandeja de la freidora con aceite normal de","category":"Desayunos","source":"365 recetas sin aceite","page":297,"text":"y la pimienta negra. Impregna la bandeja de la freidora con aceite normal de\ncocina. Pasa las ruedas de calabacín por los huevos, primeramente, y luego\npor la mezcla de pan rallado. Ubica los chips de calabacín uno al lado del\notro en la bandeja, en una sola capa.\nPara la preparación del alioli de limón, combina todos los ingredientes\ncorrespondientes, considerando la sal y la pimienta según el gusto,\nbuscando que quede una mezcla homogénea.\nCOCINAR\nCHIPS\nDE\nCALABACÍN\nEMPANIZADOS\nCON\nPARMESANO\nPara cocinar los chips, debes saber que, por cuestión de espacios, y que los\nmismos no pueden estar apilados, el proceso será realizado por tandas. Es\nconveniente rociar los chips con aceite, con la finalidad de que no se vaya a\ndesprender el empanizado. Así en modo freír, a una temperatura de 180°C,\ncocina por 8 minutos. Luego de culminado el proceso de cocción, retira y\nsirve junto con el alioli."},{"id":252,"title":"FRITADA VEGETARIANA DE INVIERNO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":298,"text":"FRITADA VEGETARIANA DE INVIERNO\nDificultad Fácil\nTiempo de Preparación 5 minutos\nTiempo de Cocción 30 minutos\nPorciones 4 persona\nINGREDIENTES\n1 puerro, limpio y cortado en aros\n3 dientes de ajo picados\n4 zanahorias pequeñas, troceadas en cuadritos\n1 ½ cda de aceite de oliva\n8 huevos\nSal\nPimienta negra molida al gusto\n150 g de queso amarillo\nPREPARACIÓN\nComienza con sofreír aparte, la zanahoria, el puerro y el ajo en aceite de\noliva, hasta que estos se hayan ablandado. Luego retira y reserva. En un bol\nbate los huevos, con la sal y la pimienta negra. Con aceite en aerosol rocía\nuna fuente de horneado. Luego coloca los huevos batidos, el compuesto de\nla zanahoria y cúbrela con los trozos de queso.\nCOCINAR FRITADA VEGETARIANA DE INVIERNO\nPreviamente se debe haber precalentado la freidora de aire a 165°C, en\nmodo horneado. Posteriormente coloca el temporizador en 30 minutos.\nLuego de finalizado el proceso de cocción, sirve caliente."},{"id":253,"title":"COL RIZADA FRITA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":299,"text":"COL RIZADA FRITA\nDificultad Fácil\nTiempo de Preparación 5 minutos\nTiempo de Cocción 10 minutos\nPorciones 6 personas\nINGREDIENTES\n½ de cdta de sal\n3 cda de levadura\n1 ½ cda de aceite de oliva\n100 g de col rizada\nPREPARACIÓN\nLava bien, seca y corta en trozos medianos la col rizada. Luego colócala en\nun recipiente y rocíala con aceite de oliva en aerosol. Luego espolvorea con\nla levadura y la sal al gusto. Busca integrar bien la col con los otros\ningredientes. Colócala en la bandeja de la freidora de aire.\nCOCINAR COL RIZADA FRITA\nEn modo freír, a una temperatura de 180°C, y con un tiempo de 5 minutos,\ninicia el proceso de cocción y al terminar, servir."},{"id":254,"title":"CHIPS DE CALABACÍN Y PARMESANO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":300,"text":"CHIPS DE CALABACÍN Y PARMESANO\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de Cocción 8 minutos\nPorciones 10 personas\nINGREDIENTES\n½ cdta de pimentón molido\n1 tza de queso parmesano rallado\n1 tza de pan rallado\n1 huevo batido\n3 calabacines medianos cortados en delgadas ruedas\nPREPARACIÓN\nElimina la humedad del calabacín. En un recipiente bate el huevo con la\npimienta y la sal. En otro recipiente mezcla el pimentón, el queso y el pan\nrallado. Las ruedas de calabacín pásalas por el huevo y posteriormente por\nel pan rallado. Con aceite en aerosol rocía las rodajas de calabacín y\ncolócalas en la bandeja de la freidora de aire.\nCOCINAR CHIPS DE CALABACÍN Y PARMESANO\nEn modo freír y a una temperatura de 180°C, coloca el temporizador a 8\nminutos. Luego de terminado el proceso de cocción, retira y sirve."},{"id":255,"title":"ENSALADA DE COLES DE BRUSELAS Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":301,"text":"ENSALADA DE COLES DE BRUSELAS\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de Cocción 15 minutos\nPorciones 3 personas\nINGREDIENTES\nPara la ensalada:\n600 g de coles de Bruselas, cortadas longitudinalmente\n3 cdta de aceite de oliva\nSal\nPimienta negra molida al gusto\n3 manzanas, limpias y sin semillas, picadas en cuadritos pequeños\n2 cebollas pequeñas, cortadas en ruedas\n3 tza de lechuga, lavada y cortada\nPara el aderezo:\n2 ½ cda de aceite de oliva\n2 cda de jugo de limón\n1 cda de vinagre balsámico\n1 ½ cdta de mostaza\nSal\nPimienta negra molida al gusto\nPREPARACIÓN\nEn un recipiente coloca las coles de Bruselas, el aceite de oliva, la sal y la\npimienta negra, luego remueve bien para que se integren los ingredientes.\nColócalos extendidos en la bandeja de horneado."},{"id":256,"title":"Para el aderezo, coloca todos los ingredientes en un bol e intégralos muy","category":"Otros","source":"365 recetas sin aceite","page":302,"text":"Para el aderezo, coloca todos los ingredientes en un bol e intégralos muy\nbien, hasta que haya quedado una mezcla uniforme.\nCOCINAR ENSALADA DE COLES DE BRUSELAS\nEn la freidora de aire, selecciona freír, a una temperatura de 180°C,\npreviamente se debe haber precalentado. Ajusta el temporizador a 7\nminutos y comienza con el proceso. Luego de finalizado, voltea las coles de\nBruselas y ponle 8 minutos más. Culminada la cocción retira y pon a\nreposar unos 5 minutos. Para finalizar debes integrar las coles de Bruselas,\njunto con las manzanas picadas, la cebolla y la lechuga. Luego debes\nagregar el aderezo y así podrás servir."},{"id":257,"title":"TORTILLA ESPAÑOLA ORIGINAL Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":304,"text":"TORTILLA ESPAÑOLA ORIGINAL\nDificultad Media\nTiempo de preparación 25 minutos\nTiempo de cocción 15 minutos\nPorción 6 personas\nINGREDIENTES\n45 ml de aceite de oliva extra virgen\n4 papas grandes, sin cáscara, en rodajas finas\n1 cebolla grande, cortada en julianas\n5 a 6 huevos\n225 g de chorizo cortado en cuadros pequeños\nSal\nPimienta negra al gusto\nPREPARACION\nEn la freidora de aire a 160 °C. Deja freír las papas y la cebolla cortada,\ndurante 10 minutos aproximadamente, con una rociada de aceite, luego\nigual con el chorizo. Bate los huevos en un bol, condimenta con sal y\npimienta. Agrega el chorizo, las papas y la cebolla junto a los huevos,\ncombina hasta que se integren todos los ingredientes.\nCOCINAR ESPAÑOLA ORIGINAL\nEn la freidora de aire agrega los 15 ml de aceite de oliva y deja su\ntemperatura en 160°C. Coloca la mezcla previamente preparada, y deja\ncocinar durante 10 minutos. Luego da la vuelta y haz el mismo\nprocedimiento, retira y sirve."},{"id":258,"title":"TORTILLA DE CAMPO CLÁSICA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":305,"text":"TORTILLA DE CAMPO CLÁSICA\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGREDIENTES\n½ k de papas\n60 ml de aceite de oliva extra virgen\n1 cda de romero picado\n75 g de queso feta\n80 g de aceitunas negras\n4 huevos\nSal\nPimienta molida\nPREPARACION\nEn una olla con agua y sal, coloca las papas sin pelar, lavadas. Tapa y pon a\nfuego alto hasta que hierva. Después de haberse ablandado. Cuela las papas,\npara luego pelar y cortar en cuadros. Calienta el aceite de oliva previamente\nen la freidora de aire y coloca las papas en esta, hasta que doren, luego\nagrega las aceitunas negras, el romero, el queso feta y revuelve hasta que se\nintegren los ingredientes.\nCOCINAR TORTILLA DE CAMPO CLÁSICA\nAdiciona a los ingredientes en la freidora de aire, los huevos previamente\nrevueltos y deja cocinar a 95 °C, durante 5 a 10 minutos, verificando que\nlos huevos coagulen, agregar sal y pimienta al gusto y puedes servir.
