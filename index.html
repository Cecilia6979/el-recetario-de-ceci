lado.\n7 Colocar en la cesta 15-20 minutos a 200°C."},{"id":438,"title":"Filete de Flanco con Mostaza Balsámica RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":35,"text":"Filete de Flanco con Mostaza Balsámica\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nhoras 10 minutos\nTIEMPO DE COCCIÓN: 10-15\nminutos\n60 ml de aceite de oliva\n60 ml de vinagre balsámico\n36 g de mostaza Dijon\n16 oz de filete de flanco Sal y\npimienta, al gusto\n4 hojas de albahaca, en\nrodajas\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina el aceite de oliva, vinagre balsámico y la\nmostaza. Mézclalos para crear un adobo.\n2 Coloca el filete directamente en el adobo. Cubre con\nuna envoltura plástica y deja marinar en la nevera\ndurante 2 horas o en la noche.\n3 Retira de la nevera y deja que alcance temperatura\nambiente.\n4 Preheat\n5 Coloca el filete en la freidora de aire precalentada,\n10-15 minutos 200°C\n6 Corta el filete en ángulo a través del músculo. Sazona\ncon sal y pimienta y decora con albahaca para servir"},{"id":439,"title":"Falafels RINDE 9 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":36,"text":"Falafels\nRINDE 9 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 120\nminutos\n500 gr de garbanzos cocidos\n50 gr de harina\n1 cebolla blanca picada\nfinamente\n2 cucharadas de perejil\npicado\n2 cucharadas de cilantro\npicado\n1 cucharadita de comino\n1 cucharada de tahini (pasta\nde sésamo)\n1 chorrito de aceite de oliva\n1 diente de ajo\nSal y pimienta al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezclar en un Bowl los garbanzos, la cebolla, el ajo,\nel perejil, el cilantro, el comino, la sal, la pimienta, la\npasta de sésamo (tahini) y la harina hasta obtener una\nmasa gruesa. Si la masa queda demasiado líquida,\nañade un poco de harina y si queda demasiado\nseca, añade un poco de líquido.\n2 Forma 18 falafels con esta masa y aplánalos\nligeramente.\n3 Ponlos en la cesta de la Freidora, riega con aceite\nde oliva (opcional) y cocina a 170°C durante 20\nminutos. Los falafels pueden quedar superpuestos en\nla cesta. Dales la vuelva a media cocción."},{"id":440,"title":"Albóndigas Italianas RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":37,"text":"Albóndigas Italianas\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n227 g de carne molida\n(75/25)\n28 g de migajas de pan 30 ml\nde leche\n1 huevo\n3 g de ajo en polvo\n2 g de cebolla en polvo\n2 g de orégano seco\n2 g de perejil seco Sal y\npimienta, al gusto\n15 g de queso parmesano,\nrallado, y un poco más para\nservir\nAceite en aerosol\nantiadherente\nSalsa Marinara, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina la carne molida, las migajas de pan, el huevo,\nlas especias, la sal, la pimienta y el Parmesano.\n2 Crea bolas pequeñas con la mezcla de carne.\nColócalas en el refrigerador durante 10 minutos.\n3 Preheat\n4 Retira las bolas de carne del refrigerador y colócalas\nen las cestas de la freidora de aire precalentada.\n5 Rocía las albóndigas con aceite en aerosol y cocina a\n205°C durante 12 minutos.\n6 Sirve con salsa marinara y con queso parmesano\nrallado"},{"id":441,"title":"Albóndigas de Cordero Mediterráneas RINDE 3 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":38,"text":"Albóndigas de Cordero Mediterráneas\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n454 g de cordero molido\n3 dientes de ajo picados\n5 g de sal\n1 g de pimienta negra\n2 g de menta, recién picada\n2 g de comino molido\n3 ml de salsa picante\n1 g de chile en polvo\n1 cebollín, picado\n8 g de perejil, finamente\npicado\n15 ml de jugo de limón fresco\n2 g de ralladura de limón\n10 ml de aceite de oliva\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el cordero, el ajo, la sal, la pimienta, la menta,\nel comino, la salsa picante, el chile en polvo, el\ncebollón, el perejil, el jugo de limón y la ralladura de\nlimón hasta que estén bien combinados.\n2 Crea bolas con la mezcla de cordero y enfríalas\ndurante 30 minutos.\n3 Preheat\n4 Cubre las albóndigas con aceite de oliva y colócalas\nen la freidora precalentada.\n5 Ajusta el tiempo a 12 minutos 205°C"},{"id":442,"title":"Albóndigas Japonesas RINDE 4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":39,"text":"Albóndigas Japonesas\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n16 oz de carne molida\n15 ml de aceite de sésamo\n18 g de pasta de miso\n10 hojas de menta fresca,\nfinamente picadas\n4 cebollines, finamente\npicados\n5 g de sal\n1 g de pimienta negra\n45 ml de salsa de soja\n45 ml de mirin\n45 ml de agua\n3 g de azúcar moreno\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la carne molida, el aceite de sésamo, la pasta\nde miso, las hojas de menta, el cebollín, la sal y la\npimienta hasta que todo quede bien unido.\n2 Agrega una pequeña cantidad de aceite de sésamo a\ntus manos y crea albóndigas de 51 mm con la mezcla.\nDeberás quedar con 8 albóndigas aproximadamente.\n3 Deja que las albóndigas se enfríen en el refrigerador\ndurante 10 minutos.\n4 Crea la salsa mezclando la salsa de soya, el mirin, el\nagua y la azúcar morena. Deja de un lado.\n5 Preheat\n6 Acomoda las albóndigas enfriadas en la freidora de\naire precalentada.\n7 Cocina a 205°C durante 12 minutos.\n8 Cepillar liberamente las albóndigas con el glaseado\ncada 2 minutos"},{"id":443,"title":"Pollo Asado con Hierbas y Ajo RINDE 3 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":40,"text":"Pollo Asado con Hierbas y Ajo\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 20\nminutos\n3 muslos de pollo,\ndeshuesados, con piel\n3 patas de pollo, con la piel\npuesta\n30 ml de aceite de oliva\n20 g de ajo en polvo\n6 g de sal\n1 g de pimienta negra\n1 g de tomillo seco\n1 g de romero seco\n1 g de estragón seco\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Cubre los muslos de pollo y las patas con aceite de\noliva y todos los condimentos. Deja que reposen\ndurante 30 minutos.\n2 Preheat\n3 Coloca el pollo en la freidora de aire precalentada\n20 minutos 190°C"},{"id":444,"title":"Pollo Barbacoa RINDE 4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":41,"text":"Pollo Barbacoa\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 30\nminutos\nTIEMPO DE COCCIÓN: 20\nminutos\n3 g de pimentón ahumado\n5 g de ajo en polvo\n3 g de cebolla en polvo\n4 g de chile en polvo\n7 g de azúcar morena\n18 g de sal kosher\n2 g de comino\n1 g de pimienta de cayena\n1 g de pimienta negra\n1 g de pimienta blanca\n454 g de patas de pollo, con\nla piel puesta\n227 g de alitas de pollo Salsa\nde barbacoa, para hilvanar y\nservir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina todos los condimentos en un tazón pequeño.\n2 Espolvorea el condimento sobre el pollo y deja\nmarinar durante 30 minutos.\n3 Preheat\n4 Coloca las alitas en la freidora de aire precalentada.\n5 Ajusta el tiempo a 20 minutos a 195°\n6 Cepilla el pollo con un poco de salsa barbacoa cada\n5 minutos.\n7 Retira el pollo de la freidora de aire cuando termine\nde cocinarse.\n8 Sirve con más salsa barbacoa a un lado."},{"id":445,"title":"Muslos de Pollo con Limón y Ajo RINDE 3 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":42,"text":"Muslos de Pollo con Limón y Ajo\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 20\nminutos\n30 ml de aceite de oliva\n1 limón, en jugo y zested\n10 g de ajo en polvo\n5 g de pimentón\n9 g de sal\n1 g de orégano seco\n1 g de pimienta negra\n2 g de azúcar moreno\n6 patas de pollo, con la piel\npuesta\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el aceite de oliva, el jugo de limón, la\nralladura de limón, el ajo en polvo, el pimentón, la sal,\nel orégano, la pimienta negra y la azúcar morena en un\ntazón pequeño.\n2 Cubre las patas de pollo con el adobo y déjalas\nreposar durante 30 minutos.\n3 Preheat\n4 Coloca las patas de pollo en la freidora de aire\nprecalentada.\n5 Ajusta el tiempo a 20 195°C"},{"id":446,"title":"Muslos de Pollo Asados con Mostaza RINDE 4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":43,"text":"Muslos de Pollo Asados con Mostaza\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 20\nminutos\n30 g de mostaza Dijon\n15 ml de jarabe de arce\n1 g de cebolla en polvo\n2 g de ajo en polvo\n1 g de pimentón\n2 g de sal\n1 g de pimienta negra\n4 muslos de pollo,\ndeshuesados, con piel\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la mostaza, el jarabe de arce, la cebolla en\npolvo, el ajo en polvo, el pimentón, la sal y la\npimienta negra en un tazón pequeño.\n2 Cubre los muslos de pollo con glaseado de mostaza\ny déjalos a un lado.\n3 Preheat\n4 Coloca las patas de pollo en la freidora de aire\nprecalentada y cúbrelas con el glaseado de mostaza\nsobrante.\n5 Ajusta el tiempo a 20 195°C"},{"id":447,"title":"Palitos de Pollo Tikka RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":44,"text":"Palitos de Pollo Tikka\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 1\nhora\nTIEMPO DE COCCIÓN: 20\nminutos\n79 ml de leche de coco\n24 g de pasta de tomate\n3 g de garam marsala\n2 g de comino\n3 g de cúrcuma\n2 g de cardamomo\n3 g de ajo en polvo\n25 g jengibre, rallado\n5 g de sal\n4 muslos de pollo\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina todo excepto pollo en un bol y mezcla.\n2 Remoja las patas de pollo en el adobo de coco y\nmezcla hasta que las patas estén bien cubiertas.\nMarinar por hasta 1 hora.\n3 Preheat\n4 Retira las patas de pollo del refrigerador y colócalas\nen la freidora de aire precalentada.\n5 Cocina a 195°C por 20 minutos.\n6 Sirve con arroz basmati cocido al vapor."},{"id":448,"title":"Pollo con Limón y Miel RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":45,"text":"Pollo con Limón y Miel\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 1\nhora\nTIEMPO DE COCCIÓN: 15\nminutos\n45 ml de miel, y un poco más\nrociar\n15 ml de salsa de soja\n1 limón, en jugo\n2 dientes de ajo picados\n4 muslos de pollo,\ndeshuesados, con piel\nSal al gusto rodajas de limón,\npara adornar\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina la miel, la salsa de soya, el jugo de limón y\nel ajo en un tazón y mezcla. Remoja los muslos de\npollo y marina por hasta 1 hora.\n2 Preheat\n3 Coloca los muslos de pollo en la freidora de aire\nprecalentada.\n4 Ajusta el tiempo 20 minutos a 195°C\n5 Retira las cestas de la freidora de aire cuando\nqueden 5 minutos en el temporizador. Cubre el pollo\ncon más marinado y devuelve las cestas para finalizar\nla cocción.\n6 Sazona con sal, rocía un poco de miel y decora con\nrodajas de limón."},{"id":449,"title":"Pollo de Cinco Especias RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":46,"text":"Pollo de Cinco Especias\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nhoras 5 minutos\nTIEMPO DE COCCIÓN: 18\nminutos\n48 g de salsa hoisin\n18 g de salsa de ostras\n3 dientes de ajo, finamente\nrallados\n5 g de polvo chino de cinco\nespecias\n60 ml de miel, dividido\n30 ml de salsa de soja oscura,\ndividida\n4 muslos de pollo,\ndeshuesados, con piel\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina la salsa de hoision, la salsa de ostras, el ajo,\nel polvo chino de cinco especias, 30 ml de miel y 20 ml\nde salsa de soya oscura en un tazón grande. Agrega los\nmuslos de pollo y mezcla hasta que estén cubiertos.\nMarina por al menos 2 horas.\n2 Preheat\n3 Coloca los muslos de pollo en las bandejas de la\nfreidora de aire precalentada.\n4 Ajusta el tiempo 18 minutos a 195°C\n5 Mezcla la miel restante y la salsa de soya en un tazón\npequeño.\n6 Cepilla la parte de arriba del pollo con la salsa de\nmiel y soya luego de 12 minutos de cocción y luego,\nregresa el pollo a la freidora de aire por 6 minutos\nmás.\n7 Sirve con brócoli chino al vapor y arroz."},{"id":450,"title":"pollo kfc RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":47,"text":"pollo kfc\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nhoras\nTIEMPO DE COCCIÓN: 25\nminutos\n2 patas de pollo\n2 muslos de pollo,\ndeshuesados, con piel\n224 ml de suero de leche\n180 g de harina todo uso\n3 g de ajo en polvo\n3 g de cebolla en polvo\n3 g de pimentón\n2 g de pimienta negra o\nblanca\n5 g de sal\n40 ml de aceite vegetal\nAceite en aerosol\nantiadherente\n1 Combina las patas, los muslos y el suero de leche en\nuna bolsa con cierre hermético. Marina durante 1-1,5\nhoras.\n2 Mezcla harina, especias y sal en un tazón.\n3 Toma las patas de pollo y los muslos directamente de\nla bolsa y sumérgelos en la harina. Asegúrate que el\npollo esté totalmente cubierto. Luego, colócalo en una\nrejilla para enfriar durante 15 minutos.\n4 Preheat\n5 Pasa una brocha de cocina por el aceite y luego,\npásala suavemente por las patas de pollo y los muslos\nhasta cubrirlos completamente.\n6 Coloca las patas y los muslos en la freidora de aire\nprecalentada.\n7 Ajusta el tiempo 25 minutos a 195°C\n8 Voltea el pollo a la mitad de la cocción y rocíalo de\naceite de cocina.\n9 Permite que se enfríe 5 minutos luego de que esté\nlisto y sírvelo\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":451,"title":"Pollo Parmesano RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":48,"text":"Pollo Parmesano\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\n56 g de pan rallado al estilo\nitaliano\n20 g de queso parmesano,\nrallado\n2 pechugas de pollo (454 g),\nsin hueso, sin piel\n60 g de harina todo uso\n2 huevos, golpeados\nAceite en aerosol\nantiadherente\n2 rebanadas de queso\nmozzarella Salsa Marinara,\npara servir\n2 ramitas de perejil,\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Mezcla las migas de pan y el queso parmesano en un\ntazón.\n3 Pasa cada pechuga de pollo por la harina, luego,\nsumérgelas en los huevos batidos y, finalmente, en la\nmezcla de migas.\n4 Rocía el interior de las cestas de la freidora de aire\nprecalentada con aceite de cocina y coloca las\npechugas de pollo adentro, rociando también la parte\nsuperior del pollo.\n5 Cocina las pechugas de pollo a 180°C durante 18\nminutos.\n6 Coloca 1 rebanada de queso mozzarella sobre cada\npechuga cuando queden 2 minutos en el temporizador.\n7 Sirve con salsa marinara y decora con perejil recién\npicado."},{"id":452,"title":"Chuletas de Cerdo al Estilo Carolina del Norte RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":49,"text":"Chuletas de Cerdo al Estilo Carolina del Norte\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\n2 chuletas de cerdo\ndeshuesadas\n15 ml de aceite vegetal\n25 g de azúcar moreno\noscuro, envasados\n6 g de pimentón húngaro\n2 g de mostaza molida\n2 g de pimienta negra recién\nmolida\n3 g de cebolla en polvo\n3 g de ajo en polvo\nSal y pimienta, al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cubre las chuletas de cerdo con aceite.\n3\nCombina\ntodas\nlas\nespecias\ny\nsazona\nabundantemente las chuletas de cerdo, casi como si\nestuvieras empanizándolas.\n4 Coloca las chuletas de cerdo en la freidora de aire\nprecalentada.\n5 Ajusta el tiempo a 18 minutos a 195°C\n6 Remueve las chuletas de cerdo cuando hayas\nterminado de cocinar, déjalas reposar durante 5 minutos\ny sírvelas."},{"id":453,"title":"Cerdo Katsu RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":50,"text":"Cerdo Katsu\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\n2 chuletas de cerdo (170 g),\ndeshuesadas\n56 g de pan rallado\n3 g de ajo en polvo\n2 g de cebolla en polvo\n6 g de sal\n1 g de pimienta blanca\n60 g de harina todo uso\n2 huevos, batidos Aceite en\naerosol antiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Coloca las chuletas de cerdo en una bolsa de cierre\nhermético o cúbrelas con una envoltura de plástico.\n2 Machaca la carne de cerdo con un rodillo o martillo\npara carne hasta que tenga un grosor de 13 mm.\n3 Combina las migas y los condimentos en un tazón.\nDeja de un lado.\n4 Pasa cada chuleta de cerdo por la harina, luego,\nremójalas en los huevos batidos y pásalas finalmente\npor la mezcla de migas.\n5 Preheat\n6 Rocía las chuletas de cerdo por cada lado con\naceite de cocina y\ncolócalas\nen\nla\nfreidora\nde\naire precalentada. 7 Cocina las chuletas de cerdo a\n180°C durante 18 minutos. 8 Remuévelas de la freidora\nde aire cuando termines y deja que reposen durante 5\nminutos. 9 Córtalas en piezas y sírvelas."},{"id":454,"title":"Trinoza de Cerdo Envuelta en Jamón RINDE 4-5 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":51,"text":"Trinoza de Cerdo Envuelta en Jamón\nRINDE 4-5 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\n6 piezas de jamón serrano, en\nrodajas finas\n1 lomo de cerdo (454 g),\nreducido a la mitad, con\nmantequilla y machacado\n6 g de sal\n1 g de pimienta negra\n227 g de hojas frescas de\nespinaca, divididas\n4 rebanadas de queso\nmozzarella, dividido\n18 g de tomates secados al\nsol, divididos\n10 ml de aceite de oliva,\ndividido\n1 Coloca 3 pedazos de jamón en papel para hornear,\nsuperponiéndolos ligeramente entre sí. Coloca 1\nmitad del cerdo en el jamón. Repite con la otra\nmitad.\n2 Sazona el interior de los rollitos de cerdo con sal y\npimienta.\n3 Coloca la mitad de la espinaca, el queso y los\ntomates secados al sol encima del lomo de cerdo,\ndejando un borde de 13 mm en todos los lados.\n4 Enrolla bien el filete alrededor del relleno y ata con\nun cordón de cocina para mantenerlo cerrado.\n5 Repite el proceso para el otro filete de cerdo y\ncolócalos en la nevera.\n6 Preheat\n7 Cepilla 5 ml de aceite de oliva sobre cada filete\nenvuelto\nprecalentada.\n8 Ajusta el tiempo 18 minutos a 195°C\n9 Permite que se enfríe durante 10 minutos antes de\ncortar.\ny\ncolócalos\nen\nla\nfreidora\nde\naire\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":455,"title":"Bagre Estilo Cajún RINDE 2 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":52,"text":"Bagre Estilo Cajún\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n5 g de pimentón\n3 g de ajo en polvo\n2 g de cebolla en polvo\n2 g de tomillo seco molida\n1 g de pimienta negra molida\n1 g de pimienta de cayena\n1 g de albahaca seca\n1 g de orégano seco\n2 filetes de bagre (6 oz)\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Mezcla todos los condimentos en un tazón.\n3 Cubre el pescado generosamente en cada lado con la\nmezcla de aderezo.\n4 Rocía cada lado del pescado con aceite en aerosol y\ncolócalo en la freidora de aire precalentada.\n5 Ajusta el tiempo 10 minutos a 180°C\n6 Retira con cuidado cuando termines de cocinar y sirve\nsobre sémola"},{"id":456,"title":"Chipotle de Atún RINDE 2 PORCIONES","category":"Pescados y mariscos","source":"120 recetas para comer mejor","page":53,"text":"Chipotle de Atún\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n1 lata (142 g) de atún\n45 g de salsa chipotle\n4 rebanadas de pan blanco\n2 rebanadas de queso pepper\njack\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Mezcla el atún y el chipotle hasta que se combinen.\n3 Extiende la mitad de la mezcla de atún con chipotle\nen cada una de las 2 rebanadas de pan.\n4 Agrega una rodaja de queso pepper jack en cada una\ny cierra con las 2 rebanadas restantes de pan, haciendo\n2 sándwiches.\n5 Coloca los sándwiches en la freidora de aire\nprecalentada.\n6 Ajusta el tiempo a 8 minutos a 180°C\n7 Corta diagonalmente y sirve"},{"id":457,"title":"Tacos de Pescado RINDE 4-5 PORCIONES","category":"Pescados y mariscos","source":"120 recetas para comer mejor","page":54,"text":"Tacos de Pescado\nRINDE 4-5 PORCIONES\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n454 g de tilapia, cortada en\ntiras de 38 mm de espesor\n52 g de harina de maíz\namarilla\n1 g de comino molido\n1 g de chile en polvo\n2 g de ajo en polvo\n1 g de cebolla en polvo\n3 g de sal\n1 g de pimienta negra\nAceite en aerosol\nantiadherente\nTortillas de maíz, para servir\nSalsa tártara, para servir\nCuñas de lima, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta la tilapia en tiras de 38 mm de espesor.\n2 Mezcla la harina de maíz y los condimentos en un\nplato poco profundo.\n3 Cubre las tiras de pescado con la harina de maíz\nsazonada. Deja de un lado en la nevera.\n4 Preheat\n5 Rocía abundantemente el pescado recubierto con\naceite en aerosol y colócalo en la freidora de aire\nprecalentada.\n6 Ajusta el tiempo a 8 minutos a 180°C\n7 Voltea el pescado a la mitad de la cocción.\n8 Sirve el pescado en tortillas de maíz con salsa tártara\ny un chorrito de limón"},{"id":458,"title":"Salmón Glaseado Teriyaki RINDE 2 PORCIONES","category":"Pescados y mariscos","source":"120 recetas para comer mejor","page":55,"text":"Salmón Glaseado Teriyaki\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\nSALSA TERIYAKI\n118 ml de salsa de soja\n50 g de azúcar\n1 g de jengibre rallado\n1 diente de ajo, aplastado\n60 ml de jugo de naranja\nSALMÓN\n2 filetes de salmón (5 oz)\n20 ml de aceite vegetal Sal y\npimienta blanca, al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina todos los ingredientes de la salsa teriyaki en\nuna olla pequeña.\n2 Pon la salsa a ebullición, redúcela a la mitad, luego\ndéjala enfriar.\n3 Preheat\n4 Cubre el salmón con aceite y sazona con sal y\npimienta blanca.\n5 Coloca el salmón en la freidora de aire precalentada,\nhacia abajo. ajusta a 8 minutos a 180°C\n6 Retira el salmón de la freidora cuando haya\nterminado. Deja reposar por 5 minutos, luego glasea\ncon salsa teriyaki.\n7 Sirve sobre una cama de arroz blanco o con verduras\na la parrilla."},{"id":459,"title":"Salmón con Mantequilla y Limón RINDE 2 PORCIONES","category":"Pescados y mariscos","source":"120 recetas para comer mejor","page":56,"text":"Salmón con Mantequilla y Limón\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 4\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n2 filetes de salmón (6 oz)\nSal y pimienta, al gusto Aceite\nen aerosol antiadherente\n30 g de mantequilla\n30 ml de jugo de limón fresco\n1 diente de ajo, rallado\n6 ml salsa de Worcestershire\n1 Sazona el salmón al gusto con sal y pimienta.\n2 Preheat\n3 Rocía las cestas de la freidora de aire precalentado\ncon aceite en aerosol y coloca el pescado dentro.\n4 Ajusta el tiempo 8 minutos a 180°C\n5 Combina la mantequilla, el jugo de limón, el ajo y la\nsalsa Worcestershire en una cacerola pequeña y derrite\na fuego lento, aproximadamente 1 minuto.\n6 Sirve los filetes de salmón con arroz y cubre con la\nsalsa de mantequilla de limón\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":460,"title":"Camarón al Estilo Cajún RINDE 2-3 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":57,"text":"Camarón al Estilo Cajún\nRINDE 2-3 PORCIONES\nTIEMPO DE PREPARACIÓN: 4\nminutos\nTIEMPO DE COCCIÓN: 6-8\nminutos\n6 g de sal\n2 g de pimentón ahumado\n2 g de ajo en polvo\n2 g de condimento italiano\n2 g de chile en polvo\n1 g de cebolla en polvo\n1 g de pimienta de cayena\n1 g de pimienta negra\n1 g de tomillo seco\n454 g de camarones grandes,\npelados y desvelados\n30 ml de aceite de oliva\nCuñas de lima, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Combina todos los condimentos en un tazón grande.\nDeja de lado.\n3 Mezcla los camarones con el aceite de oliva hasta que\nestén cubiertos uniformemente.\n4 Espolvorea la mezcla de aderezo sobre el camarón y\nrevuelve hasta que esté bien cubierto.\n5\nprecalentada.\n6 Ajusta el tiempo a 5 minutos a 190°C\n7 Agita las cestas a la mitad de la cocción (la función\nRecordatorio de Agitado te avisará cuándo).\n8 Sirve con trozos de lima.\nColoca\nel\ncamarón\nen\nla\nfreidora\nde\naire"},{"id":461,"title":"Pasteles de Cangrejo RINDE 4 PASTELES DE CANGREJO","category":"Postres","source":"120 recetas para comer mejor","page":58,"text":"Pasteles de Cangrejo\nRINDE 4 PASTELES DE CANGREJO\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\nREMOLADA\n55 g de mayonesa\n15 g de alcaparras, lavadas y\nescurridas\n5 g de encurtidos dulces, picados\n5 g de cebolla roja, finamente\npicada\n8 ml de jugo de limón\n8 g de mostaza Dijon Sal y\npimienta, al gusto\nPASTELES DE CANGREJO\n1 huevo grande, golpeado\n17 g de mayonesa\n11 g de mostaza Dijon\n5 ml de salsa Worcestershire\n2 g de condimento Old Bay\n2 g de sal\nUna pizca de pimienta blanca\nUna pizca de cayena\n26 g de apio, finamente\ncortado en cubitos\n45 g de pimiento rojo,\nfinamente cortado en cubitos 8\ng de perejil fresco, finamente\npicado\n227 g de carne de cangrejo 28\ng de migas de pan\nAceite en aerosol antiadherente\n1 Mezcla los ingredientes de rémoulade hasta que todo\nesté bien incorporado. Deja de lado.\n2 Bate el huevo, la mayonesa, la mostaza, la salsa\nWorcestershire, el condimento Old Bay, la sal, la\npimienta blanca, la pimienta de cayena, el apio, el\npimiento y el perejil.\n3 Agita suavemente la carne de cangrejo en la mezcla\nde huevo y muévela hasta que esté bien mezclada.\n4 Espolvorea las migas de pan sobre la mezcla de\ncangrejo y dóblalas suavemente hasta que las migas de\npan cubran todos los rincones.\n5 Forma la mezcla de cangrejo en 4 pasteles y enfría\nen la nevera durante 30 minutos.\n6 Preheat\n7 Coloca una hoja de papel para hornear en la canasta\nde la freidora de aire precalentada. Rocía los pasteles\nde cangrejo con aerosol para cocinar y colócalos\nsuavemente sobre el papel.\n8 Cocina los pasteles de cangrejo a 205°C durante 8\nminutos hasta que estén dorados.\n9 Dale la vuelta a los pasteles de cangrejo durante la\ncocción. 10 Sirve con rémoulade.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":462,"title":"Tofu Crujiente","category":"Otros","source":"120 recetas para comer mejor","page":59,"text":"Tofu Crujiente\nRINDE 2 PORCIONES\n225 g de tofu firme, cortado\nen cubos de 25 mm\n30 ml de salsa de soja\n10 ml de vinagre de arroz\n10 ml de aceite de sésamo\n40 g de almidón de maíz\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el tofu, la salsa de soja, el vinagre de arroz y\nel aceite de sésamo en un tazón poco profundo. Deja\nque macere por 10 minutos.\n2 Preheat\n3 Escurre el tofu del adobo y luego coloca el tofu en\nalmidón de maíz hasta que esté bien cubierto.\n4 Coloca el tofu en la freidora de aire precalentada.\n5 Ajusta el tiempo 18 minutos a 190°C\n6 Agita las cestas a la mitad de la cocción"},{"id":463,"title":"Escalope de Berenjena RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":60,"text":"Escalope de Berenjena\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 8\nminutos\n1 huevo, batido\n15 ml de leche\n112 g de pan rallado al estilo\nitaliano\n3 g de sal\n1 g de pimienta negra\n1 berenjena japonesa, cortada\nen rodajas de 13 mm de\nespesor\n60 g de harina todo uso\nAceite de oliva, para cepillar\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Bate el huevo y la leche en un plato poco profundo.\nCombina las migas de pan, la sal y la pimienta en un\nplato aparte.\n2 Corta la berenjena en rodajas de 13 mm de\nespesor.\n3 Cubre las rebanadas de berenjena con harina,\nluego sumérgelas en huevo y revuélvelas en pan\nrallado. Sumérgelas en huevo y pan rallado de nuevo.\n4 Preheat\n5 Cepilla cada lado de las rodajas de berenjena con\naceite de oliva.\n6 Coloca la berenjena empanizada en la freidora de\naire precalentada en una sola capa y cocina a 205°C\ndurante 8 minutos. Es posible que debas trabajar en\nlotes.\n7 Voltea la berenjena a la mitad de la cocción"},{"id":464,"title":"Tiras de Pollo Cajún RINDE 2-4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":61,"text":"Tiras de Pollo Cajún\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nhoras 15 minutos\nTIEMPO DE COCCIÓN: 18\nminutos\n454 g de solomillos de pollo\n355 ml de suero de leche\n10 ml de salsa picante de\nLuisiana 180 g de harina todo\nuso\n15 g de sal\n4 g de pimienta negra\n7 g de ajo en polvo\n5 g de cebolla en polvo\n5 g de pimentón\n3 g de mostaza molida\n2 g de pimienta de cayena\n12 g de almidón de maíz\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Marina las tiras de pollo en suero de leche y salsa\npicante durante 4 horas o durante la noche.\n2 Agrega todos los ingredientes restantes en un\ntazón grande y mezcla bien.\n3 Retira las tiras de pollo marinado en la mezcla y\nsacude el exceso.\n4 Mezcla 1/3 del adobo en la harina sazonada y\nmezcla bien. Esto creará pequeños copos.\n5 Deja que el pollo se asiente durante una hora\nhasta que el revestimiento se vuelva pegajoso y\nvuelve a arrastrar el pollo por la harina. Deja de\nlado.\n6 Preheat\n7 Rocía una capa abundante de aerosol para\ncocinar en cada lado de las tiras de pollo y\ncolócalas en la freidora de aire precalentada.\n8 Cocina las tiras a 205°C durante 18 minutos,\nhasta que estén doradas y crujientes"},{"id":465,"title":"Stromboli RINDE 4-5 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":62,"text":"Stromboli\nRINDE 4-5 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 20\nminutos\n283 g de masa de pizza\nrefrigerada Harina para todo\nuso, para empolvar\n8 rebanadas de jamón cocidas\n3 rebanadas de queso\nprovolone\n3 rebanadas de queso\nmozzarella\n50 g de pimientos rojos\nasados, picados\n1 g de condimento italiano\n1 huevo, batido\n15 ml de leche\n1 g de sal\n1 g de orégano seco\n1 g de ajo en polvo\n1 g de pimienta negra\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Permite que la masa descanse a temperatura\nambiente durante 30 minutos.\n2 Espolvorea la masa con harina y amásala hasta que\ntenga un grosor de 6 mm.\n3 Coloca la capa del jamón, queso, los pimientos y el\ncondimento italiano en la mitad de la masa. Dóblala\npara sellar.\n4 Mezcla el huevo y la leche. Cepilla la parte superior\nde la masa con la mezcla de huevo.\n5 Espolvorea sal, orégano, ajo en polvo y pimienta en\nla parte superior. Deja de lado.\n6 Preheat\n7\nColoca\nel\nstromboli\nen\nla\nfreidora\nde\naire\nprecalentada.\n8 Cocina a 185°C durante 20 minutos. Voltea el\nstromboli cada 5 minutos durante la cocción"},{"id":466,"title":"Nuggets de Pescado Crujientes RINDE 4 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":63,"text":"Nuggets de Pescado Crujientes\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 6\nminutos\nTIEMPO DE COCCIÓN: 8-10\nminutos\n454 g de pescado blanco u\notro pescado suave, cortado\nen tiras de 38 x 13 mm de\nlargo\n30 g de harina todo uso\n7 g de condimento Old Bay\n2 huevos, batidos\n180 g de pan rallado\nAceite en aerosol\nantiadherente\nSalsa tártara, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta el pescado en tiras de 38 x 13 mm de largo.\n2 Mezcla la harina y el condimento Old Bay en un\ntazón.\n3 Cubre cada trozo de pescado con la harina sazonada\ny luego sumerge en los huevos batidos y revuelve en\npan rallado.\n4 Preheat\n5 Rocía el pescado en ambos lados con aceite en\naerosol y colócalo en la freidora de aire precalentada.\n6 Ajusta el tiempo a 8 minutos 180°C\n7 Agita las cestas a la mitad de la cocción\n8 Sirve con salsa tártara."},{"id":467,"title":"Fiesta de Mini Pizzas RINDE 1 PORCIón","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":64,"text":"Fiesta de Mini Pizzas\nRINDE 1 PORCIón\nTIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 masa de pizza prefabricada\n(178 mm)\nAceite de oliva, para cepillar\n4 cucharadas de salsa\n85 g de mezcla de queso\nmexicano, rallado\n20 g de maíz congelado,\ndescongelado\n30 g de frijoles negros cocidos\n8 g de guisantes congelados,\ndescongelados\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cepilla la parte superior de la masa de la pizza con\naceite de oliva.\n3 Coloca la masa de pizza en la freidora de aire\nprecalentada y cocina durante 12 minutos a 180°C.\n4 Agrega la salsa, el queso, el maíz, los frijoles negros y\nlos\nguisantes\ncuando\nqueden\n5\nminutos\nen\nel\ntemporizador, luego, termina la cocción"},{"id":468,"title":"Mini Pizzas de Pepperoni RINDE 1 PORCIón","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":65,"text":"Mini Pizzas de Pepperoni\nRINDE 1 PORCIón\nTIEMPO DE PREPARACIÓN: 3\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 masa de pizza prefabricada\n(178 mm)\nAceite de oliva, para cepillar\n60 g de salsa marinara 5-6\nrebanadas de pepperoni\n85 g de queso mozzarella,\nrallado\n25 g de queso parmesano\n1 Preheat\n2 Cepilla la parte superior de la masa de la pizza con\naceite de oliva.\n3 Coloca la masa de pizza en la freidora de aire\nprecalentada y cocina durante 12 minutos a 180°C.\n4\nAgrega\nla\nsalsa\nmarinara,\nlas\nrebanadas\nde\npepperoni, la mozzarella y el queso parmesano cuando\nqueden 5 minutos en el temporizador, luego, termina la\ncocción.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":469,"title":"Hamburguesas de Queso RINDE 4 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":66,"text":"Hamburguesas de Queso\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 1\nhora 5 minutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n454 g de carne molida\n(80/20)\n3 g de sal\n1 g de pimienta negra\n6 ml de salsa Worcestershire\n5 g de mostaza Dijon\n1 cebolla pequeña, rallada\n1 huevo, batido\n40 ml de aceite de oliva\n4 rebanadas de queso\ncheddar\nBollos Slider, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la carne molida, la sal, la pimienta negra, la\nsalsa Worcestershire, la mostaza Dijon, la cebolla\nrallada y el huevo hasta que estén bien combinados.\n2 Forma 4 hamburguesas iguales con la carne y enfría\nen la nevera durante 1 hora.\n3 Preheat\n4 Frote las hamburguesas con aceite de oliva y\ncoloca las hamburguesas en la freidora de aire\nprecalentada.\n5 Ajuste el tiempo a 12-15 minutos a 205°C\n6 Voltea las hamburguesas a la mitad de la cocción\npara asegurar un dorado uniforme.\n7 Agrega las rebanadas de queso cheddar a cada una\nde las hamburguesas cuando quede 1 minuto de\ncocción.\n8 Sirve con salsa al gusto"},{"id":470,"title":"Hamburguesas de Pavo con Ensalada Asiática RINDE 4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":67,"text":"Hamburguesas de Pavo con Ensalada Asiática\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\nENSALADA DE COL ASIÁTICA\n175 g de repollo rallado\n¼ cebolla roja pequeña, en\nrodajas finas\n½ zanahoria, rallada\n2 cebollas verdes, en rodajas\nfinas\n2 g de cilantro, picado\n30 ml de vinagre de vino de\narroz\n30 ml de salsa de soja\n28 g de azúcar morena\n15 ml de aceite de sésamo\n14 g de mayonesa\nSal y pimienta, al gusto\nHAMBURGUESA\n454 g de pavo molido (85/15)\n2 dientes de ajo picados\n25 mm de jengibre rallado\n2 cebollas verdes picadas\n32 g de hoisín\n15 ml de salsa de soja\n3 g de sal\n1 g de pimienta negra\n90 g de pan rallado\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\nENSALADA\nMezcla todos los ingredientes y deja marinar por 30\nminutos\n1 Mezcla todos los ingredientes de las hamburguesas en\nun tazón grande.\n2 Crea 4 hamburguesas con la mezcla de pavo y\ncolócalas en la nevera para que se enfríen.\n3 Preheat\n4 Coloca las hamburguesas de pavo en la freidora de\naire precalentada.\n5 Cocina durante 15 minutos a 205°C.\n6 Sirve en panes con ensalada asiática."},{"id":471,"title":"Espárragos envueltos de Jamón RINDE 3 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":69,"text":"Espárragos envueltos de Jamón\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n12 espárragos 12 ml de aceite\nde oliva Sal y pimienta, al\ngusto 12 rebanadas de jamón\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Corta los extremos leñosos de los espárragos y\ndescártalos.\n3 Rocía los espárragos con aceite. Condimenta con sal y\npimienta.\n4 Envuelve 1 rebanada de jamón alrededor de cada\nespárrago, de arriba abajo, y colócala en la freidora de\naire precalentada.\n5 Establece el tiempo a 12 minutos a 160°"},{"id":472,"title":"Croquetas de jamón ibérico RINDE 3 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":70,"text":"Croquetas de jamón ibérico\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 30\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n600 ml de leche entera.\n1 cucharada sopera de\nmantequilla.\n1 cucharada sopera de harina\nde trigo.\n100 g de jamón ibérico.\n2 huevos cocidos.\n2 huevos batidos.\nPan rallado\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Picar el jamón en tacos muy pequeños.\n2 Poner en una sartén la mantequilla y la harina y,\ncuando se funda la mantequilla, añadir la mitad del\njamón. Añadir la leche muy poco a poco\n3 Cocer dos huevos, pelarlos y picar muy finamente.\n4 Añadir el resto del jamón y el huevo duro cuando la\nbechamel esté casi lista.\n5 Retirar la bechamel y dejar reposar una hora.\n6 Formar las croquetas, sumergir en huevo batido y\ncubrir con pan rallado por completo.\n7 Precalentar la freidora durante 5 minutos a una\ntemperatura de 180 °C.\n8 Introducir las croquetas en la freidora precalentada y\ncocinar a una temperatura de 180 °C durante 15 minutos\nhasta que se doren"},{"id":473,"title":"Alas de Pollo Frotadas en Seco","category":"Carnes y aves","source":"120 recetas para comer mejor","page":71,"text":"Alas de Pollo Frotadas en Seco\nRINDE 4 PORCIONES\n9 g de ajo en polvo\n1 cubito de caldo de pollo,\nsodio reducido\n5 g de sal\n3 g de pimienta negra\n1 g de pimentón ahumado\n1 g de pimienta de cayena\n3 g de condimento Old Bay,\nsin sodio\n3 g de cebolla en polvo\n1 g de orégano seco\n453 g de alitas de pollo\nAceite en aerosol\nantiadherente\nSalsa Ranch, para servir\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25-30\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Combina los condimentos en un tazón y mézclalos\nbien.\n3 Sazona las alitas de pollo con la mitad de la mezcla\nde condimentos y rocía abundantemente con aceite en\naerosol.\n4 Coloca las alitas de pollo en la freidora de aire\nprecalentada.\n5 Establece el tiempo a 25-30 minutos a 195°C\n6 Agita las cestas a la mitad de la cocción.\n7 Trasfiere las alitas de pollo a un tazón y rocíalas con\nla otra mitad de los condimentos hasta que estén bien\ncubiertas.\n8 Sirve con salsa ranch."},{"id":474,"title":"Alitas de Pollo de Mongolia RINDE 2-4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":72,"text":"Alitas de Pollo de Mongolia\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 25\nminutos\n680 g de alitas de pollo\n30 ml de aceite vegetal\nSal y pimienta, al gusto\n60 ml de salsa de soja baja en\nsodio\n85 g de miel\n20 ml de vinagre de vino de\narroz\n15 g salsa Sriracha\n3 dientes de ajo picados\n4 g de jengibre fresco, rallado\n1 cebolla verde picada para\ndecorar\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Mezcla las alitas de pollo con el aceite, la sal, y la\npimienta hasta que estén bien cubiertas.\n3 Coloca las alitas de pollo cubiertas en la freidora de\naire precalentada.\n4 Programa a 195°C por 25 minutos\n5 Combina salsa de soya, miel, vinagre de vino de arroz,\nSriracha, ajo y jengibre en una cacerola.\n6 Cocina a fuego lento hasta que los sabores se unan y\nse reduzca ligeramente el glaseado, aproximadamente\npor 10 minutos. 7\nTransfiere las alitas de pollo, luego de 20\nminutos, a un tazón grande y mézclalas con el\nglaseado.\n8 Regresa las alitas de pollo a las cestas de la freidora\ny cocina durante 5 minutos más.\n9 Adorna con cebollas verdes y sirve."},{"id":475,"title":"Alitas de Pollo con Sriracha y Miel","category":"Carnes y aves","source":"120 recetas para comer mejor","page":73,"text":"Alitas de Pollo con Sriracha y Miel\nRINDE 2-4 PORCIONES\n2 g de pimentón ahumado\n2 g de ajo en polvo\n2 g de cebolla en polvo\n2 g de sal\n2 g de pimienta negra\n25 g de almidón de maíz\n453 g de alitas de pollo\nAceite en aerosol\nantiadherente\n90 g de miel\n100 g salsa Sriracha\n15 ml de vinagre de vino de\narroz\n5 ml de aceite de sésamo\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 30\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Mezcla el pimentón ahumado, el polvo de ajo, el\npolvo de cebolla, la sal, la pimienta negra y el maíz.\n3 Mezcla las alitas en la maicena sazonada hasta que\nestén cubiertas uniformemente.\n4 Rocía las alitas con aceite en aerosol y mézclalas\nhasta que estén cubiertas con aceite.\n5 Coloca las alitas en la freidora de aire precalentada.\n6 Ajusta el tiempo a 30 minutos a 195°C\n7 Agita las cestas a la mitad de la cocción.\n8 Mezcla la miel, la Sriracha, el vinagre de vino de\narroz y el aceite de sésamo en un tazón grande.\n9 Mezcla las alitas cocidas en la salsa hasta que estén\nbien cubiertas y sirve."},{"id":476,"title":"Alitas de Pollo con Ajo a la Parmesana","category":"Carnes y aves","source":"120 recetas para comer mejor","page":74,"text":"Alitas de Pollo con Ajo a la Parmesana\nRINDE 3 PORCIONES\n25 g de almidón de maíz\n20 g de queso parmesano,\nrallado\n9 g de ajo en polvo\nSal y pimienta, al gusto\n680 g de alitas de pollo\nAceite en aerosol\nantiadherente\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Combina el almidón de maíz, el Parmesano, el polvo\nde ajo, la sal y la pimienta en un tazón.\n3 Mezcla las alitas de pollo en el condimento y sumerja\nhasta que estén bien cubiertas.\n4 Rocía las cestas e la freidora de aire con aceite en\naerosol y añada las alitas, rociando la parte superior de\nlas alitas también.\n5 Ajusta el tiempo 25 minutos a 195°C. Asegúrate de\nagitar las cestas a la mitad de la cocción. 6\nEspolvorea con lo que queda de la mezcla de\nParmesano y sirve"},{"id":477,"title":"Alitas de Pollo al Estilo Jerk RINDE 3 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":75,"text":"Alitas de Pollo al Estilo Jerk\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25\nminutos\n1 g de tomillo molido\n1 g de romero seco\n2 g de pimienta de Jamaica\n4 g de jengibre molido\n3 g de ajo en polvo\n2 g de cebolla en polvo\n1 g de canela\n2 g de pimentón\n2 g de chile en polvo\n1 g de nuez moscada\nSal al gusto\n30 ml de aceite vegetal\n0,5 - 1 kg de alitas de pollo 1\nlima, jugo\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Combina todas las especias y el aceite en un tazón\npara crear un adobo.\n3 Mezcla las alitas de pollo en el adobo hasta que\nestén bien cubiertas.\n4 Coloca las alitas de pollo en la freidora de aire\nprecalentada.\n5 Ajusta el tiempo 25 minutos a 195°C Asegúrate de\nagitar las cestas a la mitad de la cocción.\n6 Retira las alitas y colócalas en un plato para servir.\n7 Exprime jugo de limón fresco sobre las alitas y\nsírvelas"},{"id":478,"title":"Tortillas Caseras RINDE 3 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":76,"text":"Tortillas Caseras\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n3 tortillas de maíz (152 mm),\ncortadas en\n8 piezas cada una\n20 ml de aceite de oliva\n2 g de sal Salsa, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las tortillas a la mitad y luego cada mitad en\ncuartos, haciendo 8 piezas por tortilla.\n2 Preheat\n3 Mezcla las tortillas en aceite de oliva y sal hasta\nque estén bien cubiertas.\n4\nColoca\nlas\ntortillas\nen\nla\nfreidora\nde\naire\nprecalentada y cocina durante 10 minutos a 150°C.\n5 Agita las cestas a la mitad de la cocción. 6 Sirve con\nsalsa"},{"id":479,"title":"Pasta chip","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":77,"text":"Pasta chip\nRINDE 5-7 PORCIONES\n500 g de pasta seca.\nQueso parmesano o grana\npadano.\nPimienta negra molida.\nPimentón picante.\nOrégano seco.\nAceite de oliva.\nSal al gusto.\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Cocer la pasta dejándola blanda.\n2 Una vez cocida la pasta, escurrir y mezclar con el\nresto de ingredientes en un bol. Sazonar al gusto y\nrociar con aceite de oliva en aerosol. Remover bien\n3 Precalentar la freidora 5 minutos a 200 °C.\n4 Colocar la pasta en la freidora de aire y cocinar\ndurante 10 minutos a 200 °C.\n5 Se recomienda remover la pasta varias veces durante\nla cocción para asegurar que el contenido se hace de\nforma uniforme.\n6 Dejar reposar la pasta 5 minutos antes de servir"},{"id":480,"title":"Cerdos en una Manta","category":"Carnes y aves","source":"120 recetas para comer mejor","page":78,"text":"Cerdos en una Manta\nRINDE 4 PORCIONES\n½ hoja de hojaldre,\ndescongelado\n16 salchichas ahumadas\ngruesas\n15 ml de leche\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Corta la masa de hojaldre en tiras de 64 x 38 mm.\n3 Coloca una salchicha de coctel al final de la masa de\nhojaldre y enrolla alrededor de la salchicha, sellando la\nmasa con algo de agua.\n4 Cepilla la parte superior (con la costura hacia abajo)\nde las salchichas envueltas con leche y colócalas en la\nfreidora de aire precalentada.\n5 Cocina a 205°C durante 10 minutos o hasta que estén\ndoradas"},{"id":481,"title":"Setas Rellenas de Salchichas RINDE 3 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":79,"text":"Setas Rellenas de Salchichas\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 23\nminutos\n6 hongos crimini extragrandes\n45 ml de aceite de oliva,\ndividido\n¼ cebolla grande, cortada en\ncubitos\n1 diente de ajo, picado\n113 g de salchicha italiana\ndulce, sin la carcasa\n14 g de pan rallado al estilo\nitaliano\n58 g de queso mozzarella,\nrallado, y un poco más para\ndecorar\n20 g de queso parmesano,\nrallado\n4 g de perejil, recién picado\nSal y pimienta, al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Remueve los tallos de las tapas de los champiñones.\nPica los tallos y ponlos a un lado.\n2 Retira el interior de las tapas de los champiñones\npara crear un espacio para colocar el relleno.\nColócalos de un lado.\n3 Calienta una sartén a fuego medio durante un\nmomento.\n4 Añade 20 ml de aceite de oliva, los tallos de los\nchampiñones picados y la cebolla picada. Cocina\ndurante 5 minutos.\n5 Agrega el ajo y cocina durante 1 minuto.\n6 Agrega la salchicha italiana y cocina hasta que se\ndore, durante aproximadamente 5 minutos. Colócala a\nun lado.\n7 Mezcla la salchicha con las migas de pan, la\nmozzarella, el parmesano y el perejil.\n8 Sazona al gusto con sal y pimienta.\n9 Rellena los champiñones hasta que estén bien llenos\ny cúbrelos con queso mozzarella.\n10 Rocía el resto del aceite sobre los champiñones.\n11 Preheat\n12 Coloca los champiñones rellenos en la freidora de\naire precalentada.\n13 Cocina los champiñones a 160°C durante 12 minutos\nhasta que el queso se dore y burbujee."},{"id":482,"title":"Dedos de Mozzarella Fritos","category":"Desayunos","source":"120 recetas para comer mejor","page":80,"text":"Dedos de Mozzarella Fritos\nRINDE 3 PORCIONES\n6 piezas de queso mozarella\n16 g de harina todo uso 3 g\nde almidón de maíz 3 g de\nsal 1 g de pimienta negra 2\nhuevos, batidos 15 ml de\nleche 50 g de migas de pan\n2 g de hojuelas de perejil\nseco\nAceite\nen\naerosol\nantiadherente\nSalsa\nMarinara o ranch para servir\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta el queso en tres partes, haciendo 18 piezas.\n2 Mezcla la harina, el almidón de maíz, la sal y la\npimienta en un tazón. Bate los huevos y la leche en un\ntazón separado. Combina las migas de pan y las\nhojuelas de perejil en un tazón adicional.\n3 Cubre cada pieza de queso con harina, luego,\nsumérgela en huevo y finalmente en las migas de pan.\nVuelve a sumergir en huevo y en pan.\n4 Preheat\n5 Coloca los dedos de mozarella en el congelador\nmientras que la freidora de aire se precalienta.\n6 Coloca los dedos de mozarella en la freidora de aire\nprecalentada y rocíalos con spray de cocina.\n7 Establece el tiempo a 8-10 minutos a 175°C\n8 Asegúrate de agitar las cestas a la mitad de la\ncocción (la función Recordatorio de Agitado te avisará\ncuando).\n9 Sirve con salsa marinara o salsa ranch."},{"id":483,"title":"Pepinillos","category":"Desayunos","source":"120 recetas para comer mejor","page":81,"text":"Pepinillos\nRINDE 4 PORCIONES\n4 encurtidos grandes de\nfrasco\n60 g de harina todo uso\n2 huevos, batidos\n25 g de pan rallado\n2 g de pimentón\n1 g de pimienta de cayena\nSal y pimienta, al gusto\nAceite en aerosol\nantiadherente\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Seca los pepinillos con una toalla limpia de cocina y\ncorta los tallos.\n2 Crea una estación de trabajo con 3 cuencos poco\nprofundos. Llena al primero con harina. En el segundo\ncoloca el huevo batido. Y en el tercero, combina las\nmigas de pan, las especias, la sal y la pimienta.\n3 Preheat\n4 Cubre los pepinillos primero con la harina, luego con\nel huevo y finalmente con las migas, presionando\ngentilmente las migas con tus manos.\n5 Coloca los pepinillos cubiertos en una bandeja y\nrocíalos en todos los lados con aceite de cocina.\n6\nAgrega\nlos\npepinillos\na\nla\nfreidora\nde\naire\nprecalentada y cocina a 180°C durante 10 minutos,\ngirándolos a la mitad de la cocción y rociándolos\nnuevamente con aceite si es necesario.\n7 Luego, sírvelos con tu salsa favorita."},{"id":484,"title":"Jalapeños Rekkebis Envueltos con Tocino","category":"Carnes y aves","source":"120 recetas para comer mejor","page":82,"text":"Jalapeños Rekkebis Envueltos con Tocino\nRINDE 2 PORCIONES\n6 jalapeños medianos,\ncortados a la mitad\nlongitudinalmente y sin\nsemillas\n112 g de carne de cerdo\nmolida\n57 g de queso cheddar\nSal y pimienta, al gusto\n6 tiras de tocino, cortadas a\nla mitad\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 16\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta los jalapeños a la mitad, a lo largo, y retira\ntodas las semillas. Colócalos a un lado.\n2 Combina la carne de cerdo molida, el queso cheddar,\nla sal y la pimienta en un recipiente y mezcla hasta que\nqueden bien unidos.\n3 Con una cuchara, coloca aproximadamente 20 ml de\nla mezcla de cerdo en una mitad del jalapeño.\n4 Vuelve a unir las mitades de los jalapeños y\nenvuélvelos con tocino.\n5 Preheat\n6 Coloca los jalapeños envueltos en tocino en la\nfreidora de aire precalentada.\n7 Ajusta el tiempo 16 minutos a 170°C\n8 Sirve con tu salsa favorita."},{"id":485,"title":"Camarones Envueltos con Tocino RINDE 4-5 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":83,"text":"Camarones Envueltos con Tocino\nRINDE 4-5 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n16\ncamarones\ngigantes,\npelados y sin venas 3 g de\najo en polvo 2 g de pimentón\n2 g de cebolla en polvo 1 g\nde pimienta negra molida 8\ntiras\nde\ntocino,\ncortadas\nlongitudinalmente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Coloca los camarones gigantes en un recipiente y\nsazona con especias.\n2 Envuelve el tocino alrededor de los camarones,\ncomenzando desde la cabeza hasta la cola y asegúralo\ncon palitos.\n3 Preheat\n4 Agrega la mitad de los camarones a la freidora de\naire precalentada.\n5 Ajusta el tiempo a 12 minutos a 170°C. Cuando finalice\nla cocción, déjalos a un lado.\n6 Repite con la siguiente tanda de camarones\n7 Elimina el exceso de grasa con una toalla de papel y\nsirve."},{"id":486,"title":"Camarones con Coco RINDE 3 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":84,"text":"Camarones con Coco\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 8\nminutos\nTIEMPO DE COCCIÓN: 10\nminutos\n30 g de harina todo uso\n5 g de sal, dividido\n1 g de pimienta negra,\ndividida\n1 g de ajo en polvo, dividido\n2 g de pimentón, dividido\n2 huevos grandes, batidos\n15 ml de leche\n28 g de migas de pan\n40 g de coco rallado en\nescamas sin endulzar\n227 g de camarones grandes,\npelados (se dejan las colas) y\nsin venas\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la harina y la mitad de los aderezos en un\ntazón. Bate los huevos junto con la leche en un tazón\nseparado.\n2 Combina las migas de pan, el coco y la otra mitad de\nlos aderezos y especias en un tazón adicional.\n3 Cubre cada camarón con harina, luego sumérgelo en\nhuevo y pásalo por el pan y el coco. Sumérgelo\nnuevamente en huevo y en el pan. Coloca a un lado.\n4 Preheat\n5 Agrega los camarones uniformemente a la freidora y\nrocíalos con aceite en aerosol antiadherente.\n6 Ajusta el tiempo a 8-10 minutos a 175°C\n7 Asegúrate de girar los camarones a la mitad de la\ncocción (la función Recordatorio de Agitado te avisará\ncuando)."},{"id":487,"title":"Huevo Escocés","category":"Desayunos","source":"120 recetas para comer mejor","page":85,"text":"Huevo Escocés\nRINDE 4 PORCIONES\n283 g de salchicha de cerdo\nmolida\n2 g de ajo en polvo\n1 g de cebolla en polvo\n1 g de salvia seca\n2 g de sal\n1 g de pimienta negra\n4 huevos, medio hervidos,\npelados\n60 g de harina todo uso\n1 huevo, batido\n40 g de pan rallado al estilo\nitaliano\nAceite en aerosol\nantiadherente\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla la salchicha, el polvo de ajo, la cebolla en\npolvo, la salvia, la sal y la pimienta. Divide en cuatro\nbolas.\n2 Envuelve la salchicha alrededor de cada uno de los\nhuevos duros medio pelados hasta que el huevo esté\ncompletamente cubierto.\n3 Cubre cada huevo cubierto con salchicha con harina,\nluego, sumérgelos en huevo batido y pásalos por migas\nde pan. Vuelve a sumergirlos en huevo batido y pásalos\nuna última vez por migas de pan.\n4 Preheat\n5 Rocía los huevos generosamente con aceite en\naerosol.\n6 Coloca los huevos escoceses en la freidora de aire\nprecalentada.\n7 Ajusta el tiempo a 15 minutos a 180°C Asegúrate de\nvoltear los huevos a la mitad de la cocción"},{"id":488,"title":"Pinchos de Pollo con Ajo y Hierba","category":"Carnes y aves","source":"120 recetas para comer mejor","page":86,"text":"Pinchos de Pollo con Ajo y Hierba\nRINDE 2-3 PORCIONES\n60 ml de aceite de oliva\n3 dientes de ajo, rallados\n2 g de orégano seco\n1 g de tomillo seco\n2 g de sal\n1 g de pimienta negra\n1 limón, jugo\n454 g de muslos de pollo,\ndeshuesados, sin piel,\ncortados en trozos de 38 mm\n2 pinchos de madera,\ncortados a la mitad\nTIEMPO DE PREPARACIÓN: 1\nhora 5 minutos\nTIEMPO DE COCCIÓN: 18\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla aceite de oliva, ajo, orégano, tomillo, sal,\npimienta negra y jugo de limón en un tazón grande.\n2 Agrega el pollo al adobo y deja marinar durante 1\nhora.\n3 Preheat\n4 Corta el pollo marinado en piezas de 38 mm y\nensártalo en los pinchos.\n5 Coloca los pinchos en la freidora de aire\nprecalentada.\n6 Establece el tiempo 18 minutos a 195°C"},{"id":489,"title":"Pinchos de Pollo con Yogurt RINDE 2-4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":87,"text":"Pinchos de Pollo con Yogurt\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 4\nhoras 10 minutos\nTIEMPO DE COCCIÓN: 15\nminutos\n123 g de yogur griego de\nleche entera simple\n20 ml de aceite de oliva\n2 g de pimentón\n1 g de comino\n1 g de pimiento rojo triturado\n1 limón, jugo y ralladura de la\ncascara\n5 g de sal\n1 g de pimienta negra recién\nmolida\n4 dientes de ajo, picados\n454 g de muslos de pollo,\ndeshuesados, sin piel,\ncortados en trozos de 38 mm\n2 pinchos de madera,\ncortados a la mitad\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el yogurt, el aceite de oliva, el pimentón, el\ncomino, el pimentón rojo, el jugo de limón, la\nralladura de limón, la sal, la pimienta y el ajo en un\ntazón grande.\n2 Agrega el pollo al adobo y deja marinar en la\nnevera durante al menos 4 horas.\n3 Preheat\n4 Corta los muslos de pollo marinados en trozos de\n38 mm y ensártalos en pinchos.\n5 Coloca los pinchos en la freidora de aire\nprecalentada.\n6 Cocina a 205°C durante 15 minutos."},{"id":490,"title":"Pinchos de Carne Estilo Coreano RINDE 2-4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":88,"text":"Pinchos de Carne Estilo Coreano\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 1\nhora 5 minutos\nTIEMPO DE COCCIÓN: 16\nminutos\n20 g de ssamjang\n20 g de gochujang\n15 ml de salsa de soja\n15 ml de aceite de sésamo\n15 ml de miel\n5 ml de vinagre de vino de\narroz\n454 g de carne de ternera\ncortada en trozos de 38 mm\n2 pinchos de madera,\ncortados a la mitad\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el ssamjang, el gochujang, la salsa de soja, el\naceite de sésamo, la miel y el vinagre en un tazón.\n2 Mezcla la carne cortada en el adobo y deja marinar\ndurante una hora.\n3 Preheat\n4 Ensarta los pedazos de carne en los pinchos y coloca\nlos pinchos en la freidora de aire precalentada.\n5 Ajusta el tiempo 16 minutos a 205°C, a mitad del\ntiempo dale la vuelta"},{"id":491,"title":"Pinchos de Cerdo Teriyaki RINDE 2-4 PORCIONES","category":"Carnes y aves","source":"120 recetas para comer mejor","page":89,"text":"Pinchos de Cerdo Teriyaki\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 35\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\n8 g de almidón de maíz\n118 ml de agua\n60 ml de salsa de soja\n55 g de azúcar morena clara,\nligeramente compactada\n1 diente de ajo, picado\n2 g de jengibre rallado\nPimienta negra, al gusto\n454 g de chuleta de lomo de\ncerdo, cortada en cubos de 38\nmm\n2 brochetas de madera,\ncortadas a la mitad\nAceite en aerosol\nantiadherente\nSal y pimienta, al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el almidón de maíz con el agua.\n2 Combina la mezcla de almidón de maíz, la salsa de\nsoja, la azúcar morena, el ajo y el jengibre en una olla\npequeña. Cocina la salsa a fuego alto hasta que hierva\ny se espese, durante aproximadamente 5 minutos.\n3 Sazona la salsa al gusto con pimienta negra y deja\nque se enfríe.\n4 Ensarta el cerdo en pinchos de madera.\n5 Marina el cerdo ensartado en parte de la salsa teriyaki\ndurante 30 minutos.\n6 Preheat\n7 Coloca el cerdo ensartado en la freidora de aire\nprecalentada y rocíalo con aerosol de cocina.\n8 Ajusta a 18 minutos 200°C\n9 Pasa salsa teriyaki sobre los pinchos cada 2 minutos\ndurante la cocción.\n10 Sazona al gusto con sal y pimienta y sirve."},{"id":492,"title":"Shawarma de Cordero","category":"Carnes y aves","source":"120 recetas para comer mejor","page":90,"text":"Shawarma de Cordero\nRINDE 2-4 PORCIONES\n340 g de cordero molido 2\ng\nde\ncomino\n2\ng\nde\npimentón 3 g de ajo en\npolvo 2 g de cebolla en\npolvo 1 g de canela 1 g de\ncúrcuma 1 g de semillas de\nhinojo 1 g de semilla de\ncilantro molido 3 g de sal 4\nbrochetas de bambú (229\nmm)\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 18\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Combina todos los ingredientes en un tazón y\nmézclalos bien.\n2 Ensarta 85 g de carne en cada brocheta, luego,\ncolócalas en la nevera durante 10 minutos.\n3 Preheat\n4 Coloca las brochetas en la freidora de aire\nprecalentada ajusta a 18 minutos 200°C\n5 Sirve con aderezo de yogur de limón o solo"},{"id":493,"title":"Bolitas de platano rellenas de queso RINDE 4 PORCIONES","category":"Panes, pasta y aperitivos","source":"120 recetas para comer mejor","page":92,"text":"Bolitas de platano rellenas de queso\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 40\nminutos\n1 plátanos maduros\n100 gr. de queso mozzarella\n80 gr. de queso fresco\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 En una olla con agua hirviendo cocina el plátano\nmaduro, previamente pelado. Deja al fuego durante 25\nminutos hasta que esté blandito.\n2 Retira del agua los plátanos y macerar hasta obtener\nun puré. Después, agrega el queso rallado, una pizca de\nsal mezcla todo muy bien.\n3 Haz una bolita de plátano amasando el puré con las\nmanos. Luego aplástala y agrega en el centro un poco\nde queso mozzarella. Cierra muy bien volviendo a formar\nuna bola con la masa.\n4 Preheat\n5 Coloca las bolitas en la cesta de la freidora a 170°C\ndurante 18 minutos. Cuando lleve 9 minutos dales la\nvuelta"},{"id":494,"title":"Papas Fritas Caseras RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":93,"text":"Papas Fritas Caseras\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 30\nminutos\nTIEMPO DE COCCIÓN: 28\nminutos\n2 papas rojizas, cortadas en\ntiras de 76 x 25 mm\n1 litro de agua fría, para\nremojar las papas\n15 ml de aceite\n3 g de ajo en polvo\n2 g de pimentón Sal y\npimienta, al gusto\nSalsa de tomate o salsa ranch,\npara servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las papas en tiras de 76 x 25 mm y remójalas en\nagua durante 15 minutos.\n2 Drena las papas, enjuaga con agua fría y seca con\ntoallas de papel.\n3 Agrega aceite y especias a las papas, hasta que\nestén completamente cubiertas.\n4 Preheat\n5 Agrega las papas a la freidora de aire precalentada.\n6 Ajusta el tiempo a 28 minutos a 200°C Asegúrate de\nagitar las cestas a la mitad de la cocción\n7 Remueve las cestas de la freidora de aire cuando\nhayas finalizado la cocción y sazona las papas fritas\ncon sal y pimienta.\n8 Sirve con salsa de tomate o salsa ranch"},{"id":495,"title":"RINDE 4 PORCIONES","category":"Postres","source":"120 recetas para comer mejor","page":94,"text":"Patatas Fritas Dulces\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25-30\nminutos\n2 patatas dulces grandes,\ncortadas en tiras de 25 mm de\nespesor\n15 ml de aceite\n10 g de sal\n2 g de pimienta negra\n2 g de pimentón\n2 g de ajo en polvo\n2 g de cebolla en polvo\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las patatas dulces en tiras de 25 mm de grosor.\n2 Preheat\n3 Agrega las patatas dulces cortadas en un tazón\ngrande y mezcla con el aceite hasta que las patatas\nestén todas cubiertas uniformemente.\n4 Espolvorea sal, pimienta negra, paprika, polvo de ajo y\ncebolla en polvo. Mezcla bien.\n5 Coloca las patatas fritas en las cestas precalentadas y\ncocina durante 25-30 minutos a 205°C. Asegúrate de\nagitar las cestas a mitad de la cocción."},{"id":496,"title":"Papas a la Francesa Estilo Cajún RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":95,"text":"Papas a la Francesa Estilo Cajún\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 30\nminutos\nTIEMPO DE COCCIÓN: 28-30\nminutos\n2 papas rojizas, peladas y\ncortadas en tiras de 76 x 25\nmm\n1 litro de agua fría\n15 ml de aceite\n7 g de condimento Cajún\n1 g de pimienta de cayena\nSalsa de tomate o salsa ranch,\npara servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las papas en tiras de 76 x 25 mm y remójalas en\nagua durante 15 minutos.\n2 Drena las papas, enjuaga con agua fría y seca con\ntoallas de papel.\n3 Preheat\n4 Agrega aceite y especias a las papas, hasta que\nestén completamente cubiertas.\n5 Agrega las papas a la freidora de aire precalentada.\n6 Ajusta el tiempo a 28 minutos a 200°C. Asegúrate de\nagitar las cestas a la mitad de la cocción\n7 Remueve las cestas de la freidora de aire cuando\nhayas finalizado la cocción y sazona las papas fritas\ncon sal y pimienta.\n8 Sirve con salsa de tomate o salsa ranch."},{"id":497,"title":"Calabacín Frito RINDE 4 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":96,"text":"Calabacín Frito\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12-15\nminutos\n2 calabacines medianos,\ncortados en tiras de 19 mm de\nespesor\n60 g de harina todo uso\n12 g de sal\n2 g de pimienta negra\n2 huevos batidos\n15 ml de leche\n84 g pan rallado sazonado\nitaliano\n25 g de queso parmesano,\nrallado\nAceite en aerosol\nantiadherente\nSalsa ranch, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta el calabacín en tiras de 19 mm de grosor.\n2 Mezcla junto con la harina, la sal y la pimienta en un\nplato. Mezcla los huevos y la leche en un plato\nseparado. Combina las migas de pan y el queso\nparmesano en otro plato.\n3 Cubre cada pieza de calabacín con harina, luego,\nsumérgelas en huevo y pásalas por las migas. Deja a un\nlado.\n4 Preheat\n5 Coloca los calabacines cubiertos en la freidora de\naire precalentada y rocía con aceite en aerosol.\n6 Ajusta el tiempo a 12 minutos a 180°C\n7 Asegúrate de agitar las cestas a la mitad de la\ncocción\n8 Sirve con salsa de tomate o salsa ranch."},{"id":498,"title":"Aguacate Frito RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":97,"text":"Aguacate Frito\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 15\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n2 aguacates, cortados en\ncuñas de 25 mm de espesor\n50 g de pan Pancrumbs\n2 g de ajo en polvo\n2 g de cebolla en polvo\n1 g de pimentón ahumado\n1 g de pimienta de cayena Sal\ny pimienta, al gusto\n60 g de harina para todo uso\n2 huevos, golpeados\nAceite en aerosol\nantiadherente\nSalsa de tomate o salsa ranch,\npara servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta los aguacates en trozos de 25 mm de grosor.\n2 Combina las migas, el ajo en polvo, el polvo de\ncebolla, el pimentón ahumado, la pimienta cayena y la\nsal en un tazón.\n3 Separa cada cuña de aguacate en la harina, luego,\nsumerge los huevos batidos y revuelve en la mezcla de\nmigas de pan.\n4 Preheat\n5 Coloca los aguacates en las cestas de la freidora de\naire precalentada, rocía con aceite en aerosol y cocina\na 205°C durante 12 minutos.\n6 Gira el aguacate frito a la mitad de la cocción y\nrocía con aceite de cocina.\n7 Sirve con salsa de tomate o salsa ranch"},{"id":499,"title":"Papas Fritas Estilo Griego RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":98,"text":"Papas Fritas Estilo Griego\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 30\nminutos\nTIEMPO DE COCCIÓN: 28\nminutos\n2 papas rojizas, cortadas en\ntiras de 76 x 13 mm\n1 litro de agua fría, para\nremojar las papas\n40 ml de aceite vegetal\n3 g de ajo en polvo\n2 g de pimentón\n56 g de queso feta,\ndesmenuzado\n4 g de perejil plano, picado\n3 g de orégano fresco\nSal y pimienta, al gusto\nCuñas de limón, para servir\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las papas en tiras de 76 x 13 mm y remójalas en\nagua por 15 minutos.\n2 Drena las papas, enjuágalas con agua fría y sécalas\ncon toallas de papel.\n3 Agrega aceite, polvo de ajo y pimentón a las papas\nhasta que estén bien cubiertas.\n4 Preheat\n5 Agrega las papas a la freidora de aire precalentada.\n6 Ajusta el tiempo a 28 minutos a 200°C. Asegúrate de\nsacudir las cestas para asegurar una cocción pareja\n7 Retira las cestas de la freidora de aire cuando\ntermine la cocción y cubre las papas de queso feta,\nperejil, orégano, sal y pimienta.\n8 Sirve con rodajas de limón."},{"id":500,"title":"Cuñas de Papa RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":99,"text":"Cuñas de Papa\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25-28\nminutos\n2\npapas\ngruesas\ngrandes,\nenjuagadas\ny\ncortadas\nen\ncuñas de 102 mm de largo 23\nml de aceite de oliva 3 g de\najo en polvo 1 g de cebolla en\npolvo 3 g de sal 1 g de\npimienta negra 5 g de queso\nparmesano rallado Salsa de\ntomate o salsa ranch, para\nserver\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta las papas en trozos de 102 mm de largo.\n2 Preheat\n3 Cubre las papas con aceite de oliva y mezcla los\ncondimentos y el queso Parmesano hasta que estén bien\ncubiertas.\n4 Agrega las papas a la freidora precalentada.\n5 Establece el tiempo a 25 minutos a 200°C\n6 Asegúrate de agitar las cestas a la mitad de la\ncocción\n7 Sirve con salsa de tomate o salsa ranch"},{"id":501,"title":"chips de papas","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":100,"text":"chips de papas\nRINDE 4 PORCIONES\n2 L de agua\n15 g de sal\n2 papas gruesas grandes,\npicadas en rodajas finas\n20 ml de aceite de oliva\nSal y pimienta, al gusto\nTIEMPO DE PREPARACIÓN: 40\nminutos\nTIEMPO DE COCCIÓN: 25\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Mezcla el agua y la sal en un tazón grande hasta que\nse disuelva la sal.\n2\nRebana\nlas\npapas\nen\ntrozos\npequeños.\nSe\nrecomienda utilizar una mandolina (usa una cuchilla de\n1,5 mm).\n3 Remoja las papas en el agua salada durante 30\nminutos.\n4 Drena las papas y sécalas.\n5 Preheat\n6 Cubre las papas con aceite de oliva.\n7 Coloca las papas cubiertas de aceite de oliva en la\nfreidora de aire precalentada.\n8 Cocina las papas a 170°C durante 25 minutos.\nAsegúrate de agitar las cestas a mitad de la cocción.\n9 Sazona las papas con sal y pimienta cuando finalices\nla cocción"},{"id":502,"title":"Aros de Cebolla RINDE 2 PORCIONES","category":"Desayunos","source":"120 recetas para comer mejor","page":101,"text":"Aros de Cebolla\nRINDE 2 PORCIONES\nTIEMPO DE PREPARACIÓN: 10\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 cebolla blanca pequeña,\ncortada en rondas de 13 mm\nde grueso y separadas en\nanillos\n84 g de pan crujiente molido\n2 g de pimentón ahumado\n5 g de sal\n2 huevos\n224 ml de suero de leche\n60 g de harina todo uso\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Corta una cebolla en rodajas de 13 mm de grosor y\nsepara las capas en anillos.\n2 Combina las migas de pan, el pimentón y la sal en\nun tazón. Deja de un lado.\n3 Bate los huevos y el suero de leche hasta que\nestén completamente mezclados.\n4 Sumerge cada aro de cebolla en la harina, luego\nen los huevos batidos y finalmente en la mezcla de\nmigas de pan.\n5 Preheat\n6 Rocía abundantemente los aros de cebolla con\naceite de cocina.\n7 Coloca los aros de cebolla en una sola capa en las\ncestas de la freidora de aire precalentada y cocina\nen tandas a 190°C durante 12 minutos hasta que\nestén doradas. Asegúrate de utilizar aceite en\naerosol a la\nmitad uniformemente.\n8 Sirve con tu salsa favorita\nde la cocción para que se cocinen"},{"id":503,"title":"Flor de Cebolla RINDE 3 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":102,"text":"Flor de Cebolla\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 2\nhoras 15 minutos\nTIEMPO DE COCCIÓN: 25\nminutos\n1 cebolla grande\n120 g de harina todo uso\n7 g de pimentón\n12 g de sal\n7 g de ajo en polvo\n3 g de chile en polvo\n1 g de pimienta negra\n1 g de orégano seco\n295 ml de agua\n56 g de pan rallado al estilo\nitaliano\nAceite en aerosol\nantiadherente\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Pela la cebolla y corta la parte superior. Colócala en\nuna tabla de cortar.\n2 Corta hacia abajo, desde el centro hacia afuera en\nla tabla de cortar. Repite para crear 8 cortes\nseparados uniformemente alrededor de la cebolla.\nAsegúrate que tu corte pase por todas las capas, pero\ndeja la cebolla conectada en el centro. Deja de un\nlado.\n3 Cubre la cebolla en agua fría por al menos 2 horas y\nluego sécala.\n4 Une la harina, el pimentón, la sal, el polvo de ajo, el\nchile en polvo, la pimienta negra, el orégano y el agua\nhasta que se forme una mezcla.\n5 Preheat\n6 Cubre la cebolla con la mezcla, extendiéndola por\nlas capas y asegurándote que todas estén cubiertas.\nLuego, espolvorea la parte superior e inferior de la\ncebolla con las migas.\n7 Rocía la parte inferior de la freidora de aire con\naceite de cocina en aerosol y coloca la cebolla dentro\ncortada hacia arriba. Rocía la parte superior de la\ncebolla generosamente con aceite en aerosol.\n8 Cocina la cebolla a 205°C durante 10 minutos, luego,\ncocina por 15 minutos más a 175°C."},{"id":504,"title":"Papas Hasselback RINDE 4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":103,"text":"Papas Hasselback\nRINDE 4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 40\nminutos\n4 papas medianas de color\nrojizo lavadas y escurridas 30\nml de aceite de oliva 12 g de\nsal 1 g de pimienta negra 1 g\nde ajo en polvo 28 g de\nmantequilla derretida 8 g de\nperejil, recién picado, para\ndecorar\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Lava y restriega las papas. Déjalas secar con una\ntoalla de papel.\n2 Corta las hendiduras, a 6 mm de distancia, en las\npapas,\ndeteniéndote\nantes\nde\nque\nla\ncortes\ncompletamente, para que todas las rebanadas estén\nconectadas aproximadamente 13 mm en la parte inferior\nde la papa.\n3 Preheat\n4 Cubre las papas con aceite de oliva y sazona\nuniformemente con sal, pimienta negra y ajo en polvo.\n5 Agrega las papas en la freidora de aire y cocina\ndurante 30 minutos a 175°C.\n6 Cepilla la mantequilla derretida sobre las papas y\ncocina durante otros 10 minutos a 175°C.\n7 Adorna con perejil recién picado"},{"id":505,"title":"Papas Asadas","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":104,"text":"Papas Asadas\nRINDE 4 PORCIONES\n227 g de papas frescas\npequeñas, limpiadas y\npartidas por la mitad\n30 ml de aceite de oliva\n3 g de sal\n1 g de pimienta negra\n2 g de ajo en polvo\n1 g de tomillo seco\n1 g de romero seco\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 25\nminutos\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cubre las papas a la mitad con aceite de oliva y\nmezcla los condimentos.\n3\nprecalentada.\n4 Establece el tiempo a 25 minutos a 195°C. Asegúrate\nde agitar las cestas a la mitad de la cocción\nColoca\nlas\npapas\nen\nla\nfreidora\nde\naire"},{"id":506,"title":"Zanahorias Asadas con Miel RINDE 2-4 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":105,"text":"Zanahorias Asadas con Miel\nRINDE 2-4 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n454 g de zanahorias arcoíris,\npeladas y lavadas\n15 ml de aceite de oliva\n30 ml de miel\n2 ramitas de tomillo fresco Sal\ny pimienta, al gusto\n1 Lava las zanahorias y sécalas con una toalla de papel.\nDeja de un lado.\n2 Preheat\n3 Coloca las zanahorias en un tazón con aceite de oliva,\nmiel, tomillo, sal y pimienta.\n4 Ajusta el tiempo 15-18 minutos a 190°C. Asegúrate de\nagitar las cestas a la mitad de la cocción\n5 Sirve caliente.\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más"},{"id":507,"title":"Brócoli Asado con Ajo RINDE 3 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":106,"text":"Brócoli Asado con Ajo\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 12\nminutos\n1 brócoli grande de cabeza,\ncortado en florecillas\n15 ml de aceite de oliva\n3 g de ajo en polvo\n3 g de sal\n1 g de pimienta negra\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Rocía los trozos de brócoli con aceite de oliva y\nmézclalos hasta que estén bien cubiertos.\n3 Mezcla el brócoli con los condimentos.\n4 Agrega el brócoli a la freidora de aire precalentada,\n12 minutos a 160-170°C.\n5 Deja reposar 3 minutos para servir"},{"id":508,"title":"Zanahorias con Miel y Soya RINDE 3 PORCIONES","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":107,"text":"Zanahorias con Miel y Soya\nRINDE 3 PORCIONES\nTIEMPO DE PREPARACIÓN: 5\nminutos\nTIEMPO DE COCCIÓN: 15\nminutos\n454 g de zanahorias jóvenes\n(152 mm), enjuagadas, limpias\ny secadas\n15 ml de aceite de oliva\n5 ml de miel\n5 ml de salsa de soja\nSal y pimienta, al gusto\nNOTA: Dependiendo de tu preferencia el tiempo puede\nser un poco menos o más\n1 Preheat\n2 Cubre las zanahorias en aceite de oliva y mézclalas\nen la miel y en la salsa de soya.\n3 Coloca las zanahorias en la freidora de aire\nprecalentada.\n4 Ajusta el tiempo 15-18 minutos a 190°C. Asegúrate de\nagitar las cestas a la mitad de la cocción\n5 Sazona con sal y pimienta cuando termines de\ncocinar"},{"id":509,"title":"Coliflor Asada RINDE 3 PORCIONES 284 g de coliflor 10 ml de aceite de oliva 3 g de sal 1 g de pimienta negra","category":"Verduras y guarniciones","source":"120 recetas para comer mejor","page":108,"text":"Coliflor Asada\nRINDE 3 PORCIONES\n284 g de coliflor\n10 ml de aceite
