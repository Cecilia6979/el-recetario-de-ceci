"},{"id":259,"title":"TORTILLA DE ESPAGUETI Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":307,"text":"TORTILLA DE ESPAGUETI\nDificultad Fácil\nTiempo de preparación 45 minutos\nTiempo de cocción 20 a 30 minutos\nPorción 4 personas\nINGREDIENTES\n250 g de espaguetis\n½ pimiento rojo\nPerejil\n3 ajos\n150 g de chorizo\n5 o 6 huevos\nSal y Pimienta\nPREPARACION\nPrepara los espaguetis al dente, escurre y deja reposar un poco hasta enfriar.\nLuego pícalos. Bate los huevos junto a la sal, la pimienta y el perejil; luego\nagrega a la mezcla los espaguetis, los chorizos picados, el pimiento en\ntrocitos y el ajo triturado. Mezcla todo muy bien.\nCOCINAR TORTILLA DE ESPAGUETI\nAntes de colocar nuestra mezcla en la freidora de aire, aceita la bandeja un\npoco, para evitar que la tortilla se adhiera, vierte la mezcla y deja cocinar de\n20 a 30 minutos a 170 °C, desmolda con cuidado y sirve."},{"id":260,"title":"TORTILLA A LA ITALIANA DIETÉTICA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":308,"text":"TORTILLA A LA ITALIANA DIETÉTICA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 3 minutos\nPorción 1 persona\nINGREDIENTES\n1 huevo\n½ pimiento poblano\n7 aceitunas verdes\n25 g de queso gruyere rallado\n1 tomate maduro\nPREPARACION\nCorta en julianas el pimiento verde y quita las semillas, corta las aceitunas\nverdes en rodajas y por último pica el tomate por la mitad y luego en\nrodajas cada parte.\nCOCINAR TORTILLA A LA ITALIANA DIETÉTICA\nPre-calienta la freidora de aire a 180°C. Coloca el pimiento en forma de flor\ndentro de esta, mientras bates un huevo en un bol. Coloca el huevo batido\ndentro de la freidora de aire y deja cocinar durante 3 minutos.\nUna vez cocida la tortilla, retira de la freidora y coloca en un plato, luego\nesparce el queso gruyere rayado por encima, coloca el tomate en rodajas, en\nforma de flor y por último agrega las aceitunas verdes encima de la tortilla.\nRetira y sirve."},{"id":261,"title":"TORTILLA DE QUESO PARMESANO CON ESPINACAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":309,"text":"TORTILLA DE QUESO PARMESANO CON\nESPINACAS\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 8 minutos\nPorción 2 personas\nINGREDIENTES\n75 g de queso parmesano rallado\n2 cda de espinacas en picadillo\nPimienta y sal\n3 huevos\nPREPARACION\nBate bien los huevos, agrega sal y pimienta al gusto y sigue revolviendo\nhasta integrar bien los ingredientes. Enmanteca la freidora de aire\npreviamente y vierte la mezcla de huevos, luego agrega por encima y sin\nrevolver el queso parmesano rallado junto a las espinacas cortadas.\nCOCINAR\nTORTILLA\nDE\nQUESO\nPARMESANO\nCON\nESPINACAS\nDeja cocinar la tortilla a 190°C durante 8 minutos, en la freidora de aire. Es\nnecesario comprobar la consistencia, en caso de querer una tortilla bien\ndorada deja cocinar por 2 minutos extra y lista para servir."},{"id":262,"title":"TORTILLA DE COLIFLOR CON ZANAHORIA Y POLLO Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":310,"text":"TORTILLA DE COLIFLOR CON ZANAHORIA Y\nPOLLO\nDificultad Media\nTiempo de preparación 8 minutos\nTiempo de cocción 15 minutos\nPorción 6 personas\nINGREDIENTES\n1 coliflor (cocido y picado en trozos)\n225 g de pollo picado, asado y en cuadros\n1 zanahoria rallada\n1 cebolla cortada en cuadros pequeños\n1 cda de harina de trigo\n2 cda de perejil picado\n3 cda de queso parmesano rallado\n1 cubito de pollo\nPimienta molida\n½ cdta de orégano molido\n4 huevos\n30 ml de aceite\nPREPARACION\nEn 15 ml de aceite, sofríe la cebolla, la zanahoria y mezcla. En un bol\nintégralas, luego el pollo asado, el perejil y el cubito de pollo triturado. Por\núltimo, agrega el queso rallado, pimienta, orégano, harina y 2 huevos\nbatidos. Mezcla todo."},{"id":263,"title":"COCINAR TORTILLA DE COLIFLOR CON ZANAHORIA Y","category":"Desayunos","source":"365 recetas sin aceite","page":311,"text":"COCINAR TORTILLA DE COLIFLOR CON ZANAHORIA Y\nPOLLO\nDeja cocinar 8 minutos, a 190°C, en modo freír, agrega sobre la tortilla 2\nhuevos batidos y cocina por 5 minutos más, hasta cuajar; da vuelta y dora\npor el otro lado durante 3 minutos. Retira y sirve."},{"id":264,"title":"TORTILLA DE CALABACÍN CON CHORIZO Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":312,"text":"TORTILLA DE CALABACÍN CON CHORIZO\nDificultad Media\nTiempo de preparación 30 minutos\nTiempo de cocción 20 minutos\nPorción 2 personas\nINGREDIENTES\n3 huevos\n1 cebolla pequeña\n1 calabacín mediano\nAceite\n1 chorizo picado\nPREPARACION\nPela el calabacín, pica en cuadros pequeños y pon a pochar en la freidora,\ncon un poco de aceite, sin exceder los 80°C y deja cocinar durante 8\nminutos. Una vez listo el calabacín, deja reposar en una escurridora. A\ncontinuación, en la freidora de aire agrega aceite y calienta a no más de\n100°C, agrega el chorizo picado y rehoga durante 4 o 6 minutos.\nCOCINAR TORTILLA DE CALABACÍN CON CHORIZO\nBate los huevos y vierte en la freidora de aire junto al calabacín y el\nchorizo, luego revuelve. Cocina la tortilla hasta cuajar y voltea para dorar\npor ambos lados. Una vez consistente la tortilla, quedará lista."},{"id":265,"title":"TORTILLA DE ESPÁRRAGOS CON QUESO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":313,"text":"TORTILLA DE ESPÁRRAGOS CON QUESO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 12 minutos\nPorción 3 personas\nINGREDIENTES\n4 huevos\n100 g de queso semi-curado en trozos\n1 manojo de espárragos verdes\nSal\nAceite de oliva extra virgen\nPREPARACION\nLava los espárragos y quita la punta dura, corta en pedazos pequeños de 2\ncm. Escurre los espárragos y añade sal al gusto. Corta el queso en cuadros\nde 3 cm de espesor. Bate los huevos y agrega sal al gusto. En la freidora de\naire, vierte 3 cucharadas de aceite de oliva y calienta un poco, pon los\nespárragos con sal y fríe hasta dorar, ya listos, deja escurrir. En un bol vierte\nlos huevos batidos, agrega los espárragos, el queso y mezcla todo.\nCOCINAR TORTILLA DE ESPÁRRAGOS CON QUESO\nPre-calienta la freidora de aire a 95°C, y con una pequeña cantidad de aceite\nengrasa. Agrega la mezcla y pon a cocinar cada lado de la tortilla, durante 6\nminutos. Retira y sirve."},{"id":266,"title":"TORTILLA DE QUESO, ESPINACA Y HIERBAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":314,"text":"TORTILLA DE QUESO, ESPINACA Y HIERBAS\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 14 minutos\nPorción 3 personas\nINGREDIENTES\n200 g de espinaca\n30 g de queso mozzarella\n15 ml de aceite de oliva\n2 huevos\nSal de mesa\nPimienta\nHierbas provenzales\nPerejil seco\nPREPARACION\nHierve la espinaca 10 minutos, en agua con sal. Escurre las hojas y exprime\ncon una cucharilla. Extiende la espinaca en un plato y esparce por encima\nhierbas provenzales, pimienta molida y perejil seco. Calienta una cucharada\nde aceite en la freidora de aire a temperatura media, pon las espinacas y\nsaltea por 6 minutos, luego colócalas en un plato y agrega queso rallado por\nencima. En un bol sala los huevos y bate.\nCOCINAR TORTILLA DE QUESO, ESPINACA Y HIERBAS\nÚnta con aceite la freidora de aire, calienta, agrega el huevo y en el centro\nde éste coloca las espinacas enrolladas con queso. Enrolla la tortilla y\ncocina hasta cuajar ambos lados."},{"id":267,"title":"TORTILLA DE CALABACÍN CON QUESO GRUYERE Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":316,"text":"TORTILLA DE CALABACÍN CON QUESO\nGRUYERE\nDificultad Media\nTiempo de preparación 40 minutos\nTiempo de cocción 30 minutos\nPorción Para 4 personas\nINGEDIENTES\n2 calabacines\n1 cda de mostaza\n1 cebolla blanca\n250 ml de crema de leche\n4 huevos\nPimienta y sal\n50 gr de queso rallado Gruyere\nPREPARACION\nPica la cebolla en julianas, pica el calabacín en cubitos. Rehoga la cebolla\njunto al calabacín en una cucharada de mantequilla, a menos de 100 °C,\ndurante 5 a 6 minutos. Bate los huevos en un bol y adicionar el calabacín y\nla cebolla previamente cocinados, el queso gruyere, la crema de leche, la\nmostaza y sal y pimienta al gusto. Mezcla todos los ingredientes. Luego\npasa la mezcla por la licuadora, hasta obtener un puré homogéneo.\nCOCINAR TORTILLA DE CALABACÍN CON QUESO GRUYERE\nVierte el puré en la freidora de aire, previamente engrasada y deja cocinar\ndurante 30 minutos a temperatura media. Una vez lista, retira la tortilla de la"},{"id":268,"title":"TORTILLA DE PAPAS CON ZANAHORIA Dificultad Media","category":"Desayunos","source":"365 recetas sin aceite","page":318,"text":"TORTILLA DE PAPAS CON ZANAHORIA\nDificultad Media\nTiempo de preparación 20 minutos\nTiempo de cocción 10 minutos\nPorción 4 personas\nINGEDIENTES\n6 papas\n6 huevos\n1 zanahoria\n1 cebolla\nSal\nOrégano\nAceite de oliva\nPREPARACION\nPela las papas y corta en rodajas, pica la cebolla en juliana, rehoga en un\npoco de aceite de oliva, en la freidora de aire a menos de 100 °C durante 6\nminutos. Bate los huevos, raya la zanahoria y en un bol mezcla ambos,\nadiciona la cebolla y las patatas previamente cocinadas, mezcla\nnuevamente.\nCOCINAR TORTILLA DE PAPAS CON ZANAHORIA\nEn la freidora de aire cocina la tortilla a 160° C, durante 10 minutos,\ndurante la cocción voltea para dorar por ambos lados. Una vez obtenida la\nconsistencia requerida, puedes servir."},{"id":269,"title":"TORTILLA DE CEBOLLAS DE VERDEO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":319,"text":"TORTILLA DE CEBOLLAS DE VERDEO\nDificultad Fácil\nTiempo de preparación 18 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGREDIENTES\n200 g de cebollín\nAceite de oliva\nPimienta negra molida\nSal\n4 huevos\nPREPARACION\nLava el cebollín, pica en trozos redondos, deja escurrir un poco para\neliminar el exceso de humedad, condimenta con sal y pimienta y saltea con\nel aceite de oliva, hasta que el cebollín esté tierno. Bate los huevos con sal y\npimienta en un bol y agrega el cebollín salteado.\nCOCINAR TORTILLA DE CEBOLLAS DE VERDEO\nVierte la mezcla en la freidora y deja cocinar durante 10 minutos a 160°C,\nrevisa constantemente la consistencia de la tortilla y voltea para que se dore\npor ambos lados, una vez lista sirve caliente."},{"id":270,"title":"TORTILLA DE ARVEJAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":320,"text":"TORTILLA DE ARVEJAS\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 13 minutos\nPorción 5 personas\nINGREDIENTES\n½ kilo de guisantes verdes\n1 cebolla grande\n4 huevos\n2 dientes de ajo\nPimienta\nSal\nPerejil\nAceite de oliva\nPREPARACION\nPon a hervir las arvejas hasta ablandar, mientras tanto corta la cebolla en\ntiras, igual corta el perejil y el ajo.\nEn un bol bate los huevos, adiciona las cebollas, el perejil, las arvejas, el ajo\ny salpimentar.\nCOCINAR TORTILLA DE ARVEJAS\nPrecalienta la freidora de aire a 160°C, engrasa con un poco de aceite de\noliva y vierte la mezcla. Deja cocinar durante 13 minutos, dando vueltas a\nla tortilla a mitad de cocción. Una vez cuajada la tortilla, puedes servir."},{"id":271,"title":"TORTILLA DE PAPAS “ROSTI” Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":321,"text":"TORTILLA DE PAPAS “ROSTI”\nDificultad Fácil\nTiempo de preparación 20 minutos\nTiempo de cocción 15 minutos\nPorción 6 personas\nINGREDIENTES\n1 k de papas\n300 g de queso gruyere\n1 huevo\n75 g de harina de trigo\n2 cda de aceite\nPimienta y sal\n1 cebolla\n3 dientes de ajo\nPREPARACION\nPela las papas y rallarlas, pica la cebolla en juliana o cuadros y pica el ajo.\nBate el huevo en un bol, agrega las papas ralladas, el ajo, la cebolla, la\nharina, el queso gruyere y condimenta con sal y pimienta. Revuelve bien los\ningredientes hasta que se integren.\nCOCINAR TORTILLA DE PAPAS “ROSTI”\nUna vez teniendo nuestra mezcla, engrasa la freidora de aire con el aceite,\ncalienta a 170°C y vierte la mezcla, deja cocinar por 15 minutos, da vuelta a\nla tortilla a mitad de cocción para dorar por ambos lados. Una vez lista la\ntortilla, puedes servir."},{"id":272,"title":"TORTILLA DE AJOPORRO Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":322,"text":"TORTILLA DE AJOPORRO\nDificultad Medio\nTiempo de preparación 45 minutos\nTiempo de cocción 30 minutos\nPorción 4 personas\nINGREDIENTES\n1 cda de mostaza\n1 cebolla mediana\n3 huevos grandes\n250 ml de crema de leche\n2 ajo porro\nPimienta negra molida\nSal\nPREPARACION\nLava los ajoporros y quita la raíz, lava la cebolla retirando la cáscara y la\nraíz. Hierve en agua con sal la cebolla y el ajo porro durante 5 minutos,\nluego cuela y licua hasta obtener una mezcla homogénea. En un bol vierte\nla mezcla de ajo porro y cebolla, adiciona crema de leche, mostaza y los\nhuevos. Condimenta con sal y pimienta, remueve todos los ingredientes\nhasta que la mezcla quede con la consistencia de un puré.\nCOCINAR TORTILLA DE AJOPORRO\nCalienta la freidora de aire a 200° C y enmanteca con aceite, vierte la\nmezcla y cocina durante 30 minutos, hasta que cuaje. Retira y sirve."},{"id":273,"title":"Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":323,"text":"TORTILLA PATATAS LIVIANA\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 15 minutos\nPorción 4 personas\nINGREDIENTES\n3 huevos\n3 papas medianas\n1 lata de cebolla frita\nAceite de oliva\nPimienta\nSal\nPREPARACION\nHierve las papas en agua con sal, una vez cocidas escurre, retira la cáscara y\ncorta en cuadros. En un bol revuelve los huevos y agrega las papas, la\ncebolla caramelizada y mezcla.\nCOCINAR TORTILLA PATATAS LIVIANA\nPor último, calienta la freidora de aire a temperatura media, engrasa y vierte\nla mezcla, cocina por 15 minutos aproximadamente. De ser necesario dale\nla vuelta a la tortilla, hazlo con mucho cuidado para que no se rompa. Una\nvez dorada estará lista para servir."},{"id":274,"title":"TORTILLA ESPAÑOLA CON MORCILLA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":324,"text":"TORTILLA ESPAÑOLA CON MORCILLA\nDificultad Fácil\nTiempo de preparación 28 minutos\nTiempo de cocción 15 minutos\nPorción 4 personas\nINGREDIENTES\n3 dientes de ajo\n½ morcilla\n4 papas medianas\n1 cebolla blanca\nPimienta y sal\n5 huevos\nAceite\nPREPARACION\nPela y pica las papas en rodajas, corta la cebolla en julianas y corta o\ntriturar el ajo. Luego procede a saltear en aceite las papas y cuando se doren\nagrega la cebolla y el ajo, sigue salteando hasta que la cebolla se vea\ncristalina. Agrega la sal, la morcilla y pimienta al gusto.\nCOCINAR TORTILLA ESPAÑOLA CON MORCILLA\nLuego bate los huevos y agrega a la mezcla anterior, ahora procede a\ncocinar en la freidora de aire a 150°C, durante 15 minutos, hasta lograr la\nconsistencia adecuada. Una vez cuajada y dorada la tortilla estará lista para\nservir."},{"id":275,"title":"TORTILLA ESPAÑOLA CON AJÍES VERDES Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":325,"text":"TORTILLA ESPAÑOLA CON AJÍES VERDES\nDificultad Fácil\nTiempo de preparación 28 minutos\nTiempo de cocción 15 minutos\nPorción 6 personas\nINGREDIENTES\n4 ajíes verdes dulces\nAceite de oliva\n5 papas medianas\nSal\n1 cebolla\n4 huevos\nPREPARACION\nCorta los ajíes en tiras. En la freidora de aire coloca un poco de aceite y\ndora los ajíes, agregar sal, cocina hasta que ablanden y reserva. Pela y pica\nlas papas en tajadas circulares. Ahora pica la cebolla en julianas. Vierte\naceite en la freidora de aire y a temperatura media, fríe la cebolla y las\npatatas hasta que estén blandas y doradas; luego coloca en un bol con los\nhuevos batidos y revuelve.\nCOCINAR TORTILLA ESPAÑOLA CON AJÍES VERDES\nAgrega la mezcla en la freidora engrasada y cocina a 160°C durante 10\nminutos, voltea la tortilla a mitad de cocción y deja cocinar. Al estar dorada\npor ambos lados sirve y agrega los ajíes por encima."},{"id":276,"title":"TORTILLA ESPAÑOLA CON AJO Y PAPRIKA Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":326,"text":"TORTILLA ESPAÑOLA CON AJO Y PAPRIKA\nDificultad Medio\nTiempo de preparación 28 minutos\nTiempo de cocción 10 minutos\nPorción 4 personas\nINGREDIENTES\n½ k de papas\nAceite de oliva\n1 cebolla blanca\n1 chorizo\n6 huevos\nPaprika\n3 dientes de ajo\n1 cdta de perejil\nPREPARACION\nLimpia y corta las papas en rodajas. En la freidora de aire a 170°C, fríe las\npapas hasta dorarlas, luego reserva. Corta la cebolla en rodajas y rehoga a\nmenos de 90°C. Corta el chorizo colorado en rodajas y también pica los\ndientes de ajos y el perejil. En un bol, bate los huevos, sala al gusto y\nadiciona las papas, el chorizo, el ajo, la cebolla, paprika al gusto y el perejil.\nRevuelve.\nCOCINAR TORTILLA ESPAÑOLA CON AJO Y PAPRIKA\nEngrasa la freidora de aire, vierte la mezcla y cocina a 160°C durante 10 a\n12 minutos, voltea la tortilla a mitad de cocción. Cuando la tortilla esté\ndorada puedes servir."},{"id":277,"title":"TORTILLA DE ACELGA CON SOBRASADA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":328,"text":"TORTILLA DE ACELGA CON SOBRASADA\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 12 minutos\nPorción 2 personas\nINGREDIENTES\n150 g de acelgas\n2 ruedas de sobrasada\nSal\nPimienta\n3 huevos\nAceite de oliva\nPREPARACION\nEn agua hirviendo con sal coce las acelgas, cuando estén listas, cuela y deja\nescurrir sobre papel de cocina. En un bol revuelve los huevos con pimienta\nmolida y una pizca de sal. Agrega las acelgas y la sobrasada, picada, a los\nhuevos batidos, tratando de que la sobrasada de distribuya bien entre las\nacelgas.\nCOCINAR TORTILLA DE ACELGA CON SOBRASADA\nUna vez preparada la mezcla, vierte en la freidora de aire, previamente\nengrasada con aceite de oliva. Deja cocinar la tortilla durante 12 minutos a\n170°C, voltea la tortilla durante la cocción procurando dorar ambas caras.\nUna vez lista, sirve."},{"id":278,"title":"TORTILLA DE ESPÁRRAGOS CON CARNE DE PAVO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":329,"text":"TORTILLA DE ESPÁRRAGOS CON CARNE DE\nPAVO\nDificultad Fácil\nTiempo de preparación 18 minutos\nTiempo de cocción 8 minutos\nPorción 1 persona\nINGREDIENTES\n2 Espárragos en conserva\n30 g de embutido de pavo\n1 huevo\n15 ml de aceite de oliva\nSal\nPimienta\nPREPARACION\nColoca los espárragos sobre papel de cocina para eliminar el exceso de\nhumedad, pica el pavo en trocitos. Bate el huevo en un bol, agregando sal y\npimienta al gusto, luego corta los espárragos en pedazos pequeños y\nagrégalos a la mezcla de huevo junto a los trozos de pavo.\nCOCINAR TORTILLA DE ESPÁRRAGOS CON CARNE DE PAVO\nEngrasa un poco la freidora de aire con aceite de oliva, agrega la mezcla\nrealizada previamente y cocina a 170°C durante 8 minutos, voltea durante\nla cocción y una vez cuajada la tortilla, retira de la freidora y sirve."},{"id":279,"title":"TORTILLA DE BACALAO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":330,"text":"TORTILLA DE BACALAO\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 4 personas\nINGREDIENTES\n1 cebolla\n5 huevos\n1 pimiento rojo, cortado en rodajas\n200 g de bacalao\nPimienta\nSal\nAceite de oliva\n3 dientes de ajo\n1 perejil\nPREPARACION\nDesmenuza el bacalao. Corta la cebolla y el pimiento rojo en julianas; así\nmismo el perejil y el ajo en trozos pequeños. En la freidora de aire rehoga la\ncebolla con aceite de oliva, agrega el pimiento rojo, el bacalao, el ajo y el\nperejil, revuelve y deja cocinar 5 minutos más. En un bol bate los huevos\ncon una pizca de pimienta y sal. El preparado de la freidora, agrégalo en el\nbol junto a los huevos y revuelve.\nCOCINAR TORTILLA DE BACALAO\nEn la freidora de aire, engrasada, agrega la mezcla y deja cocinar a 170°C\ndurante 10 minutos. Una vez dorada la tortilla, estará lista para servir."},{"id":280,"title":"TORTILLA DE ESPINACA CON RALLADO DE MAR Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":332,"text":"TORTILLA DE ESPINACA CON RALLADO DE\nMAR\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGREDIENTES\n300 g de espinacas\n3 dientes de ajo\n2 cda de rallado de mar\n15 ml de aceite de oliva\n2 huevos\nSal\nPimienta\nPREPARACION\nCoce las espinacas y escurre. Pela los ajos y sofríe un poco hasta dorar,\necha luego las espinacas en el aceite, agrega el rallado de mar, sal y\npimienta al gusto mezcla y saltea durante 5 minutos. En un bol bate el\nhuevo con una pizca de sal, agrega el salteado y sigue mezclando.\nCOCINAR TORTILLA DE ESPINACA CON RALLADO DE MAR\nEngrasa un poco la freidora de aire con aceite, vierte la mezcla y deja\ncocinar durante 10 minutos aproximadamente. Da vuelta a la tortilla durante\nla cocción y una vez lista puedes servir."},{"id":281,"title":"TORTILLA DE SALMÓN AHUMADO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":333,"text":"TORTILLA DE SALMÓN AHUMADO\nDificultad Fácil\nTiempo de preparación 18 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGREDIENTES\n2 huevos pequeños\nHiervas provenzales\n4 lonchas de salmón ahumado\nPimienta negra\n15 ml de aceite de oliva\nSal\nPREPARACION\nBate en un bol los dos huevos hasta que haga espuma, agrega la sal y la\npimienta negra.\nCOCINAR TORTILLA DE SALMÓN AHUMADO\nCalienta la freidora a baja temperatura, agrega aceite de oliva y vierte los\nhuevos, a medida que vaya cuajando los huevos, ve colocando lonchas de\nsalmón, luego deja cocinar durante 5 a 10 minutos extras, hasta que el\nsalmón se torne más rosa, dobla la tortilla y retira de la freidora una vez\ncuajada y sirve."},{"id":282,"title":"TORTILLA DE ACELGA A LA PIZZA Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":334,"text":"TORTILLA DE ACELGA A LA PIZZA\nDificultad Medio\nTiempo de preparación 35 minutos\nTiempo de cocción 15 minutos\nPorción 4 personas\nINGREDIENTES\n400 g de acelga\n1 cebolla\n1 pimiento\nAceite de girasol\nSal\nPimienta\n3 dientes de ajo\n½ lata de salsa de tomate\n250 g de mozzarella\nAceitunas negras\n4 huevos\nPREPARACION\nCorta la acelga en tiras, pasa por agua hirviendo. Rehoga el pimiento y la\ncebolla en julianas, junto al ajo, luego agrega las acelgas, sal y pimienta.\nDespués coloca en un bol, incorpora los huevos y mezcla. Para la salsa para\npizza, agrega en un bol la salsa de tomates, un ajo picado, sal, aceite y\nadobo, mezclando todo.\nCOCINAR TORTILLA DE ACELGA A LA PIZZA"},{"id":283,"title":"TORTILLA DE CEREZAS A LA FRANCESA Dificultad Fácil.","category":"Desayunos","source":"365 recetas sin aceite","page":336,"text":"TORTILLA DE CEREZAS A LA FRANCESA\nDificultad Fácil.\nTiempo de preparación 17 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGEDIENTES\n2 huevos grandes\nSal.\n200 g de cerezas\nAceite\nPREPARACION\nQuita los huesos de las cerezas, lava muy bien y corta por la mitad o en\npequeñas rodajas, luego déjalas escurrir. En un bol o plato hondo, bate los\nhuevos con sal al gusto, agrega las cerezas y revuelve hasta integrar los\ningredientes.\nCOCINAR TORTILLA DE CEREZAS A LA FRANCESA\nEn la freidora de aire vierte una cucharada de aceite y agrega la mezcla de\nla tortilla. Deja cocinar a 170 °C durante 10 minutos, pasado 5 minutos\nvoltea la tortilla y sigue cocinando hasta que dore por ambos lados y lista\npara servir."},{"id":284,"title":"TORTILLA DE LANGOSTINOS AL AJILLO Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":337,"text":"TORTILLA DE LANGOSTINOS AL AJILLO\nDificultad Medio\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 4 personas\nINGREDIENTES\n200 g de langostinos\n4 huevos\n4 dientes de ajo\n100 ml de brandy\nPerejil\nAceite extra virgen\nPimienta negra\nSal\nPREPARACION\nPela y limpia los langostinos, pica en trozos y reserva. En la sartén, a baja\ntemperatura, sofríe el ajo sin dorar, agrega los langostinos y saltea. Agrega\nsal, pimienta, perejil, el brandy y flambea. En un bol, aparte, revuelve los\nhuevos, cuando los langostinos hayan tomado color, agrégalos al bol, junto\na los huevos y mezcla.\nCOCINAR TORTILLA DE LANGOSTINOS AL AJILLO\nEn la freidora a 190°C, previamente engrasada, agrega la mezcla con los\nlangostinos y cocina durante 10 minutos. Voltea la tortilla durante la\ncocción para dorar por ambos lados. Una vez cuajada estará lista para\nservir."},{"id":285,"title":"QUESOS Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":339,"text":"TORTILLA DE PATATAS A LOS CUATRO\nQUESOS\nDificultad Medio\nTiempo de preparación 40 minutos\nTiempo de cocción 20 minutos\nPorción 4 personas\nINGREDIENTES\n250 g de papas\n100 g de queso gruyere\n100 g de queso mozzarella\n100 g de queso fontina\n50 g de queso roquefort\n125 g de tocino\n¼ tza de crema de leche\nNuez moscada\n30 g de mantequilla\nPREPARACION\nHierve en agua con sal, las papas peladas y cortadas en rodajas, 7 minutos,\nescurre. Corta la cebolla en rodajas y saltea con mantequilla junto al tocino\nen trozos.\nCOCINAR TORTILLA DE PATATAS A LOS CUATRO QUESOS\nEngrasa la freidora, coloca una capa de papas y seguido coloca una capa\ncon la mitad del salteado de cebolla y tocino, haz otra capa de papas y\ntermina de colocar el resto del salteado, agrega los 4 quesos. Revuelve la"},{"id":286,"title":"crema de leche, agrega sal, pimienta y una pizca de nuez moscada, luego","category":"Otros","source":"365 recetas sin aceite","page":340,"text":"crema de leche, agrega sal, pimienta y una pizca de nuez moscada, luego\nespárcela encima de la preparación. Cocina a 190°C durante 20 minutos."},{"id":287,"title":"TORTILLA ESPAÑOLA CON CHORIZO ASTURIANO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":341,"text":"TORTILLA ESPAÑOLA CON CHORIZO\nASTURIANO\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 13 minutos\nPorción 4 personas\nINGEDIENTES\n400 g de papas\n2 cebollas\n2 chorizos asturianos\n6 huevos\nAceite de oliva\nSal\nPREPARACION\nPela y pica las papas en láminas finas. Corta la cebolla en julianas.\nColócalas en un bol y mezcla. En una sartén, con aceite de oliva, agrega las\npapas y la cebolla, la sal y saltea hasta que estén tiernas. En un Bol bate los\nhuevos incorpora el chorizo picado y el salteado de papas y cebolla.\nCOCINAR TORTILLA ESPAÑOLA CON CHORIZO ASTURIANO\nAgrega la mezcla en la freidora de aire previamente engrasada y cocina a\n170 °C durante 13 minutos. Es importante voltear la tortilla a mitad de\ncocción, una vez que quede firme la tortilla, sirve."},{"id":288,"title":"TORTILLA DE HINOJOS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":342,"text":"TORTILLA DE HINOJOS\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 23 minutos\nPorción 4 personas\nINGEDIENTES\n2 cebollas\n1 cda. de mostaza\n3 huevos\n250 ml de crema de leche\n2 hinojos\nSal\nPimienta\nPREPARACION\nLimpia el hinojo y quita la cáscara de la cebolla en una olla pon a hervir\nagua con sal, cuando el agua llegue el punto de ebullición echa el hinojo y\nla cebolla, dejándolos cocinar durante 5 minutos. Cuando el hinojo y la\ncebolla estén blandos cuela y escurre. Pasa estos por la licuadora, agrega los\nhuevos la mostaza y la crema de leche, sigue licuando hasta lograr la\nconsistencia de un puré.\nCOCINAR TORTILLA DE HINOJOS\nEngrasa la bandeja de la freidora de aire y vierte la mezcla, déjala cocinar a\n170°C durante 23 minutos hasta que quede firme. Retira y sirve."},{"id":289,"title":"TORTILLA DE ALCACHOFAS Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":343,"text":"TORTILLA DE ALCACHOFAS\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 15 minutos\nPorción 4 personas\nINGEDIENTES\n4 alcachofas\n1 limón (zumo)\n1 manojo de ajos\n4 huevos\nAceite\nHarina de maíz\nSal al gusto\nCanela en polvo\nPREPARACION\nLava los ajos y pica en trocitos. En un bol con agua agrega 1 cucharada de\nharina, el jugo de limón y revuelve. Limpia las alcachofas; corta en tajadas\ny sumerge en el agua de limón y harina. Bate los huevos, mientras fríes los\najos hasta dorar, cuando estén listos agrega en el bol junto a los huevos\nbatidos. En el aceite fríe la alcachofa, agrega sal, canela y deja dorar. Una\nvez listas, mezcla en el bol con los huevos y los ajos.\nCOCINAR TORTILLA DE ALCACHOFAS\nEngrasa la freidora y vierte la mezcla. Deja cocinar a 170°C, durante 15\nminutos, dorando ambos lados. Retira y sirve."},{"id":290,"title":"TORTILLA DE ESPINACA CON BERENJENA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":344,"text":"TORTILLA DE ESPINACA CON BERENJENA\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 10 minutos\nPorción 1 personas\nINGEDIENTES\n1 berenjena pequeña\nAceite de oliva\n50 g de hojas de espinaca\n2 huevos\nSal\nPimienta\nPREPARACION\nLava la berenjena y corta en tajadas finas, luego fríe las lonchas, cuando\nestén tiernas agrega un poco de sal y pimienta, y retira del fuego. Lava las\nespinacas, y saltea hasta que se ablanden, agrega las berenjenas fritas y deja\nsaltear durante 5 minutos más. Mientras tanto en un bol bate los huevos,\nagrega el salteado de y revuelve.\nCOCINAR TORTILLA DE ESPINACA CON BERENJENA\nEn la freidora de aire coloca un poco de aceite, vierte la mezcla y deja\ncocinar la tortilla a 170°C, durante 10 minutos, voltea durante la cocción,\nuna vez dorada ya se puede servir."},{"id":291,"title":"TORTILLA DE ALCACHOFA CON MAÍZ DULCE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":345,"text":"TORTILLA DE ALCACHOFA CON MAÍZ\nDULCE\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 5 personas\nINGREDIENTES\n6 alcachofas (alcauciles)\n6 huevos\n300 g de maíz dulce (de lata)\nSal\nAceite de oliva\nPREPARACION\nDe la alcachofa pica solo los corazones en pequeños triángulos. En una\nsartén con aceite de oliva, fríelos. Al estar dorada agrega 3/4 vaso de agua,\ny cocina durante 10 minutos más, hasta que el agua seque. Pon a escurrir el\nmaíz. En un bol, bate los huevos, sal, agrega el maíz, la alcachofa y mezcla.\nCOCINAR TORTILLA DE ALCACHOFA CON MAÍZ DULCE\nEngrasa la freidora con aceite. A temperatura de 150°C, vierte la mezcla y\ncocina por 12 minutos, voltea la tortilla entre la cocción. Luego de este\ntiempo, estará lista para servir."},{"id":292,"title":"TORTILLA DE ZANAHORIA CON LECHUGA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":346,"text":"TORTILLA DE ZANAHORIA CON LECHUGA\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 12 minutos\nPorción 2 personas\nINGREDIENTES\n1 zanahoria\n2 tza de lechuga\n1 cebolla blanca pequeña\n2 cda de harina\n4 huevos\n1 cubito de pollo o verduras\n35 ml de aceite\nPREPARACION\nPica la cebolla muy fina y fríe, ralla la zanahoria y corta la lechuga en tiras.\nAl estar lista la cebolla, en un bol agrega junto a la zanahoria y la lechuga,\ntritura el cubito y agregar al gusto; adiciona 2 huevos y revuelve. En un bol\naparte bate los 2 huevos restantes y agrega sal al gusto.\nCOCINAR TORTILLA DE ZANAHORIA CON LECHUGA\nEngrasa la freidora con aceite, enciende a temperatura de 150°C, vierte la\nmezcla y cocina durante 5 minutos, vierte los huevos restantes. Cocina\ndurante 7 minutos más hasta cuajar (da vuelta a la tortilla entre la cocción)."},{"id":293,"title":"TORTILLA DE VEGETALES CON QUINOA Y QUESO Dificultad Medio","category":"Desayunos","source":"365 recetas sin aceite","page":347,"text":"TORTILLA DE VEGETALES CON QUINOA Y\nQUESO\nDificultad Medio\nTiempo de preparación 45 minutos\nTiempo de cocción 11 minutos\nPorción 4 personas\nINGEDIENTES\n5 huevos\n100 g de quínoa\n100 g de queso mimolette\n100 g de espinaca\n100 g de judías\nAceite de oliva\n3 cdta de levadura\nSal\nPimienta\nPREPARACION\nPon a hervir las espinacas hasta ablandar. Corta las judías y escalda en agua\ncon sal, durante 6 minutos, luego escurre. Pon a cocer la quínoa. Bate los\nhuevos y la levadura, agregando sal al gusto. En aceite, rehoga la quínoa\ncocida junto a las verduras; luego agrega al bol junto a los huevos batidos y\nrevuelve.\nCOCINAR TORTILLA DE VEGETALES CON QUINOA Y QUESO\nEngrasa la freidora y ponla a 170°C, vierte la mezcla y cocina por 5\nminutos. Corta el queso en cuadros. Una vez pasados los 5 minutos, agrega"},{"id":294,"title":"Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":349,"text":"TORTILLA DE PATATAS CON JAMÓN\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 6 personas\nINGREDIENTES\n1 cebolla\n6 huevos\n150 g de jamón cocido\n4 papas medianas\nSal y pimienta\n30 g de mantequilla\nAceite\nPREPARACION\nLava y pela las papas luego pica en rodajas. Pela la cebolla y córtala en\njulianas, luego rehoga junto a las papas en una sartén con mantequilla.\nCorta el jamón en tiras y reserva. En un bol bate los huevos, agrega sal y\npimienta al gusto, adiciona el jamón, la cebolla y las papas. Revuelve hasta\nque todos los ingredientes se integren.\nCOCINAR TORTILLA DE PATATAS CON JAMÓN\nEnciende la freidora a 170°C, agrega un poco de aceite y vierte la mezcla.\nDeja que la tortilla cuaje un poco, para darle la vuelta y cocina por 5 o 10\nminutos más. Una vez cuajada y dorado la tortilla estará lista para servir."},{"id":295,"title":"TORTILLA SIMPLE DE ESPINACA CON CALABACÍN Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":350,"text":"TORTILLA SIMPLE DE ESPINACA CON\nCALABACÍN\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGEDIENTES\n½ k de calabacín\n3 huevos\n100 g de espinaca\n45 ml de aceite de oliva\nSal\nPimienta\nHiervas provenzales\nPREPARACION\nLava los calabacines, pélalos, corta en cuadritos y colócalos en un\nrecipiente. Cocina en el microondas durante 5 minutos a máxima potencia.\nHierve las espinacas en agua con sal durante 10 minutos. Escurre. Bate los\nhuevos en un bol, agrega la espinaca, el calabacín y las hierbas provenzales,\nsigue revolviendo hasta unir todos los ingredientes.\nCOCINAR TORTILLA SIMPLE DE ESPINACA CON CALABACÍN\nEn la freidora de aire agrega aceite de oliva, coloca la temperatura a 170°C,\nvierte la mezcla y cocina durante 10 minutos, dando vueltas. Retira y sirve."},{"id":296,"title":"TORTILLA DE CHAMPIÑONES A LA FRANCESA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":351,"text":"TORTILLA DE CHAMPIÑONES A LA\nFRANCESA\nDificultad Fácil\nTiempo de preparación 35 minutos\nTiempo de cocción 15 minutos\nPorción 2 personas\nINGREDIENTES\n1 cebolla blanca mediana\n200 g de champiñones cortados\nSal y pimienta negra\nPerejil y tomillo seco o fresco\n4 huevos\nAjo\nPREPARACION\nCorta la cebolla por la mitad, una mitad para rallarla y la otra para picarla\nen cuadritos. Pica en trocitos los ajos. Fríe la cebolla rallada, agrega la\nmitad troceada junto al ajo. Adiciona los champiñones, cocina a fuego lento\ny agrega sal y especias. Bate los huevos y agrega una pizca de sal.\nCOCINAR TORTILLA DE CHAMPIÑONES A LA FRANCESA\nCalienta la freidora a baja temperatura, agrega los huevos batidos y cocina\npor 3 minutos, cuando cuajen, agrega el salteado, dobla la tortilla, para que\nel salteado quede dentro, voltea y cocina por 10 minutos más. Retira y\nsirve."},{"id":297,"title":"SERRANO Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":352,"text":"TORTILLA DE PATATAS CON JAMÓN\nSERRANO\nDificultad Fácil\nTiempo de preparación 30 minutos\nTiempo de cocción 10 minutos\nPorción 2 personas\nINGEDIENTES\n1 cebolla\n2 dientes de ajo\n½ k de papas\nAceite de oliva\n30 ml de aceite\n4 rebanadas de jamón serrano\n6 huevos\nSal\nPREPARACION\nPica la cebolla y el ajo en trocitos. Lava, pela y corta las papas. Saltea la\ncebolla, el ajo y las papas, agrega el jamón en cuadros y rehoga todo por 2\nminutos. Bate los huevos y reserva aparte. Ya listo el salteado, coloca en un\ncolador con un plato debajo, para escurrir y recolectar el aceite que se usará\npara cocinar la tortilla. Una vez escurrido, coloca en un bol junto a los\nhuevos revueltos y mezcla.\nCOCINAR TORTILLA DE PATATAS CON JAMÓN SERRANO"},{"id":298,"title":"TORTILLA DE ARROZ Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":354,"text":"TORTILLA DE ARROZ\nDificultad Fácil\nTiempo de preparación 25 minutos\nTiempo de cocción 12 minutos\nPorción 4 personas\nINGEDIENTES\n2 tza de arroz\n4 huevos\n70 g de queso rallado\nAceite\nPREPARACION\nLava y cocina el arroz, condimenta al gusto con azafrán, pimienta, o si\nprefiere, agregar solo sal y dejar el arroz blanco. Mientras se cuece el arroz,\nbate los huevos y ralla el queso. Una vez listo el arroz, junta con los huevos\ny el queso rallado en el bol y revuelve hasta integrar todos los ingredientes.\nCOCINAR TORTILLA DE ARROZ\nEn la freidora de aire previamente engrasada, vierte la mezcla dejando que\nse logre esparcir, finalmente deja cocinar a 160°C durante 10 a 12 minutos."},{"id":299,"title":"ESPÁRRAGOS CON ROMERO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":356,"text":"ESPÁRRAGOS CON ROMERO\nDificultad Fácil\nTiempo de preparación 7 minutos\nTiempo de cocción 8 minutos\nPara 2 personas\nINGREDIENTES\n500 g de espárragos\n1 cdta de aceite de oliva\nSal\nPimienta al gusto\n1 cda de hojas de romero\n1 hoja de lechuga\nPREPARACIÓN\nLimpia los espárragos, córtalos en trozos medianos, rocía con aceite.\nCOCINAR ESPÁRRAGOS CON ROMERO\nColoca aceite en aerosol en la freidora, coloca los espárragos,\nsalpimentados rociados con aceite y con las hojas de romero, cocina por 8\nminutos a una temperatura de 135°C, puedes servir en la hoja de lechuga."},{"id":300,"title":"SOPA DE TOMATES CON ALBAHACA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":357,"text":"SOPA DE TOMATES CON ALBAHACA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 6 hora\nPara 6 personas\nINGREDIENTES\n1 diente de ajo\n90 g de zanahorias\n600 g de tomates frescos\n1 ½ L de caldo de verduras\n1 cda de albahaca\n80 g de cebolla picada\n½ cdta de sal\nPimienta al gusto\nPREPARACIÓN\nColoca todos los ingredientes en la olla interna de la freidora de aire, tápala.\nCOCINAR SOPA DE TOMATES CON ALBAHACA\nAjusta correctamente el temporizador de la olla a cocción lenta por 6 horas,\nuna vez lista, deja reposar y pasa por la licuadora para suavizarla, sirve\ncaliente."},{"id":301,"title":"PIMIENTOS RELLENOS CON VEGETALES DE TEMPORADA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":358,"text":"PIMIENTOS RELLENOS CON VEGETALES DE\nTEMPORADA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 24 minutos\nPara 4 personas\nINGREDIENTES\n5 huevos\n20 g de brócoli (flores)\n50 g de tomates en cubos pequeños\n15 g de cebolla bien picada\n1 pizca de perejil\n90 g de queso rallado (de su preferencia)\n2 pimientos grandes, limpios, sin semilla, cortados a la mitad\nSal\nPimienta al gusto\nPREPARACIÓN\nBate los huevos en un tazón y luego agrega todos los ingredientes, menos el\nqueso, con esta mezcla rellena los pimientos, coloca encima el queso.\nCOCINAR PIMIENTOS RELLENOS CON VEGETALES DE\nTEMPORADA:\nA una temperatura de 200°C, hornea los pimientos por 24 minutos. Retira y\nsirve."},{"id":302,"title":"CAZUELA DE ALCACHOFA A LA VALENCIANA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":359,"text":"CAZUELA DE ALCACHOFA A LA\nVALENCIANA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPara 12 personas\nINGREDIENTES\n14 huevos\n400 g de corazón de alcachofa, limpios, escurridos y cortados en\ncubos.\n280 g de espinaca\n1 diente de ajo finamente picado\n250 g de queso cheddar\n130 g de queso parmesano\n120 g de queso ricota\n½ cdta de tomillo\n20 g de cebolla picada\n50 g de pimientos verdes y rojos bien picados\nSal\nPimienta al gusto\nPREPARACIÓN\nEn un recipiente bate bien los huevos, luego agrega todos los ingredientes.\nVacía la mezcla en un molde engrasado.\nCOCINAR CAZUELA DE ALCACHOFA A LA VALENCIANA"},{"id":303,"title":"COLIFLOR CON ESPECIAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":361,"text":"COLIFLOR CON ESPECIAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 40 minutos\nPara 2 personas\nINGREDIENTES\n1 coliflor cortado en ramilletes\n2 cdas de aceite de oliva\n¼ de pimienta blanca\n¼ de ajo en polvo\n¼ de comino molido\n¼ de pimienta negra\n1 cda de cayena molida\n½ cda de cebolla bien picada\n½ cda de orégano seco\n¼ de cda de tomillo\n¼ de cda de pimentón picado\nSal al gusto\nPREPARACIÓN\nEn una olla unir todos los ingredientes, remueve bien para mezclarlos.\nCOCINAR COLIFLOR CON ESPECIAS\nLleva a la freidora de aire por 40 minutos a 200°C. Luego retira y sirve."},{"id":304,"title":"ALUBIAS CAMPESTRES Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":362,"text":"ALUBIAS CAMPESTRES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 2 personas\nINGREDIENTES\n500 g de alubias blancas, limpias y escurridas\n3 cda de salsa BBQ\n1 cda de zumo de limón\n1 cda grande de mostaza amarilla\nSal\nPimienta al gusto\nPREPARACIÓN\nUne todos los ingredientes en una olla, y luego tapa.\nCOCINAR ALUBIAS CAMPESTRES\nLleva al modo de cocción lento en la freidora por 10 minutos a 170°C.\nRetira y sirve."},{"id":305,"title":"BERENJENA AL HORNO CON QUESO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":363,"text":"BERENJENA AL HORNO CON QUESO\nDificultad Fácil\nTiempo de preparación 6 minutos\nTiempo de cocción 40 minutos\nPara 6 personas\nINGREDIENTES\n2 berenjenas cortadas de rodajas\n90 g de queso parmesano rallado\n50 g de pimiento picado\n200 g de tomate picado\n4 cda de perejil picado\n5 cda de albahaca picada\nSal\nPimienta al gusto\nPREPARACIÓN\nUne todos los ingredientes en una olla, luego tapa.\nCOCINAR BERENJENA AL HORNO CON QUESO\nSeleccionar opción hornear, colocar la olla en la freidora a 180°C, por 40\nminutos, luego puedes servir caliente."},{"id":306,"title":"PAPAS CON PIMIENTOS A LA SARTEN Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":364,"text":"PAPAS CON PIMIENTOS A LA SARTEN\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 40 minutos\nPara 6 personas\nINGREDIENTES\n6 huevos\n1 tza de queso parmesano rallado\n4 papas cortadas en cubos\n2 pimientos cortados en cuadritos\n1 cebolla finamente picada\n½ tza de tomates picados\n2 cdas de aceite\nSal\nPimienta al gusto\nPREPARACIÓN\nSofríe los vegetales por 5 minutos, luego en la sartén coloca las papas y\núnelas con el sofrito y encima coloca el queso rallado.\nCOCINAR PAPAS CON PIMIENTOS AL SARTEN\nSelecciona 130°C y lleva el sartén en la freidora, hornea por 35 minutos."},{"id":307,"title":"CALABACÍN HORNEADO CON ESPECIES Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":365,"text":"CALABACÍN HORNEADO CON ESPECIES\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de cocción 40 minutos\nPara 6 personas\nINGREDIENTES\n4 calabacines cortados en rodajas\n90 g de queso Cheddar\n3 cda de perejil\n3 cdas de albahaca picada\n¼ cdta de pimienta negra\n¼ de cdta de pimienta roja\n1 diente de ajo finamente picado\n¼ de cdta de cayena en polvo\nSal al gusto\nPREPARACIÓN\nIntegra todos los ingredientes, menos el queso, colócalos en un molde\nengrasado.\nCOCINAR CALABACINES HORNEADOS CON ESPECIAS\nLlevar el molde a la freidora de aire por 180°C de temperatura por 40\nminutos. Una vez listo y bien caliente coloca encima el queso y vuelve a\ntapar. Finalizado el proceso de cocción, retira y sirve."},{"id":308,"title":"BRÓCOLI CON CREMA DE CHAMPIÑONES Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":366,"text":"BRÓCOLI CON CREMA DE CHAMPIÑONES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPara 6 personas\nINGREDIENTES\n450 g de flor de coliflor\n1 lata de champiñones de 280 g\n245 g de queso mozzarella rallado\n90 ml de leche\n½ cdta de cebolla en polvo\n1 cda de mantequilla\n4 cda de pimientos rojos y verdes cortados finamente\nPREPARACIÓN\nEn una olla mezcla todos los ingredientes de manera uniforme.\nCOCINAR BROCOLIS CON CREMA DE CHAMPIÑONES\nLleva a la freidora de aire por un tiempo de 30 minutos, a una temperatura\nde 180°C. Luego retira y sirve."},{"id":309,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":367,"text":"VERDURAS A LA PARMESANA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 4 horas\nPara 2 personas\nINGREDIENTES\n400 g de berenjenas en cubos\n1 calabacín en cubos\n4 tomates en cubos\n1 cebolla pequeña picada\n1 pimiento rojo picado\n1 cda de aceite\n2 cda de albahaca seca\n1 diente de ajo triturado\n90 g de queso parmesano rallado\nPREPARACIÓN\nEn una olla mezcla todos los ingredientes, menos el queso parmesano, une\nuniformemente la mezcla y tapa.\nCOCINAR VERDURAS A LA PARMESANA\nA una temperatura de cocción lenta por 5 horas lleva las verduras, una vez\nfinalizada la cocción puedes servir caliente, coloca por encima el queso\nparmesano."},{"id":310,"title":"SOPA TRADICIONAL DE TOMATES Y ZANAHORIA Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":368,"text":"SOPA TRADICIONAL DE TOMATES Y\nZANAHORIA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 6 horas\nPara 4 personas\nINGREDIENTES\n1 lata de tomates de 400 gramos\n2 zanahorias limpias y cortadas en cubos pequeños\n1 L de caldo de vegetales\n1 cdta de comino en polvo\n1 cdta de cilantro triturado\nPimienta negra\nSal al gusto\nPREPARACIÓN\nTodos los ingredientes se unirán en la olla de cocción tapados.\nCOCINAR SOPA TRADICIONAL DE TOMATES Y ZANAHORIA\nColoca la opción: cocina lenta, con una duración de 6 horas. Al estar lista\npasa por la licuadora hasta que esté suave y así puedes servir."},{"id":311,"title":"OLLA DE SABORES TRADICIONALES Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":369,"text":"OLLA DE SABORES TRADICIONALES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 4 horas\nPara 8 personas\nINGREDIENTES\n3 calabazas de verano en rodajas\n1 pimiento rojo picado\n2 berenjenas picadas\n2 calabacines picados\n3 dientes de ajo triturados\n1 cdta de orégano seco\n1 cdta de albahaca picada\n2 cda grandes de pasta de tomate\n1 tza de tomates bien picados\n3 cda de cebolla picada\n2 cda de aceite de oliva\nSal\nPimienta al gusto\nPREPARACIÓN\nMezcla todos los ingredientes en la olla de cocción, tapar.\nCOCINAR OLLA DE SABORES TRADICIONALES\nColoca la olla en la freidora en modo lento de cocción por 4 horas. Luego\nretira y sirve."},{"id":312,"title":"JUDÍAS GUISADAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":370,"text":"JUDÍAS GUISADAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 6 personas\nINGREDIENTES\n700 g de judías rojas cocidas\n20 g de pimientos picados\n20 g de cebolla finamente picados\n1 diente de ajo triturado\n1 cda de cilantro triturado\n120 ml de caldo de verduras\n1 cda de aceite de oliva\nSal al gusto\nPREPARACIÓN\nUne todos los ingredientes en la olla de cocción, y luego tapa.\nCOCINANDO JUDÍAS GUISADAS\nSelecciona cocción lenta por 10 minutos, retira y puedes servir caliente."},{"id":313,"title":"CALABACINES CON MANTEQUILLA Y QUESO HORNEADOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":371,"text":"CALABACINES CON MANTEQUILLA Y QUESO\nHORNEADOS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 30 minutos\nPara 4 personas\nINGREDIENTES\n2 cda de mantequilla derretida\n2 calabacines cortados a lo largo por la mitad\n1 cdta de zumo de limón\n1 cdta de albahaca seca\n30 g de queso parmesano rallado\nSal\nPimienta al gusto\nPREPARACIÓN\nUne todos los ingredientes, luego en papel aluminio coloca dentro los\ncalabacines individualmente y báñalos con la mezcla, dobla bien los\nextremos del papel aluminio para que no se derrame.\nCOCINAR CALABACINES CON MANTEQUILLA Y QUESO\nHORNEADOS\nColoca los calabacines dentro del papel aluminio en la cesta freidora,\nseleccionar freír a 180°C por 30 minutos. Luego retira y sirve."},{"id":314,"title":"BRÓCOLI ASADO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":372,"text":"BRÓCOLI ASADO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 minutos\nPara 4 personas\nINGREDIENTES\n320 g de brócoli\n1 cda de aceite de oliva\n1 cda de zumo de limón\n20 g de queso parmesano rallado\n1 cda de orégano molido seco\nPREPARACIÓN\nUne en un tazón el brócoli con el limón y aceite. Los dos últimos\ningredientes se colocarán encima del brócoli al estar listo.\nCOCINAR BRÓCOLI ASADO\nSeleccionar en la freidora la temperatura de 180°C por 8 minutos. Luego\nretira y sirve."},{"id":315,"title":"ZANAHORIAS ASADAS AL AJO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":373,"text":"ZANAHORIAS ASADAS AL AJO\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 4 personas\nINGREDIENTES\n450 g de zanahorias cortadas en cuadros\n2 cda de mantequilla derretida\n1 diente de ajo triturado\nSal\nPimienta al gusto\nPREPARACIÓN\nPasa las zanahorias por la mantequilla derretida, luego salpiméntalas y\ncolócales el ajo, llevalas a la bandeja freidora.\nCOCINAR ZANAHORIAS ASADAS AL AJO\nSeleccionar temperatura en la freidora de aire de 200°C, revolviendo de vez\nen cuando, durante 12 minutos. Luego retira y sirve."},{"id":316,"title":"ESPÁRRAGOS ASADOS AL AJO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":374,"text":"ESPÁRRAGOS ASADOS AL AJO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n2 cda de mantequilla derretida\n450 g de espárragos limpios y cortados\n2 dientes de ajo triturados\n30 g de queso parmesano rallado\nPimienta\nSal al gusto\nPREPARACIÓN\nIntegra bien el ajo y la mantequilla, salpimenta los espárragos, y colócalos\nen un molde para hornear ya engrasado, úntalos con la mezcla anterior.\nCOCINAR ESPARRAGOS ASADOS AL AJO\nEn la freidora de aire seleccionar la temperatura de 200°C y hornear los\nespárragos por 10 minutos, colocar el queso encima al servir calientes."},{"id":317,"title":"CALABAZA HORNEADA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":375,"text":"CALABAZA HORNEADA\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 6 minutos\nPara 4 personas\nINGREDIENTES\n1 calabaza cortada en cubos\n1 cda de aceite de oliva\n1 cda de mantequilla derretida\n1 cdta de orégano seco en polvo\nSal\nPimienta al gusto\nPREPARACIÓN\nUne el aceite, la mantequilla y el orégano, unta con esta mezcla los trozos\nde calabaza, llévala a un molde para hornear engrasado.\nCOCINAR CALABAZA HORNEADA\nSelecciona hornear en la freidora a una temperatura de 200°C, coloca\nencima de la calabaza papel aluminio, por 7 minutos, luego retira y cocina\npor 5 minutos más. Luego retira y sirve."},{"id":318,"title":"SETAS PRIMAVERA CON AJO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":376,"text":"SETAS PRIMAVERA CON AJO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 12 minutos\nPara 5 personas\nINGREDIENTES\n230 g de champiñones cortados en finas láminas\n1 cda de aceite\n1 cda de salsa de soja\n½ cdta de azúcar\n2 dientes de ajo triturado\nSal\nPimienta al gusto\nPREPARACIÓN\nUne todos los ingredientes con los champiñones y coloca en un sartén\nengrasado.\nCOCINAR SETAS PRIMAVERA AL AJO\nSeleccionar modo freír a una temperatura de 180°C por un tiempo de 10\nminutos."},{"id":319,"title":"COLIFLOR FRITO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":377,"text":"COLIFLOR FRITO\nDificultad Fácil\nTiempo de preparación 7 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n500 g de coliflor\n1 cda de mantequilla\n1 cda de pimiento rojo picado\n1 cda de cebolla picada\nSal\nPimienta al gusto\nPREPARACIÓN\nSofríe en la mantequilla todos los ingredientes, menos la coliflor, coloca\neste en una bandeja para freír y lleva a la freidora de aire.\nCOCINAR COLIFLOR FRITO\nAntes de iniciar la cocción, baña el coliflor con la mezcla del sofrito, cocina\nremoviendo de vez en cuando, a una temperatura de 150°C, a modo freír,\npor 20 minutos. Luego retira y sirve."},{"id":320,"title":"CHULETAS DE BERENJENA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":378,"text":"CHULETAS DE BERENJENA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 7 minutos\nPara 6 personas\nINGREDIENTES\n1 berenjena grande en ruedas\n2 huevos\n4 cda de leche\n130 g de pan rallado\n1 diente de ajo triturado\nSal\nPimienta al gusto\nPREPARACIÓN\nSalpimienta por ambos lados las chuletas de berenjena, para luego untarlas\ncon el ajo triturado, déjalas reposar así por unos 10 minutos, aparte une la\nleche con huevo batido, pasa las chuletas por esta mezcla y finalmente por\nel pan rallado.\nCOCINAR CHULETAS DE BERENJENA\nColoca la freidora a una temperatura de 160°C, freír las chuletas por ambos\nlados, por 7 minutos hasta que estén doradas. Luego retira y sirve."},{"id":321,"title":"ARROZ CON ALUBIAS ROJAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":379,"text":"ARROZ CON ALUBIAS ROJAS\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 8 horas\nPara 8 personas\nINGREDIENTES\n250 g de alubias, en remojo desde el día anterior\n300 g de arroz blanco\n¼ de tomillo\n1 cda de zumo de lima\n1 L de caldo de verduras\n3 dientes de ajo triturado\n1 cda de mantequilla derretida\nSal\nPimienta al gusto\nPREPARACIÓN\nUna vez escurridas las alubias se ponen a hervir por 15 minutos, luego se\nescurren una vez más y se colocan en una olla con los demás ingredientes.\nCOCINAR ARROZ CON ALUBIAS ROJAS\nSelecciona en la freidora el modo de cocción lenta, por un tiempo de 8\nhoras, cocina el platillo y servir caliente."},{"id":322,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":380,"text":"VERDURAS MIXTAS ASADAS\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n2 zanahorias en cuadritos\n1 tza de brócoli picado\n½ tza de calabacín en cubos\n½ tza de berenjenas en cuadritos\n1 ½ cda de aceite de oliva\nSal\nPimienta al gusto.\nPREPARACIÓN\nColoca todos los ingredientes en un recipiente, cuida que todas las verduras\nqueden aceitadas, saladas y pimentadas.\nCOCINAR VERDURAS MIXTAS ASADAS\nLleva las verduras a la bandeja en la freidora y asa por espacio de 20\nminutos a una temperatura de 200°C. Luego retira y sirve."},{"id":323,"title":"FRITADA VEGETARIANA DE OTOÑO Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":381,"text":"FRITADA VEGETARIANA DE OTOÑO\nDificultad Fácil\nTiempo de preparación 5 minutos\nTiempo de cocción 25 minutos\nPara 4 personas\nINGREDIENTES\n1 puerro limpio y cortado en aros\n3 dientes de ajo triturados\n2 zahorias en cuadritos\n½ tza de pimientos verdes y rojos en cuadritos\n½ tza de tomates en cuadritos\n2 cda de cebolla picada en cuadritos\n2 cda de aceite de oliva\n8 huevos\n150 g de queso amarillo\nSal\nPimienta al gusto\nPREPARACIÓN\nSofríe en el aceite el puerro, el ajo, las zanahorias y demás vegetales hasta\nque estén blandos y cocidos, luego aparte bate los huevos, únelo con el\nsofrito y llévalo a un molde engrasado, coloca encima el queso amarillo.\nCOCINAR FRITADA VEGETARIANA DE OTOÑO\nPrecalienta la freidora a 170°C, coloca en opción hornear y procede a\ncocinar la fritada, por un espacio de 25 minutos. Luego retira y sirve."},{"id":324,"title":"Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":382,"text":"APERITIVOS DE CALABACÍN Y ZANAHORIA\nDificultad Fácil\nTiempo de preparación 9 minutos\nTiempo de cocción 8 minutos\nPara 6 personas\nINGREDIENTES\n3 calabacines limpios cortados en delgadas ruedas\n2 zanahorias limpias cortadas en finos palitos\n½ cdta de pimentón molido\n1 tza de queso parmesano rallado\n1 tza de pan rallado\n1 huevo batido\nPREPARACIÓN\nElimina el exceso de humedad de calabacín y de la zanahoria, secándolos\ncon una toalla; en un recipiente bate un huevo con sal y pimienta; en otro\nrecipiente mezcla el pan rallado, pimentón y queso, pasa las ruedas de\ncalabacín y los palitos de zanahoria por el huevo y luego por la mezcla de\npan y queso.\nCOCINAR APERITIVO DE CALABACÍN Y ZANAHORIA\nEn modo freír, a una temperatura de 180°C, cocina los aperitivos por 8\nminutos. Luego retira y sirve."},{"id":325,"title":"GAJOS DE PATATA CRUJIENTE CON ESPECIAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":383,"text":"GAJOS DE PATATA CRUJIENTE CON\nESPECIAS\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 20 minutos\nPara 2 personas\nINGREDIENTES\n5 patatas cortadas en gajos\n1 diente de ajo triturado\n1 cdta de pimentón en polvo\n1 cdta de tomillo molido\nSal\nPimienta al gusto\nPREPARACIÓN\nEn un tazón agrega a las patatas y todos los ingredientes.\nCOCINANDO GAJOS DE PATATA CRUJIENTE\nPrecalienta la freidora a 190°C, y hornea los gajos por 20 minutos, revuelve\nlas patatas para cocinarlas uniformemente. Luego retira y sirve."},{"id":326,"title":"ZANAHORIAS CON ESPECIAS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":384,"text":"ZANAHORIAS CON ESPECIAS\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 15 minutos.\nPara 2 personas\nINGREDIENTES\n3 zanahorias grandes picadas en palitos\n1 cdta de semillas de cilantro\n1 cdta de semillas de comino\n½ cdta de romero triturado\n1 cdta de mantequilla derretida\n1 diente de ajo triturado\nSal\nPimienta al gusto\nPREPARACIÓN\nComienza con tostar las semillas de cilantro y comino ligeramente en una\nsartén, triturarlas, en un tazón coloca las zanahorias y añade todos los\ningredientes, coloca en una bandeja engrasada para llevar a la freidora.\nCOCINAR ZANAHORIAS CON ESPECIES\nLleva a la freidora de aire por 15 minutos o hasta que estén crujientes, a una\ntemperatura de 163°C. Luego retira y sirve."},{"id":327,"title":"RÁBANOS DE PRIMAVERA AL HORNO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":385,"text":"RÁBANOS DE PRIMAVERA AL HORNO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n3 tza de rábanos limpios y cortados en cuartos\n2 cdas de mantequilla\n1 cda de perejil fresco\nSal\npimienta al gusto\nPREPARACIÓN\nMezcla los rábanos con todos los ingredientes, colócalos en una bandeja\nengrasada.\nCOCINAR RÁBANOS DE PRIMAVERA AL HORNO\nEn la freidora a 190°C fríe los rábanos de 12 a 15 minutos. Luego retira y\nsirve."},{"id":328,"title":"PINCHOS DE VEGETALES ASADOS Dificultad Fácil","category":"Verduras y guarniciones","source":"365 recetas sin aceite","page":386,"text":"PINCHOS DE VEGETALES ASADOS\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 8 minutos\nPara 2 personas\nINGREDIENTES\n3 dientes de ajo triturados\n1/2 tza de salsa de soja\n3 cdas de azúcar\n2 cdas de aceite de oliva\n1 cdta de salsa picante\n1 pimiento cortado en gajos\n1 tomate grande en gajos\n1 cebolla grande en gajos\n1 calabacín en cubos\n1 berenjena en cubos\nSal\nPimienta al gusto\nPREPARACIÓN\nHas una salsa con todos los ingredientes, menos los vegetales, luego marina\nen esta salsa los vegetales por 10 minutos, colócalos en los pinchos y\nllévalos a la freidora de aire.\nCOCINAR PINCHOS DE VEGETALES ASADOS\nA una temperatura de 190°C, asa los vegetales en la freidora de aire, por 8\nminutos o hasta que estén bien dorados y cocidos. Luego retira y sirve."},{"id":329,"title":"MAGDALENAS DE MANTEQUILLA CON CACAO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":389,"text":"MAGDALENAS DE MANTEQUILLA CON\nCACAO\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 16 minutos\nPara 6 personas\nINGREDIENTES\n100 g de harina de trigo\n1 cdta de polvo de hornear\n¼ cdta de canela molida\n85 g de azúcar morena\n26 g de cacao en polvo\n1 pizca de sal común\n1 barra de mantequilla a temperatura ambiente\n1 tza de leche de coco\n2 huevos batidos\nPREPARACIÓN\nMezcla todos los ingredientes en un tazón grande, en moldes de silicona\npara hornear coloca la masa y rellena bien con una espátula, colócalos en la\nbandeja de hornear.\nCOCINAR MAGDALENAS DE MANTEQUILLA CON CACAO\nUna vez calentada la freidora, a la temperatura de 170°C, coloca el molde\nen la posición correcta que corresponde a la freidora, selecciona hornear y\ncocina los panecitos por 15 minutos aproximadamente, o hasta introducir un"},{"id":330,"title":"MELOCOTONES DORADOS CON AZUCAR MORENA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":391,"text":"MELOCOTONES DORADOS CON AZUCAR\nMORENA\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 15 minutos\nPara 3 personas\nINGREDIENTES\n3 melocotones grandes cortados por la mitad\n1 cda de limón\n½ cdta de canela molida\n¼ de cucharadita de nuez moscada molida\n100 g de azúcar morena\n3 cda de mantequilla derretida\nPREPARACIÓN\nComienza a mezclar los melocotones con el resto de los ingredientes,\ncuidando de que estos mantengan su forma para posteriormente cocinarlos.\nCOCINAR MELOCOTONES DORADOS CON AZÚCAR MORENA\nAl tener la freidora precalentada a la temperatura de 170°C, vierte 60 ml de\nagua en el molde para hornear, una vez realizado, coloca los melocotones\nen la sartén, selecciona hornear, y cocina durante 15 minutos, deja enfriar\nantes de servir."},{"id":331,"title":"PASTEL DE CALABAZA CON MANTEQUILLA Y NUEZ Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":392,"text":"PASTEL DE CALABAZA CON MANTEQUILLA Y\nNUEZ\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 14 minutos\nPara 4 personas\nINGREDIENTES\n75 g de puré de calabaza\n100 g de mantequilla\n2 huevos batidos\n1 cdta de extracto de vainilla\n½ cdta de polvo para hornear\n½ cdta de nuez molida\n1 pizca de nuez moscada\nPREPARACIÓN\nPasamos a unir todos los ingredientes en un tazón, luego de formar una\nmezcla homogénea se vierte la masa en un molde refractario ligeramente\naceitado.\nCOCINAR PASTEL DE CALABAZA CON MANTEQUILLA\nUna vez ya precalentada la freidora de aire a 180°C, coloca el molde en la\nposición correcta y selecciona hornear, aproximadamente en 14 minutos\nestará listo el pastel o hasta que se vean dorados los bordes. Luego retira y\nsirve."},{"id":332,"title":"BARRAS DE PLATANO Y COCO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":393,"text":"BARRAS DE PLATANO Y COCO\nDificultad Fácil\nTiempo de preparación 9 minutos\nTiempo de cocción 8 minutos\nPara 2 personas\nINGREDIENTES\n2 plátanos pelados\n1 pizca de nuez moscada rallada\n60 g de coco rallado\n1 cda de mantequilla derretida\n4 cda de azúcar moreno\n¼ de cdta de canela molida\n¼ cdta de nuez molida\n4 cda de pasas\nPREPARACIÓN\nSe cortan los plátanos a lo largo, pero no por completo, como si fueran unos\nbarquitos, se colocan en la bandeja de hornear, allí dentro de la abertura se\nesparcen los ingredientes, tratando de que el plátano conserve su forma\ninicial.\nCOCINAR BARRAS DE PLÁTANO CON COCO\nLuego de precalentar la freidora a 200°C, se coloca la bandeja en la\ncorrespondiente posición y se procede a seleccionar la opción de hornear y\nse cocinan durante 8 minutos, se pueden comer calientes o a temperatura\nambiente."},{"id":333,"title":"PANQUEQUES CON YOGUR Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":394,"text":"PANQUEQUES CON YOGUR\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n100 g de harina de trigo\n1 cdta de polvo de hornear\n1 pizca de sal\n60 g de yogur del sabor de su preferencia\n2 huevos batidos\n50 g de azúcar\n2 cda de mantequilla derretida\nPREPARACIÓN\nSe mezclan todos los ingredientes hasta obtener una mezcla homogénea, se\ndeja caer una cucharada grande de la mezcla en la sartén que previamente\nha sido ligeramente engrasada.\nCOCINAR PANQUEQUES CON YOGUR\nUna vez ya precalentada la freidora a 180°C, coloque la sartén en la\nposición del molde de la freidora y seleccione la opción de hornear.\nDándoles vuelta deja que se cocine por ambos lados y repite la operación\ncon el resto de la mezcla, sírvelo caliente, puedes combinarlos con\nmermelada o miel al momento de servirlos."},{"id":334,"title":"PERAS A LA VAINILLA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":395,"text":"PERAS A LA VAINILLA\nDificultad Fácil\nTiempo de Preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 3 personas\nINGREDIENTES\n3 peras peladas sin semillas\n1 cdta de vainilla\n1 rama de canela\n3 clavos de olor\n120 g de azúcar en polvo\n200 ml de vino tinto\nPREPARACIÓN\nLas peras junto a todos los ingredientes se colocarán en la bandeja de\nhornear.\nCOCINAR PERAS A LA VAINILLA\nLa freidora de aire será precalentada a 180°C, una vez colocada la bandeja\nen la posición correcta, selecciona hornear y cocina las peras por 20\nminutos, puedes servir al enfriar."},{"id":335,"title":"CHURROS TRADICIONALES Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":396,"text":"CHURROS TRADICIONALES\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n90 g de harina de trigo\n½ cdta de levadura en polvo\n180 ml de agua\n3 cda de mantequilla\n2 cda de azúcar\n½ cdta de extracto de vainilla\n½ cdta de sal\n1 huevo\nPREPARACIÓN\nTodos los ingredientes se mezclarán en un tazón, para una vez unidos,\ncolocarlos en una manga pastelera con boquilla de estrella abierta, forma\nlos churros alargados, colocándolos en la bandeja de hornear previamente\nengrasada.\nCOCINAR CHURROS TRADICIONALES\nPrimero calienta la freidora de aire a 170°C, una vez colocada la bandeja en\nla posición correcta, selecciona la opción hornear, cocina los churros por 10\nminutos y luego dale la vuelta para completar su cocción, puedes servir\ncalientes o a temperatura ambiente."},{"id":336,"title":"PASTEL DE MANZANA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":397,"text":"PASTEL DE MANZANA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 35 minutos\nPara 4 personas\nINGREDIENTES\n350 g de corteza de pasteles refrigerados\n350 g de manzanas peladas, cortadas en rodajas finas\n½ tza de azúcar morena\n1 pizca de nuez molida\n1 pizca de sal\nPREPARACIÓN\nEn un molde engrasado, para tarta, se coloca la mitad de la corteza\ncongelada, esta será la base del pastel, el resto de los ingredientes se\nmezclan aparte, este será el relleno, una vez mezclados se colocan encima\nde la masa de corteza que ya está en el molde, la mitad de masa de tarta se\ncolocará encima como tapa del pastel.\nCOCINAR PASTEL DE MANZANA\nEn la freidora previamente calentada a 180°C, se seleccionará la opción de\nhornear y cocina el pastel durante 35 minutos o hasta que las orillas estén\ndoradas."},{"id":337,"title":"PASTEL TRADICIONAL DE CACAO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":398,"text":"PASTEL TRADICIONAL DE CACAO\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 18 minutos\nPara 6 personas\nINGREDIENTES\n3 huevos\n150 g de mantequilla derretida\n2 cda de cacao en polvo\n125 g de harina de trigo\n½ cdta de zumo de lima o limón\nPREPARACIÓN\nTodos los ingredientes se unen, sin dejar de batir, hasta obtener una mezcla\nhomogénea, vierte en un molde ligeramente engrasado.\nCOCINAR PASTEL TRADICIONAL DE CACAO\nColoca el molde dentro de la freidora de aire, previamente precalentada a\n180°C, durante 18 minutos. Luego retira y sirve.\nROLLOS DE CREMA DE FRAMBUESA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES"},{"id":338,"title":"1 lata de leche condensada","category":"Desayunos","source":"365 recetas sin aceite","page":399,"text":"1 lata de leche condensada\n170 g de frambuesas frescas ya limpias\n120 g de queso crema, ya ablandado y a temperatura ambiente\n50 g de azúcar\n1 huevo\n6 envoltorios de rollitos primavera\n60 ml de agua\n1 cda de maicena\n1 pizca de nuez moscada molida\nPREPARACION\nEs necesario cubrir con papel aluminio la cesta de la freidora de aire,\ndejando los bordes libres, en un tazón se mezclan en forma homogénea el\nqueso crema, el azúcar, la leche condensada, la maicena, el huevo, y la nuez\nmoscada se bate constantemente hasta que sea una masa esponjosa, luego\ncon esto se rellenan los envoltorios de rollitos primavera, a su vez dentro\ncoloca frambuesas y sella los envoltorios con agua.\nCOCINAR ROLLOS DE CREMA DE FRAMBUEZA\nUna vez precalentada la freidora de aire a 180°C, se colocarán encima del\npapel aluminio los rollos con las costuras hacia adentro, de vez en cuando\nagitar la cesta para que los rollos queden crujientes. Luego de 10 minutos\nretira y sirve."},{"id":339,"title":"PASTEL DE CHOCOLATE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":400,"text":"PASTEL DE CHOCOLATE\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 45 minutos\nPara 10 personas\nINGREDIENTES\n100 g de azúcar\n100 g de harina de trigo\n120 ml de agua caliente\n1 cdta de vainilla\n120 ml de leche completa o de almendras\n1 huevo\n1 pizca de sal\n¾ cda de levadura en polvo\n50 g de cacao en polvo sin azúcar\n200 g de azúcar morena\nPREPARACIÓN\nPrimero se mezclan todos los ingredientes secos, luego se añaden los\nhúmedos y al final el agua caliente, en un molde que se adapte a la freidora\nde aire, vierte la mezcla, cubre con papel aluminio y con un tenedor pincha\npara hacer agujeros.\nCOCINAR PASTEL DE CHOCOLATE\nUna vez que hayas precalentado el horno a 180°C, hornear durante 35\nminutos, luego desecha el papel aluminio y hornea por otros 10 minutos\nmás. Luego retira y sirve."},{"id":340,"title":"ROLLOS DE CANELA Dificultad Fácil","category":"Panes, pasta y aperitivos","source":"365 recetas sin aceite","page":402,"text":"ROLLOS DE CANELA\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 6 minutos\nPara 6 personas\nINGREDIENTES\n½ cda de canela\n450 g de masa de pan congelada\n170 g de azúcar morena\n2 cda de mantequilla derretida\nGLASEADO\n30 g de queso crema\n½ cdta de vainilla\n60 g de edulcorante en polvo\nPREPARACIÓN\nExtienda la masa descongelada y dale forma de rectángulo, unta\nmantequilla y luego espolvorea con canela y azúcar morena, enrolla la masa\ncon fuerza y córtala en 8 trozos y la dejas reposar por una hora. Para el\nglaseado se mezclan todos los ingredientes hasta que queden suaves.\nCOCINANDO LOS ROLLOS DE CANELA\nColoque los rollos dentro de la freidora de aire precalentada a 170°C,\ndurante 6 minutos, al estar listos baña con el glaseado. Luego retira y sirve."},{"id":341,"title":"MANZANA ASADA Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":403,"text":"MANZANA ASADA\nDificultad Fácil\nTiempo de preparación 15 minutos\nTiempo de cocción 20 minutos\nPara 4 personas\nINGREDIENTES\n2 manzanas\n½ cdta de canela\n½ cdta de nuez moscada\n1 cda de pasas\n1 cda de nueces picadas\nPREPARACIÓN\nCorta la manzana a la mitad y desecha las semillas, haz un agujero en el\ncentro de cada mitad, coloca las mitades en una sartén, mezcla todos los\ningredientes y colócalos en las manzanas, con cuidado vierte el agua al\nfinal.\nCOCINANDO LAS MANZANAS AZADAS\nColoca la sartén en la bandeja de hornear de la freidora de aire y hornea a\nuna temperatura de 170°C, durante 20 minutos. Posteriormente retira y\nsirve."},{"id":342,"title":"PASTEL DE QUESO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":404,"text":"PASTEL DE QUESO\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 16 minutos\nPara 15 personas\nINGREDIENTES\n3 cdas de mantequilla\n4 cdas de azúcar\n100 g de galletas dulces desmenuzadas\n2 huevos\n450 g de queso crema\n½ cdta de extracto de vainilla\nPREPARACIÓN\nEn un tazón se unen las galletas con la mantequilla para formar la corteza,\naparte se mezclan los demás ingredientes.\nCOCINANDO EL PASTEL DE QUESO\nPrimero se hornea la corteza en su freidora de aire a 175°C, por 3 minutos,\nuna vez lista rellena la corteza con la mezcla de queso y hornea a 150°C,\npor 14 minutos, una vez enfriada refrigera y sirva."},{"id":343,"title":"HOJALDRE CON PASTEL DE MANZANA Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":405,"text":"HOJALDRE CON PASTEL DE MANZANA\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 20 minutos\nPara 5 personas\nINGREDIENTES\n350 g de hojaldre congelado\n250 g de relleno de tarta de manzanas\nPREPARACIÓN\nExtiende la masa de hojaldre ya descongelada en forma de rectángulo, corte\nen rectángulos más pequeños y rellena con la masa de manzanas, sella\ncorrectamente.\nCOCINANDO EL HOJALDRE CON PASTEL DE MANZANA\nColoque en la bandeja de hornear los hojaldres rellenos y seleccione\nhornear en la freidora de aire a una temperatura de 180°C por 20 minutos.\nLuego retira y sirve."},{"id":344,"title":"TOSTADAS DE CANELA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":406,"text":"TOSTADAS DE CANELA\nDificultad Fácil\nTiempo de preparación 7 minutos\nTiempo de cocción 10 minutos\nPara 4 personas\nINGREDIENTES\n4 rebanadas de pan\n1 huevo batido\n60 ml de leche\n2 cda de mantequilla derretida\n½ cdta de canela molida\n1 pizca de nuez moscada rallada\n1 cdta de nueces finamente picadas\n4 cda de azúcar\nPREPARACIÓN\nMezcla todos los ingredientes en un tazón y deja aparte las rebanadas de\npan. Luego sumerge una por una las rebanadas en la mezcla.\nCOCINANDO LAS TOSTADAS DE CANELA\nUna vez ya precalentado la freidora de aire, a una temperatura de 170°C,\nselecciona hornear y coloca las rebanadas de pan, cocinándolas por 4 o 5\nminutos de cada lado. Retira y sirve."},{"id":345,"title":"CIRUELAS CON ANÍS ESTRELLADO Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":407,"text":"CIRUELAS CON ANÍS ESTRELLADO\nDificultad Fácil\nTiempo de preparación 8 minutos\nTiempo de cocción 15 minutos\nPara 4 personas\nINGREDIENTES\n4 anís estrellado entero\n400 g de ciruelas cortadas por la mitad y deshuesadas\n2 cda de mantequilla derretida\n4 cda de azúcar morena\n4 clavos enteros\n1 rama de canela\nPREPARACIÓN\nMezcla todos los ingredientes junto con las ciruelas, colócalas en la sartén,\ncoloca agua en el molde de la freidora de aire.\nCOCINANDO A LAS CIRUELAS CON ANIS ESTRELLADO\nUna vez colocado el molde en la posición correcta cocina las ciruelas a\n170°C por 15 minutos, deja enfriar y sirve."},{"id":346,"title":"MANZANAS CON PASAS Dificultad Fácil","category":"Otros","source":"365 recetas sin aceite","page":408,"text":"MANZANAS CON PASAS\nDificultad Fácil\nTiempo de preparación 14 minutos\nTiempo de cocción 30 minutos\nPara 4 persona\nINGREDIENTES\n2 cda de aceite de coco\n2 hojas de hojaldre\n2 cda de azúcar moreno\n2 cda de pasas\n4 manzanas\nPREPARACIÓN\nPela y retira corazón de las manzanas y mézclalas con las pasas y el azúcar,\ncoloca mezcla de manzana en las hojas de hojaldre, y pinta con el aceite de\ncoco.\nCOCINANDO LAS MANZANAS CON PASAS\nLuego de asegurarte que la freidora de aire está en la temperatura correcta\nde 180°C, fríe al aire por 30 minutos, volteando las manzanas para que su\ncocción sea uniforme. Luego retira y sirve."},{"id":347,"title":"DONAS DE CHOCOLATE Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":409,"text":"DONAS DE CHOCOLATE\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 15 minutos\nPara 10 personas\nINGREDIENTES\nSalsa de chocolate\nBollos de pan dulce\nAceite comestible\nPREPARACIÓN\nEn una mesa aplana los bollos de pan, con un cortador de galletas o cuchillo\nhaz un corte en medio para darle forma de dona, retira masa sobrante.\nCOCINANDO DONAS DE CHOCOLATE\nRocía la cesta de la freidora de aire con el aceite, fríe las donas por ambos\nlados a una temperatura de 170°C, por 5 minutos, una vez que se hayan\nfrito todas las donas, procede a bañarlas con la salsa de chocolate. Luego\nsirve."},{"id":348,"title":"PUDÍN DE PAN Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":410,"text":"PUDÍN DE PAN\nDificultad Fácil\nTiempo de preparación 10 minutos\nTiempo de cocción 1 hora\nPara 4 personas\nINGREDIENTES\n6 panes desmenuzados\n60 g de cereza\n4 yemas de huevo\n300 g de nata\n4 cda de pasas\n2 tza de azúcar\nChispa de chocolates\nPREPARACIÓN\nEn un tazón mezcla bien las cerezas, con las yemas de huevos y la nata, en\notro tazón aparte el resto de los ingredientes, una vez obtenida una mezcla\nhomogénea, en ambas partes, combínalas y transfiérelas a un molde\nengrasado, acomódala en la forma correcta en la freidora de aire.\nCOCINAR PUDIN DE PAN\nColoca la opción de hornear a 160°C de temperatura por una hora,\nfinalizado el proceso sirve al enfriar."},{"id":349,"title":"POSTRE DE AMARETTO Dificultad Fácil","category":"Postres","source":"365 recetas sin aceite","page":411,"text":"POSTRE DE AMARETTO\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 12 minutos\nPara 10 personas\nINGREDIENTES\n450 g de masa de pan\n2 tza grandes de azúcar\n1 barra de mantequilla derretida\n250 g de crema de leche\n350 g de chips de chocolate\n2 cda de licor de amaretto\nPREPARACIÓN\nCorta la masa en 20 pedazos en forma de rebanadas, úntalos con\nmantequilla y azúcar, en un tazón aparte unir el resto de los ingredientes\npara hacer una salsa.\nCOCINAR EL POSTRE DE AMARETTO\nEn la freidora, previamente engrasada, freír los panes a una temperatura de\n170°C de 5 a 8 minutos, hasta que estén dorados. Pásalos luego a una\nbandeja.\nEn una olla calienta la leche junto con los demás ingredientes y estará lista\ncuando se derritan los chips de chocolate, sirve con los panes fritos\nbañándolos por encima."},{"id":350,"title":"PAN DE MANZANA Dificultad Fácil","category":"Desayunos","source":"365 recetas sin aceite","page":412,"text":"PAN DE MANZANA\nDificultad Fácil\nTiempo de preparación 12 minutos\nTiempo de cocción 45 minutos\nPara 6 personas\nINGREDIENTES\n350 g de manzanas peladas, sin semillas y cortadas en cubos\n2 tzas grandes de azúcar\n2 huevos\n1
